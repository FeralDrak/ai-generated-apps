/* =====================================================================
   BOUCLE PRINCIPALE & INITIALISATION
   ===================================================================== */
let lastFrame = performance.now(), lastEco = Date.now();
function offlineGain(sec, silent){
  const cap = (hasCons('k_vault') ? 8 : 2) * 3600;
  const aff = hasCons('k_vault') ? 0.6 : 0.25;
  const t = Math.min(sec, cap);
  const gain = maisonBase() * aff * t;
  S.hype = Math.max(0, S.hype - hypeDecay() * sec);
  for (const k in S.buffs){ S.buffs[k] = Math.max(0, S.buffs[k] - sec); if (!S.buffs[k]) delete S.buffs[k]; }
  if (gain > 0){ credit(gain); S.stats.maisonEarned += gain; }
  if (gain > 0 && !silent){
    modal({ title: 'Bon retour !', body: `<p>Pendant votre absence (${fmtTime(sec)}), les clients de La Maison ont joué pour vous.</p><p style="font-size:26px;font-weight:900;color:var(--gold3);margin:14px 0">+${fmt(gain)} jetons</p><p class="dim">Hors-ligne, l'affluence est de ${Math.round(aff * 100)} % et plafonnée à ${cap / 3600} h. Revenez jouer pour relancer la Ferveur !</p>` });
  } else if (gain > 0) toast('La Maison a tourné sans vous', `+${fmt(gain)} jetons`, 'good', ICONS.maison);
}
function ecoTick(){
  const now = Date.now();
  const dt = (now - lastEco) / 1000; lastEco = now;
  if (dt <= 0) return;
  if (dt > 30){ offlineGain(dt, true); return; }
  if (buff('carpet')) S.hype = 1; else S.hype = Math.max(0, S.hype - hypeDecay() * dt);
  for (const k in S.buffs){ S.buffs[k] = Math.max(0, S.buffs[k] - dt); if (!S.buffs[k]){ delete S.buffs[k]; UI.dirty.side = true; } }
  const r = maisonRate();
  if (r > 0){ credit(r * dt); S.stats.maisonEarned += r * dt; }
  S.stats.time += dt;
}
function loop(now){
  const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000)); lastFrame = now;
  try {
    ecoTick();
    if (UI.cur && UI.cur.frame) UI.cur.frame(dt);
    fxFrame(dt);
    tickCounter(dt);
    refreshTop();
  } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}
function helpButton(){
  const box = $('#tb-chips');
  let b = $('#tb-aid');
  const need = S.run.chips < 1 && !(UI.cur && UI.cur.busy && UI.cur.busy());
  if (need && !b){
    b = h('button', { id: 'tb-aid', class: 'btn btn-acc btn-sm', style: { marginLeft: '6px' }, onclick: () => {
      const wait = S.helpAt - Date.now();
      if (wait > 0){ toast('Le patron hésite…', `Revenez dans ${Math.ceil(wait / 1000)} s.`, '', ICONS.info); return; }
      const gift = Math.max(START_CHIPS, Math.floor(S.run.peak * 0.02));
      S.run.chips += gift; S.helpAt = Date.now() + 45000;
      sfx.win(); fxCoins(innerWidth / 2, innerHeight / 2, 20);
      toast('Coup de pouce', `Le patron vous avance ${fmt(gift)} jetons. Jouez prudemment !`, 'good', ICONS.coin);
      b.remove(); refreshTop(true);
    } }, 'Coup de pouce');
    box.append(b);
  } else if (!need && b) b.remove();
}
function init(){
  S = loadState();
  const fresh = !S;
  if (!S){ S = newState(); S.run = newRun(); }
  document.body.dataset.venue = S.run.venue;
  fxInit(); buildTop();
  fillContracts();
  const away = (Date.now() - (S.lastSave || Date.now())) / 1000;
  go(S.view && VIEWS[S.view] ? S.view : 'slots');
  lastEco = Date.now();
  if (!fresh && away > 60) offlineGain(away, false);
  if (fresh) showWelcome();
  requestAnimationFrame(loop);
  setInterval(() => { ecoTick(); checkAchievements(); renderNav(); helpButton(); }, 1000);
  setInterval(saveState, 15000);
  addEventListener('beforeunload', saveState);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); else { lastFrame = performance.now(); } });
  const unlockAudio = () => Snd.init();
  addEventListener('pointerdown', unlockAudio);
  addEventListener('keydown', e => {
    unlockAudio();
    if (e.target.closest && e.target.closest('input,textarea')) return;
    if ($('#modal-root .back')){ if (e.code === 'Escape'){ const b = $$('#modal-root .back'); b[b.length - 1].remove(); } return; }
    if (e.repeat && e.code === 'Space') { e.preventDefault(); return; }
    if (UI.cur && UI.cur.key) UI.cur.key(e);
  });
  // empêche le défilement de la page avec Espace
  addEventListener('keydown', e => { if (e.code === 'Space' && !(e.target.closest && e.target.closest('input,textarea'))) e.preventDefault(); }, { capture: true });
  addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'BUTTON') a.blur(); });
}
init();
</script>
