<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pachinko Rogue — La Descente Néon</title>
<!--
  ======================================================================
  PACHINKO ROGUE — DOCUMENT DE GAME DESIGN (résumé)
  ======================================================================
  Pitch : un pachinko néon où chaque partie est une descente de 4 étages.
  On tire des billes dans une forêt de pegs ; chaque bille accumule des
  POINTS et un MULT, puis tombe dans un SEAU qui multiplie le tout.
  Entre les manches, on transforme le plateau lui-même (pegs spéciaux,
  burin, seaux améliorés) et on collectionne des reliques.

  Boucle : Manche (atteindre l'objectif avec N billes) -> Récompenses
           -> Boutique (pegs / reliques / consommables / services) -> ...
  Structure : 4 étages x (Petite manche, Grande manche, Boss).
              Boss = 1 malédiction (2 à l'étage 4). Victoire après le boss
              de l'étage 4, puis mode infini optionnel.
  Score d'une bille = Points x Mult x Seau (x bonus de reliques).
  Économie : or de base + 1 or par bille restante + intérêts (1/5 or).

  Fonctionnalités :
   - Physique maison (pas fixe 240 Hz, collisions cercle/capsule)
   - 13 types de pegs à 3 niveaux (placement libre sur le plateau)
   - 24 reliques passives, 6 consommables, 4 services de boutique
   - 8 malédictions de boss, 4 kits de départ
   - Coupe JACKPOT mobile + machine à sous à 3 rouleaux
   - Visée avec trajectoire prévisualisée, tir souris/tactile/clavier
   - Accélération x1/x2/x4, sons synthétisés WebAudio, statistiques
     sauvegardées (localStorage), écran titre animé (démo)
  ======================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>

.card{background:linear-gradient(180deg,rgba(32,26,66,.94),rgba(18,14,38,.94));border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}

.round-card.boss{border-color:rgba(255,51,85,.6);box-shadow:0 0 24px rgba(255,51,85,.18)}

.bar{height:10px;border-radius:6px;background:#1f1a40;overflow:hidden;margin-top:8px;border:1px solid var(--line)}

.relic .sell{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;background:#3a1030;border:1px solid var(--pink);border-radius:6px;padding:0 4px;white-space:nowrap;line-height:14px}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.item{position:relative;background:#1d1840;border:1px solid var(--line2);border-radius:12px;padding:8px 5px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:14px;font-weight:700;min-height:94px;transition:transform .12s,border-color .12s}

.rowb{display:flex;gap:8px;margin-top:12px}.rowb .btn{flex:1}

.mbox{width:min(660px,100%);max-height:94vh;overflow-y:auto;background:linear-gradient(180deg,#1d1742,#110d27);border:1px solid var(--line2);border-radius:18px;padding:24px;box-shadow:0 0 60px rgba(180,107,255,.25);text-align:center;animation:pop .25s ease-out}

.logo{font-family:var(--fd);font-weight:900;font-size:46px;line-height:1;letter-spacing:.04em;background:linear-gradient(90deg,var(--pink),var(--gold),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,79,163,.45))}
.subt{color:var(--dim);letter-spacing:.32em;text-transform:uppercase;font-size:13px;margin:8px 0 16px;font-weight:700}
.pitch{font-size:16px;line-height:1.4;color:#cfc8f5;max-width:520px;margin:0 auto 6px}
.kits{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.kit{background:#1d1840;border:1px solid var(--line2);border-radius:14px;padding:12px;text-align:left;display:flex;gap:12px;align-items:center;transition:transform .12s,border-color .12s}
.kit:hover{border-color:var(--pink);transform:translateY(-2px);box-shadow:0 0 18px rgba(255,79,163,.25)}
.kit .ki{font-size:30px}
.kit .kn{font-family:var(--fd);font-size:14px;font-weight:800;margin-bottom:2px}
.kit .kd{font-size:14px;color:var(--dim);line-height:1.2}
.statline{font-size:14px;color:var(--dim);margin-top:10px}
.statline b{color:var(--text)}
.mtitle{font-family:var(--fd);font-size:28px;font-weight:900;margin-bottom:6px;letter-spacing:.04em}
.mtitle.win{color:var(--green);text-shadow:0 0 18px rgba(63,224,138,.5)}
.mtitle.lose{color:var(--red);text-shadow:0 0 18px rgba(255,51,85,.5)}
.mtitle.gold{color:var(--gold);text-shadow:0 0 18px rgba(255,210,63,.5)}
.rews{max-width:380px;margin:14px auto}
.rew{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px dashed var(--line);font-size:17px}
.rew.tot{border:none;font-family:var(--fd);font-size:20px;font-weight:900;color:var(--gold);padding-top:10px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.choice{background:#1d1840;border:1px solid var(--line2);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s,border-color .12s}
.choice:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,63,.25)}
.choice:disabled{opacity:.35;pointer-events:none}
.choice .ci{font-size:38px}
.choice .cn{font-family:var(--fd);font-size:13px;font-weight:800}
.choice .cd{font-size:14px;color:#cfc8f5;line-height:1.25}
.help{text-align:left;font-size:15px;line-height:1.4}
.help h3{font-family:var(--fd);font-size:13px;color:var(--cyan);margin:16px 0 6px;letter-spacing:.1em}
.help p{margin-bottom:6px;color:#d6d0f7}
.help .pl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.kbd{display:inline-block;border:1px solid var(--line2);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-size:13px;background:#221c46;font-weight:700}
.bigstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.bigstats div{background:#1d1840;border:1px solid var(--line);border-radius:12px;padding:10px 6px}
.bigstats b{display:block;font-family:var(--fd);font-size:18px;color:var(--cyan)}
.bigstats span{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.mrow{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(12,9,28,.94);border:1px solid var(--line2);border-radius:10px;padding:8px 14px;font-size:15px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .2s;max-width:92%;text-align:center;z-index:5}
#toast.on{opacity:1}
@media (max-width:880px){
  html,body{overflow:auto;height:auto}
  #app{flex-direction:column;height:auto;padding:8px;gap:10px}
  #boardWrap{max-width:none;height:min(80vh,146vw);flex:none}
  #side{flex:none;width:100%;overflow:visible}
  .logo{font-size:32px}
  .kits,.choices{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <main id="boardWrap"><canvas id="cv"></canvas><div id="toast"></div></main>
  <aside id="side"></aside>
</div>
<div id="modal" class="hidden"><div class="mbox" id="mbox"></div></div>
<div id="tip" class="hidden"></div>
<script>
'use strict';
/* ============================================================
   1. UTILITAIRES
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function wpick(items, w) {
  let tot = 0;
  for (const it of items) tot += w(it);
  let r = Math.random() * tot;
  for (const it of items) { r -= w(it); if (r <= 0) return it; }
  return items[items.length - 1];
}
function fmt(n) {
  n = Math.floor(n);
  if (Math.abs(n) < 1e6) return n.toLocaleString('fr-FR');
  for (const [v, s] of [[1e18, 'Qn'], [1e15, 'P'], [1e12, 'T'], [1e9, 'Md'], [1e6, 'M']])
    if (Math.abs(n) >= v) return (n / v).toFixed(2).replace('.', ',') + ' ' + s;
  return String(n);
}
const fmtMult = m => String(Math.round(m * 100) / 100).replace('.', ',');

/* ============================================================
   2. CONSTANTES DU PLATEAU
   ============================================================ */
const W = 560, H = 820;               // taille logique du plateau
const BALL_R = 8;
const GRAV = 980;
const LAUNCH = { x: W / 2, y: 62 };
const LAUNCH_SPEED = 560;
const BUCKET_TOP = 744;
const NB = 7, BW = W / NB;            // seaux
const BAND = { y1: 394, y2: 446, cy: 420 }; // bande de la coupe Jackpot
const ROW_Y = [];
for (let i = 0; i < 6; i++) ROW_Y.push(150 + 42 * i);
for (let i = 0; i < 6; i++) ROW_Y.push(478 + 42 * i);
const STEP = 1 / 240;
const MAX_RELICS = 6, MAX_CONS = 2;
const DEFAULT_BUCKETS = [3, 1.5, 1, 2, 1, 1.5, 3];

/* ============================================================
   3. DONNÉES DE JEU
   ============================================================ */
const RARITY = {
  c: { name: 'Commun', w: 60, col: '#9fb3d9' },
  u: { name: 'Peu commun', w: 30, col: '#3fe08a' },
  r: { name: 'Rare', w: 12, col: '#ff4fa3' },
};

// Types de pegs. l = niveau (1..3), p = le peg (optionnel)
const PEGS = {
  std:    { name: 'Clou', col: '#8fa3c8', glyph: '', r: 6, price: 0, rar: 'c',
            desc: () => '+5 points.' },
  bump:   { name: 'Ressort', col: '#ff4fa3', glyph: '', r: 9, price: 4, rar: 'c',
            desc: l => `+${10 * l} points. Rebond très puissant.` },
  mult:   { name: 'Néon', col: '#3fa9ff', glyph: '+', r: 8, price: 5, rar: 'c',
            desc: l => `+${l} mult.` },
  gold:   { name: 'Pièce', col: '#ffd23f', glyph: '$', r: 8, price: 4, rar: 'c',
            desc: l => `+${l >= 3 ? 2 : 1} or et +${10 * l} points (1× par bille).` },
  fire:   { name: 'Braise', col: '#ff6a2a', glyph: '♨', r: 8, price: 5, rar: 'c',
            desc: l => `Enflamme la bille : +${3 * l} points sur chaque touche suivante (cumulable, 1× par bille).` },
  grow:   { name: 'Cristal', col: '#8ff0ff', glyph: '◆', r: 8, price: 5, rar: 'u',
            desc: (l, p) => `+${p ? p.value : 5} points. Gagne +${l} point${l > 1 ? 's' : ''} de valeur à chaque touche, pour toute la partie.` },
  crit:   { name: 'Prisme', col: '#b46bff', glyph: '×', r: 8, price: 7, rar: 'u',
            desc: l => `Mult ×${fmtMult(1.25 + 0.25 * l)} (1× par bille).` },
  bomb:   { name: 'Bombe', col: '#ff8c1a', glyph: '!', r: 8, price: 6, rar: 'u',
            desc: l => `Explose toutes les ${5 - l} touches et déclenche tous les pegs dans un rayon de ${80 + 20 * l}.` },
  echo:   { name: 'Écho', col: '#5ff0e0', glyph: '↻', r: 8, price: 6, rar: 'u',
            desc: l => `Redéclenche ${l > 1 ? `les ${l} derniers pegs touchés` : 'le dernier peg touché'} par la bille.` },
  portal: { name: 'Portail', col: '#8a6bff', glyph: '◎', r: 8, price: 6, rar: 'u',
            desc: l => `Renvoie la bille en haut du plateau (1× par bille)${l > 1 ? ` et +${l - 1} mult` : ''}.` },
  split:  { name: 'Scission', col: '#3fe08a', glyph: 'Y', r: 8, price: 8, rar: 'r',
            desc: l => `Divise la bille en ${l + 1} (1× par bille). Les copies gardent points et mult.` },
  x2:     { name: 'Doubleur', col: '#ff3355', glyph: '²', r: 8, price: 9, rar: 'r',
            desc: l => `Points de la bille ×${fmtMult(1.5 + 0.5 * l)} (1× par bille).` },
  ball:   { name: 'Recharge', col: '#f4f1ff', glyph: '↑', r: 8, price: 8, rar: 'r',
            desc: l => `+1 bille (${l}× par manche).` },
};

const RELICS = {
  loupe:    { name: 'Loupe', ico: '🔍', rar: 'c', price: 5, desc: 'Les Clous donnent +5 points supplémentaires.' },
  bourse:   { name: 'Bourse', ico: '👛', rar: 'c', price: 5, desc: 'Plafond des intérêts porté de 5 à 10 or.' },
  trefle:   { name: 'Trèfle', ico: '🍀', rar: 'c', price: 4, desc: 'Les Pièces donnent +1 or supplémentaire.' },
  caout:    { name: 'Caoutchouc', ico: '🏀', rar: 'c', price: 5, desc: 'Les billes rebondissent 20% plus fort.' },
  premier:  { name: 'Premier sang', ico: '🩸', rar: 'c', price: 5, desc: 'La 1re bille de chaque manche : score ×3.' },
  baroud:   { name: 'Baroud', ico: '🎯', rar: 'c', price: 5, desc: 'La dernière bille de chaque manche : score ×4.' },

/* ============================================================
   4. AUDIO (entièrement synthétisé avec WebAudio)
   ============================================================ */
const Sfx = (() => {
  let ac = null, master = null, muted = false, lastHit = 0;
  const ok = () => ac && !muted && G.screen !== 'title';
  function init() {
    if (ac || typeof window === 'undefined') return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.3;
      const comp = ac.createDynamicsCompressor();
      master.connect(comp); comp.connect(ac.destination);
    } catch (e) { ac = null; }
  }
  function tone(f, dur, type = 'sine', vol = 0.2, when = 0, slide = 0) {
    const t = ac.currentTime + when;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, freq) {
    const t = ac.currentTime, len = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = ac.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(master); src.start(t);
  }
  const SCALE = [0, 3, 5, 7, 10]; // pentatonique mineure
  const note = i => 220 * Math.pow(2, (SCALE[i % 5] + 12 * Math.floor(i / 5)) / 12);
  return {
    init,
    get muted() { return muted; },
    toggle() { muted = !muted; return muted; },
    hit(n) {
      if (!ok()) return;
      const t = performance.now(); if (t - lastHit < 22) return; lastHit = t;
      tone(note(5 + Math.min(n, 17)), 0.09, 'triangle', 0.12);
    },
    bump() { if (ok()) tone(150, 0.18, 'sine', 0.25, 0, 3.2); },
    coin() { if (!ok()) return; tone(1175, 0.06, 'square', 0.05); tone(1568, 0.16, 'square', 0.05, 0.05); },
    mult() { if (ok()) tone(520, 0.14, 'sawtooth', 0.05, 0, 1.6); },
    xmult() { if (!ok()) return; tone(392, 0.1, 'sawtooth', 0.06); tone(784, 0.22, 'sawtooth', 0.06, 0.07); },
    boom() { if (!ok()) return; noise(0.5, 0.55, 650); tone(70, 0.45, 'sine', 0.4, 0, 0.3); },
    portal() { if (ok()) tone(260, 0.4, 'sine', 0.16, 0, 4); },
    split() { if (!ok()) return; tone(600, 0.1, 'triangle', 0.12); tone(900, 0.12, 'triangle', 0.12, 0.05); },
    launch() { if (!ok()) return; tone(140, 0.12, 'triangle', 0.2, 0, 0.5); noise(0.08, 0.12, 2400); },
    bucket(m) {
      if (!ok()) return;
      const b = m >= 3 ? 523 : m >= 2 ? 440 : m >= 1 ? 349 : 175;
      [1, 1.26, 1.5].forEach((r, i) => tone(b * r, 0.3, 'triangle', 0.11, i * 0.045));
      if (m >= 3) tone(b * 2, 0.45, 'sine', 0.09, 0.15);
    },
    slot() { if (!ok()) return; for (let i = 0; i < 10; i++) tone(680 + (i % 3) * 130, 0.03, 'square', 0.035, i * 0.08); },
    slotWin(big) {
      if (!ok()) return;
      const seq = big ? [523, 659, 784, 1047, 784, 1047, 1319] : [659, 880];
      seq.forEach((f, i) => tone(f, 0.16, 'square', 0.06, 0.9 + i * 0.08));
    },
    clear() { if (!ok()) return; [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.12, i * 0.09)); },
    win() { if (!ok()) return; [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'square', 0.06, i * 0.1)); },
    lose() { if (!ok()) return; [392, 330, 262, 196].forEach((f, i) => tone(f, 0.4, 'sawtooth', 0.07, i * 0.18, 0.97)); },
    click() { if (ac && !muted) tone(900, 0.04, 'square', 0.04); },
    buy() { if (!ac || muted) return; tone(880, 0.07, 'square', 0.05); tone(1320, 0.12, 'square', 0.05, 0.06); },
    deny() { if (!ac || muted) return; tone(160, 0.14, 'square', 0.07, 0, 0.8); },
  };
})();

/* ---------- Statistiques persistantes ---------- */
const STORE_KEY = 'pachinkoRogue.opus55.stats';
function loadStats() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
function saveStats(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ } }
function recordRun(won) {
  const s = loadStats();
  if (!G.recorded) { s.runs = (s.runs || 0) + 1; G.recorded = true; }
  if (won) s.wins = (s.wins || 0) + 1;
  s.bestFloor = Math.max(s.bestFloor || 0, won ? 4 : G.floor);
  s.bestBall = Math.max(s.bestBall || 0, G.run.bestBall);
  s.bestRun = Math.max(s.bestRun || 0, G.run.score);
  saveStats(s);
}

function buildBoard() {
  G.pegs = [];
  ROW_Y.forEach((y, row) => {
    const odd = row % 2 === 1, n = odd ? 10 : 11;
    for (let c = 0; c < n; c++) {
      G.pegs.push({ id: uid++, x: (odd ? 64 : 40) + 48 * c, y, row, col: c, type: 'std', lvl: 1, value: 5,
        st: {}, flash: 0, removed: false, frozen: false, hidden: false, temp: null });
    }
  });
}
function convertRandom(type, n, temp = false) {
  const pool = shuffle(G.pegs.filter(p => !p.removed && p.type === 'std' && !p.temp)).slice(0, n);
  for (const p of pool) {
    if (temp) p.temp = type; else { p.type = type; p.lvl = 1; p.value = 5; }
    p.flash = 1;
  }
  return pool;
}

function newRun(kitId) {
  Object.assign(G, {
    floor: 1, round: 0, gold: 5, ballsBase: 8, relics: [], cons: [], armed: [], curses: [],
    buckets: DEFAULT_BUCKETS.slice(), tamponPrice: 6, ballUpPrice: 12,
    balls: [], parts: [], texts: [], rings: [], shake: 0, placing: null, slot: null,
    endless: false, recorded: false, kit: kitId,
    run: { score: 0, bestBall: 0, balls: 0, hits: 0, jackpots: 0, rounds: 0 },
  });
  buildBoard();
  (KITS.find(k => k.id === kitId) || KITS[0]).setup();
  G.bossCurses = pickCurses(1);
  startRound();
}

function targetFor(floor, round) {
  const bases = [450, 1600, 6000, 20000];
  const base = floor <= 4 ? bases[floor - 1] : bases[3] * Math.pow(3.5, floor - 4);
  const t = base * [1, 1.6, 2.4][round];
  const mag = Math.pow(10, Math.max(1, Math.floor(Math.log10(t)) - 1));
  return Math.round(t / mag) * mag;
}
function pickCurses(floor) { return shuffle(Object.keys(CURSES)).slice(0, floor >= 4 ? 2 : 1); }
const ROUND_NAMES = ['Petite manche', 'Grande manche', 'BOSS'];

function startRound() {
  G.screen = 'round';
  G.placing = null;
  G.curses = G.round === 2 ? G.bossCurses.slice() : [];
  G.target = targetFor(G.floor, G.round);
  G.score = 0; G.shownScore = 0;
  G.ballsLeft = Math.max(3, G.ballsBase + (has('sac') ? 1 : 0) - (curse('disette') ? 3 : 0));
  G.ballsTotal = G.ballsLeft; G.launched = 0;
  G.balls = []; G.armed = []; G.filetUses = 0; G.cooldown = 0.5;
  G.cleared = false; G.endTimer = 0; G.lastBall = null;
  G.bucketPerm = [0, 1, 2, 3, 4, 5, 6];
  G.gouffre = -1;
  if (curse('gouffre')) { let bi = 0; G.buckets.forEach((m, i) => { if (m > G.buckets[bi]) bi = i; }); G.gouffre = bi; }
  for (const p of G.pegs) { p.st = {}; p.temp = null; p.frozen = false; p.hidden = curse('brume'); p.flash = 0; }
  if (curse('gel')) {
    const sp = shuffle(G.pegs.filter(p => !p.removed && p.type !== 'std'));
    sp.slice(0, Math.ceil(sp.length / 2)).forEach(p => { p.frozen = true; });
  }
  if (has('pluie')) convertRandom('gold', 4, true);
  const sub = G.curses.length
    ? G.curses.map(c => CURSES[c].ico + ' ' + CURSES[c].name).join('   ') + `  ·  Objectif ${fmt(G.target)}`
    : `Objectif : ${fmt(G.target)} points`;
  banner(`ÉTAGE ${G.floor} — ${ROUND_NAMES[G.round]}`, sub, G.round === 2 ? '#ff3355' : '#5ff0e0', 2.6);
  UI.dirty();
}

// Multiplicateur effectif du seau i (malédictions et reliques comprises)
function bucketMult(i) {
  const idx = G.bucketPerm[i];
  if (idx === G.gouffre) return 0;
  let m = G.buckets[idx];
  if (has('seaux')) m += 1;
  if (curse('mur')) m *= 0.5;
  return m;
}

function winRound() {
  const boss = G.round === 2;
  const base = [3, 4, 6][G.round] + Math.max(0, G.floor - 4);
  const perBall = has('epargne') ? 2 : 1;
  const ballsGold = G.ballsLeft * perBall;
  const avare = curse('avare');
  const interest = avare ? 0 : Math.min(has('bourse') ? 10 : 5, Math.floor(G.gold / 5));
  const total = base + ballsGold + interest;
  const info = { base, ballsLeft: G.ballsLeft, perBall, ballsGold, interest, avare, total, boss,
    score: G.score, target: G.target, forged: null, floor: G.floor, round: G.round };
  G.gold += total;
  G.run.rounds++;
  if (has('forge')) {
    const c = G.pegs.filter(p => !p.removed && p.type !== 'std' && p.lvl < 3);
    if (c.length) { const p = pick(c); p.lvl++; p.flash = 1; info.forged = p; }
  }
  for (const p of G.pegs) { p.temp = null; p.frozen = false; p.hidden = false; }
  G.curses = []; G.gouffre = -1; G.bucketPerm = [0, 1, 2, 3, 4, 5, 6];
  G.balls = []; G.armed = []; G.slot = null;
  G.screen = 'summary';
  Sfx.win();
  UI.summary(info);
  UI.dirty();
}
function loseRun() {
  G.screen = 'over';
  G.balls = [];
  Sfx.lose();
  recordRun(false);
  UI.gameOver();
  UI.dirty();
}
function afterSummary() {
  if (G.round === 2) {
    const final = G.floor === 4 && !G.endless;
    G.floor++; G.round = 0; G.bossCurses = pickCurses(G.floor);
    if (final) { G.screen = 'victory'; recordRun(true); UI.victory(); UI.dirty(); return; }
    offerRelics();
  } else { G.round++; openShop(); }
}
function offerRelics() {
  const avail = Object.keys(RELICS).filter(k => !G.relics.includes(k));
  const opts = [];
  while (opts.length < 3 && avail.length) {
    const k = wpick(avail, k => ({ c: 40, u: 40, r: 28 })[RELICS[k].rar]);
    opts.push(k); avail.splice(avail.indexOf(k), 1);
  }
  G.screen = 'relic';
  UI.relicChoice(opts);
  UI.dirty();
}
function takeRelic(k) {
  if (k && G.relics.length < MAX_RELICS) G.relics.push(k);
  else G.gold += 6;
  openShop();
}
function continueEndless() { G.endless = true; offerRelics(); }

/* ============================================================
   7. BOUTIQUE ET PLACEMENT
   ============================================================ */
function openShop() {
  G.screen = 'shop';
  G.placing = null;
  G.shop = { rerollCost: 2, pegs: [], relics: [], cons: [] };
  rollShop();
  UI.dirty();
}
function rollShop() {
  const pk = Object.keys(PEGS).filter(k => k !== 'std');
  G.shop.pegs = [0, 1, 2].map(() => ({ id: wpick(pk, k => RARITY[PEGS[k].rar].w), sold: false }));
  const ra = Object.keys(RELICS).filter(k => !G.relics.includes(k));
  G.shop.relics = [];
  while (G.shop.relics.length < 2 && ra.length) {
    const k = wpick(ra, k => RARITY[RELICS[k].rar].w);
    ra.splice(ra.indexOf(k), 1);
    G.shop.relics.push({ id: k, sold: false });
  }
  G.shop.cons = shuffle(Object.keys(CONS)).slice(0, 2).map(id => ({ id, sold: false }));
}
function reroll() {
  if (G.gold < G.shop.rerollCost) return deny('Pas assez d\'or');
  G.gold -= G.shop.rerollCost; G.shop.rerollCost++;
  G.placing = null;
  rollShop(); Sfx.buy(); UI.dirty();
}
function buyShop(kind, i) {
  const it = G.shop[kind][i];
  if (!it || it.sold) return;
  const def = kind === 'pegs' ? PEGS[it.id] : kind === 'relics' ? RELICS[it.id] : CONS[it.id];
  if (G.gold < def.price) return deny('Pas assez d\'or');
  if (kind === 'pegs') {
    G.placing = { kind: 'peg', type: it.id, price: def.price, item: it };
    UI.toast(`Cliquez sur un peg pour le transformer en ${def.name} (même type = niveau +1)`);
    UI.dirty(); return;
  }
  if (kind === 'relics' && G.relics.length >= MAX_RELICS) return deny('Emplacements de reliques pleins (vendez-en une)');
  if (kind === 'cons' && G.cons.length >= MAX_CONS) return deny('Emplacements de consommables pleins');
  (kind === 'relics' ? G.relics : G.cons).push(it.id);
  G.gold -= def.price; it.sold = true;
  Sfx.buy(); UI.dirty();
}
function buyService(k) {
  const price = SERVICES[k].price();
  if (G.gold < price) return deny('Pas assez d\'or');
  if (k === 'bille') { G.gold -= price; G.ballsBase++; G.ballUpPrice += 6; Sfx.buy(); UI.toast('+1 bille par manche !'); UI.dirty(); return; }
  if (k === 'clou' && !G.pegs.some(p => p.removed)) return deny('Aucun emplacement vide sur le plateau');
  G.placing = { kind: k, price };
  UI.toast(k === 'tampon' ? 'Cliquez sur un seau pour augmenter son multiplicateur'
    : k === 'burin' ? 'Cliquez sur un peg à retirer' : 'Cliquez sur un emplacement vide');
  UI.dirty();
}
// Cible de placement sous le point (x, y), ou null si invalide
function placeTarget(x, y) {
  const pl = G.placing; if (!pl) return null;
  if (pl.kind === 'tampon') return y > BUCKET_TOP - 10 ? { bucket: clamp(Math.floor(x / BW), 0, NB - 1) } : null;
  let best = null, bd = 24;
  for (const p of G.pegs) { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } }
  if (!best) return null;
  if (pl.kind === 'clou' ? !best.removed : best.removed) return null;
  if (pl.kind === 'peg' && best.type === pl.type && best.lvl >= 3) return null;
  return { peg: best };
}
function placeAt(x, y) {
  const pl = G.placing, tg = placeTarget(x, y);
  if (!tg) return deny();
  if (G.gold < pl.price) { G.placing = null; UI.dirty(); return deny('Pas assez d\'or'); }
  G.gold -= pl.price;
  if (tg.bucket !== undefined) {
    G.buckets[tg.bucket] += 1; G.tamponPrice += 3; G.bucketFlash[tg.bucket] = 1;
    burst(tg.bucket * BW + BW / 2, H - 40, '#ffd23f', 30, 220);
  } else {
    const p = tg.peg;
    if (pl.kind === 'peg') {
      if (p.type === pl.type) p.lvl++; else { p.type = pl.type; p.lvl = 1; p.value = 5; }
      pl.item.sold = true;
    } else if (pl.kind === 'burin') p.removed = true;
    else if (pl.kind === 'clou') { p.removed = false; p.type = 'std'; p.lvl = 1; }
    p.flash = 1;
    burst(p.x, p.y, p.removed ? '#8fa3c8' : PEGS[p.type].col, 24, 200);
  }
  G.placing = null;
  Sfx.buy(); UI.dirty();
}
function cancelPlacing() { if (G.placing) { G.placing = null; UI.dirty(); } }
function sellRelic(i) {
  const k = G.relics[i]; if (!k) return;
  G.relics.splice(i, 1); G.gold += Math.floor(RELICS[k].price / 2);
  Sfx.buy(); UI.dirty();
}
function useCons(i) {
  const id = G.cons[i]; if (!id) return;
  if (id === 'transmu') {
    if (G.screen !== 'round' && G.screen !== 'shop') return;
    const pk = Object.keys(PEGS).filter(k => k !== 'std');
    const pool = shuffle(G.pegs.filter(p => !p.removed && p.type === 'std')).slice(0, 3);
    for (const p of pool) {
      p.type = wpick(pk, k => RARITY[PEGS[k].rar].w); p.lvl = 1; p.value = 5; p.flash = 1; p.temp = null;
      burst(p.x, p.y, PEGS[p.type].col, 20, 200);
      addText(p.x, p.y - 14, PEGS[p.type].name, PEGS[p.type].col, 12, 1.4);
    }
  } else {
    if (G.screen !== 'round' || G.cleared) return deny('Utilisable pendant une manche');
    if (id === 'renfort') { G.ballsLeft += 2; G.ballsTotal += 2; addText(W / 2, 110, '+2 BILLES', '#ffffff', 18, 1.4); }
    else {
      if (G.armed.includes(id)) return deny('Déjà armé pour la prochaine bille');
      G.armed.push(id);
    }
  }
  G.cons.splice(i, 1);
  Sfx.buy(); UI.dirty();
}

/* ---------- Écran titre : plateau de démonstration ---------- */
function startDemo() {
  G.screen = 'title';
  G.relics = []; G.curses = []; G.armed = []; G.placing = null; G.slot = null; G.banner = null;
  G.buckets = DEFAULT_BUCKETS.slice(); G.bucketPerm = [0, 1, 2, 3, 4, 5, 6]; G.gouffre = -1;
  G.balls = []; G.demoT = 0.5; G.ballsLeft = 0; G.gold = 0;
  G.run = { score: 0, bestBall: 0, balls: 0, hits: 0, jackpots: 0, rounds: 0 };
  buildBoard();
  const pk = Object.keys(PEGS).filter(k => k !== 'std');
  shuffle(G.pegs.slice()).slice(0, 16).forEach(p => { p.type = pick(pk); p.lvl = rndi(1, 3); });
}

/* ============================================================
   8. PHYSIQUE, EFFETS DES PEGS ET SCORE
   ============================================================ */
function canLaunch() {
  return G.screen === 'round' && !G.cleared && !G.placing && G.ballsLeft > 0 && G.cooldown <= 0 && G.endTimer <= 0;
}
function makeBall(x, y, vx, vy) {
  return { id: uid++, x, y, vx, vy, r: BALL_R, pts: 0, mult: 1 + (has('collec') ? 0.5 * G.relics.length : 0),
    hits: 0, fire: has('pyro') ? 4 : 0, cd: new Map(), once: new Set(), hist: [], life: 0, slow: 0,
    portals: 0, trail: [], dead: false, ghost: false, golden: false, first: false, last: false,
    splitDone: false, clone: false, caught: false, wallCd: 0 };
}
function launch() {
  if (!canLaunch()) return false;
  G.ballsLeft--; G.launched++; G.cooldown = 0.35;
  const first = G.launched === 1, last = G.ballsLeft === 0;
  const armed = G.armed; G.armed = [];
  const spread = armed.includes('tri') ? [-0.2, 0, 0.2] : [0];
  for (const da of spread) {
    const a = G.aim + da;
    const b = makeBall(LAUNCH.x + Math.sin(a) * 24, LAUNCH.y + Math.cos(a) * 24, Math.sin(a) * LAUNCH_SPEED, Math.cos(a) * LAUNCH_SPEED);
    b.first = first; b.last = last;
    if (armed.includes('mega')) b.r = BALL_R * 1.8;
    if (armed.includes('elixir')) b.mult += 2;
    if (armed.includes('dore')) b.golden = true;
    G.balls.push(b);
  }
  G.run.balls++;
  Sfx.launch(); UI.dirty();
  return true;
}
function demoLaunch() {
  const a = rnd(-0.9, 0.9);
  G.balls.push(makeBall(LAUNCH.x + Math.sin(a) * 24, LAUNCH.y + Math.cos(a) * 24, Math.sin(a) * LAUNCH_SPEED, Math.cos(a) * LAUNCH_SPEED));
}

// Avance la simulation (pas fixe)
function simulate(dt) {
  if (G.screen !== 'round' && G.screen !== 'title') return;
  G.acc = Math.min(G.acc + dt * (G.screen === 'title' ? 1 : G.speed), 0.3);
  while (G.acc >= STEP) { step(STEP); G.acc -= STEP; }
}
function step(h) {
  G.time += h;
  if (G.cooldown > 0) G.cooldown -= h;
  const c = G.catcher, wide = has('aimant');
  c.t += h * (wide ? 0.5 : 0.8);
  c.w = wide ? 80 : 50;
  c.x = W / 2 + Math.sin(c.t) * (W / 2 - 80);
  const wind = curse('vent') ? Math.sin(G.time * 0.7) * 280 : 0;
  const rest = has('caout') ? 1.2 : 1;
  for (let i = 0; i < G.balls.length; i++) { const b = G.balls[i]; if (!b.dead) stepBall(b, h, wind, rest); }
  if (G.balls.some(b => b.dead)) G.balls = G.balls.filter(b => !b.dead);
  if (G.slot) {
    G.slot.t += h;
    if (!G.slot.revealed && G.slot.t > 0.95) {
      G.slot.revealed = true;
      if (G.slot.n >= 2) { burst(c.x, BAND.cy, '#ffd23f', G.slot.n === 3 ? 50 : 16, 260); if (G.slot.n === 3) shake(6); }
    }
    if (G.slot.t > 3.2) G.slot = null;
  }
  if (G.screen === 'title') {
    G.demoT -= h;
    if (G.demoT <= 0 && G.balls.length < 6) { G.demoT = rnd(0.5, 1.1); demoLaunch(); }
  } else checkRoundEnd(h);
}

function stepBall(b, h, wind, rest) {
  b.life += h;
  b.vy += GRAV * h;
  if (wind) b.vx += wind * h;
  const sp = Math.hypot(b.vx, b.vy);
  if (sp > 1300) { b.vx *= 1300 / sp; b.vy *= 1300 / sp; }
  const py = b.y;
  b.x += b.vx * h; b.y += b.vy * h;
  if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.75; wallHit(b); }
  else if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * 0.75; wallHit(b); }
  if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.5; }
  if (!b.ghost) {
    // Coupe Jackpot (capteur)
    if (!b.caught && py < BAND.cy && b.y >= BAND.cy && Math.abs(b.x - G.catcher.x) < G.catcher.w / 2) catcherHit(b);
    for (const p of G.pegs) {
      if (p.removed) continue;
      const t = pegType(p), rr = b.r + PEGS[t].r;
      const dx = b.x - p.x; if (dx > rr || dx < -rr) continue;
      const dy = b.y - p.y; if (dy > rr || dy < -rr) continue;
      const d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr || d2 === 0) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      b.x = p.x + nx * rr; b.y = p.y + ny * rr;
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) {
        const e = Math.min(1.1, (t === 'bump' ? 0.95 : 0.55) * rest);
        b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
        if (t === 'bump') {
          const out = b.vx * nx + b.vy * ny;
          if (out < 480) { b.vx += (480 - out) * nx; b.vy += (480 - out) * ny; }
        }
        b.vx += rnd(-14, 14);
        if (-vn > 30) hitPeg(b, p);
        if (b.dead) return;
      }
    }
    // Séparateurs des seaux (capsules verticales)
    if (b.y > BUCKET_TOP - b.r - 4) {
      for (let i = 1; i < NB; i++) {
        const sx = i * BW, cy = clamp(b.y, BUCKET_TOP, H), rr = b.r + 3;
        const dx = b.x - sx, dy = b.y - cy, d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
        b.x = sx + nx * rr; b.y = cy + ny * rr;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) { b.vx -= 1.4 * vn * nx; b.vy -= 1.4 * vn * ny; }
      }
    }
  }
  // Anti-blocage
  if (Math.abs(b.vx) + Math.abs(b.vy) < 45) {
    b.slow += h;
    if (b.slow > 0.5) { b.vx += (Math.random() < 0.5 ? -1 : 1) * rnd(90, 160); b.vy -= 50; b.slow = 0; }
  } else b.slow = 0;
  if (b.life > 22 && !b.ghost) { b.ghost = true; addText(b.x, b.y - 14, 'hors-jeu…', '#9189c0', 11); }
  if (b.y > H - 12) resolveBall(b);
}

function wallHit(b) {
  if (!has('ancre') || G.time < b.wallCd || b.ghost) return;
  b.wallCd = G.time + 0.25;
  b.pts += 15; b.hits++;
  addText(b.x < W / 2 ? 30 : W - 30, b.y, '+15', '#9fb3d9', 11);
}

function hitPeg(b, p) {
  const lastT = b.cd.get(p.id);
  if (lastT !== undefined && G.time - lastT < 0.2) return;
  b.cd.set(p.id, G.time);
  b.hits++; G.run.hits++;
  p.flash = 1; p.hidden = false;
  if (b.fire) b.pts += b.fire;
  triggerPeg(b, p, 0);
  if (has('diapason') && Math.random() < 0.25) {
    addText(p.x, p.y - 22, 'ÉCHO ♪', '#5ff0e0', 10);
    triggerPeg(b, p, 1);
  }
  if (has('chaine') && b.hits % 8 === 0) { b.mult += 1; addText(b.x, b.y - 20, '🔗 +1 mult', '#3fa9ff', 11); }
  if (b.golden && b.hits % 4 === 0) gainGold(1, b.x, b.y);
  b.hist.push(p); if (b.hist.length > 5) b.hist.shift();
  burst(p.x, p.y, PEGS[pegType(p)].col, 3, 70);
  Sfx.hit(b.hits);
}

function triggerPeg(b, p, depth) {
  const t = pegType(p), L = p.lvl;
  switch (t) {
    case 'std': addPts(b, 5 + (has('loupe') ? 5 : 0), p); break;
    case 'bump': addPts(b, 10 * L, p); Sfx.bump(); break;
    case 'mult': addMult(b, L, p); break;
    case 'gold':
      if (b.once.has(p.id)) { addPts(b, 5, p); break; }
      b.once.add(p.id);
      addPts(b, 10 * L, p);
      gainGold((L >= 3 ? 2 : 1) + (has('trefle') ? 1 : 0), p.x, p.y - 12);
      break;
    case 'fire':
      addPts(b, 5, p);
      if (!b.once.has(p.id)) { b.once.add(p.id); b.fire += 3 * L; addText(p.x, p.y - 22, `🔥 +${3 * L}/touche`, '#ff6a2a', 11); }
      break;
    case 'grow':
      addPts(b, p.value, p);
      p.value += L * (has('geode') ? 2 : 1);
      break;
    case 'crit':
      if (b.once.has(p.id)) { addPts(b, 5, p); break; }
      b.once.add(p.id); xMult(b, 1.25 + 0.25 * L, p);
      break;
    case 'bomb':
      addPts(b, 10, p);
      p.st.n = (p.st.n || 0) + 1;
      if (p.st.n >= 5 - L) { p.st.n = 0; explode(b, p, depth); }
      break;
    case 'echo':
      addPts(b, 5, p);
      if (depth < 2) {
        for (const q of b.hist.slice(-L)) {
          if (q === p || q.removed || pegType(q) === 'echo') continue;
          q.flash = 1; addText(q.x, q.y - 22, '↻', '#5ff0e0', 12);
          triggerPeg(b, q, depth + 1);
        }
      }
      break;
    case 'portal':
      if (b.portals < 1 && depth === 0) {
        b.portals++;
        if (L > 1) addMult(b, L - 1, p);
        teleport(b);
      } else addPts(b, 5, p);
      break;
    case 'split':
      addPts(b, 5, p);
      if (!b.splitDone && depth === 0) {
        b.splitDone = true;
        for (let i = 0; i < L; i++) G.balls.push(cloneBall(b, i));
        addText(p.x, p.y - 22, `SCISSION ×${L + 1}`, '#3fe08a', 13);
        Sfx.split();
      }
      break;
    case 'x2':
      if (b.once.has(p.id)) { addPts(b, 5, p); break; }
      b.once.add(p.id); xPts(b, 1.5 + 0.5 * L, p);
      break;
    case 'ball':
      addPts(b, 5, p);
      if ((p.st.uses || 0) < L && G.screen === 'round') {
        p.st.uses = (p.st.uses || 0) + 1;
        G.ballsLeft++; G.ballsTotal++;
        addText(p.x, p.y - 22, '+1 BILLE', '#ffffff', 14, 1.3);
        UI.dirty();
      }
      break;
  }
}

function addPts(b, n, p) {
  if (has('de') && Math.random() < 0.1) { n *= 3; addText(p.x + 12, p.y - 22, 'CRIT ×3', '#ffd23f', 11); }
  b.pts += n;
  addText(p.x, p.y - 10, '+' + fmt(n), PEGS[pegType(p) || 'std'].col, 10, 0.7);
}
function addMult(b, n, p) { b.mult += n; addText(p.x, p.y - 12, `+${n} mult`, '#3fa9ff', 12, 0.9); Sfx.mult(); }
function xMult(b, f, p) { b.mult *= f; addText(p.x, p.y - 12, `×${fmtMult(f)} mult`, '#b46bff', 13, 1); Sfx.xmult(); }
function xPts(b, f, p) { b.pts *= f; addText(p.x, p.y - 12, `pts ×${fmtMult(f)}`, '#ff3355', 13, 1); Sfx.xmult(); }
function gainGold(n, x, y) {
  if (curse('avare') || G.screen !== 'round') return false;
  G.gold += n;
  addText(x, y, `+${n} or`, '#ffd23f', 13, 1.1);
  Sfx.coin(); UI.dirty();
  return true;
}
function explode(b, p, depth) {
  const R = 80 + 20 * p.lvl;
  G.rings.push({ x: p.x, y: p.y, r: R, t: 0, dur: 0.45, col: '#ff8c1a' });
  burst(p.x, p.y, '#ff8c1a', 34, 320); burst(p.x, p.y, '#ffd23f', 14, 200);
  shake(7); Sfx.boom();
  addPts(b, 20, p);
  addText(p.x, p.y - 26, 'BOUM !', '#ff8c1a', 16, 1.1);
  const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy) || 1;
  b.vx += dx / d * 260; b.vy += dy / d * 260 - 80;
  if (depth >= 3) return;
  for (const q of G.pegs) {
    if (q === p || q.removed || Math.hypot(q.x - p.x, q.y - p.y) > R) continue;
    q.flash = 1; q.hidden = false; b.hits++;
    triggerPeg(b, q, depth + 1);
  }
}
function teleport(b) {
  G.rings.push({ x: b.x, y: b.y, r: 30, t: 0, dur: 0.4, col: '#8a6bff' });
  b.x = rnd(70, W - 70); b.y = 108; b.vx = rnd(-90, 90); b.vy = 30; b.trail = [];
  G.rings.push({ x: b.x, y: b.y, r: 30, t: 0, dur: 0.4, col: '#8a6bff' });
  burst(b.x, b.y, '#8a6bff', 16, 160);
  Sfx.portal();
}
function cloneBall(b, i) {
  const c = makeBall(b.x, b.y, 0, 0);
  Object.assign(c, { pts: b.pts, mult: b.mult, fire: b.fire, golden: b.golden, r: b.r, splitDone: true, clone: true,
    first: b.first, last: b.last, hits: b.hits, portals: b.portals, caught: b.caught });
  c.once = new Set(b.once); c.cd = new Map(b.cd); c.hist = b.hist.slice();
  const side = i % 2 === 0 ? -1 : 1, k = 1 + Math.floor(i / 2);
  c.vx = side * (140 + 70 * k) + b.vx * 0.3;
  c.vy = Math.min(b.vy, 0) * 0.5 - 120;
  return c;
}

// Machine à sous
function catcherHit(b) {
  b.caught = true;
  const w = s => s.w * (has('truquee') && (s.s === '7️⃣' || s.s === '💎') ? 2.6 : 1);
  const reels = [0, 1, 2].map(() => wpick(SLOT, w).s);
  const counts = {};
  reels.forEach(s => { counts[s] = (counts[s] || 0) + 1; });
  let best = reels[0], n = 0;
  for (const s in counts) if (counts[s] > n) { n = counts[s]; best = s; }
  let label;
  if (n === 1) { b.pts += 25; label = '+25 pts'; }
  else label = SLOT_FX[best][n - 2](b);
  G.slot = { reels, t: 0, label, n, revealed: false };
  addText(G.catcher.x, BAND.cy - 24, '🎰 JACKPOT ?', '#ffd23f', 13, 1.2);
  G.rings.push({ x: G.catcher.x, y: BAND.cy, r: 40, t: 0, dur: 0.5, col: '#ffd23f' });
  Sfx.slot(); if (n >= 2) Sfx.slotWin(n === 3);
  UI.dirty();
}

function resolveBall(b) {
  b.dead = true;
  const i = clamp(Math.floor(b.x / BW), 0, NB - 1);
  const bm = bucketMult(i);
  let extra = 1;
  if (b.first && has('premier')) extra *= 3;
  if (b.last && has('baroud')) extra *= 4;
  if (b.hits >= 25 && has('marathon')) extra *= 2;
  let mult = b.mult;
  if (has('midas')) mult += Math.floor(G.gold / 10);
  const total = Math.floor(b.pts * mult * bm * extra);
  G.score = (G.score || 0) + total;
  G.run.score += total;
  G.run.bestBall = Math.max(G.run.bestBall, total);
  G.bucketFlash[i] = 1;
  const cx = i * BW + BW / 2;
  if (G.screen === 'round') {
    const ratio = G.target ? total / G.target : 0;
    addText(cx, BUCKET_TOP - 34, `${fmt(b.pts)} × ${fmtMult(mult)} × ${fmtMult(bm)}${extra > 1 ? ' × ' + extra : ''}`, '#cfc8f5', 12, 1.6);
    addText(cx, BUCKET_TOP - 14, fmt(total), ratio > 0.5 ? '#ff4fa3' : ratio > 0.2 ? '#ffd23f' : '#ffffff', 16 + Math.min(14, ratio * 30), 1.8);
    burst(cx, H - 30, bm >= 3 ? '#ffd23f' : bm >= 2 ? '#3fe08a' : '#9fb3d9', 10 + Math.min(40, ratio * 80), 240);
    if (ratio > 0.25) shake(Math.min(10, ratio * 14));
    G.lastBall = { pts: b.pts, mult, bm, extra, total };
    Sfx.bucket(bm);
    if (has('filet') && !b.clone && b.hits < 6 && G.filetUses < 2 && !G.cleared) {
      G.filetUses++; G.ballsLeft++;
      addText(cx, BUCKET_TOP - 56, '🥅 Bille rendue', '#3fe08a', 13, 1.5);
    }
    if (curse('seisme')) { shuffle(G.bucketPerm); G.bucketFlash.fill(0.6); }
    UI.dirty();
  }
}

function checkRoundEnd(h) {
  if (G.screen !== 'round') return;
  if (G.endTimer > 0) {
    G.endTimer -= h;
    if (G.endTimer <= 0) { if (G.cleared) winRound(); else loseRun(); }
    return;
  }
  if (!G.cleared && G.score >= G.target) {
    G.cleared = true;
    for (const a of G.armed) if (G.cons.length < MAX_CONS) G.cons.push(a); // consommables armés rendus
    G.armed = [];
    banner('OBJECTIF ATTEINT !', G.ballsLeft ? `${G.ballsLeft} bille${G.ballsLeft > 1 ? 's' : ''} restante${G.ballsLeft > 1 ? 's' : ''} = or bonus` : 'Bien joué !', '#3fe08a', 2);
    Sfx.clear(); UI.dirty();
  }
  if (G.balls.length) return;
  if (G.cleared) G.endTimer = 1.1;
  else if (G.ballsLeft <= 0) {
    G.endTimer = 1.6;
    banner('PLUS DE BILLES…', `${fmt(G.score)} / ${fmt(G.target)}`, '#ff3355', 2);
  }
}

/* ---------- Effets visuels (données) ---------- */
function addText(x, y, s, col, size = 12, life = 0.9) {
  G.texts.push({ x, y, s, col, size, life, max: life });
  if (G.texts.length > 140) G.texts.shift();
}
function burst(x, y, col, n = 10, sp = 150) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), v = rnd(0.2, 1) * sp;
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.3, 0.8), max: 0.8, col, r: rnd(1, 2.6) });
  }
  if (G.parts.length > 700) G.parts.splice(0, G.parts.length - 700);
}
function shake(a) { G.shake = Math.max(G.shake, a); }
function updateFx(dt) {
  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt; p.vx *= 0.985; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const t of G.texts) { t.y -= 26 * dt; t.life -= dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  for (const r of G.rings) r.t += dt;
  G.rings = G.rings.filter(r => r.t < r.dur);
  for (const p of G.pegs) if (p.flash > 0) p.flash = Math.max(0, p.flash - dt * 2.5);
  for (let i = 0; i < NB; i++) G.bucketFlash[i] = Math.max(0, G.bucketFlash[i] - dt * 1.8);
  G.shake = Math.max(0, G.shake - dt * 28);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
  for (const b of G.balls) { b.trail.push(b.x, b.y); if (b.trail.length > 24) b.trail.splice(0, 2); }
}

function glowSprite(col, r) {
  const key = col + r;

  c = document.createElement('canvas'); c.width = c.height = R * 2 * q;

  gr.addColorStop(0, col + 'dd'); gr.addColorStop(0.3, col + '55'); gr.addColorStop(1, col + '00');
  g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
  c.lsize = R * 2;
  glowCache.set(key, c);
  return c;
}

function bucketColors(m) {

}

function drawPegs(now) {
  const pl = G.placing;
  const hov = pl && pl.kind !== 'tampon' ? placeTarget(mouse.x, mouse.y) : null;
  for (const p of G.pegs) {
    if (p.removed) {
      const want = pl && pl.kind === 'clou';
      ctx.strokeStyle = want ? `rgba(255,210,63,${0.55 + 0.35 * Math.sin(now * 6)})` : 'rgba(143,163,200,0.16)';
      ctx.setLineDash([2, 3]); ctx.lineWidth = 1.2; circle(p.x, p.y, 6); ctx.stroke(); ctx.setLineDash([]);
      continue;
    }
    const t = pegType(p), d = PEGS[t], r = d.r;
    let a = 1;
    if (p.hidden) a = 0.05 + p.flash * 0.95;
    if (pl && pl.kind !== 'tampon') {
      const valid = pl.kind !== 'clou' && !(pl.kind === 'peg' && p.type === pl.type && p.lvl >= 3);
      if (!valid) a *= 0.3;

    if (t !== 'std' || p.flash > 0) {

      ctx.globalAlpha = a * (t === 'std' ? p.flash * 0.8 : 0.42 + p.flash * 0.58);
      ctx.drawImage(gs, p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = a;
    ctx.fillStyle = p.flash > 0.55 ? '#ffffff' : d.col;
    circle(p.x, p.y, r); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';

    if (p.lvl > 1 && !p.frozen) {
      ctx.strokeStyle = d.col; ctx.lineWidth = 1.2;

    }
    if (p.frozen) {

  ctx.globalAlpha = 1;

function aimPath() {
  const pts = [], r = G.armed.includes('mega') ? BALL_R * 1.8 : BALL_R;
  let x = LAUNCH.x + Math.sin(G.aim) * 24, y = LAUNCH.y + Math.cos(G.aim) * 24;
  let vx = Math.sin(G.aim) * LAUNCH_SPEED, vy = Math.cos(G.aim) * LAUNCH_SPEED;
  const maxHits = has('viseur') ? 3 : 1, h = 1 / 120;
  let hits = 0, after = 0;
  for (let i = 0; i < 420; i++) {
    vy += GRAV * h; x += vx * h; y += vy * h;
    if (x < r) { x = r; vx = Math.abs(vx) * 0.75; } else if (x > W - r) { x = W - r; vx = -Math.abs(vx) * 0.75; }
    for (const p of G.pegs) {
      if (p.removed || p.hidden) continue;
      const t = pegType(p), rr = r + PEGS[t].r, dx = x - p.x, dy = y - p.y;
      if (Math.abs(dx) > rr || Math.abs(dy) > rr) continue;
      const d = Math.hypot(dx, dy); if (d >= rr || d === 0) continue;
      const nx = dx / d, ny = dy / d; x = p.x + nx * rr; y = p.y + ny * rr;
      const vn = vx * nx + vy * ny;
      if (vn < 0) {
        const e = t === 'bump' ? 0.95 : 0.55; vx -= (1 + e) * vn * nx; vy -= (1 + e) * vn * ny;
        if (t === 'bump') { const o = vx * nx + vy * ny; if (o < 480) { vx += (480 - o) * nx; vy += (480 - o) * ny; } }
        hits++;
      }
    }
    if (i % 3 === 0) pts.push(x, y);
    if (hits >= maxHits && ++after > 9) break;
    if (y > BUCKET_TOP) break;
  }
  return pts;
}
function drawAim() {
  if (G.screen !== 'round' || G.placing || G.cleared || G.ballsLeft <= 0 || G.endTimer > 0) return;
  const pts = aimPath(), n = pts.length / 2;
  for (let i = 0; i < n; i++) {
    const k = 1 - i / n;
    ctx.fillStyle = `rgba(255,255,255,${0.15 + 0.6 * k})`;
    circle(pts[i * 2], pts[i * 2 + 1], 1.2 + 1.3 * k); ctx.fill();

}

function render() {
  const now = performance.now() / 1000, k = VIEW.s * VIEW.dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!bgCanvas) buildBg();
  ctx.drawImage(bgCanvas, 0, 0);
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-1, 1) * G.shake, rnd(-1, 1) * G.shake);
  drawBand(now); drawBuckets(now); drawCatcher(now); drawPegs(now);
  drawAim(); drawBalls(); drawLauncher(); drawFx();
  ctx.restore();
  drawLCD(now); drawBallCounter(); drawBanner();
}

  const s = fmt(G.shownScore);
  if (s !== hud.scoreStr) {

    hud.bar.style.width = pct + '%'; hud.bar.classList.toggle('full', pct >= 100);
  }
  let best = null;
  for (const b of G.balls) if (!best || b.pts * b.mult > best.pts * best.mult) best = b;

  if (best) html = `<span class="p">${fmt(best.pts)}</span> <span class="x">pts ×</span> <span class="m">${fmtMult(best.mult)}</span> <span class="x">mult</span>`;

    html = `<span class="p">${fmt(l.pts)}</span>${x('×')}<span class="m">${fmtMult(l.mult)}</span>${x('×')}<span class="bk">${fmtMult(l.bm)}</span>${l.extra > 1 ? x('×') + `<span class="bk">${l.extra}</span>` : ''}${x('=')}${fmt(l.total)}`;

const tipEl = $('tip');
function showTip(html, cx, cy) {
  if (tipEl.innerHTML !== html) tipEl.innerHTML = html;
  tipEl.classList.remove('hidden');
  const r = tipEl.getBoundingClientRect();
  let x = cx + 16, y = cy + 16;
  if (x + r.width > innerWidth - 8) x = cx - r.width - 12;
  if (y + r.height > innerHeight - 8) y = cy - r.height - 12;
  tipEl.style.left = Math.max(8, x) + 'px'; tipEl.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tipEl.classList.add('hidden'); }
document.addEventListener('mousemove', e => {
  if (e.target === cv) return;
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el.dataset.tip, e.clientX, e.clientY); else hideTip();
});
function pegAt(x, y) {
  let best = null, bd = 14;
  for (const p of G.pegs) { if (p.removed) continue; const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } }
  return best;
}
function placeTipHTML(tg) {
  const pl = G.placing;
  if (tg.bucket !== undefined) return `<div class="th">Tampon</div>Seau ×${fmtMult(G.buckets[tg.bucket])} → ×${fmtMult(G.buckets[tg.bucket] + 1)} (valeur de base)`;

  if (pl.kind === 'burin') return `<div class="th" style="color:#ff3355">Retirer ce peg</div>${p.type !== 'std' ? `⚠️ Détruit ${PEGS[p.type].name} niv. ${p.lvl}` : 'Ouvre un passage'}`;
  if (pl.kind === 'clou') return '<div class="th">Replanter un Clou</div>';
  if (p.type === pl.type) return `<div class="th" style="color:${PEGS[pl.type].col}">${PEGS[pl.type].name} : niv. ${p.lvl} → ${p.lvl + 1}</div>${PEGS[pl.type].desc(p.lvl + 1, p)}`;
  return `<div class="th" style="color:${PEGS[pl.type].col}">→ ${PEGS[pl.type].name}</div>${cur}`;

const hover = { key: null, since: 0 };
function canvasTip(e) {
  if (modalOpen() || e.pointerType === 'touch') return hideTip();
  let html = null, key = null;
  if (G.placing) { const tg = placeTarget(mouse.x, mouse.y); if (tg) { html = placeTipHTML(tg); key = 'pl'; } }
  if (!html) {
    const p = pegAt(mouse.x, mouse.y), c = G.catcher;
    if (p && !p.hidden) {
      html = pegTip(pegType(p), p.lvl, p); key = p.id;
      if (p.frozen) html += `<div class="tw">❄️ ${PEGS[p.type].name} gelé : agit comme un Clou</div>`;
      if (p.temp) html += '<div class="tw">Temporaire (cette manche)</div>';
    } else if (mouse.y > BUCKET_TOP) {
      const i = clamp(Math.floor(mouse.x / BW), 0, NB - 1), m = bucketMult(i);
      html = `<div class="th">Seau ×${fmtMult(m)}</div>Le score de la bille (points × mult) est multiplié par ${fmtMult(m)}.`; key = 'b' + i;
    } else if (Math.abs(mouse.y - BAND.cy) < 22 && Math.abs(mouse.x - c.x) < c.w / 2 + 8) {
      html = '<div class="th" style="color:#ffd23f">Coupe JACKPOT</div>Une bille qui y tombe lance la machine à sous (1× par bille).<br>🍒 points · 🔔 mult · 💰 or · 💎 points × · 7️⃣ mult × et JACKPOT'; key = 'c';
    }
  }
  const now = performance.now();
  if (key !== hover.key) { hover.key = key; hover.since = now; }
  // Pendant une manche, l'infobulle n'apparaît qu'après un court survol (évite le clignotement en visant)
  if (html && (G.screen !== 'round' || G.placing || now - hover.since > 450)) showTip(html, e.clientX, e.clientY); else hideTip();
}

   ============================================================ */
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function aimAt(x, y) {
  if (G.screen !== 'round' || G.placing) return;
  G.aim = clamp(Math.atan2(x - LAUNCH.x, Math.max(12, y - LAUNCH.y)), -1.35, 1.35);
}
cv.addEventListener('pointermove', e => {
  const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
  aimAt(p.x, p.y); canvasTip(e);
});
cv.addEventListener('pointerdown', e => {
  if (e.button === 2) return;
  Sfx.init();
  const p = toLogical(e); mouse.x = p.x; mouse.y = p.y;
  mouse.down = true; mouse.held = 0; mouse.auto = false;
  aimAt(p.x, p.y);
  if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointerup', e => {
  if (!mouse.down) return;
  mouse.down = false;
  const p = toLogical(e); mouse.x = p.x; mouse.y = p.y;
  if (G.placing) placeAt(p.x, p.y);
  else if (G.screen === 'round' && !mouse.auto) { aimAt(p.x, p.y); launch(); }
  mouse.auto = false;
});
cv.addEventListener('pointercancel', () => { mouse.down = false; });
cv.addEventListener('pointerleave', () => { mouse.inside = false; hideTip(); });
cv.addEventListener('contextmenu', e => { e.preventDefault(); cancelPlacing(); });

function cycleSpeed() { G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 4 : 1; UI.toast(`Vitesse ×${G.speed}`); UI.dirty(); }
function toggleMute() { Sfx.init(); const m = Sfx.toggle(); UI.toast(m ? 'Son coupé' : 'Son activé'); UI.dirty(); }

const keys = {};
addEventListener('keydown', e => {
  Sfx.init();
  keys[e.code] = true;
  if (modalOpen()) {
    if ((e.code === 'Enter' || e.code === 'Space') && !e.repeat) {
      const b = document.querySelector('#mbox .btn.primary, #mbox .btn.goldb');
      e.preventDefault(); if (b) b.click();
    } else if (e.code === 'Escape' && document.querySelector('#mbox [data-act="close"]')) closeModal();
    return;
  }
  switch (e.code) {
    case 'Space': case 'Enter': e.preventDefault(); if (G.screen === 'round') launch(); break;
    case 'Digit1': case 'Numpad1': useCons(0); break;
    case 'Digit2': case 'Numpad2': useCons(1); break;
    case 'KeyF': cycleSpeed(); break;
    case 'KeyM': toggleMute(); break;
    case 'KeyH': if (G.screen !== 'title') openModal(helpHTML()); break;
    case 'Escape': cancelPlacing(); break;
    case 'ArrowLeft': case 'ArrowRight': e.preventDefault(); break;
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  Sfx.init(); Sfx.click();
  el.blur();
  const [a, b, c] = el.dataset.act.split(':');
  switch (a) {
    case 'kit': closeModal(); newRun(b); break;
    case 'help': openModal(helpHTML()); break;
    case 'close': closeModal(); if (G.screen === 'title') openModal(titleHTML()); break;
    case 'cont': closeModal(); afterSummary(); break;
    case 'relic': closeModal(); takeRelic(b); break;
    case 'skiprelic': closeModal(); takeRelic(null); break;
    case 'buy': buyShop(b, +c); break;
    case 'svc': buyService(b); break;
    case 'reroll': reroll(); break;
    case 'next': startRound(); break;
    case 'use': useCons(+b); break;
    case 'sell': e.stopPropagation(); sellRelic(+b); break;
    case 'cancel': cancelPlacing(); break;
    case 'speed': cycleSpeed(); break;
    case 'mute': toggleMute(); break;
    case 'menu': openModal(quitHTML()); break;
    case 'quit': if (G.screen !== 'over' && G.screen !== 'victory') recordRun(false); closeModal(); showTitle(); break;
    case 'endless': closeModal(); continueEndless(); break;
    case 'title': closeModal(); showTitle(); break;
  }
});

/* ============================================================
   12. BOUCLE PRINCIPALE
   ============================================================ */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const paused = modalOpen() && G.screen === 'round';
  if (!paused) {
    if (G.screen === 'round' && !G.placing) {
      if (keys.ArrowLeft) G.aim = clamp(G.aim - 1.1 * dt, -1.35, 1.35);
      if (keys.ArrowRight) G.aim = clamp(G.aim + 1.1 * dt, -1.35, 1.35);
      if (mouse.down) { mouse.held += dt; if (mouse.held > 0.45 && launch()) mouse.auto = true; }
    }
    simulate(dt);
    updateFx(dt * (G.screen === 'round' ? G.speed : 1));
  }
  render();
  updateHUD(dt);
  if (uiDirty) { uiDirty = false; renderSide(); }
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('boardWrap'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { bgCanvas = null; });
resize();
showTitle();
requestAnimationFrame(frame);
</script>
</body>
