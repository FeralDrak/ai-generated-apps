<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instinct Sauvage — Musique de prédateur</title>
<meta name="description" content="Une transe tribale nocturne générée en direct, portée par des grondements de panthère entièrement synthétisés.">
<!--
  ======================================================================
  INSTINCT SAUVAGE — NOTES DE CONCEPTION
  ======================================================================
  Un morceau d'environ 3 minutes (64 mesures, ré mineur / phrygien) dont
  la voix principale est un grand félin. Aucun échantillon : chaque cri
  est synthétisé au lancement par un modèle de gorge :
   - source glottale de Rosenberg en « vocal fry » (20–60 impulsions/s,
     jitter, shimmer, doublement de période) = la râpe gutturale ;
   - conduit vocal long (formants bas, ~300/800/1350/2100 Hz) qui s'ouvre
     pendant les rugissements ; souffle synchronisé aux impulsions ;
   - « poitrine » : le débit glottal filtré sous 160 Hz = le grondement
     qu'on sent plus qu'on ne l'entend ; saturation tanh.
  Les cris passent ensuite dans une caverne (réverbération à convolution),
  des résonateurs accordés sur la basse (le grondement « chante » dans la
  tonalité) et un écho ping-pong.

  Structure : Nuit noire → La Traque → La Chasse → La Tanière → L'Assaut
  → L'Aube (boucle infinie optionnelle). L'appel « en scie » du léopard
  sert de riff rythmique pendant la chasse.
  Esprits : Panthère, Tigre, Loup, Dragon (mêmes briques, autre anatomie).
  Export .wav par rendu hors ligne, identique à l'écoute (graine fixe).
  ======================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030507; --ink:#e2eae4; --mute:#8d9b93; --line:rgba(255,255,255,.075);
  --glass:rgba(6,11,10,.6); --eye-rgb:207,255,58; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid rgba(var(--eye-rgb),.85);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}

.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:18px 22px;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand svg{flex:none;width:34px;height:34px;color:rgb(var(--eye-rgb));filter:drop-shadow(0 0 8px rgba(var(--eye-rgb),.55))}
.brand h1{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:21px;letter-spacing:.16em;text-transform:uppercase;line-height:1.1}
.brand p{color:var(--mute);font-size:12.5px}
.totems{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.totems button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;color:var(--mute);font-weight:500;transition:background .2s,color .2s}
.totems button i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.totems button:hover{color:var(--ink)}
.totems button[aria-checked=true]{background:rgba(255,255,255,.08);color:var(--ink)}

.panel{position:fixed;right:18px;top:50%;transform:translateY(-62%);width:250px;padding:16px 16px 14px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:6;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:Cinzel,Georgia,serif;font-size:12px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase;font-weight:500}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}
.ctl .lbl b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,rgba(var(--eye-rgb),.9) var(--p,50%),rgba(255,255,255,.12) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 0 0 4px rgba(var(--eye-rgb),.22)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:rgba(var(--eye-rgb),.9)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch i{position:relative;flex:none;width:34px;height:20px;border-radius:20px;background:rgba(255,255,255,.14);transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+i{background:rgba(var(--eye-rgb),.85)}
.switch input:checked+i::after{transform:translateX(14px)}
.switch input:focus-visible+i{outline:2px solid rgba(var(--eye-rgb),.85);outline-offset:2px}
.btn{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:500;text-align:left;transition:background .2s,border-color .2s}
.btn:hover{background:rgba(255,255,255,.09)}
.btn small{color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums}
.btn.primary{background:rgba(var(--eye-rgb),.13);border-color:rgba(var(--eye-rgb),.4)}
.btn.primary:hover{background:rgba(var(--eye-rgb),.22)}
.btn:disabled{opacity:.5;cursor:wait}
.panel-toggle{display:none;position:fixed;right:16px;z-index:7;padding:8px 13px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:500;font-size:13px}

.dock{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(880px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px;z-index:5}
.pads-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;font-size:11.5px;color:var(--mute);letter-spacing:.04em}
.pads-head b{font-family:Cinzel,Georgia,serif;font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:11px}
.pads{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pad{position:relative;overflow:hidden;padding:10px 10px 9px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:left;transition:transform .08s,border-color .2s,box-shadow .3s;touch-action:manipulation}
.pad strong{display:block;font-size:13px;font-weight:600;padding-right:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad small{display:block;color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad kbd{position:absolute;top:8px;right:8px;font:600 10px Inter,sans-serif;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:15px}
.pad:hover{border-color:rgba(var(--eye-rgb),.4)}
.pad.hit{transform:scale(.965);border-color:rgba(var(--eye-rgb),.9);box-shadow:inset 0 0 26px rgba(var(--eye-rgb),.28)}
.transport{display:flex;align-items:center;gap:14px;padding:11px 16px 11px 11px;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.play{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgb(var(--eye-rgb));color:#050a05;box-shadow:0 0 28px rgba(var(--eye-rgb),.4);transition:transform .15s,box-shadow .3s}
.play:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(var(--eye-rgb),.55)}
.play svg{width:22px;height:22px}
.play .i-pause{display:none}
.play.on .i-play{display:none}
.play.on .i-pause{display:block}
.track{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.track-info{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#secName{font-family:Cinzel,Georgia,serif;font-weight:700;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#time{flex:none;color:var(--mute);font-variant-numeric:tabular-nums;font-size:12.5px}
.timeline{display:flex;gap:3px;height:24px}
.seg{position:relative;flex:var(--bars) 1 0;min-width:0;border-radius:6px;background:rgba(255,255,255,.065);overflow:hidden;font-size:10.5px;color:var(--mute);letter-spacing:.03em;text-align:left;padding:0 7px;transition:background .2s,color .2s}
.seg span{position:relative;z-index:1;display:block;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg i{position:absolute;top:0;bottom:0;left:0;width:var(--fill,0%);background:rgba(var(--eye-rgb),.3)}
.seg:hover{background:rgba(255,255,255,.12);color:var(--ink)}
.seg.cur{color:var(--ink)}
.seg.pending{box-shadow:inset 0 0 0 1px rgba(var(--eye-rgb),.8)}

.sec-title{position:fixed;left:50%;bottom:calc(var(--dock-h,180px) + 34px);transform:translateX(-50%);font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(24px,4.6vw,50px);letter-spacing:.25em;text-transform:uppercase;color:#fff;opacity:0;pointer-events:none;text-shadow:0 0 32px rgba(var(--eye-rgb),.55);z-index:4;white-space:nowrap}
.sec-title.show{animation:secIn 3.8s ease forwards}
@keyframes secIn{0%{opacity:0;letter-spacing:.55em;filter:blur(8px)}18%{opacity:.95;letter-spacing:.25em;filter:blur(0)}70%{opacity:.8}100%{opacity:0;letter-spacing:.2em}}
.hint{position:fixed;left:50%;bottom:calc(var(--dock-h,180px) + 30px);transform:translateX(-50%);color:var(--mute);font-size:13.5px;letter-spacing:.04em;z-index:4;pointer-events:none;text-align:center;transition:opacity .8s;white-space:nowrap}
.hint b{color:rgb(var(--eye-rgb));font-weight:600}
.hint.gone{opacity:0}

.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20}
.overlay[hidden]{display:none}
.ov-card{width:min(320px,calc(100% - 32px));padding:20px;border-radius:var(--r);background:rgba(8,13,12,.92);border:1px solid var(--line);text-align:center}
.ov-card p{margin-bottom:12px;font-family:Cinzel,Georgia,serif;letter-spacing:.08em}
.ov-bar{height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.ov-bar i{display:block;height:100%;width:0;background:rgb(var(--eye-rgb));transition:width .15s}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:rgba(8,13,12,.94);border:1px solid rgba(var(--eye-rgb),.35);z-index:30;transition:transform .35s;font-size:13px}
.toast.show{transform:translate(-50%,0)}

@media (max-width:980px){
  .panel{display:none;top:122px;transform:none;max-height:calc(100% - 330px);overflow:auto}
  .panel.open{display:flex}
  .panel-toggle{display:block;top:74px}
}
@media (max-width:720px){
  .top{flex-direction:column;align-items:stretch;padding:14px 16px;gap:10px}
  .brand{padding-right:104px}
  .brand p{display:none}
  .brand svg{width:26px;height:26px}
  .brand h1{font-size:15px;letter-spacing:.12em}
  .totems{align-self:flex-start;max-width:100%;overflow-x:auto}
  .totems button{padding:7px 11px;font-size:13px}
  .panel-toggle{top:16px}
  .panel{right:16px;left:16px;width:auto;top:112px}
  .pads{grid-template-columns:repeat(3,1fr);gap:6px}
  .pad{padding:10px 9px}
  .pad small,.pad kbd{display:none}
  .pad strong{padding-right:0}
  .pads-head span{display:none}
  .seg span{display:none}
  .hint{font-size:12.5px;white-space:normal;width:calc(100% - 48px)}
}
@media (max-height:560px){
  .pad small,.pads-head{display:none}
  .pad{padding:8px 9px}
  .transport{padding:8px 12px 8px 8px}
  .play{width:46px;height:46px}
}
@media (hover:none){.hint .kb,.pads-head span{display:none}}
@media (prefers-reduced-motion:reduce){.sec-title.show{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="currentColor"><path d="M9 4c4 8 6 17 4 32 5-11 5-21-4-32z"/><path d="M18 3c4 9 6 19 3 34 6-12 6-23-3-34z"/><path d="M27 5c4 8 5 17 3 30 5-10 5-20-3-30z"/></g></svg>
    <div><h1>Instinct Sauvage</h1><p id="subtitle">Transe nocturne portée par les grondements de la panthère</p></div>
  </div>
  <nav class="totems" id="totems" role="radiogroup" aria-label="Esprit animal"></nav>
</header>

<button class="panel-toggle" id="panelToggle" aria-controls="panel" aria-expanded="false">Réglages</button>
<aside class="panel" id="panel" aria-label="Réglages">
  <h2>Réglages</h2>
  <div id="ctls"></div>
  <label class="switch"><span>Boucle infinie</span><input type="checkbox" id="loop" checked><i></i></label>
  <button class="btn" id="reseed" title="Change les choix aléatoires du morceau">Nouvelle variation <small id="seedLbl"></small></button>
  <button class="btn primary" id="export" title="Rend le morceau complet hors ligne et le télécharge">Exporter en .wav <small>≈ 30 Mo</small></button>
</aside>

<div class="hint" id="hint"><b>▶</b> pour réveiller <span id="hintWho">la panthère</span><span class="kb"> · touches <b>1</b> à <b>6</b> pour ses cris</span></div>
<div class="sec-title" id="secTitle" aria-live="polite"></div>

<section class="dock">
  <div class="pads-head"><b>Cris</b><span>clavier 1 – 6 · espace = lecture</span></div>
  <div class="pads" id="pads"></div>
  <div class="transport">
    <button class="play" id="play" aria-label="Lecture">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.2v16H6zM13.8 4H18v16h-4.2z" fill="currentColor"/></svg>
    </button>
    <div class="track">
      <div class="track-info"><span id="secName">Nuit noire</span><span id="time">0:00 / 2:51</span></div>
      <div class="timeline" id="timeline" role="group" aria-label="Parties du morceau"></div>
    </div>
  </div>
</section>

<div class="overlay" id="overlay" hidden><div class="ov-card"><p id="ovText">…</p><div class="ov-bar"><i id="ovBar"></i></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   Utilitaires
   ===================================================================== */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash32(...ns) {
  let h = 0x811c9dc5;
  for (const n of ns) { h = Math.imul(h ^ (n | 0), 0x01000193); h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; }
  return h >>> 0;
}
function makeRng(seed) {
  const r = mulberry32(seed >>> 0);
  let spare = null;
  const f = () => r();
  f.range = (a, b) => a + (b - a) * r();
  f.int = (a, b) => a + Math.floor(r() * (b - a + 1));
  f.gauss = () => {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u, v, s;
    do { u = r() * 2 - 1; v = r() * 2 - 1; s = u * u + v * v; } while (s >= 1 || s === 0);
    const m = Math.sqrt(-2 * Math.log(s) / s);
    spare = v * m;
    return u * m;
  };
  return f;
}
// Courbe par points [[x, y], …] avec x de 0 à 1, interpolation douce
function bp(pts, x) {
  if (typeof pts === 'number') return pts;
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    const b = pts[i];
    if (x <= b[0]) {
      const a = pts[i - 1], u = (x - a[0]) / (b[0] - a[0] || 1);
      return a[1] + (b[1] - a[1]) * u * u * (3 - 2 * u);
    }
  }
  return pts[pts.length - 1][1];
}
const yieldNow = () => new Promise((res) => { const ch = new MessageChannel(); ch.port1.onmessage = () => res(); ch.port2.postMessage(0); });

/* =====================================================================
   DSP hors ligne : filtres et synthèse vocale
   ===================================================================== */
function biquad(x, type, f, q, sr) {
  const w0 = TAU * Math.min(f, sr * 0.45) / sr, cw = Math.cos(w0), al = Math.sin(w0) / (2 * q);
  let b0, b1, b2;
  const a0 = 1 + al, a1 = -2 * cw, a2 = 1 - al;
  if (type === 'lowpass') { b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = b0; }
  else if (type === 'highpass') { b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = b0; }
  else { b0 = al; b1 = 0; b2 = -al; }
  const B0 = b0 / a0, B1 = b1 / a0, B2 = b2 / a0, A1 = a1 / a0, A2 = a2 / a0;
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < x.length; i++) {
    const xi = x[i], y = B0 * xi + B1 * x1 + B2 * x2 - A1 * y1 - A2 * y2;
    x2 = x1; x1 = xi; y2 = y1; y1 = y; x[i] = y;
  }
  return x;
}
function rms(a) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * a[i]; return Math.sqrt(s / Math.max(1, a.length)); }
function peakNorm(a, target) {
  let p = 0;
  for (let i = 0; i < a.length; i++) { const v = Math.abs(a[i]); if (v > p) p = v; }
  if (p > 0) { const g = target / p; for (let i = 0; i < a.length; i++) a[i] *= g; }
  return a;
}
function fades(a, sr, fi, fo) {
  const ni = Math.min(a.length, Math.floor(fi * sr)), no = Math.min(a.length, Math.floor(fo * sr));
  for (let i = 0; i < ni; i++) a[i] *= i / ni;
  for (let i = 0; i < no; i++) a[a.length - 1 - i] *= i / no;
}
function mixParts(sr, parts, tail = 0.05) {
  let n = 0;
  for (const [a, at] of parts) n = Math.max(n, Math.floor(at * sr) + a.length);
  const out = new Float32Array(n + Math.floor(tail * sr));
  for (const [a, at, g] of parts) { const o = Math.floor(at * sr); for (let i = 0; i < a.length; i++) out[o + i] += a[i] * g; }
  return peakNorm(out, 0.92);
}

/* Modèle de gorge :
   source glottale (Rosenberg) → cascade de formants (Klatt) + souffle + « poitrine » */
function renderVoice(sr, p) {
  const rng = makeRng(p.seed);
  const N = Math.max(64, Math.floor(p.dur * sr));
  const voc = new Float32Array(N), bod = new Float32Array(N), his = new Float32Array(N);
  const tract = p.tract || 1;
  const Fc = p.F || [300, 820, 1350, 2100], Fo = p.Fo || [640, 1250, 2050, 2850], BW = p.BW || [90, 120, 170, 230];
  const nF = Fc.length;
  const A = new Float64Array(nF), B = new Float64Array(nF), C = new Float64Array(nF);
  const y1 = new Float64Array(nF), y2 = new Float64Array(nF), drift = new Float64Array(nF);
  const jitter = p.jitter ?? 0.1, shimmer = p.shimmer ?? 0.2, chaos = p.chaos ?? 0.03;
  const sub = p.sub ?? 0, drop = p.drop ?? 0, oq = p.oq ?? 0.5, fryOpen = p.fryOpen ?? 0.004;
  const nsync = p.noiseSync ?? 0.7, vib = p.vib || null, hasHiss = !!p.hiss;
  const dt = 1 / sr;
  let phase = 0, period = 1 / bp(p.f0, 0), openLen = period * oq, pulseAmp = 1, pulseN = 0;
  let prevFlow = 0, wob = 0, nlp = 0;
  let envA = 0, noiseA = 0, fryV = 0, mouthV = 0, hissA = 0;
  for (let i = 0; i < N; i++) {
    if ((i & 31) === 0) {
      const tn = i / N;
      envA = bp(p.amp, tn); noiseA = bp(p.noise ?? 0.3, tn); fryV = bp(p.fry ?? 1, tn);
      mouthV = bp(p.mouth ?? 0, tn); hissA = hasHiss ? bp(p.hiss, tn) : 0;
      for (let k = 0; k < nF; k++) {
        drift[k] = drift[k] * 0.996 + rng.gauss() * 0.004;
        const F = Math.min(sr * 0.45, lerp(Fc[k], Fo[k], mouthV) * tract * (1 + drift[k]));
        const r = Math.exp(-Math.PI * BW[k] * (1 + 0.4 * mouthV) / sr);
        C[k] = -r * r; B[k] = 2 * r * Math.cos(TAU * F / sr); A[k] = 1 - B[k] - C[k];
      }
    }
    phase += dt;
    if (phase >= period) {
      phase -= period;
      pulseN++;
      let f = bp(p.f0, i / N);
      if (vib) f *= 1 + vib[1] * Math.sin(TAU * vib[0] * i * dt);
      wob = wob * 0.92 + rng.gauss() * chaos;
      f *= Math.exp(wob);
      period = (1 / f) * (1 + jitter * clamp(rng.gauss(), -2.5, 2.5));
      pulseAmp = Math.max(0.05, 1 + shimmer * rng.gauss());
      if (sub > 0 && (pulseN & 1)) { period *= 1 + sub * 0.12; pulseAmp *= 1 - sub * 0.55; }
      if (drop > 0 && rng() < drop * fryV) pulseAmp *= 0.12;
      period = clamp(period, 1 / 1500, 0.25);
      openLen = lerp(period * oq, Math.min(fryOpen, period * 0.85), fryV);
    }
    const Tp = openLen * 0.62, Tn = openLen * 0.38;
    let flow = 0;
    if (phase < Tp) flow = 0.5 * (1 - Math.cos(Math.PI * phase / Tp));
    else if (phase < openLen) flow = Math.cos(0.5 * Math.PI * (phase - Tp) / Tn);
    flow *= pulseAmp;
    const src = (flow - prevFlow) * openLen * sr * 0.5;
    prevFlow = flow;
    const w = rng() * 2 - 1;
    nlp += (w - nlp) * 0.55;
    const gate = (1 - nsync) + nsync * Math.min(1.6, 0.2 + flow * 1.6);
    let x = (src * (1 - 0.6 * noiseA) + nlp * noiseA * 1.8 * gate) * envA;
    for (let k = 0; k < nF; k++) { const y = A[k] * x + B[k] * y1[k] + C[k] * y2[k]; y2[k] = y1[k]; y1[k] = y; x = y; }
    voc[i] = x;
    bod[i] = flow * envA;
    if (hasHiss) his[i] = w * hissA * envA * gate;
  }
  biquad(voc, 'highpass', p.hp || 30, 0.7, sr);
  biquad(bod, 'highpass', 20, 0.7, sr);
  biquad(bod, 'lowpass', 160, 0.7, sr);
  if (hasHiss) { biquad(his, 'highpass', 1800, 0.7, sr); biquad(his, 'lowpass', 7500, 0.7, sr); }
  const rv = rms(voc) || 1, rb = rms(bod) || 1, rh = hasHiss ? rms(his) || 1 : 1;
  const body = p.body || 0, hm = p.hissMix ?? 0.3;
  for (let i = 0; i < N; i++) voc[i] = voc[i] / rv + (body ? body * bod[i] / rb : 0) + (hasHiss ? hm * his[i] / rh : 0);
  const k = 0.28 / (rms(voc) || 1), d = p.drive || 1, td = Math.tanh(d);
  for (let i = 0; i < N; i++) voc[i] = Math.tanh(d * voc[i] * k) / td;
  biquad(voc, 'lowpass', p.lp || 4000, 0.6, sr);
  fades(voc, sr, 0.004, 0.03);
  return peakNorm(voc, 0.92);
}

// Souffle de feu (dragon) : bruit grave filtré en balayage + crépitements
function renderFire(sr, p) {
  const r = makeRng(p.seed), N = Math.floor(p.dur * sr), out = new Float32Array(N);
  let brown = 0, low = 0, band = 0, ce = 0;
  const cdec = Math.exp(-1 / (0.006 * sr));
  for (let i = 0; i < N; i++) {
    const tn = i / N, w = r() * 2 - 1;
    brown = brown * 0.992 + w * 0.08;
    const f = 2 * Math.sin(Math.PI * Math.min(bp(p.fc, tn), sr / 6) / sr);
    low += f * band; const high = w * 0.5 + brown * 1.5 - low - 1.1 * band; band += f * high;
    if (r() < bp(p.crackle, tn) / sr) ce = r.range(0.5, 1.6);
    ce *= cdec;
    out[i] = (band * 1.3 + brown * 0.6 + ce * w * 1.5) * bp(p.amp, tn);
  }
  biquad(out, 'highpass', 35, 0.7, sr);
  const k = 0.6 / (rms(out) || 1);
  for (let i = 0; i < N; i++) out[i] = Math.tanh(out[i] * k);
  fades(out, sr, 0.01, 0.05);
  return peakNorm(out, 0.9);
}

const BANK_SPEC = [['growl', 4], ['grunt', 4], ['roar', 2], ['raspEx', 4], ['raspIn', 3], ['snarl', 2], ['chuff', 2], ['sig', 1]];
async function buildBank(ctx, S, onProgress) {
  const sr = ctx.sampleRate, bank = {}, r = makeRng(hash32(7, S.id.length, S.id.charCodeAt(0), S.id.charCodeAt(1)));
  const total = BANK_SPEC.reduce((a, b) => a + b[1], 0);
  let done = 0;
  for (const [type, n] of BANK_SPEC) {
    bank[type] = [];
    for (let v = 0; v < n; v++) {
      const data = CALLS[type](S, r, sr);
      const buf = ctx.createBuffer(1, data.length, sr);
      buf.copyToChannel(data, 0);
      bank[type].push(buf);
      if (onProgress) onProgress(++done / total);
      await yieldNow();
    }
  }
  return bank;
}

function lcgFill(d, seed) { let s = seed >>> 0; for (let i = 0; i < d.length; i++) { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; d[i] = s / 2147483648 - 1; } }
function makeNoise(ctx) {
  const b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  lcgFill(b.getChannelData(0), 12345);
  return b;
}
function makeBrown(ctx) {
  const sr = ctx.sampleRate, N = sr * 4, X = Math.floor(sr * 0.25), tmp = new Float32Array(N + X);
  lcgFill(tmp, 987654);
  let b = 0;
  for (let i = 0; i < tmp.length; i++) { b = b * 0.996 + tmp[i] * 0.06; tmp[i] = b; }
  const buf = ctx.createBuffer(1, N, sr), d = buf.getChannelData(0);
  for (let i = 0; i < N; i++) d[i] = tmp[i];
  for (let i = 0; i < X; i++) { const a = i / X; d[i] = tmp[i] * a + tmp[N + i] * (1 - a); }
  peakNorm(d, 0.9);
  return buf;
}
function makeIR(ctx, dur) {
  const sr = ctx.sampleRate, N = Math.floor(dur * sr), buf = ctx.createBuffer(2, N, sr);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c), r = makeRng(1234 + c * 77);
    let lp = 0;
    for (let i = 0; i < N; i++) {
      const t = i / sr, a = lerp(0.85, 0.06, Math.sqrt(Math.min(1, t / dur)));
      lp += (r() * 2 - 1 - lp) * a;
      d[i] = lp * Math.exp(-t * 6.9 / dur) * (t < 0.012 ? t / 0.012 : 1);
    }
    for (let k = 0; k < 12; k++) { const idx = Math.floor(r.range(0.006, 0.09) * sr); d[idx] += r.range(-0.7, 0.7) * (1 - k * 0.06); }
  }
  return buf;
}
function bq(c, type, f, q) { const n = c.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; }

function buildGraph(ctx, live) {
  const g = { ctx };
  const G = (v) => { const n = ctx.createGain(); n.gain.value = v; return n; };
  const link = (...ns) => { for (let i = 0; i < ns.length - 1; i++) ns[i].connect(ns[i + 1]); };
  g.pre = G(0.45);
  // Coupe l'infra-grave (Q en dB : −3 = Butterworth), puis « Profondeur »
  const hp1 = bq(ctx, 'highpass', 30, -3), hp2 = bq(ctx, 'highpass', 30, -3);
  g.shelf = bq(ctx, 'lowshelf', 110, 0.7);
  g.comp = ctx.createDynamicsCompressor();
  g.comp.threshold.value = -18; g.comp.knee.value = 10; g.comp.ratio.value = 4; g.comp.attack.value = 0.006; g.comp.release.value = 0.22;
  g.clip = ctx.createWaveShaper(); g.clip.curve = softCurve(1.4); g.clip.oversample = '2x';
  g.master = G(0.8);
  link(g.pre, hp1, hp2, g.shelf, g.comp, g.clip, g.master, ctx.destination);
  if (live) { g.analyser = ctx.createAnalyser(); g.analyser.fftSize = 2048; g.analyser.smoothingTimeConstant = 0.8; g.master.connect(g.analyser); }

  // Caverne
  g.revIn = G(1); g.revOut = G(0.7);
  const pd = ctx.createDelay(0.2); pd.delayTime.value = 0.025;
  g.conv = ctx.createConvolver(); g.conv.buffer = makeIR(ctx, 4.4);
  link(g.revIn, pd, g.conv, g.revOut, g.pre);

  // Résonateurs accordés sur la basse
  g.combIn = G(1); g.combOut = G(0.5); g.combs = [];
  for (let i = 0; i < 3; i++) {
    const d = ctx.createDelay(0.1); d.delayTime.value = 1 / (73.42 * (i + 2));
    // Q en dB pour un passe-bas : −6 dB = aucun pic, sinon la boucle s'emballe
    const lp = bq(ctx, 'lowpass', 1600, -6), fb = G(0.87 - i * 0.02), out = G(0.28);
    link(g.combIn, d, lp, fb, d); link(lp, out, g.combOut);
    g.combs.push(d);
  }
  g.combOut.connect(g.pre); link(g.combOut, G(0.35), g.revIn);

  // Écho ping-pong
  g.delIn = G(1); g.delOut = G(0.55);
  g.dl = ctx.createDelay(2); g.dr = ctx.createDelay(2);
  const dlp = bq(ctx, 'lowpass', 2400, -6);
  const pl = ctx.createStereoPanner(), pr = ctx.createStereoPanner(); pl.pan.value = -0.7; pr.pan.value = 0.7;
  link(g.delIn, dlp, g.dl, G(0.5), g.dr, G(0.5), dlp);
  link(g.dl, pl, g.delOut); link(g.dr, pr, g.delOut);
  g.delOut.connect(g.pre); link(g.delOut, G(0.3), g.revIn);

  // Bus instrumentaux
  g.drums = G(0.9); g.drums.connect(g.pre); link(g.drums, G(0.16), g.revIn);
  g.duck = G(1); g.duck.connect(g.pre);
  g.bass = G(0.5);
  const bsh = ctx.createWaveShaper(); bsh.curve = softCurve(2.5);
  link(g.bass, bsh, bq(ctx, 'highpass', 45, -3), bq(ctx, 'lowpass', 420, 0.6), g.duck);
  g.pad = G(0.9); g.pad.connect(g.duck); link(g.pad, G(0.45), g.revIn);
  g.lead = G(0.8); g.lead.connect(g.pre); link(g.lead, G(0.5), g.delIn); link(g.lead, G(0.35), g.revIn);
  g.amb = G(0.9); g.amb.connect(g.pre); link(g.amb, G(0.4), g.revIn);

  // Chaîne des cris : sèche + saturée, puis caverne / résonance / écho
  g.growlIn = G(1); g.growlDry = G(1); g.growlDist = G(0.3); g.growlOut = G(1);
  const gsh = ctx.createWaveShaper(); gsh.curve = softCurve(3.5); gsh.oversample = '2x';
  link(g.growlIn, g.growlDry, g.growlOut);
  link(g.growlIn, gsh, bq(ctx, 'lowpass', 4500, 0.5), g.growlDist, g.growlOut);
  // Présence : fait ressortir la râpe de la gorge
  const presence = bq(ctx, 'peaking', 1700, 0.8); presence.gain.value = 5;
  const gshelf = bq(ctx, 'lowshelf', 100, 0.7); gshelf.gain.value = -4.5;
  link(g.growlOut, presence, gshelf, g.pre);
  link(g.growlOut, G(0.32), g.revIn);
  link(g.growlOut, G(0.7), g.combIn);
  link(g.growlOut, G(0.12), g.delIn);
  if (live) { g.growlAn = ctx.createAnalyser(); g.growlAn.fftSize = 1024; g.growlOut.connect(g.growlAn); }
  g.far = G(1.1); g.far.connect(g.revIn);
  g.res = G(1); g.res.connect(g.combIn);

  g.noise = makeNoise(ctx);
  g.brown = makeBrown(ctx);
  return g;
}

function setParams(g, p, t, instant) {
  const set = (param, v) => (instant ? (param.value = v) : param.setTargetAtTime(v, t, 0.05));
  set(g.shelf.gain, lerp(-6, 6, p.depth));
  set(g.revOut.gain, p.cave * 1.3);
  set(g.combOut.gain, p.res * 1.2);
  set(g.master.gain, p.vol);
  set(g.growlIn.gain, 0.6 + 0.55 * p.fer);
  set(g.growlDist.gain, 0.55 * Math.pow(p.fer, 1.5));
  set(g.growlDry.gain, 1 - 0.25 * p.fer);
  set(g.dl.delayTime, 45 / p.bpm);
  set(g.dr.delayTime, 45 / p.bpm);
}

/* Une « session » = les sorties d'une lecture. Changer de session permet de
   couper proprement tout ce qui est déjà programmé (pause, saut de partie). */
function newSession(E, t) {
  const c = E.ctx, g = E.g;
  const mk = (dest) => { const n = c.createGain(); n.gain.value = 0; n.gain.setValueAtTime(1, t); n.connect(dest); return n; };
  const out = { drums: mk(g.drums), bass: mk(g.bass), pad: mk(g.pad), lead: mk(g.lead), amb: mk(g.amb), growl: mk(g.growlIn), far: mk(g.far), res: mk(g.res), rev: mk(g.revIn) };
  const wsrc = c.createBufferSource(); wsrc.buffer = g.noise; wsrc.loop = true;
  const wf = bq(c, 'bandpass', 420, 0.7), wl = c.createOscillator(), wlg = c.createGain();
  wl.frequency.value = 0.06; wlg.gain.value = 260; wl.connect(wlg); wlg.connect(wf.frequency);
  const wind = c.createGain(); wind.gain.value = 0;
  wsrc.connect(wf); wf.connect(wind); wind.connect(out.amb);
  const rsrc = c.createBufferSource(); rsrc.buffer = g.brown; rsrc.loop = true;
  const rumble = c.createGain(); rumble.gain.value = 0;
  rsrc.connect(bq(c, 'highpass', 40, -3)).connect(bq(c, 'lowpass', 170, -3)).connect(rumble); rumble.connect(out.amb);
  const d1 = c.createOscillator(), d2 = c.createOscillator(), d1g = c.createGain(), drone = c.createGain();
  d1.frequency.value = mtof(26); d2.frequency.value = mtof(38); d1g.gain.value = 0.4; drone.gain.value = 0;
  d1.connect(d1g); d1g.connect(drone); d2.connect(drone); drone.connect(out.amb);
  const srcs = [wsrc, wl, rsrc, d1, d2];
  wsrc.start(t, 0.37); rsrc.start(t); wl.start(t); d1.start(t); d2.start(t);
  return { out, amb: { wind, rumble, drone }, srcs };
}
function endSession(sess, t, fade = 0.3) {
  if (!sess) return;
  for (const k in sess.out) { const p = sess.out[k].gain; p.cancelScheduledValues(t); p.setTargetAtTime(0, t, fade / 3); }
  for (const s of sess.srcs) { try { s.stop(t + fade * 3 + 0.1); } catch (e) { /* déjà arrêtée */ } }
  const ms = (t - sess.out.drums.context.currentTime + fade * 3) * 1000 + 8000;
  setTimeout(() => { for (const k in sess.out) sess.out[k].disconnect(); }, ms);
}

/* =====================================================================
   Instruments
   ===================================================================== */
function env(c, t, peak, a, tau, dest) {
  const g = c.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.setTargetAtTime(0, t + a, tau);
  g.connect(dest);
  return g;
}
function osc(c, type, f, t) { const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); return o; }
function noiseSrc(E, t, R, dur) {
  const s = E.ctx.createBufferSource(); s.buffer = E.g.noise; s.loop = true;
  s.start(t, R() * 1.5); s.stop(t + dur);
  return s;
}
function duck(E, t, depth) { const d = E.g.duck.gain; d.setValueAtTime(1 - depth, t); d.setTargetAtTime(1, t + 0.02, 0.11); }
function pan(c, v, dest) { const p = c.createStereoPanner(); p.pan.value = v; p.connect(dest); return p; }

const I = {
  kick(E, t, v, tune = 1, soft = false) {
    const c = E.ctx, o = osc(c, 'sine', 150 * tune, t);
    o.frequency.exponentialRampToValueAtTime(54 * tune, t + (soft ? 0.09 : 0.1));
    o.frequency.exponentialRampToValueAtTime(46 * tune, t + 0.4);
    o.connect(env(c, t, v, soft ? 0.012 : 0.003, soft ? 0.15 : 0.11, E.out.drums));
    o.start(t); o.stop(t + 1);
    duck(E, t, (soft ? 0.25 : 0.4) * v);
  },
  heart(E, t, v) { I.kick(E, t, v * 0.9, 0.88, true); },
  taiko(E, t, v, R) {
    const c = E.ctx, out = E.out.drums;
    const o = osc(c, 'sine', 108, t); o.frequency.exponentialRampToValueAtTime(56, t + 0.28);
    const g = env(c, t, v * 0.95, 0.004, 0.26, out);
    o.connect(g); o.start(t); o.stop(t + 1.6);
    const o2 = osc(c, 'triangle', 190, t); o2.frequency.exponentialRampToValueAtTime(105, t + 0.12);
    o2.connect(env(c, t, v * 0.22, 0.002, 0.07, out)); o2.start(t); o2.stop(t + 0.6);
    noiseSrc(E, t, R, 0.6).connect(bq(c, 'bandpass', 240, 1.2)).connect(env(c, t, v * 0.9, 0.002, 0.07, out));
    const s = c.createGain(); s.gain.value = 0.25; g.connect(s); s.connect(E.out.rev);
    duck(E, t, 0.5 * v);
  },
  tom(E, t, v, which, R) {
    const c = E.ctx, f0 = which === 'low' ? 82 : which === 'mid' ? 110 : 147;
    const p = pan(c, which === 'low' ? -0.3 : which === 'mid' ? 0.1 : 0.4, E.out.drums);
    const o = osc(c, 'sine', f0 * 1.45, t); o.frequency.exponentialRampToValueAtTime(f0, t + 0.07);
    o.connect(env(c, t, v * 0.8, 0.002, 0.16, p)); o.start(t); o.stop(t + 0.9);
    noiseSrc(E, t, R, 0.3).connect(bq(c, 'bandpass', f0 * 4, 1.5)).connect(env(c, t, v * 0.3, 0.001, 0.03, p));
  },
  clap(E, t, v, R) {
    const c = E.ctx, g = c.createGain();
    g.gain.setValueAtTime(0, t);
    for (const [d, a] of [[0, 1], [0.011, 0.8], [0.023, 0.9]]) { g.gain.setValueAtTime(v * a, t + d); g.gain.setTargetAtTime(0, t + d + 0.001, 0.004); }
    g.gain.setValueAtTime(v * 0.8, t + 0.034); g.gain.setTargetAtTime(0, t + 0.035, 0.09);
    noiseSrc(E, t, R, 0.8).connect(bq(c, 'bandpass', 1350, 0.9)).connect(g);
    g.connect(E.out.drums);
    const s = c.createGain(); s.gain.value = 0.5; g.connect(s); s.connect(E.out.rev);
    const o = osc(c, 'triangle', 190, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
    o.connect(env(c, t, v * 0.35, 0.002, 0.05, E.out.drums)); o.start(t); o.stop(t + 0.4);
  },
  shaker(E, t, v, R) {
    const c = E.ctx;
    noiseSrc(E, t, R, 0.2).connect(bq(c, 'highpass', 6000, 0.7)).connect(env(c, t, v * 0.22, 0.003, 0.024, pan(c, 0.28, E.out.drums)));
  },
  claw(E, t, R) {
    const c = E.ctx;
    for (let k = 0; k < 3; k++) {
      const tt = t + k * 0.021, f = bq(c, 'bandpass', 6500, 4);
      f.frequency.setValueAtTime(6500, tt); f.frequency.exponentialRampToValueAtTime(1100, tt + 0.12);
      noiseSrc(E, tt, R, 0.3).connect(f).connect(env(c, tt, 0.55, 0.004, 0.035, pan(c, -0.4 + k * 0.4, E.out.drums)));
    }
    if (E.ev) E.ev('claw', t, {});
  },
  riser(E, t, dur, v, R) {
    const c = E.ctx, f = bq(c, 'bandpass', 250, 3), g = c.createGain();
    f.frequency.setValueAtTime(250, t); f.frequency.exponentialRampToValueAtTime(3200, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v * 0.3, t + dur * 0.95); g.gain.linearRampToValueAtTime(0, t + dur);
    noiseSrc(E, t, R, dur + 0.05).connect(f).connect(g);
    g.connect(E.out.drums);
    const s = c.createGain(); s.gain.value = 0.6; g.connect(s); s.connect(E.out.rev);
  },
  impact(E, t, v, R) {
    I.kick(E, t, v); I.taiko(E, t, v * 1.1, R);
    const c = E.ctx, g = env(c, t, v * 0.4, 0.003, 0.45, E.out.drums);
    noiseSrc(E, t, R, 3).connect(bq(c, 'lowpass', 2600, 0.5)).connect(g);
    const s = c.createGain(); s.gain.value = 0.8; g.connect(s); s.connect(E.out.rev);
    if (E.ev) E.ev('impact', t, {});
  },
  cricket(E, t, R) {
    const c = E.ctx, o = osc(c, 'sine', 4300 + R() * 700, t), g = c.createGain(), n = 2 + Math.floor(R() * 3);
    g.gain.setValueAtTime(0, t);
    for (let k = 0; k < n; k++) { const tt = t + k * 0.055; g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(0.018, tt + 0.006); g.gain.linearRampToValueAtTime(0, tt + 0.035); }
    o.connect(g); g.connect(pan(c, R() * 1.6 - 0.8, E.out.amb));
    o.start(t); o.stop(t + n * 0.055 + 0.05);
  },
  bass(E, t, hz, dur, v) {
    const c = E.ctx, o = osc(c, 'sine', hz * 1.6, t), o2 = osc(c, 'triangle', hz * 2, t), g2 = c.createGain(), g = c.createGain();
    o.frequency.exponentialRampToValueAtTime(hz, t + 0.045);
    g2.gain.value = 0.2;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v * 0.55, t + 0.008);
    g.gain.setValueAtTime(v * 0.55, t + Math.max(0.01, dur - 0.02)); g.gain.setTargetAtTime(0, t + Math.max(0.011, dur), 0.06);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(E.out.bass);
    o.start(t); o2.start(t); o.stop(t + dur + 0.5); o2.stop(t + dur + 0.5);
  },
  pad(E, t, dur, notes, bright, lvl) {
    const c = E.ctx, f = bq(c, 'lowpass', bright, 0.6), lfo = osc(c, 'sine', 0.11, t), lg = c.createGain(), g = c.createGain();
    lg.gain.value = bright * 0.4; lfo.connect(lg); lg.connect(f.frequency);
    const a = Math.min(1.8, dur * 0.45), rel = 2.4, L = 0.06 * lvl, end = t + dur + rel + 0.05;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(L, t + a); g.gain.setValueAtTime(L, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + rel);
    f.connect(g); g.connect(E.out.pad);
    for (const m of notes) for (const d of [-8, 7]) { const o = osc(c, 'sawtooth', mtof(m), t); o.detune.value = d; o.connect(f); o.start(t); o.stop(end); }
    const so = osc(c, 'sine', mtof(notes[0] - 12), t), sg = c.createGain(); sg.gain.value = 1.5;
    so.connect(sg); sg.connect(f); so.start(t); so.stop(end);
    lfo.start(t); lfo.stop(end);
  },
  pluck(E, t, midi, v) {
    const c = E.ctx, fr = mtof(midi), car = osc(c, 'sine', fr, t), mod = osc(c, 'sine', fr * 2.005, t), mg = c.createGain();
    mg.gain.setValueAtTime(fr * 2.4, t); mg.gain.exponentialRampToValueAtTime(fr * 0.04, t + 0.45);
    mod.connect(mg); mg.connect(car.frequency);
    car.connect(bq(c, 'lowpass', 2600, 0.5)).connect(env(c, t, v * 0.2, 0.003, 0.32, E.out.lead));
    car.start(t); mod.start(t); car.stop(t + 2.2); mod.stop(t + 2.2);
  },
};

// Cri joué depuis la banque
const CALL_GAIN = { growl: 0.9, grunt: 0.85, roar: 1, raspEx: 0.7, raspIn: 0.42, snarl: 0.75, chuff: 0.7, sig: 0.95 };
function playCall(E, out, type, t, o = {}) {
  const list = E.bank && E.bank[type];
  if (!list || !list.length) return 0;
  const R = o.R || Math.random, c = E.ctx;
  const buf = list[Math.floor(R() * list.length) % list.length];
  const src = c.createBufferSource(); src.buffer = buf;
  const rate = (o.rate || 1) * (1 + (R() - 0.5) * 0.08);
  src.playbackRate.value = rate;
  const dist = o.dist || 0, lvl = (o.gain ?? 1) * (CALL_GAIN[type] || 1);
  const p = c.createStereoPanner(); p.pan.value = clamp(o.pan || 0, -1, 1);
  src.connect(bq(c, 'lowpass', lerp(9000, 900, Math.pow(dist, 0.8)), 0.5)).connect(p);
  const dry = c.createGain(); dry.gain.value = lvl * (1 - 0.85 * dist); p.connect(dry); dry.connect(out.growl);
  if (dist > 0.05) { const fg = c.createGain(); fg.gain.value = lvl * dist; p.connect(fg); fg.connect(out.far); }
  if (o.res) { const rg = c.createGain(); rg.gain.value = lvl * o.res; p.connect(rg); rg.connect(out.res); }
  src.start(t);
  const dur = buf.duration / rate;
  if (E.ev) E.ev(type, t, { dur, dist, gain: lvl });
  return dur;
}

const P = {

function getBank(id) {

  if (!P.bankJobs[id]) {
    const S = SPECIES[id];
    let shown = false;
    const tm = setTimeout(() => { shown = true; overlay.show(`${S.art[0].toUpperCase()}${S.art.slice(1)} s’éveille…`); }, 150);
    P.bankJobs[id] = buildBank(P.ctx, S, (p) => shown && overlay.progress(p)).then((b) => {
      clearTimeout(tm); if (shown) overlay.hide();

async function ensureAudio() {

    }
  }
  function drawBeast() {
    const E = V.E, S = V.S, H = HEADS[S.head];
    const breath = 1 + Math.sin(V.time * 0.9) * 0.008 + V.level * 0.018;
    const cy = V.cy - V.level * E * 0.15;
    const bg = c.createRadialGradient(V.cx, cy - E, E, V.cx, cy - E, E * 9);
    bg.addColorStop(0, 'rgba(70,95,88,0.2)'); bg.addColorStop(1, 'rgba(70,95,88,0)');
    c.fillStyle = bg; c.fillRect(V.cx - E * 9, cy - E * 10, E * 18, E * 18);
    c.save();
    c.translate(V.cx, cy); c.scale(breath, breath); c.translate(-V.cx, -cy);

    c.fillStyle = '#020405'; c.fill();
    c.strokeStyle = rim; c.lineWidth = 1.5; c.stroke();

    c.fillStyle = '#020405'; c.fill();
    c.stroke();

    c.restore();

  }
  // Truffe, babines, moustaches, et la gueule qui s'ouvre quand la bête gronde
  function drawFace(cy) {
    const E = V.E, S = V.S, col = V.col, lv = V.level, x = V.cx;
    const F = { feline: [1.35, true], tigre: [1.35, true], loup: [2.2, false], dragon: [1.85, false] }[S.head];
    const ny = cy + F[0] * E;
    const lit = c.createRadialGradient(x, cy - 0.3 * E, E * 0.3, x, cy + 0.6 * E, E * 3.4);
    lit.addColorStop(0, rgba(col, 0.03 + 0.06 * lv)); lit.addColorStop(1, rgba(col, 0));
    c.fillStyle = lit; c.fillRect(x - E * 4, cy - E * 3, E * 8, E * 7);
    // Gueule
    const open = clamp((lv - 0.12) * 1.6, 0, 1), my = ny + 0.95 * E, rx = E * (S.head === 'loup' ? 0.75 : 0.95), ry = E * 0.85 * open;
    if (open > 0.02) {
      const mg = c.createRadialGradient(x, my, 0, x, my, rx);
      mg.addColorStop(0, `rgba(${60 + 60 * lv | 0},6,4,1)`); mg.addColorStop(1, '#030000');
      c.fillStyle = mg;
      c.beginPath(); c.ellipse(x, my, rx, ry + 1, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(232,226,208,0.9)';
      for (const s of [-1, 1]) {
        const fx = x + s * rx * 0.55, fl = E * 0.42 * Math.min(1, open * 1.6);
        c.beginPath(); c.moveTo(fx - E * 0.1, my - ry); c.lineTo(fx + E * 0.1, my - ry); c.lineTo(fx + s * E * 0.02, my - ry + fl); c.fill();
        c.beginPath(); c.moveTo(fx - E * 0.08, my + ry); c.lineTo(fx + E * 0.08, my + ry); c.lineTo(fx - s * E * 0.02, my + ry - fl * 0.7); c.fill();

    c.beginPath();
    c.moveTo(x - E * 0.34, ny - E * 0.12);
    c.quadraticCurveTo(x, ny - E * 0.28, x + E * 0.34, ny - E * 0.12);
    c.quadraticCurveTo(x + E * 0.3, ny + E * 0.12, x, ny + E * 0.3);
    c.quadraticCurveTo(x - E * 0.3, ny + E * 0.12, x - E * 0.34, ny - E * 0.12);
    c.fillStyle = '#000'; c.fill();
    c.strokeStyle = rgba(col, 0.12 + 0.35 * lv); c.lineWidth = 1.2; c.stroke();
    if (S.head === 'dragon') {

      for (const s of [-1, 1]) { c.beginPath(); c.ellipse(x + s * E * 0.16, ny + E * 0.02, E * 0.06, E * 0.1, s * 0.5, 0, TAU); c.fill(); }
    }

    c.strokeStyle = `rgba(255,255,255,${0.05 + 0.08 * lv})`; c.lineWidth = 1.2;
    c.beginPath();
    c.moveTo(x, ny + E * 0.3); c.lineTo(x, ny + E * 0.62 - open * E * 0.2);
    for (const s of [-1, 1]) { c.moveTo(x, ny + E * 0.62 - open * E * 0.2); c.quadraticCurveTo(x + s * E * 0.3, ny + E * 0.9, x + s * E * 0.7, ny + E * 0.72); }

    if (F[1]) {

        const x0 = x + s * E * 0.62, y0 = ny + E * (0.42 + k * 0.14), sway = Math.sin(V.time * 0.8 + k) * E * 0.05;
        c.moveTo(x0, y0); c.quadraticCurveTo(x + s * E * 2.2, y0 - E * (0.25 - k * 0.2) + sway, x + s * E * 3.9, y0 - E * (0.35 - k * 0.42) + sway * 2);

  }
  function drawGrass() {
    const { w, h } = V, n = V.grass.length, sr = P.ctx ? P.ctx.sampleRate : 48000, binHz = sr / 2048;

    const tips = [];
    for (let i = 0; i < n; i++) {
      const G = V.grass[i], f = 40 * Math.pow(150, i / (n - 1)), b = Math.min(1022, Math.max(1, Math.round(f / binHz)));
      const a = (V.spec[b - 1] + V.spec[b] * 2 + V.spec[b + 1]) / 1020;
      const hh = h * (0.03 + 0.15 * Math.pow(a, 1.6)) * G.k;
      const sway = Math.sin(V.time * 1.3 + G.ph) * 3 + V.bass * 6;
      c.moveTo(G.x - 2.6, h + 2);
      c.quadraticCurveTo(G.x + sway * 0.3, h - hh * 0.5, G.x + sway, h - hh);
      c.quadraticCurveTo(G.x + sway * 0.3 + 1, h - hh * 0.5, G.x + 2.6, h + 2);
      if (a > 0.45) tips.push(G.x + sway, h - hh, a);

    const gg = c.createLinearGradient(0, h, 0, h * 0.75);
    gg.addColorStop(0, '#020604'); gg.addColorStop(1, '#0b1d15');
    c.fillStyle = gg; c.fill();
    if (tips.length && glowSprite) {
      c.save(); c.globalCompositeOperation = 'lighter';
      for (let i = 0; i < tips.length; i += 3) { c.globalAlpha = Math.min(1, (tips[i + 2] - 0.45) * 1.6); c.drawImage(glowSprite, tips[i] - 6, tips[i + 1] - 6, 12, 12); }

  }
  function slash(x0, y0, x1, y1, bow, thick) {
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1;
    const nx = -dy / l, ny = dx / l, qx = mx + nx * bow, qy = my + ny * bow, left = [], right = [];
    for (let i = 0; i <= 14; i++) {
      const u = i / 14, iu = 1 - u;
      const px = iu * iu * x0 + 2 * iu * u * qx + u * u * x1, py = iu * iu * y0 + 2 * iu * u * qy + u * u * y1;

  function onEvent(ev) {
    const d = ev.dist || 0, near = 1 - d, E = V.E;
    const ring = (n, big) => { for (let k = 0; k < n; k++) V.ripples.push({ t0: V.time + k * 0.14, max: E * (big ? 11 : 6) * (0.6 + near * 0.6), dur: big ? 2.2 : 1.6, a: 0.4 * near + 0.08 }); };
    switch (ev.type) {
      case 'roar': V.shake = Math.max(V.shake, near); V.flash = Math.max(V.flash, 0.3 * near); ring(3, true); break;
      case 'sig': V.shake = Math.max(V.shake, 0.5 * near); ring(3, true); break;
      case 'growl': ring(2, false); break;
      case 'grunt': V.shake = Math.max(V.shake, 0.35 * near); ring(1, false); break;
      case 'snarl': V.snarl = 1; ring(1, false); break;
      case 'raspEx': if (near > 0.8) ring(1, false); break;

  function frame() {

  }

  function draw(dt, open) {
    const { w, h } = V, E = V.E, col = V.col;
    c.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    const bg = c.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#020406'); bg.addColorStop(0.6, '#050b0a'); bg.addColorStop(1, '#081410');
    c.fillStyle = bg; c.fillRect(0, 0, w, h);
    const sh = V.shake * E * 0.22;
    c.save();
    c.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
    // Lune
    const mx = w * 0.8, my = h * 0.17, mr = Math.min(w, h) * 0.05;
    const mh = c.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 7);
    mh.addColorStop(0, 'rgba(190,215,205,0.1)'); mh.addColorStop(1, 'rgba(190,215,205,0)');

        const dx = f.x - V.cx, dy = f.y - V.cy, d = Math.hypot(dx, dy) || 1;
        if (V.level > 0.12) { const k = V.level * 220 * dt / Math.max(0.4, d / (E * 6)); f.vx += dx / d * k; f.vy += dy / d * k; }
        f.vx *= 0.97; f.vy *= 0.97; f.x += f.vx * dt; f.y += f.vy * dt;
        if (f.x < -20) f.x = w + 20; if (f.x > w + 20) f.x = -20; if (f.y < -20) f.y = h + 20; if (f.y > h + 20) f.y = -20;
        c.globalAlpha = 0.25 + 0.75 * Math.max(0, Math.sin(V.time * f.sp + f.ph));
        const s = 14 * f.s; c.drawImage(glowSprite, f.x - s / 2, f.y - s / 2, s, s);
      }
      c.restore();
    }
    // Griffures
    c.save(); c.globalCompositeOperation = 'lighter';
    for (let i = V.claws.length - 1; i >= 0; i--) {
      const k = V.claws[i], age = V.time - k.t0;
      if (age > 1.4) { V.claws.splice(i, 1); continue; }

    setSpecies(S) { V.S = S; V.target = S.col.slice(); glowSprite = sprite(S.col.map((v) => lerp(v, 255, 0.35)), false); softSprite = sprite([175, 195, 190], true); },

})();

scene.start();
window.__instinct = { P, SPECIES, CALLS, I, renderVoice, renderSong, encodeWav, ensureAudio, scene };
})();
