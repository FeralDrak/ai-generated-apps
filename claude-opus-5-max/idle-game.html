<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENTROPIE — Programme d'exploration profonde</title>
<style>
/* ============================================================
   RESET & THEME
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; }

:root{
  --bg:        #05070d;
  --bg2:       #080c16;
  --panel:     rgba(18,26,44,.72);
  --panel-hi:  rgba(28,40,66,.78);
  --line:      rgba(96,132,190,.22);
  --line-hi:   rgba(120,190,255,.45);
  --txt:       #c9d6ee;
  --txt-dim:   #6e819f;
  --txt-hi:    #eaf3ff;
  --cyan:      #4fd6e8;
  --amber:     #ffb547;
  --violet:    #c77dff;
  --green:     #56dc9a;
  --red:       #ff6b6b;
  --blue:      #6ea8ff;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Mono", Consolas, monospace;
  --sans: "Inter", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
}

body{
  background: var(--bg);
  color: var(--txt);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#stars{ position:fixed; inset:0; z-index:0; }
#veil{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    radial-gradient(1200px 700px at 80% -10%, rgba(80,140,255,.10), transparent 60%),
    radial-gradient(900px 600px at 5% 100%, rgba(200,120,255,.07), transparent 60%);
}
#app{ position:relative; z-index:2; height:100%; display:flex; flex-direction:column; }

::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:rgba(110,150,210,.22); border-radius:5px; }
::-webkit-scrollbar-thumb:hover{ background:rgba(110,150,210,.4); }

/* ============================================================
   HEADER
   ============================================================ */
header{
  flex:0 0 auto;
  border-bottom:1px solid var(--line);
  background: linear-gradient(180deg, rgba(10,16,30,.94), rgba(8,12,24,.80));
  backdrop-filter: blur(8px);
  padding:8px 16px 0;
}
.brandrow{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.brand{ display:flex; align-items:baseline; gap:9px; }
.brand h1{
  margin:0; font-size:15px; letter-spacing:.26em; font-weight:600;
  color:var(--txt-hi); text-transform:uppercase;
}
.brand .sub{ font-family:var(--mono); font-size:10px; color:var(--txt-dim); letter-spacing:.1em; }

.res-row{ display:flex; gap:7px; flex-wrap:wrap; flex:1; }
.res{
  display:flex; flex-direction:column; gap:0;
  padding:4px 11px; min-width:104px;
  border:1px solid var(--line); border-radius:7px;
  background: rgba(14,22,40,.6);
}
.res .k{ font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:var(--txt-dim); }
.res .v{ font-family:var(--mono); font-size:15px; font-weight:600; color:var(--txt-hi); line-height:1.2; }
.res .r{ font-family:var(--mono); font-size:10px; color:var(--green); }
.res .r.neg{ color:var(--red); }
.res.hidden{ display:none; }
.res.e .v{ color:var(--amber); }
.res.s .v{ color:var(--cyan); }
.res.d .v{ color:var(--blue); }
.res.x .v{ color:var(--violet); }

/* thermal gauge */
.thermo{ padding:8px 0 9px; display:flex; align-items:center; gap:12px; }
.thermo .lbl{ font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--txt-dim); white-space:nowrap; }
.bar{
  position:relative; flex:1; height:15px; border-radius:8px; overflow:hidden;
  background: rgba(255,255,255,.05); border:1px solid var(--line);
}
.bar .fill{ position:absolute; inset:0 auto 0 0; width:0%; transition:width .18s linear, background .3s; border-radius:8px; }
.bar .mark{ position:absolute; top:0; bottom:0; width:2px; background:rgba(255,255,255,.4); }
.bar .txt{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:10px; font-weight:600; color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.9); letter-spacing:.05em;
}
.thermo .eff{ font-family:var(--mono); font-size:11px; min-width:118px; text-align:right; }

/* tabs */
nav{ display:flex; gap:2px; }
nav button{
  appearance:none; border:none; background:transparent; cursor:pointer;
  color:var(--txt-dim); font-family:var(--sans); font-size:11.5px; font-weight:600;
  letter-spacing:.13em; text-transform:uppercase;
  padding:9px 15px; border-bottom:2px solid transparent; position:relative;
  transition:color .16s, border-color .16s;
}
nav button:hover{ color:var(--txt); }
nav button.on{ color:var(--cyan); border-bottom-color:var(--cyan); }
nav button .dot{
  position:absolute; top:5px; right:5px; width:6px; height:6px; border-radius:50%;
  background:var(--amber); box-shadow:0 0 8px var(--amber);
}
nav button.locked{ opacity:.32; cursor:not-allowed; }

/* ============================================================
   LAYOUT
   ============================================================ */
main{ flex:1; min-height:0; display:grid; grid-template-columns: 1fr 316px; }
#view{ overflow-y:auto; padding:16px; }
aside{
  border-left:1px solid var(--line); overflow:hidden;
  display:flex; flex-direction:column; background:rgba(6,10,20,.5);
}
aside h3{
  margin:0; padding:10px 14px; font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--txt-dim); border-bottom:1px solid var(--line); flex:0 0 auto;
}
#log{ flex:1; overflow-y:auto; padding:8px 12px; display:flex; flex-direction:column-reverse; gap:1px; }
.le{ font-family:var(--mono); font-size:11px; line-height:1.45; padding:3px 0; border-bottom:1px solid rgba(96,132,190,.08); color:var(--txt-dim); }
.le b{ color:var(--txt); font-weight:500; }
.le .t{ color:rgba(110,129,159,.6); margin-right:6px; font-size:10px; }
.le.ok b, .le.ok{ color:var(--green); }
.le.warn b, .le.warn{ color:var(--amber); }
.le.bad b, .le.bad{ color:var(--red); }
.le.sci b{ color:var(--cyan); }
.le.fringe b{ color:var(--violet); }

/* ============================================================
   PANELS & GENERIC UI
   ============================================================ */
.grid{ display:grid; gap:14px; }
.g2{ grid-template-columns: repeat(auto-fit, minmax(330px,1fr)); }
.g3{ grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); }

.card{
  border:1px solid var(--line); border-radius:10px; padding:13px 14px;
  background:var(--panel); backdrop-filter:blur(4px);
}
.card > h2{
  margin:0 0 11px; font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--cyan); display:flex; align-items:center; gap:8px;
}
.card > h2 .n{ color:var(--txt-dim); font-family:var(--mono); }
.card > h2 .sp{ margin-left:auto; color:var(--txt-dim); font-size:10px; letter-spacing:.05em; text-transform:none; font-family:var(--mono); }
.hint{ font-size:11.5px; color:var(--txt-dim); margin:-4px 0 11px; line-height:1.5; }

button.b{
  appearance:none; cursor:pointer; font-family:var(--sans); font-weight:600;
  border:1px solid var(--line-hi); border-radius:6px;
  background:rgba(60,110,190,.16); color:var(--txt-hi);
  padding:6px 12px; font-size:12px; transition:background .14s, border-color .14s, transform .06s;
}
button.b:hover:not(:disabled){ background:rgba(80,150,255,.26); border-color:var(--cyan); }
button.b:active:not(:disabled){ transform:translateY(1px); }
button.b:disabled{ opacity:.34; cursor:not-allowed; }
button.b.sm{ padding:3px 9px; font-size:11px; }
button.b.gh{ background:transparent; border-color:var(--line); }
button.b.warn{ background:rgba(255,181,71,.14); border-color:rgba(255,181,71,.5); color:var(--amber); }
button.b.vio{ background:rgba(199,125,255,.14); border-color:rgba(199,125,255,.5); color:var(--violet); }
button.b.on{ background:rgba(86,220,154,.2); border-color:var(--green); color:var(--green); }

.row{ display:flex; align-items:center; gap:9px; }
.sep{ height:1px; background:var(--line); margin:11px -14px; }
.mono{ font-family:var(--mono); }
.dim{ color:var(--txt-dim); }
.tiny{ font-size:11px; }
.pill{
  display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.06em;
  padding:1px 6px; border-radius:4px; border:1px solid var(--line);
  color:var(--txt-dim); background:rgba(255,255,255,.03);
}
.pill.c{ color:var(--cyan); border-color:rgba(79,214,232,.4); }
.pill.a{ color:var(--amber); border-color:rgba(255,181,71,.4); }
.pill.v{ color:var(--violet); border-color:rgba(199,125,255,.4); }
.pill.g{ color:var(--green); border-color:rgba(86,220,154,.4); }
.pill.r{ color:var(--red); border-color:rgba(255,107,107,.4); }

/* building rows */
.bl{ display:flex; flex-direction:column; gap:5px; }
.bx{
  display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:center;
  padding:7px 9px; border:1px solid var(--line); border-radius:7px;
  background:rgba(255,255,255,.018); transition:border-color .14s, background .14s;
}
.bx:hover{ border-color:var(--line-hi); background:rgba(255,255,255,.04); }
.bx .nm{ font-size:12.5px; font-weight:600; color:var(--txt-hi); display:flex; gap:7px; align-items:center; }
.bx .nm .ct{ font-family:var(--mono); color:var(--cyan); font-weight:700; }
.bx .ds{ font-family:var(--mono); font-size:10.5px; color:var(--txt-dim); margin-top:1px; }

/* sliders */
.alloc{ display:flex; flex-direction:column; gap:9px; }
.ag{ border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:rgba(255,255,255,.018); }
.ag .top{ display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.ag .top .nm{ font-size:12px; font-weight:600; color:var(--txt-hi); }
.ag .top .pc{ margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--cyan); font-weight:600; }
.ag .info{ font-family:var(--mono); font-size:10px; color:var(--txt-dim); margin-top:4px; display:flex; gap:10px; flex-wrap:wrap; }
input[type=range]{
  appearance:none; width:100%; height:5px; border-radius:3px; outline:none; cursor:pointer;
  background:rgba(255,255,255,.1);
}
input[type=range]::-webkit-slider-thumb{
  appearance:none; width:14px; height:14px; border-radius:50%;
  background:var(--cyan); border:2px solid #08101e; cursor:pointer;
  box-shadow:0 0 8px rgba(79,214,232,.6);
}
input[type=range]::-moz-range-thumb{
  width:12px; height:12px; border-radius:50%; background:var(--cyan);
  border:2px solid #08101e; cursor:pointer;
}
input[type=range]:disabled{ opacity:.35; cursor:not-allowed; }

/* tech */
.tech{
  border:1px solid var(--line); border-radius:8px; padding:9px 11px;
  background:rgba(255,255,255,.018); display:flex; flex-direction:column; gap:5px;
  transition:border-color .14s, background .14s;
}
.tech:hover{ border-color:var(--line-hi); }
.tech.done{ opacity:.5; border-color:rgba(86,220,154,.3); background:rgba(86,220,154,.05); }
.tech.fringe{ border-color:rgba(199,125,255,.32); background:rgba(199,125,255,.045); }
.tech.doc{ border-color:rgba(255,181,71,.32); background:rgba(255,181,71,.045); }
.tech.blocked{ opacity:.34; }
.tech .th{ display:flex; align-items:center; gap:8px; }
.tech .th .nm{ font-size:12.5px; font-weight:600; color:var(--txt-hi); }
.tech .dsc{ font-size:11.5px; color:var(--txt-dim); line-height:1.45; }
.tech .ft{ display:flex; align-items:center; gap:8px; margin-top:2px; }
.tech .cost{ font-family:var(--mono); font-size:10.5px; display:flex; gap:9px; }
.tech .cost .no{ color:var(--red); }
.q{ border:1px solid rgba(79,214,232,.35); border-radius:7px; padding:8px 10px; background:rgba(79,214,232,.06); margin-bottom:6px; }
.q .qh{ display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--txt-hi); }
.q .qh .tm{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--cyan); }
.pbar{ height:4px; border-radius:2px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:6px; }
.pbar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--cyan),var(--blue)); transition:width .2s linear; }

/* systems / missions */
.sys{
  border:1px solid var(--line); border-radius:8px; padding:9px 11px;
  background:rgba(255,255,255,.018); cursor:pointer; transition:border-color .14s, background .14s;
}
.sys:hover{ border-color:var(--line-hi); background:rgba(255,255,255,.045); }
.sys.sel{ border-color:var(--cyan); background:rgba(79,214,232,.09); }
.sys .sh{ display:flex; align-items:baseline; gap:8px; }
.sys .sh .nm{ font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--txt-hi); }
.sys .sh .di{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--amber); }
.sys .tags{ display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; }
.mission{ border:1px solid var(--line); border-radius:8px; padding:9px 11px; background:rgba(255,255,255,.018); margin-bottom:6px; }
.mission.late{ border-color:rgba(199,125,255,.4); background:rgba(199,125,255,.06); }
.mh{ display:flex; align-items:center; gap:8px; font-size:12px; }
.mh .nm{ font-family:var(--mono); font-weight:600; color:var(--txt-hi); }
.mh .st{ margin-left:auto; font-family:var(--mono); font-size:10.5px; }

/* cards */
.dcard{
  border:1px solid var(--line); border-radius:8px; padding:9px 11px;
  background:linear-gradient(160deg, rgba(79,214,232,.07), rgba(255,255,255,.015));
  display:flex; flex-direction:column; gap:4px;
}
.dcard.eq{ border-color:var(--green); background:linear-gradient(160deg, rgba(86,220,154,.13), rgba(255,255,255,.02)); }
.dcard .nm{ font-size:12px; font-weight:600; color:var(--txt-hi); }
.dcard .ef{ font-family:var(--mono); font-size:11px; color:var(--green); }

/* rules */
.rule{ border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:rgba(255,255,255,.018); margin-bottom:6px; }
.rule.off{ opacity:.45; }
.rule .rh{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.rule .fx{ font-family:var(--mono); font-size:11.5px; color:var(--txt); }
.rule .fx .kw{ color:var(--violet); font-weight:700; }
.rule .fx .vl{ color:var(--amber); }
.rule .fx .tg{ color:var(--cyan); }
select, input[type=number]{
  font-family:var(--mono); font-size:11.5px; color:var(--txt-hi);
  background:rgba(10,18,34,.9); border:1px solid var(--line); border-radius:5px;
  padding:4px 6px; outline:none;
}
select:focus, input[type=number]:focus{ border-color:var(--cyan); }
.builder{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:9px; border:1px dashed var(--line); border-radius:8px; }
.builder .kw{ font-family:var(--mono); font-size:11px; color:var(--violet); font-weight:700; }

/* talents */
.tal{
  border:1px solid var(--line); border-radius:8px; padding:9px 11px;
  background:rgba(255,255,255,.018); display:flex; flex-direction:column; gap:4px;
}
.tal .nm{ font-size:12px; font-weight:600; color:var(--txt-hi); display:flex; gap:8px; }
.tal .nm .lv{ margin-left:auto; font-family:var(--mono); color:var(--violet); }
.const{
  border:1px solid rgba(199,125,255,.35); border-radius:8px; padding:10px 12px;
  background:rgba(199,125,255,.06); cursor:pointer; transition:border-color .14s, background .14s;
}
.const:hover{ border-color:var(--violet); background:rgba(199,125,255,.13); }
.const .nm{ font-family:var(--mono); font-size:12.5px; font-weight:700; color:var(--violet); }
.const .up{ font-size:11.5px; color:var(--green); }
.const .dn{ font-size:11.5px; color:var(--red); }

table.arc{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:11px; }
table.arc th{ text-align:left; color:var(--txt-dim); font-weight:500; padding:5px 8px; border-bottom:1px solid var(--line); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
table.arc td{ padding:5px 8px; border-bottom:1px solid rgba(96,132,190,.09); }

/* modal */
.mask{
  position:fixed; inset:0; z-index:50; background:rgba(2,4,10,.82); backdrop-filter:blur(5px);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{
  width:min(560px,100%); max-height:88vh; overflow-y:auto;
  border:1px solid var(--line-hi); border-radius:12px; padding:20px 22px;
  background:linear-gradient(180deg, rgba(20,30,52,.98), rgba(10,16,30,.98));
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
.modal h2{ margin:0 0 4px; font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan); }
.modal .msub{ font-size:12px; color:var(--txt-dim); margin-bottom:16px; }
.mass{ display:flex; flex-direction:column; gap:11px; }
.mrow .mtop{ display:flex; align-items:center; gap:8px; margin-bottom:3px; }
.mrow .mtop .nm{ font-size:12px; font-weight:600; }
.mrow .mtop .vv{ margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--amber); }
.mrow .ex{ font-size:11px; color:var(--txt-dim); margin-top:3px; }
.readout{ display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin:15px 0; }
.ro{ border:1px solid var(--line); border-radius:7px; padding:6px 9px; background:rgba(255,255,255,.02); }
.ro .k{ font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--txt-dim); }
.ro .v{ font-family:var(--mono); font-size:14px; font-weight:600; color:var(--txt-hi); }

.foot{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }

.empty{ text-align:center; color:var(--txt-dim); font-size:12px; padding:22px 10px; font-style:italic; }

@media (max-width:960px){
  main{ grid-template-columns:1fr; grid-template-rows: 1fr 180px; }
  aside{ border-left:none; border-top:1px solid var(--line); }
  .res{ min-width:88px; }
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="veil"></div>

<div id="app">
  <header>
    <div class="brandrow">
      <div class="brand">
        <h1>Entropie</h1>
        <span class="sub">v1.0 · programme d'exploration profonde</span>
      </div>
      <div class="res-row" id="resRow"></div>
    </div>
    <div class="thermo">
      <span class="lbl">Charge thermique</span>
      <div class="bar"><div class="fill" id="thFill"></div><div class="mark" id="thMark"></div><div class="txt" id="thTxt">—</div></div>
      <span class="eff" id="thEff"></span>
    </div>
    <nav id="nav"></nav>
  </header>

  <main>
    <div id="view"></div>
    <aside>
      <h3>Journal de bord</h3>
      <div id="log"></div>
    </aside>
  </main>
</div>

<div id="modalHost"></div>

<script>
"use strict";
/* ============================================================================
   ENTROPIE — idle game d'exploration spatiale
   5 modules : Réacteur/thermique · Recherche · Exploration · Automatisation · Ascension
   ============================================================================ */

const SAVE_KEY = "entropie_opus5_v1";
const TICK_MS  = 100;
const OFFLINE_CAP = 8 * 3600;      // 8 h max de progression hors-ligne

/* ---------------------------------------------------------------- utilitaires */
const $  = (s, r) => (r||document).querySelector(s);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];

const SUF = ["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
function fmt(n, dec){
  if(n === undefined || n === null || !isFinite(n)) return "0";
  if(n < 0) return "-" + fmt(-n, dec);
  if(n < 1000){
    if(dec !== undefined) return n.toFixed(dec);
    if(n < 10) return n.toFixed(n < 1 && n > 0 ? 2 : 1).replace(/\.0+$/,"");
    return Math.floor(n).toString();
  }
  let t = 0;
  while(n >= 1000 && t < SUF.length-1){ n /= 1000; t++; }
  return n.toFixed(n < 10 ? 2 : (n < 100 ? 1 : 0)) + SUF[t];
}
function fmtT(s){
  s = Math.max(0, Math.ceil(s));
  if(s < 60) return s + "s";
  if(s < 3600) return Math.floor(s/60) + "m " + String(s%60).padStart(2,"0") + "s";
  const h = Math.floor(s/3600);
  return h + "h " + String(Math.floor((s%3600)/60)).padStart(2,"0") + "m";
}
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ============================================================================
   DONNÉES — BÂTIMENTS

let S, MULT, D = {}, dirty = {}, tab = "reactor", uiBuilt = {}, sel = { sys:null };

function freshRun(keep){
  const t = keep || {};
  const s = {
    energy:0, materials:50, science:0, data:0,
    totalScience:0, totalMat:0,
    b:{ solar:1, fission:0, fusion:0, radiator:1, battery:0, foundry:0, lab:0, antenna:0, server:0, pad:0 },
    alloc:{ foundry:100, lab:100, antenna:100, server:100, pad:100 },
    oc:{ foundry:false, lab:false, antenna:false, server:false, pad:false },
    researched:{}, queue:[], unlocked:{},
    reputation:0, publications:0,
    systems:[], missions:[], probes:0, cards:[], equipped:[], missionSeq:1,
    rules:[], ruleSeq:1, autoOffUntil:0,
    events:[],
    log:[], runStart:Date.now(), lastSave:Date.now(),
    // persistants
    entropy: t.entropy||0, talents: t.talents||{}, ascensions: t.ascensions||0,
    archives: t.archives||[], constant: t.constant||null, constOffer: t.constOffer||null,
    cardSlotsBonus:0,
  };
  s.materials += 250 * (s.talents.bootstrap||0);
  s.probes = (s.talents.fleet||0);

}

/* ============================================================================
   MULTIPLICATEURS
   ============================================================================ */
function recalc(){
  const m = {
    energy:1, solarMult:1, materials:1, science:1, data:1, cpu:1, cap:1, dissip:1, heat:1,
    research:1, probeYield:1, probeCost:1, speed:1, delay:1, range:1, probeSurv:0, cardLuck:0, fringeLuck:0,
  };
  const add = (k,v) => { m[k] = (m[k]||0) + v; };

  // recherches
  for(const id in S.researched){
    const t = TECH[id];
    if(t && t.mods) for(const k in t.mods) add(k, t.mods[k]);
  }
  // talents persistants
  const T = S.talents;
  add("energy", 0.12*(T.power||0));
  add("dissip", 0.15*(T.thermal||0));
  add("research", 0.10*(T.research||0));
  add("probeSurv", 0.04*(T.fleet||0));
  add("probeYield", 0.15*(T.yield||0));
  // constante physique de la run
  if(S.constant && CONST_BY_ID[S.constant]){
    const c = CONST_BY_ID[S.constant].mods;
    for(const k in c) add(k, c[k]);
  }
  // cartes équipées
  for(const cid of S.equipped){
    const c = S.cards.find(x => x.id === cid);
    if(c) add(c.k, c.v);
  }
  // réputation : +2,5 % sur toute la production par point
  const rep = 1 + 0.025 * S.reputation;
  m.materials *= rep; m.science *= rep; m.data *= rep; m.energy *= rep;

  // événements actifs
  const now = Date.now();
  S.events = S.events.filter(e => e.until > now);
  for(const e of S.events){
    if(e.kind === "heat" || e.kind === "zero") m.heat *= (1 + (e.mult||1));
  }

  // planchers de sécurité
  for(const k in m) if(k !== "delay" && k !== "probeSurv" && k !== "cardLuck" && k !== "fringeLuck") m[k] = Math.max(0.05, m[k]);
  m.delay = clamp(m.delay, 0.05, 5);
  MULT = m;
}

/* ============================================================================
   COÛTS
   ============================================================================ */
function bCost(id){
  const def = BUILDINGS[id];
  return Math.ceil(def.cost * Math.pow(def.growth, S.b[id]));
}
function canBuy(id){ return S.materials >= bCost(id); }
function buy(id, silent){
  const c = bCost(id);
  if(S.materials < c) return false;
  S.materials -= c; S.b[id]++;
  dirty.reactor = true;
  if(!silent) log(`Construit : ${BUILDINGS[id].name} #${S.b[id]}`, "");
  return true;
}
function probeCost(){ return Math.ceil(120 * Math.max(0.15, MULT.probeCost)); }
function pubCost(){ return Math.ceil(4000 * Math.pow(1.9, S.publications)); }
function talentCost(id){
  const t = TALENTS[id];
  return Math.ceil(t.base * Math.pow(t.growth, S.talents[id]||0));
}

function unlocked(k){ return !!S.unlocked[k]; }

/* ============================================================================
   MOTEUR — dérivés & tick
   ============================================================================ */
function derive(){
  const m = MULT;
  const b = S.b;

  const prodE = (b.solar*BUILDINGS.solar.energy*m.solarMult
               + b.fission*BUILDINGS.fission.energy
               + b.fusion*BUILDINGS.fusion.energy) * m.energy;

  const producerHeat = (b.fission*BUILDINGS.fission.heat + b.fusion*BUILDINGS.fusion.heat) * m.heat;
  const dissip = (BASE_DISSIP + b.radiator*BUILDINGS.radiator.dissip) * m.dissip;
  const cap = (BASE_CAP + b.battery*BUILDINGS.battery.cap) * m.cap;

  const g = {};
  let need = 0;
  for(const k of CONSUMERS){
    const def = BUILDINGS[k];
    const ocm = S.oc[k] ? OC_DEMAND : 1;
    const full = b[k] * def.demand * ocm;
    const want = full * (S.alloc[k]/100);
    g[k] = { full, want };
    need += want;
  }
  return { prodE, producerHeat, dissip, cap, g, need, m };
}

function tick(dt){
  recalc();
  const d = derive();
  const m = MULT;

  // --- distribution de puissance ---------------------------------------
  const pool  = S.energy + d.prodE*dt;
  const want  = d.need*dt;
  const served= Math.min(pool, want);
  const brown = want > 1e-9 ? served/want : 1;
  S.energy = clamp(pool - served, 0, d.cap);

  const eff = {};
  for(const k of CONSUMERS) eff[k] = (S.alloc[k]/100) * brown;

  // --- bilan thermique --------------------------------------------------
  let heat = d.producerHeat;
  for(const k of CONSUMERS){
    const def = BUILDINGS[k];
    if(!def.heat) continue;
    heat += S.b[k] * def.heat * (S.oc[k] ? OC_HEAT : 1) * eff[k] * m.heat;
  }
  const load = d.dissip > 0 ? heat/d.dissip : 0;
  const thermal = load <= 1 ? 1 : Math.exp(-3*(load-1));

  // --- production -------------------------------------------------------
  const ocO = k => S.oc[k] ? OC_OUT : 1;
  const rMat  = S.b.foundry * BUILDINGS.foundry.rate * eff.foundry * ocO("foundry") * thermal * m.materials;
  const rSci  = S.b.lab     * BUILDINGS.lab.rate     * eff.lab     * ocO("lab")     * thermal * m.science;
  const rData = S.b.antenna * BUILDINGS.antenna.rate * eff.antenna * ocO("antenna") * thermal * m.data;

  S.materials += rMat*dt;  S.totalMat += rMat*dt;
  S.science   += rSci*dt;  S.totalScience += rSci*dt;
  S.data      += rData*dt;

  const cpuCap = (BASE_CPU + 4*(S.talents.cpu||0)
                + S.b.server*BUILDINGS.server.rate * eff.server * ocO("server") * thermal) * m.cpu;

  // --- recherche --------------------------------------------------------
  for(let i = S.queue.length-1; i >= 0; i--){
    const q = S.queue[i];
    q.left -= dt * m.research;
    if(q.left <= 0){ S.queue.splice(i,1); finishTech(q.id); }
  }

  // --- missions ---------------------------------------------------------
  const now = Date.now();
  for(let i = S.missions.length-1; i >= 0; i--){
    if(now >= S.missions[i].reportAt) resolveMission(S.missions.splice(i,1)[0]);
  }

  D = { load, thermal, dissip:d.dissip, heat, cap:d.cap, cpuCap, prodE:d.prodE, brown, eff,
        need:d.need, rMat, rSci, rData, cpuUsed: cpuUsed() };

  // --- automatisation ---------------------------------------------------
  runRules();
}

function cpuUsed(){
  let u = 0;
  for(const r of S.rules) if(r.on) u += ACTIONS[r.act].cpu;
  return u;
}

/* ============================================================================
   MODULE 2 — RECHERCHE
   ============================================================================ */
function techAvailable(t){
  if(S.researched[t.id]) return false;
  if(S.queue.some(q => q.id === t.id)) return false;
  for(const r of t.r) if(!S.researched[r]) return false;
  if(t.excl){
    for(const o of TECHS) if(o.excl === t.excl && o.id !== t.id && S.researched[o.id]) return false;
  }
  return true;
}
function techBlocked(t){
  if(!t.excl) return false;
  return TECHS.some(o => o.excl === t.excl && o.id !== t.id && S.researched[o.id]);
}
function researchSlots(){
  let n = 1 + (S.talents.slot||0);
  for(const id in S.researched) if(TECH[id] && TECH[id].slots) n += TECH[id].slots;
  return n;
}
function startResearch(id){
  const t = TECH[id];
  if(!t || !techAvailable(t)) return false;
  if(S.queue.length >= researchSlots()) return false;
  if(S.science < (t.c.s||0) || S.data < (t.c.d||0)) return false;
  S.science -= (t.c.s||0); S.data -= (t.c.d||0);
  S.queue.push({ id, left:t.t, total:t.t });
  log(`Recherche lancée : ${t.n}`, "sci");
  dirty.research = true;
  return true;
}
function finishTech(id){
  const t = TECH[id];
  if(!t) return;
  if(t.fringe !== undefined){
    const failChance = clamp(t.fringe - MULT.fringeLuck, 0.02, 0.95);
    if(Math.random() < failChance){
      log(`ÉCHEC — ${t.n} : ${t.ko}`, "bad");
      applyFailure(t);
      dirty.research = true;
      return;                       // pas de techno acquise, pas de remboursement
    }
    log(`PERCÉE — ${t.n} : ${t.ok}`, "fringe");
  } else {
    log(`Recherche acquise : ${t.n}`, "sci");
  }
  S.researched[id] = true;
  if(t.unlock){ S.unlocked[t.unlock] = true; buildNav(); log(`Débloqué : ${unlockLabel(t.unlock)}`, "ok"); }
  if(t.systems) genSystems(t.systems);
  if(t.cardSlots) S.cardSlotsBonus += t.cardSlots;
  if(t.excl){
    for(const o of TECHS) if(o.excl === t.excl && o.id !== id) log(`Doctrine abandonnée : ${o.n}`, "warn");
  }
  dirty.research = true; dirty.reactor = true; dirty.explore = true;
}
function applyFailure(t){
  const f = t.fail; if(!f) return;
  const now = Date.now();
  if(f.kind === "heat"){ S.events.push({ kind:"heat", mult:f.mult, until:now + f.dur*1000, name:t.n }); }
  else if(f.kind === "mat"){ S.materials *= (1 - f.frac); }
  else if(f.kind === "cpu"){ S.autoOffUntil = now + f.dur*1000; }
  else if(f.kind === "zero"){ S.energy = 0; S.events.push({ kind:"zero", mult:f.mult, until:now + f.dur*1000, name:t.n }); }
}
function unlockLabel(u){
  return { fission:"Réacteur à fission", oc:"Overclock", dsn:"Antennes DSN & Données",
           probes:"Module Exploration", auto:"Module Automatisation", fusion:"Réacteur à fusion",
           publish:"Publications" }[u] || u;
}
function publish(){
  const c = pubCost();
  if(S.science < c) return false;
  S.science -= c; S.publications++; S.reputation++;
  log(`Article publié. Réputation ${S.reputation} (+${(S.reputation*2.5).toFixed(1)} % production).`, "sci");
  dirty.research = true;
  return true;
}

/* ============================================================================
   MODULE 3 — EXPLORATION
   ============================================================================ */
function genSystems(n){
  for(let i=0;i<n;i++){
    const tags = [];
    const nt = Math.random() < 0.15 ? 3 : (Math.random() < 0.5 ? 1 : 2);
    while(tags.length < nt){
      const k = pick(TAG_KEYS);
      if(!tags.includes(k)) tags.push(k);
    }
    let diff = rnd(0.08, 0.45);
    for(const t of tags) diff += TAGS[t].diff;
    const dist = rnd(1.4, 42);
    S.systems.push({
      id: "sys"+(S.systems.length+1)+"_"+Math.floor(Math.random()*9999),
      name: pick(SYS_PREFIX) + "-" + Math.floor(rnd(100,999)) + " " + pick(SYS_SUFFIX),
      dist: +dist.toFixed(1),
      diff: clamp(diff, 0.05, 0.92),
      tags, visits:0,
    });
  }
  S.systems.sort((a,b) => a.dist - b.dist);
  dirty.explore = true;
}
function maxRange(fuel){ return fuel * 0.36 * MULT.range; }
function travelTime(dist){ return dist * 25 / MULT.speed; }
function teleDelay(dist){ return dist * 6 * MULT.delay; }
function successChance(sys, shield){
  const pad = S.b.pad > 0 ? (D.eff ? D.eff.pad : 1) * 0.1 : 0;
  return clamp(0.46 + shield*0.005 + MULT.probeSurv + pad - sys.diff*0.62, 0.03, 0.97);
}
function launch(sysId, fuel, instr, shield){
  const sys = S.systems.find(s => s.id === sysId);
  if(!sys) return false;
  if(S.probes < 1) return false;
  if(S.missions.length >= S.b.pad) return false;
  if(maxRange(fuel) < sys.dist) return false;
  if(!D.eff || D.eff.pad < 0.5) return false;

  S.probes--;
  const now = Date.now();
  const tt = travelTime(sys.dist), td = teleDelay(sys.dist);
  S.missions.push({
    id: S.missionSeq++, sysId, sysName: sys.name, dist: sys.dist, tags: sys.tags.slice(),
    fuel, instr, shield, launchAt: now,
    arriveAt: now + tt*1000, reportAt: now + (tt+td)*1000,
    chance: successChance(sys, shield),
  });
  sys.visits++;
  log(`Lancement vers ${sys.name} — ${sys.dist} al · trajet ${fmtT(tt)} · télémétrie +${fmtT(td)}`, "");
  dirty.explore = true;
  return true;
}
function resolveMission(ms){
  const ok = Math.random() < ms.chance;
  if(!ok){
    log(`Sonde perdue en route vers ${ms.sysName}. Aucun signal.`, "bad");
    dirty.explore = true;
    return;
  }
  let mSci = 1, mMat = 1, mData = 1, luck = MULT.cardLuck;
  for(const t of ms.tags){
    const T = TAGS[t];
    if(T.sci) mSci *= T.sci; if(T.mat) mMat *= T.mat;
    if(T.data) mData *= T.data; if(T.luck) luck += T.luck;
  }
  const base = (25 + ms.dist*16) * (ms.instr/40) * MULT.probeYield * (1 + ms.dist*0.05);
  const gS = base * 9   * mSci;
  const gD = base * 1.6 * mData;
  const gM = base * 14  * mMat;

  S.science += gS; S.totalScience += gS; S.data += gD; S.materials += gM;
  log(`${ms.sysName} — retour : +${fmt(gS)} sci · +${fmt(gD)} don · +${fmt(gM)} mat`, "ok");

  if(Math.random() < 0.12 + luck) awardCard(ms);
  dirty.explore = true;
}
function awardCard(ms){
  const t = pick(CARD_TYPES);
  const rarity = Math.random() < 0.08 ? 3 : (Math.random() < 0.3 ? 2 : 1);
  const c = {
    id: "c"+Date.now()+Math.floor(Math.random()*999),
    n: t.n, k: t.k, v: +(t.v * rarity * rnd(0.85,1.2)).toFixed(3),
    rarity, from: ms.sysName,
  };
  S.cards.push(c);
  log(`Découverte : ${c.n} (${ms.sysName}) — +${(c.v*100).toFixed(0)} % ${MOD_LABEL[c.k]||c.k}`, "fringe");
}
function cardSlots(){ return 2 + S.cardSlotsBonus; }
function toggleCard(id){
  const i = S.equipped.indexOf(id);
  if(i >= 0) S.equipped.splice(i,1);
  else if(S.equipped.length < cardSlots()) S.equipped.push(id);
  dirty.explore = true;
}

/* ============================================================================
   MODULE 4 — AUTOMATISATION
   ============================================================================ */
function runRules(){
  const now = Date.now();
  if(now < S.autoOffUntil) return;
  let budget = D.cpuCap || 0;
  for(const r of S.rules){
    if(!r.on) continue;
    const cost = ACTIONS[r.act].cpu;
    if(budget < cost) continue;
    budget -= cost;
    if(now - (r.last||0) < 1500) continue;
    const met = METRICS[r.metric];
    if(!met) continue;
    const v = met.get(D);
    let pass = false;
    switch(r.op){
      case "gt":  pass = v >  r.value; break;
      case "lt":  pass = v <  r.value; break;
      case "gte": pass = v >= r.value; break;
      case "lte": pass = v <= r.value; break;
    }
    if(!pass) continue;
    r.last = now;
    if(doAction(r)) { r.fires = (r.fires||0)+1; dirty.auto = true; }
  }
}
function doAction(r){
  switch(r.act){
    case "buy":     return canBuy(r.target) ? buy(r.target, true) && (log(`[auto] ${BUILDINGS[r.target].name} construit`, "") || true) : false;
    case "ocOn":    if(!unlocked("oc") || S.oc[r.target]) return false; S.oc[r.target] = true;  dirty.reactor = true; log(`[auto] Overclock ${GROUP_NAME[r.target]} ON`, "warn"); return true;
    case "ocOff":   if(!S.oc[r.target]) return false; S.oc[r.target] = false; dirty.reactor = true; log(`[auto] Overclock ${GROUP_NAME[r.target]} OFF`, ""); return true;
    case "alloc":   if(S.alloc[r.target] === r.value2) return false; S.alloc[r.target] = r.value2; dirty.reactor = true; log(`[auto] ${GROUP_NAME[r.target]} → ${r.value2} %`, ""); return true;
    case "research":{
      if(S.queue.length >= researchSlots()) return false;
      const opts = TECHS.filter(t => techAvailable(t) && t.fringe === undefined
                    && S.science >= (t.c.s||0) && S.data >= (t.c.d||0));
      if(!opts.length) return false;
      opts.sort((a,b) => (a.c.s||0) - (b.c.s||0));
      return startResearch(opts[0].id);
    }
    case "probe":{
      const c = probeCost();
      if(S.materials < c || !unlocked("probes")) return false;
      S.materials -= c; S.probes++; dirty.explore = true; return true;
    }
    case "launch":{
      if(S.probes < 1 || S.missions.length >= S.b.pad) return false;
      const cands = S.systems.filter(s => maxRange(70) >= s.dist);
      if(!cands.length) return false;
      // meilleur ratio valeur/risque avec un profil équilibré
      let best = null, bestV = -1;
      for(const s of cands){
        const fuel = clamp(Math.ceil(s.dist/(0.36*MULT.range)) + 4, 5, 80);
        const rest = 100 - fuel;
        const instr = Math.round(rest*0.62), shield = rest - instr;
        const ch = successChance(s, shield);
        let mul = 1; for(const t of s.tags){ const T = TAGS[t]; mul *= (T.sci||1)*0.6 + (T.mat||1)*0.4; }
        const v = ch * (25 + s.dist*16) * (instr/40) * mul;
        if(v > bestV){ bestV = v; best = { s, fuel, instr, shield }; }
      }
      if(!best) return false;
      return launch(best.s.id, best.fuel, best.instr, best.shield);
    }
    case "publish": return unlocked("publish") ? publish() : false;
  }
  return false;
}
function addRule(rule){
  rule.id = S.ruleSeq++; rule.on = true; rule.fires = 0;
  S.rules.push(rule); dirty.auto = true;
}

/* ============================================================================
   MODULE 5 — ASCENSION
   ============================================================================ */
function entropyGain(){
  return Math.floor(Math.pow(Math.max(0, S.totalScience) / 900, 0.5));
}
function rollConstants(){
  const pool = CONSTANTS.slice();
  const out = [];
  while(out.length < 3 && pool.length) out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].id);
  return out;
}
function ascend(chosenConst){
  const gain = entropyGain();
  const keep = {
    entropy: S.entropy + gain,
    talents: S.talents,
    ascensions: S.ascensions + 1,
    archives: S.archives.concat([{
      n: S.ascensions+1,
      dur: Math.floor((Date.now()-S.runStart)/1000),
      sci: S.totalScience,
      ent: gain,
      cst: S.constant,
      doc: TECHS.filter(t => t.excl && S.researched[t.id]).map(t => t.n.replace(/^Doctrine : /,"")).join(", ") || "—",
    }]).slice(-12),
    constant: chosenConst,
    constOffer: null,
  };
  const oldLog = S.log.slice(0, 6);
  S = freshRun(keep);
  S.log = oldLog;
  sel.sys = null; uiBuilt = {}; dirty = { reactor:true, research:true, explore:true, auto:true, ascend:true };
  log(`— ASCENSION ${keep.ascensions} — +${gain} entropie. Constante : ${CONST_BY_ID[chosenConst].n}`, "fringe");
  recalc(); buildNav(); go("reactor"); save();
}

   JOURNAL

function log(text, kind){
  const d = new Date();
  const t = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
  S.log.unshift({ t, text, kind: kind||"" });
  if(S.log.length > 160) S.log.length = 160;
  renderLog();
}
let logDirty = true;

function paintLog(){

}

function techCard(t, cls){
  const done = !!S.researched[t.id];
  const blocked = techBlocked(t) && !done;
  const box = el("div","tech "+(cls||"")+(done?" done":"")+(blocked?" blocked":""));
  const fringePct = t.fringe !== undefined ? clamp(t.fringe - MULT.fringeLuck, 0.02, 0.95) : 0;
  box.innerHTML = `
    <div class="th"><span class="nm">${esc(t.n)}</span>
      ${t.fringe!==undefined ? `<span class="pill v" data-fr></span>` : ""}
      ${t.excl ? `<span class="pill a">exclusif</span>` : ""}</div>
    <div class="dsc">${esc(t.d)}</div>
    ${t.fringe!==undefined ? `<div class="tiny" style="color:var(--green)">✔ ${esc(t.ok)}</div>
                              <div class="tiny" style="color:var(--red)">✘ ${esc(t.ko)}</div>` : ""}`;
  const ft = el("div","ft");
  const cost = el("div","cost");
  ft.appendChild(cost);

  btn.style.marginLeft = "auto";

  ft.appendChild(btn);
  box.appendChild(ft);

  patchers.push(() => {
    if(t.fringe !== undefined){
      const f = box.querySelector("[data-fr]");
      if(f) f.textContent = `échec ${(clamp(t.fringe - MULT.fringeLuck,0.02,0.95)*100).toFixed(0)} %`;
    }
    const okS = S.science >= (t.c.s||0), okD = S.data >= (t.c.d||0);
    cost.innerHTML = `<span class="${okS?"":"no"}">${fmt(t.c.s||0)} sci</span>`
      + (t.c.d ? `<span class="${okD?"":"no"}">${fmt(t.c.d)} don</span>` : "")
      + `<span class="dim">${fmtT(t.t/MULT.research)}</span>`;
    if(done){ btn.style.display = "none"; cost.innerHTML = `<span style="color:var(--green)">acquis</span>`; return; }
    if(blocked){ btn.style.display = "none"; cost.innerHTML = `<span class="dim">verrouillé par une autre doctrine</span>`; return; }
    btn.style.display = "";
    const queued = S.queue.some(q => q.id === t.id);
    btn.textContent = queued ? "en cours" : "Lancer";
    btn.disabled = queued || !okS || !okD || S.queue.length >= researchSlots();
  });
  return box;
}

function openPlanner(sys){
  let fuel = clamp(Math.ceil(sys.dist/(0.36*MULT.range)) + 5, 5, 90);
  let instr = Math.round((100-fuel)*0.6);
  let shield = 100 - fuel - instr;

  const mask = el("div","mask");
  const mo = el("div","modal");
  mo.innerHTML = `<h2>Plan de vol — ${esc(sys.name)}</h2>
    <div class="msub">${sys.dist} al · difficulté ${(sys.diff*100).toFixed(0)} % · ${sys.tags.map(t=>TAGS[t].n).join(", ")}</div>
    <p class="hint">Masse utile fixe : 100 unités à répartir. Le carburant définit la portée, les instruments le rendement, le blindage la survie.</p>`;
  const mass = el("div","mass"); mo.appendChild(mass);

  const mk = (key, name, ex) => {
    const r = el("div","mrow");
    r.innerHTML = `<div class="mtop"><span class="nm">${name}</span><span class="vv" data-v></span></div>`;
    const sl = el("input"); sl.type="range"; sl.min=0; sl.max=100; sl.step=1;
    r.appendChild(sl);
    r.appendChild(el("div","ex",ex));
    mass.appendChild(r);
    return { r, sl, v:r.querySelector("[data-v]"), key };
  };
  const rows = [
    mk("fuel",   "Carburant",   "Portée maximale atteignable."),
    mk("instr",  "Instruments", "Multiplie tout le rendement scientifique et matériel."),
    mk("shield", "Blindage",    "+0,5 pt de survie par unité."),
  ];
  const readout = el("div","readout"); mo.appendChild(readout);
  const foot = el("div","foot");
  const cancel = el("button","b gh","Annuler");
  const gobtn = el("button","b","Lancer");
  foot.appendChild(cancel); foot.appendChild(gobtn); mo.appendChild(foot);

  function normalize(changed){
    let vals = { fuel, instr, shield };
    const total = vals.fuel + vals.instr + vals.shield;
    if(total !== 100){
      const others = ["fuel","instr","shield"].filter(k => k !== changed);
      let excess = total - 100;
      for(const k of others){
        if(excess === 0) break;
        const take = clamp(excess, -(100 - vals[k]), vals[k]);
        vals[k] -= take; excess -= take;
      }
      if(excess !== 0) vals[changed] -= excess;
    }
    fuel = vals.fuel; instr = vals.instr; shield = vals.shield;
  }
  function refresh(){
    for(const r of rows){
      const v = { fuel, instr, shield }[r.key];
      if(document.activeElement !== r.sl) r.sl.value = v;
      r.v.textContent = v;
    }
    const range = maxRange(fuel);
    const reach = range >= sys.dist;
    const ch = successChance(sys, shield);
    const tt = travelTime(sys.dist), td = teleDelay(sys.dist);
    let mul = 1; for(const t of sys.tags){ const T = TAGS[t]; mul *= ((T.sci||1)+(T.mat||1))/2; }
    const est = (25 + sys.dist*16) * (instr/40) * MULT.probeYield * (1 + sys.dist*0.05) * 9 * mul;
    readout.innerHTML =
      `<div class="ro"><div class="k">Portée</div><div class="v" style="color:${reach?"var(--green)":"var(--red)"}">${range.toFixed(1)} / ${sys.dist} al</div></div>`
    + `<div class="ro"><div class="k">Survie</div><div class="v" style="color:${ch>0.7?"var(--green)":ch>0.45?"var(--amber)":"var(--red)"}">${(ch*100).toFixed(0)} %</div></div>`
    + `<div class="ro"><div class="k">Trajet</div><div class="v">${fmtT(tt)}</div></div>`
    + `<div class="ro"><div class="k">Délai télémétrie</div><div class="v" style="color:var(--violet)">+${fmtT(td)}</div></div>`
    + `<div class="ro"><div class="k">Science estimée</div><div class="v">~${fmt(est)}</div></div>`
    + `<div class="ro"><div class="k">Espérance</div><div class="v">~${fmt(est*ch)}</div></div>`;

    const padOk = D.eff && D.eff.pad >= 0.5;
    gobtn.disabled = !reach || S.probes < 1 || S.missions.length >= S.b.pad || !padOk;
    gobtn.textContent = S.probes < 1 ? "Aucune sonde"
      : S.missions.length >= S.b.pad ? "Rampes occupées"
      : !padOk ? "Rampes sous-alimentées"
      : !reach ? "Hors de portée" : "Lancer";
  }
  rows.forEach(r => {
    r.sl.oninput = () => {
      const v = +r.sl.value;
      if(r.key==="fuel") fuel=v; else if(r.key==="instr") instr=v; else shield=v;
      normalize(r.key); refresh();
    };
  });
  cancel.onclick = () => mask.remove();
  gobtn.onclick = () => { if(launch(sys.id, fuel, instr, shield)) mask.remove(); };
  mask.onclick = e => { if(e.target === mask) mask.remove(); };
  mask.appendChild(mo); $("#modalHost").appendChild(mask);
  normalize("fuel"); refresh();
}

    ["Garde-fou thermique", { metric:"heat", op:"gt", value:95, act:"ocOff", target:"foundry" }],
    ["Radiateur automatique", { metric:"heat", op:"gt", value:80, act:"buy", target:"radiator" }],
    ["Réinvestir l'énergie", { metric:"energyPct", op:"gt", value:90, act:"buy", target:"solar" }],
    ["Recherche continue", { metric:"queue", op:"lt", value:1, act:"research" }],
    ["Flotte permanente", { metric:"probes", op:"lt", value:2, act:"probe" }],
    ["Exploration continue", { metric:"probes", op:"gte", value:1, act:"launch" }],
  ];
  for(const [n,r] of P){
    const bb = el("button","b sm gh",n);
    bb.onclick = () => { addRule(Object.assign({ value2:50, target:null }, r)); paintRules(); };
    presets.appendChild(bb);
  }
  c2.appendChild(presets);
  g.appendChild(c2);
  patch();
}

/* ---------------------------------------------------- MODULE 5 : ASCENSION */
function viewAscend(root){
  patchers = [];
  const g = el("div","grid g2"); root.appendChild(g);

  const c1 = el("div","card"); c1.style.gridColumn = "1 / -1";
  c1.appendChild(el("h2","",`<span class="n">01</span> Ascension`));
  c1.appendChild(el("p","hint","Réinitialise la run : bâtiments, recherches, sondes, découvertes, doctrines. Conserve l'entropie, les talents et les archives. À chaque ascension, vous choisissez une constante physique qui s'appliquera à toute la partie suivante."));
  const stat = el("div","grid g3"); stat.style.marginBottom = "12px"; c1.appendChild(stat);
  const ab = el("button","b vio"); c1.appendChild(ab);
  ab.onclick = () => openAscendModal();
  patchers.push(() => {
    const gain = entropyGain();
    stat.innerHTML = ro("Science totale (run)", fmt(S.totalScience))
      + ro("Entropie à récolter", fmt(gain))
      + ro("Durée de la run", fmtT((Date.now()-S.runStart)/1000))
      + ro("Ascensions", String(S.ascensions))
      + ro("Entropie disponible", fmt(S.entropy))
      + ro("Constante active", S.constant ? CONST_BY_ID[S.constant].n : "aucune");
    ab.textContent = gain > 0 ? `Ascension — récolter ${fmt(gain)} entropie` : "Pas assez de science accumulée";
    ab.disabled = gain < 1;
  });
  g.appendChild(c1);

  // talents
  const c2 = el("div","card"); c2.style.gridColumn = "1 / -1";
  c2.appendChild(el("h2","",`<span class="n">02</span> Grille de talents`));
  const tg = el("div","grid g3");
  for(const id in TALENTS){
    const t = TALENTS[id];
    const box = el("div","tal");
    box.innerHTML = `<div class="nm">${t.n}<span class="lv" data-lv></span></div><div class="tiny dim">${t.d}</div>`;
    const b = el("button","b sm vio");
    b.onclick = () => {
      const c = talentCost(id);
      if(S.entropy >= c && (S.talents[id]||0) < t.max){
        S.entropy -= c; S.talents[id] = (S.talents[id]||0)+1;
        log(`Talent amélioré : ${t.n} → niveau ${S.talents[id]}`, "fringe");
        dirty.ascend = true; recalc();
      }
    };
    box.appendChild(b); tg.appendChild(box);
    patchers.push(() => {
      const lv = S.talents[id]||0;
      box.querySelector("[data-lv]").textContent = `${lv}/${t.max}`;
      if(lv >= t.max){ b.textContent = "max"; b.disabled = true; return; }
      const c = talentCost(id);
      b.textContent = `${fmt(c)} entropie`;
      b.disabled = S.entropy < c;
    });
  }
  c2.appendChild(tg);
  g.appendChild(c2);

  // archives
  if(S.archives.length){
    const c3 = el("div","card"); c3.style.gridColumn = "1 / -1";
    c3.appendChild(el("h2","",`<span class="n">03</span> Archives`));
    const t = el("table","arc");
    t.innerHTML = `<thead><tr><th>#</th><th>Durée</th><th>Science</th><th>Entropie</th><th>Constante</th><th>Doctrines</th></tr></thead><tbody>`
      + S.archives.slice().reverse().map(a =>
        `<tr><td>${a.n}</td><td>${fmtT(a.dur)}</td><td>${fmt(a.sci)}</td><td style="color:var(--violet)">${fmt(a.ent)}</td><td>${a.cst?esc(CONST_BY_ID[a.cst].n):"—"}</td><td class="dim">${esc(a.doc)}</td></tr>`
      ).join("") + `</tbody>`;
    c3.appendChild(t);
    g.appendChild(c3);
  }
  patch();
}
function openAscendModal(){
  const offer = rollConstants();
  const mask = el("div","mask");
  const mo = el("div","modal");
  mo.innerHTML = `<h2>Ascension ${S.ascensions+1}</h2>
    <div class="msub">+${fmt(entropyGain())} entropie · la run recommence à zéro</div>
    <p class="hint">Choisissez la constante physique qui régira le prochain univers. Chaque option est un compromis, pas un bonus.</p>`;
  const list = el("div","grid"); list.style.gap = "9px";
  for(const id of offer){
    const c = CONST_BY_ID[id];
    const box = el("div","const");
    box.innerHTML = `<div class="nm">${c.n}</div><div class="up">▲ ${c.up}</div><div class="dn">▼ ${c.dn}</div>`;
    box.onclick = () => { mask.remove(); ascend(id); };
    list.appendChild(box);
  }
  mo.appendChild(list);
  const foot = el("div","foot");
  const cancel = el("button","b gh","Annuler");
  cancel.onclick = () => mask.remove();
  foot.appendChild(cancel); mo.appendChild(foot);
  mask.onclick = e => { if(e.target === mask) mask.remove(); };
  mask.appendChild(mo); $("#modalHost").appendChild(mask);
}

/* ============================================================================
   SAUVEGARDE
   ============================================================================ */
function save(){
  S.lastSave = Date.now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw){ S = freshRun(); return false; }
  try{
    const o = JSON.parse(raw);
    S = Object.assign(freshRun({ entropy:o.entropy, talents:o.talents, ascensions:o.ascensions,
                                 archives:o.archives, constant:o.constant }), o);
    // compléter les clés manquantes après mise à jour du jeu
    const base = freshRun();
    for(const k in base.b)     if(S.b[k]     === undefined) S.b[k] = base.b[k];
    for(const k in base.alloc) if(S.alloc[k] === undefined) S.alloc[k] = base.alloc[k];
    for(const k in base.oc)    if(S.oc[k]    === undefined) S.oc[k] = base.oc[k];
    S.events = (S.events||[]).filter(e => e.until > Date.now());
    return true;
  }catch(e){ S = freshRun(); return false; }
}
function offline(){
  const dt = clamp((Date.now() - (S.lastSave||Date.now()))/1000, 0, OFFLINE_CAP);
  if(dt < 30) return;
  const before = { m:S.materials, s:S.science, d:S.data };
  let left = dt;
  recalc();
  while(left > 0){ const step = Math.min(5, left); tick(step); left -= step; }
  const gm = S.materials-before.m, gs = S.science-before.s, gd = S.data-before.d;
  log(`Reprise après ${fmtT(dt)} — +${fmt(gm)} mat · +${fmt(gs)} sci · +${fmt(gd)} don`, "ok");
}

/* ============================================================================
   FOND ÉTOILÉ
   ============================================================================ */
(function starfield(){
  const cv = $("#stars"), cx = cv.getContext("2d");
  let W, H, layers;
  function init(){
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    layers = [
      { n:110, s:0.5, sp:0.006, a:0.35 },
      { n:60,  s:0.9, sp:0.014, a:0.55 },
      { n:24,  s:1.5, sp:0.028, a:0.8  },
    ].map(L => ({ ...L, pts: Array.from({length:L.n}, () => ({ x:Math.random()*W, y:Math.random()*H, p:Math.random()*Math.PI*2 })) }));
  }
  init(); addEventListener("resize", init);
  let t = 0;
  (function draw(){
    t += 0.016;
    cx.clearRect(0,0,W,H);
    for(const L of layers){
      for(const p of L.pts){
        p.y += L.sp; if(p.y > H) { p.y = 0; p.x = Math.random()*W; }
        const tw = 0.65 + 0.35*Math.sin(t*1.6 + p.p);
        cx.globalAlpha = L.a * tw;
        cx.fillStyle = "#cfe4ff";
        cx.fillRect(p.x, p.y, L.s, L.s);
      }
    }
    cx.globalAlpha = 1;
    requestAnimationFrame(draw);
  })();
})();

/* ============================================================================
   BOUCLE PRINCIPALE
   ============================================================================ */
function boot(){
  const had = load();
  recalc();
  buildRes(); buildNav();
  if(had) offline(); else log("Système initialisé. Ressources minimales allouées. Bonne chance.", "ok");
  go("reactor");

  let last = performance.now(), acc = 0, saveAcc = 0;
  setInterval(() => {
    const now = performance.now();
    const dt = Math.min(0.5, (now-last)/1000); last = now;
    tick(dt);
    paintRes();
    acc += dt;
    if(acc > 0.2){ acc = 0; render(false); paintLog(); }
    saveAcc += dt;
    if(saveAcc > 15){ saveAcc = 0; save(); }
    // apparition différée des onglets
    const want = TABS.filter(t => t.show()).length;
    if(want !== $("#nav").children.length) buildNav();
  }, TICK_MS);

  addEventListener("beforeunload", save);
  addEventListener("keydown", e => { if(e.key === "Escape"){ const m = $(".mask"); if(m) m.remove(); } });
}
boot();
