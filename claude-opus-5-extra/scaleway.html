MODULES.push({
id:"entretien", icon:"🎤", title:"Préparation à l'entretien",
lead:"Les questions les plus probables, une trame de réponse pour chacune, et les phrases qui font la différence.",
blocks:[
 {t:"note",k:"exam",b:"Méthode",x:"Pour chaque question : **définition en une phrase** → **comment ça marche** → **un exemple concret vécu** → **la limite ou le piège**. Cette structure en quatre temps donne l'impression d'une maîtrise réelle même sur un sujet que tu viens d'apprendre."},
 {t:"h",x:"1. « Qu'est-ce qui différencie Scaleway des hyperscalers ? »"},
 {t:"p",x:"Souveraineté européenne et RGPD sans zone grise ; un **catalogue plus resserré donc plus lisible** ; une tarification simple et souvent moins chère sur le compute et l'egress ; une **API cohérente** et un CLI agréable ; une forte culture développeur (open source, documentation, communauté). En contrepartie : moins de services de niche, moins de regions, un écosystème tiers plus petit."},
 {t:"h",x:"2. « Explique-moi la différence entre region et availability zone »"},
 {t:"p",x:"Une **region** est une zone géographique (`fr-par`) qui regroupe plusieurs **AZ** (`fr-par-1`, `fr-par-2`, `fr-par-3`), chaque AZ étant un data center isolé en énergie et en réseau. Certains produits sont **zonaux** (Instances, Block Storage), d'autres **régionaux** (Object Storage, VPC, Kapsule, RDB), d'autres **globaux** (IAM, DNS, Billing). Pour de la HA on répartit sur plusieurs AZ d'une même region ; pour du disaster recovery on réplique sur une autre region."},
 {t:"h",x:"3. « Comment tu t'authentifies sur l'API ? »"},
 {t:"p",x:"Une **API key** liée à un principal IAM (idéalement une **application**, pas un user), composée d'un **access key** et d'un **secret key**. La secret key part dans le header `X-Auth-Token`. Exception : l'**Object Storage** utilise le protocole S3 et donc la **signature AWS V4** avec les deux clés. En CI, on injecte `SCW_ACCESS_KEY` / `SCW_SECRET_KEY` en variables d'environnement plutôt qu'un fichier de config."},
 {t:"h",x:"4. « Function, Container ou Job ? »"},
 {t:"p",x:"**Function** : je fournis du code, Scaleway builde, runtimes limités, mise en place la plus rapide. **Container** : je fournis une image OCI, liberté totale sur la stack. **Job** : un traitement qui démarre, s'exécute et se termine, avec un cron possible, sans endpoint HTTP. Les trois scalent à zéro. Piège à mentionner spontanément : le **cold start** et le risque de **connection storm** sur la base quand `max-scale` est trop haut."},
 {t:"h",x:"5. « Comment tu déploies une app en production sur Scaleway ? »"},
 {t:"ol",x:[
  "Infra décrite en **Terraform** : VPC, Private Network, Kapsule ou Serverless Containers, RDB, bucket.",

/* ============================================================
   2. Quiz — la bonne réponse est indiquée par `a`,
      l'ordre affiché est mélangé à chaque tirage.

QUIZ = [
{m:"intro",q:"Quel est le bon ordre hiérarchique chez Scaleway ?",
 o:["Project → Organization → Resource","Organization → Project → Resource","Account → Region → Project","Organization → Region → Project"],a:1,
 e:"L'**Organization** est la racine (facturation, users, IAM). Elle contient des **Projects**, qui contiennent les **Resources**."},
{m:"intro",q:"`fr-par-2` désigne :",
 o:["une region","un project","une availability zone","un endpoint S3"],a:2,
 e:"`fr-par` est la **region**, `fr-par-2` est une **availability zone** de cette region."},
{m:"intro",q:"Parmi ces produits, lequel est **régional** et non zonal ?",
 o:["Object Storage","Instance","Block Storage","Elastic Metal"],a:0,
 e:"L'Object Storage est **régional** : un bucket appartient à `fr-par`, pas à `fr-par-1`. Instances, Block Storage et Elastic Metal sont zonaux."},
{m:"intro",q:"Quelle affirmation est vraie sur les Projects ?",
 o:["Chaque Project a sa propre facture séparée","Un Project ne peut contenir que des Instances","Les Projects servent de scope d'isolation et de permissions IAM","Il ne peut y avoir qu'un seul Project par Organization"],a:2,
 e:"Le Project isole les ressources et sert de **scope IAM**. La facturation reste consolidée au niveau de l'Organization, avec une ventilation par project."},
{m:"intro",q:"Une Instance est arrêtée (`stopped`). Que continues-tu à payer ?",
 o:["Rien du tout","Le block storage volume et la flexible IP réservée","Uniquement le trafic réseau","Seulement la RAM"],a:1,
 e:"L'arrêt libère le CPU/RAM, mais le **volume** et l'**IP réservée** restent facturés. C'est le piège de coût le plus courant."},
{m:"intro",q:"Combien d'availability zones compte la region `fr-par` ?",
 o:["1","2","3","6"],a:2,
 e:"`fr-par-1`, `fr-par-2` et `fr-par-3`. Les regions `nl-ams` et `pl-waw` ont également plusieurs AZ."},
{m:"iam",q:"Quel principal IAM faut-il utiliser pour une CI/CD ?",
 o:["Une Application","Le user Owner de l'Organization","Un user dédié avec MFA désactivé","Un Group vide"],a:0,
 e:"Une **Application** est une identité machine. Utiliser une clé d'un humain (a fortiori l'Owner) est une mauvaise pratique majeure."},
{m:"iam",q:"Que met-on dans le header `X-Auth-Token` ?",
 o:["L'access key (SCWXXXX…)","Le project_id","La secret key","Un JWT généré par la console"],a:2,
 e:"`X-Auth-Token` attend la **secret key**. L'access key ne sert qu'à identifier la clé et à signer les requêtes S3."},
{m:"iam",q:"Tu as perdu la secret key d'une API key. Que fais-tu ?",
 o:["Tu la récupères dans la console, onglet Credentials","Tu la retrouves via `scw iam api-key get`","Tu révoques la clé et tu en crées une nouvelle","Tu contactes le support pour qu'il te la renvoie"],a:2,
 e:"La secret key n'est affichée **qu'une seule fois**, à la création. Elle n'est jamais réaffichée : il faut révoquer et recréer."},
{m:"iam",q:"Comment est composée une policy IAM Scaleway ?",
 o:["Un principal + des rules (permission sets + scope)","Un document JSON avec Effect Allow/Deny et des conditions","Une liste d'IP autorisées","Un rôle assumé temporairement via STS"],a:0,
 e:"Le modèle est **allow-only** : une policy lie **un principal** à des **rules**, chaque rule combinant des **permission sets** et un **scope** (project_ids ou organization_id)."},
{m:"iam",q:"Quelle est la principale différence avec l'IAM d'AWS ?",
 o:["Scaleway n'a pas de notion de groupe","Scaleway ne gère pas les identités machine","Il n'y a pas de `Deny` explicite ni de conditions chez Scaleway","Les permissions Scaleway sont globales uniquement"],a:2,
 e:"Le modèle Scaleway est **allow-only**, sans `Effect: Deny` ni conditions. Plus simple, moins expressif."},
{m:"iam",q:"Où ne faut-il surtout pas stocker une secret key ?",
 o:["Dans Secret Manager","Dans une variable d'environnement injectée par la CI","Dans un fichier commité au repo, même en .gitignore local","Dans ~/.config/scw/config.yaml avec des droits 600"],a:2,
 e:"Un fichier de credentials dans le repo finit toujours par être poussé. Secret Manager, variables d'environnement ou secrets CI."},
{m:"compute",q:"Quelle différence entre local storage et block storage ?",
 o:["Le local storage est répliqué sur 3 AZ","Le block storage est un volume réseau détachable et redimensionnable","Le block storage ne supporte pas les snapshots","Le local storage se monte sur plusieurs Instances à la fois"],a:1,
 e:"Le **block storage** est un volume réseau : détachable, redimensionnable à chaud, snapshot-able, il survit à la suppression de l'Instance. Le **local storage** est physiquement lié à l'hyperviseur."},
{m:"compute",q:"À quoi sert un placement group en `max_availability` ?",
 o:["Rapprocher les Instances pour réduire la latence","Garantir que les Instances tournent sur des hyperviseurs différents","Répartir les Instances sur plusieurs regions","Créer un cluster Kubernetes"],a:1,
 e:"C'est de l'**anti-affinity** : le placement group force la répartition sur des hyperviseurs distincts pour éviter un point de défaillance unique."},
{m:"compute",q:"Quelle commande supprime proprement une Instance avec son IP et ses volumes ?",
 o:["`scw instance server delete <id>`","`scw instance server stop <id> --force`","`scw instance server terminate <id> with-ip=true with-volumes=all`","`scw instance server destroy <id> --all`"],a:2,
 e:"`terminate` avec `with-ip=true` et `with-volumes=all` évite de laisser des ressources orphelines facturées."},
{m:"compute",q:"Quand choisir Elastic Metal plutôt qu'une Instance ?",
 o:["Pour héberger un site statique","Pour de la virtualisation imbriquée ou une licence liée au CPU physique","Pour réduire le temps de provisioning à quelques secondes","Pour bénéficier du scale-to-zero"],a:1,
 e:"Elastic Metal donne un **serveur physique dédié** : nécessaire pour la nested virtualization, certaines licences ou des I/O extrêmes."},
{m:"compute",q:"Comment injecte-t-on un script d'initialisation dans une Instance ?",
 o:["Via un security group","Via le user data `cloud-init`","Via une bucket policy","Via une annotation Kubernetes"],a:1,
 e:"On pose un user data de clé `cloud-init` : `scw instance user-data set server-id=… key=cloud-init content=@init.yaml`."},
{m:"compute",q:"Un security group Scaleway agit :",
 o:["au niveau de l'Instance, de façon stateful","au niveau du VPC entier, de façon stateless","au niveau du bucket Object Storage","au niveau du DNS"],a:0,
 e:"C'est un firewall **stateful** attaché aux Instances, avec des règles inbound/outbound — l'équivalent des security groups AWS."},
{m:"serverless",q:"Quel produit part d'une image OCI plutôt que de code source ?",
 o:["Serverless Functions","Serverless Containers","Serverless SQL Database","Managed Inference"],a:1,
 e:"Les **Containers** déploient une image du Container Registry ; les **Functions** partent du code et Scaleway builde l'image."},
{m:"serverless",q:"Que provoque `min-scale=0` ?",
 o:["Un scale-to-zero, donc un cold start possible","Une erreur de configuration","La suppression du namespace après 24 h","Un plafond de 0 requête par seconde"],a:0,
 e:"`min-scale=0` arrête toutes les instances en l'absence de trafic : coût nul, mais **cold start** à la requête suivante."},
{m:"serverless",q:"Quel type de trigger permet d'exécuter une fonction toutes les nuits à 3 h ?",
 o:["Un trigger HTTP","Un trigger CRON","Un webhook Object Storage","Un health check du Load Balancer"],a:1,
 e:"Un **CRON trigger** avec une expression et une timezone. Pour un batch qui se termine, un **Serverless Job** avec cron est encore plus adapté."},
{m:"serverless",q:"Un `max-scale` très élevé devant une base managée peut provoquer :",
 o:["un cold start permanent","une connection storm qui sature `max_connections`","une perte des logs","un changement de region automatique"],a:1,
 e:"Chaque instance ouvre ses connexions : sans pooling, un scaling agressif sature la base. Réponse attendue : pooling/proxy et `max-scale` cohérent."},
{m:"serverless",q:"Le CPU alloué à une Serverless Function est déterminé par :",
 o:["le nombre de requêtes par seconde","la mémoire allouée","la region choisie","le runtime sélectionné"],a:1,
 e:"Le CPU est **proportionnel à la mémoire** configurée : augmenter la mémoire accélère aussi le traitement."},
{m:"k8s",q:"Quelle est la différence entre Kapsule et Kosmos ?",
 o:["Kosmos est la version gratuite de Kapsule","Kapsule est mono-AZ, Kosmos est multi-region","Kosmos permet des nodes hors Scaleway (multi-cloud / on-premise)","Kapsule n'a pas de control plane managé"],a:2,
 e:"Les deux ont un **control plane managé**. **Kapsule** = nodes Scaleway ; **Kosmos** = nodes hétérogènes, y compris chez un autre provider."},
{m:"k8s",q:"Que se passe-t-il quand tu crées un `Service type=LoadBalancer` sur Kapsule ?",
 o:["Rien, il faut un Ingress obligatoirement","Le CCM provisionne un Load Balancer Scaleway facturé","Le trafic passe par le Public Gateway","Kubernetes crée un bucket Object Storage"],a:1,
 e:"Le **Cloud Controller Manager** crée un vrai **Load Balancer Scaleway**. C'est pour ça qu'on met plutôt un seul Ingress Controller devant."},
{m:"k8s",q:"Quel est le username à utiliser pour `docker login rg.fr-par.scw.cloud` ?",
 o:["ton email Scaleway","`nologin`","l'access key","`root`"],a:1,
 e:"Le username littéral est **`nologin`** et le mot de passe est la **secret key**."},
{m:"k8s",q:"Que fait `scw k8s kubeconfig install <cluster-id>` ?",
 o:["Installe kubectl sur la machine","Fusionne le kubeconfig du cluster dans ~/.kube/config","Crée un nouveau pool de nodes","Met à jour la version du control plane"],a:1,
 e:"La commande récupère le kubeconfig du cluster et l'ajoute à ta configuration kubectl locale."},
{m:"k8s",q:"Quand un PersistentVolumeClaim est créé sur Kapsule, que provisionne le CSI driver ?",
 o:["Un bucket Object Storage","Un partage NFS","Un Block Storage volume","Une flexible IP"],a:2,
 e:"Le driver CSI Scaleway crée dynamiquement un **Block Storage volume** attaché au node qui héberge le pod."},
{m:"storage",q:"Comment s'authentifie-t-on sur l'Object Storage Scaleway ?",
 o:["Header `X-Auth-Token` avec la secret key","Signature AWS V4 avec access key + secret key","Basic auth email / mot de passe","OAuth2 avec un refresh token"],a:1,
 e:"L'Object Storage est **compatible S3** : on utilise la **signature AWS V4**. Le `X-Auth-Token` sert aux autres APIs Scaleway."},
{m:"storage",q:"Quel est l'endpoint S3 de la region Paris ?",
 o:["https://api.scaleway.com/s3/fr-par","https://s3.fr-par.scw.cloud","https://fr-par-1.s3.scaleway.com","https://object.fr-par.scaleway.com"],a:1,
 e:"`https://s3.<region>.scw.cloud`, donc `https://s3.fr-par.scw.cloud`. Le bucket peut aussi être adressé en virtual-hosted : `https://mon-bucket.s3.fr-par.scw.cloud`."},
{m:"storage",q:"Quelle classe de stockage impose une restauration différée avant lecture ?",
 o:["STANDARD","ONEZONE_IA","GLACIER","MULTI_AZ"],a:2,
 e:"**GLACIER** est de l'archivage : l'objet doit être restauré (opération qui prend des heures et qui est facturée) avant d'être lisible."},
{m:"storage",q:"Quel mécanisme permet de donner un accès temporaire à un objet privé ?",
 o:["Une pre-signed URL","Une bucket policy publique","Un security group","Un CNAME dans le DNS"],a:0,
 e:"La **pre-signed URL** encode une signature et une expiration : l'accès est temporaire sans distribuer de credentials."},
{m:"storage",q:"Quel levier réduit le plus efficacement la facture Object Storage ?",
 o:["Renommer les objets avec des noms plus courts","Des lifecycle rules de transition et d'expiration","Activer le versioning","Passer les buckets en public"],a:1,
 e:"Les **lifecycle rules** déplacent automatiquement les données froides vers ONEZONE_IA/GLACIER et suppriment les objets périmés."},
{m:"storage",q:"Un Block Storage volume peut être attaché :",
 o:["à plusieurs Instances simultanément","à une seule Instance à la fois","à un bucket","à un cluster entier"],a:1,
 e:"Le Block Storage est attaché à **une** Instance. Pour un accès partagé simultané, c'est **File Storage** (NFS)."},
{m:"network",q:"Un Private Network Scaleway (VPC v2) est :",
 o:["global","régional","zonal","lié à un seul serveur"],a:1,
 e:"Depuis VPC v2 les Private Networks sont **régionaux** : les ressources de plusieurs AZ d'une même region peuvent y communiquer."},
{m:"network",q:"À quoi sert principalement un Public Gateway ?",
 o:["Répartir le trafic entrant entre plusieurs serveurs","Fournir le NAT sortant et un bastion SSH aux machines privées","Chiffrer les volumes","Distribuer du contenu statique en CDN"],a:1,
 e:"Le Public Gateway donne un accès Internet sortant (NAT), du port forwarding et un bastion SSH aux ressources sans IP publique."},
{m:"network",q:"Pour survivre à la perte d'une AZ, quel type de Load Balancer choisis-tu ?",
 o:["Un LB zonal avec une flexible IP","Un LB multi-AZ (regional)","Deux LB zonaux avec un round robin DNS manuel","Aucun, le Public Gateway suffit"],a:1,
 e:"Le **Load Balancer multi-AZ / regional** est réparti sur plusieurs AZ. Un LB zonal disparaît avec son AZ."},
{m:"network",q:"Quel produit met un CDN et un domaine personnalisé devant un bucket ?",
 o:["Edge Services","Public Gateway","IPAM","Interlink"],a:0,
 e:"**Edge Services** apporte cache CDN, nom de domaine personnalisé et certificat TLS managé devant un bucket ou un Load Balancer."},
{m:"network",q:"Que gère IPAM ?",
 o:["Les certificats TLS","L'attribution des adresses IP privées dans le VPC","Le routage BGP vers Internet","Les règles de firewall"],a:1,
 e:"IPAM (IP Address Management) gère les plages et l'attribution des adresses privées des Private Networks."},
{m:"db",q:"Que garantit l'option High Availability d'une Managed Database ?",
 o:["Des backups plus fréquents","Un node standby dans une autre AZ avec basculement automatique","Une protection contre un DROP TABLE","Des read replicas illimités"],a:1,
 e:"La HA ajoute un **standby** avec failover automatique. Elle protège d'une panne d'infrastructure, **pas** d'une erreur humaine : les backups restent indispensables."},
{m:"db",q:"Quelle est la bonne pratique pour exposer une Managed Database en production ?",
 o:["Endpoint public avec une ACL 0.0.0.0/0","Endpoint public sans ACL, protégé par le mot de passe","Endpoint sur Private Network uniquement","Tunnel SSH depuis le poste de chaque développeur"],a:2,
 e:"On attache la base à un **Private Network** et on supprime l'endpoint public : la base n'est joignable que depuis le VPC."},
{m:"db",q:"Quel produit descend automatiquement à zéro quand personne ne l'utilise ?",
 o:["Managed Database PostgreSQL","Serverless SQL Database","Managed Redis","Elastic Metal"],a:1,
 e:"La **Serverless SQL Database** (compatible PostgreSQL) scale automatiquement et jusqu'à zéro, facturée à l'usage réel."},
{m:"db",q:"Par défaut, qui peut se connecter à l'endpoint public d'une Managed Database ?",
 o:["Tout Internet","Personne : il faut déclarer explicitement les CIDR autorisés","Uniquement les Instances du même project","Uniquement la console"],a:1,
 e:"Les **ACL / allowed IPs** sont vides au départ : aucune connexion externe n'est possible tant qu'on n'a pas ajouté de CIDR."},
{m:"integ",q:"Quels protocoles propose Messaging & Queuing ?",
 o:["AMQP, MQTT et Kafka","NATS, SQS et SNS","gRPC, GraphQL et REST","Redis Streams et RabbitMQ"],a:1,
 e:"**NATS** (pub/sub + JetStream), **SQS** (files, compatible AWS) et **SNS** (topics, compatible AWS)."},
{m:"integ",q:"Que faut-il configurer dans le DNS pour utiliser Transactional Email ?",
 o:["Un enregistrement A vers l'IP du serveur SMTP","Les enregistrements SPF, DKIM (et DMARC)","Un CNAME vers scaleway.com","Rien, la vérification est automatique"],a:1,
 e:"La vérification du domaine repose sur **SPF** et **DKIM**, avec **DMARC** fortement recommandé pour la délivrabilité."},
{m:"integ",q:"Cockpit repose sur quelle stack ?",
 o:["Elasticsearch, Logstash, Kibana","Grafana, Prometheus/Mimir, Loki, Tempo","Datadog managé","Zabbix et Nagios"],a:1,
 e:"Cockpit est une stack **Grafana** (visualisation), **Prometheus/Mimir** (métriques), **Loki** (logs), **Tempo** (traces)."},
{m:"integ",q:"Les Generative APIs de Scaleway sont :",
 o:["compatibles avec l'API OpenAI, facturées au token","réservées aux clients Elastic Metal","accessibles uniquement via la console","limitées aux modèles entraînés par le client"],a:0,
 e:"L'endpoint `https://api.scaleway.ai/v1` est **compatible OpenAI** : on réutilise les SDK existants en changeant le base URL et la clé."},
{m:"cli",q:"Quelle est la grammaire d'une commande scw ?",
 o:["`scw <verbe> <ressource> <namespace>`","`scw <namespace> <ressource> <verbe>`","`scw --resource <x> --action <y>`","`scw run <commande>`"],a:1,
 e:"Toujours `scw <namespace> <resource> <verb>`, par exemple `scw instance server list`."},
{m:"cli",q:"Comment passe-t-on un argument à une commande scw ?",
 o:["`--type DEV1-S`","`type=DEV1-S`","`-t DEV1-S`","`type: DEV1-S`"],a:1,
 e:"Les **arguments de ressource** s'écrivent `cle=valeur`. Les tirets sont réservés aux **flags** globaux comme `-o` ou `--wait`."},
{m:"cli",q:"Quel est l'ordre de précédence de la configuration du CLI ?",
 o:["config file > env vars > flags","env vars > flags > config file","flags > env vars > config file","config file > flags > env vars"],a:2,
 e:"Les **flags** gagnent, puis les **variables d'environnement**, puis le **profil du fichier de config**. C'est ce qui permet de scripter en CI sans fichier."},
{m:"cli",q:"Quel flag attend la fin d'une opération asynchrone ?",
 o:["`--sync`","`--block`","`-w` / `--wait`","`--poll`"],a:2,
 e:"`--wait` (ou `-w`) bloque jusqu'à l'état final. Indispensable dans un script qui enchaîne création puis configuration."},
{m:"cli",q:"Comment découvrir la requête HTTP réellement envoyée par le CLI ?",
 o:["`scw --debug …`","`scw trace …`","`scw --verbose-api …`","`SCW_LOG=all scw …`"],a:0,
 e:"`--debug` affiche méthode, URL et body. C'est la meilleure façon d'apprendre l'API à partir de commandes CLI connues."},
{m:"cli",q:"Que fait `scw object config install type=aws-cli` ?",
 o:["Installe le binaire aws-cli","Génère la configuration aws-cli pointant vers l'Object Storage Scaleway","Migre un bucket S3 vers Scaleway","Crée une API key S3 dédiée"],a:1,
 e:"La commande écrit la configuration (endpoint, region, credentials) pour aws-cli, rclone, s3cmd ou mc à partir de ton profil scw."},
{m:"cli",q:"Où se trouve la configuration du CLI sous Linux ?",
 o:["/etc/scaleway/scw.conf","~/.scw/credentials","~/.config/scw/config.yaml","~/.aws/config"],a:2,
 e:"`~/.config/scw/config.yaml`, surchargeable via `SCW_CONFIG_PATH`. Il contient la secret key en clair : droits 600, jamais commité."},
{m:"api",q:"Quelle URL liste les Instances de `fr-par-1` ?",
 o:["GET /instance/v1/regions/fr-par/servers","GET /instance/v1/zones/fr-par-1/servers","GET /compute/v1/fr-par-1/instances","GET /instance/servers?zone=fr-par-1"],a:1,
 e:"Produit **zonal** : `/instance/v1/zones/<zone>/servers`. Les produits régionaux utilisent `/regions/<region>/…`."},
{m:"api",q:"À quoi correspond `total_count` dans une réponse de liste ?",
 o:["Au nombre d'éléments de la page courante","Au nombre total d'éléments, toutes pages confondues","Au quota maximum du project","Au nombre de pages restantes"],a:1,
 e:"`total_count` donne le total côté serveur : c'est lui qui permet de calculer le nombre de pages avec `per_page`."},
{m:"api",q:"Un `403 permissions_denied` signifie :",
 o:["le token est invalide","tu es authentifié mais la policy IAM n'autorise pas l'action","la ressource n'existe pas","le quota est dépassé"],a:1,
 e:"`401` = authentification en échec, `403` = authentifié mais **non autorisé** : il manque un permission set sur le bon scope."},
{m:"api",q:"L'API renvoie `429`. Que fais-tu ?",
 o:["Tu relances immédiatement en boucle","Tu appliques un backoff exponentiel avec jitter","Tu changes de region","Tu recrées une API key"],a:1,
 e:"`429` = rate limit ou quota. La réponse attendue est un **retry avec backoff exponentiel et jitter**, éventuellement une demande d'augmentation de quota."},
{m:"api",q:"Une création d'Instance renvoie 201 avec `state: starting`. Que signifie-t-il ?",
 o:["L'opération a échoué silencieusement","La ressource est prête à être utilisée","L'API est asynchrone : il faut attendre l'état `running`","Il faut refaire la requête"],a:2,
 e:"L'API Scaleway est **asynchrone**. On attend l'état cible via `--wait` en CLI ou un `wait_for_*` dans un SDK."},
{m:"api",q:"Que signifie une version d'API en `v1alpha1` ?",
 o:["Une version dépréciée","Une version en évolution, susceptible de changer","Une version réservée aux comptes entreprise","Une version en lecture seule"],a:1,
 e:"Les suffixes `alpha`/`beta` signalent une API **non stabilisée** : à utiliser en connaissance de cause, avec un plan de migration."},
{m:"api",q:"Sur quel outil s'appuient à la fois le CLI et le provider Terraform ?",

var KEY="scw-academy-v1";
var state={xp:0,done:{},missions:{},badges:{},best:0,seen:0,page:"intro",theme:"dark"};
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);for(var k in o)state[k]=o[k];}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
load();
document.documentElement.setAttribute("data-theme",state.theme||"dark");

function toast(msg,ic){
  var d=document.createElement("div");d.className="toast";
  d.innerHTML='<span style="font-size:17px">'+(ic||"✨")+"</span><span>"+msg+"</span>";
  document.getElementById("toast").appendChild(d);
  setTimeout(function(){d.style.transition="opacity .4s";d.style.opacity="0";setTimeout(function(){d.remove();},420);},2600);
}
function addXp(n,why){
  state.xp+=n;save();paintXp();
  if(why)toast("+"+n+" XP — "+why,"⚡");
  checkBadges();
}
function unlock(id){
  if(state.badges[id])return;
  state.badges[id]=1;save();
  var b=BADGES.filter(function(x){return x.id===id;})[0];
  if(b)toast("Badge débloqué : "+b.t,b.ic);
  paintXp();
}
function checkBadges(){
  var nd=Object.keys(state.done).length;
  if(nd>=1)unlock("first");
  if(nd>=MODULES.length)unlock("all");
  if(Object.keys(state.missions).length>=MISSIONS.length)unlock("ops");
  if(state.best>=80)unlock("brain");
  if(state.best>=100)unlock("perfect");
  if(state.seen>=20)unlock("deck");
  if(Math.floor(state.xp/100)+1>=5)unlock("lvl5");
}
function paintXp(){
  var lvl=Math.floor(state.xp/100)+1, into=state.xp%100;
  document.getElementById("lvl").textContent=lvl;
  document.getElementById("xptxt").textContent=state.xp+" XP · "+into+"/100";
  document.getElementById("xpbar").style.width=into+"%";
  document.getElementById("badges").innerHTML=BADGES.map(function(b){
    return '<div class="bdg'+(state.badges[b.id]?" on":"")+'" title="'+esc(b.t)+'">'+b.ic+"</div>";
  }).join("");
}

function hl(code){
  var s=esc(code);
  return s.replace(
    /(&[a-z]+;)|(^[ \t]*)(scw|curl|docker|kubectl|aws|brew|winget|choco|terraform|export|chmod)\b|(#[^\n]*)|(^|[ \t])(\/\/[^\n]*)|("[^"\n]*")|('[^'\n]*')|\b(GET|POST|PUT|PATCH|DELETE)\b|(^|[\s(])(--?[A-Za-z][\w-]*)|\b(\d+(?:\.\d+)?)\b/gm,
    function(m,ent,ws,cmd,cmt,cpre,slash,dq,sq,verb,pre,flag,num){
      if(ent)return ent;
      if(cmd)return ws+'<span class="k-cmd">'+cmd+"</span>";
      if(cmt)return '<span class="k-cmt">'+cmt+"</span>";
      if(slash)return cpre+'<span class="k-cmt">'+slash+"</span>";
      if(dq)return '<span class="k-str">'+dq+"</span>";
      if(sq)return '<span class="k-str">'+sq+"</span>";
      if(verb)return '<span class="k-http">'+verb+"</span>";
      if(flag)return pre+'<span class="k-flag">'+flag+"</span>";
      if(num)return '<span class="k-num">'+num+"</span>";
      return m;
    });
}
var CODEBANK=[];

    esc(cap||lang||"shell")+'</span><button data-copy="'+i+'">copier</button></div><pre>'+hl(code)+"</pre></div>";

    switch(b.t){
      case "p": return "<p>"+md(b.x)+"</p>";
      case "h": return '<h3 class="sub">'+md(b.x)+"</h3>";
      case "ul": return '<ul class="li">'+b.x.map(function(i){return "<li>"+md(i)+"</li>";}).join("")+"</ul>";
      case "ol": return '<ol class="st">'+b.x.map(function(i){return "<li>"+md(i)+"</li>";}).join("")+"</ol>";
      case "code": return codeBlock(b.x,b.lang,b.cap);
      case "note": return '<div class="note '+b.k+'">'+(b.b?"<b>"+md(b.b)+"</b>":"")+md(b.x)+"</div>";

        "</tr></thead><tbody>"+b.rows.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+md(c)+"</td>";}).join("")+"</tr>";}).join("")+
        "</tbody></table></div>";
      case "cards": return '<div class="grid g2">'+b.x.map(function(c){
        return '<div class="card"><span class="ci">'+c.i+"</span><h4>"+md(c.t)+"</h4><p>"+md(c.d)+"</p>"+
          (c.tag?'<span class="tag '+(c.tc||"")+'">'+esc(c.tag)+"</span>":"")+"</div>";
      }).join("")+"</div>";

  termPrint(r);termPrint([tl("")]);
  MISSIONS.forEach(function(m){
    if(!state.missions[m.id]&&m.re.test(cmd.trim())){
      state.missions[m.id]=1;save();
      toast("Mission validée : "+m.t,"✅");addXp(15);
      var el=document.querySelectorAll(".mission")[MISSIONS.indexOf(m)];
      if(el){el.classList.add("done");el.querySelector(".mi").textContent="✓";}
      var h=document.querySelector("h3.sub");
      if(h)h.innerHTML="Missions ("+Object.keys(state.missions).length+" / "+MISSIONS.length+")";
    }
  });
}

/* ---------- Quiz ---------- */
var QZ={list:[],i:0,score:0,filter:"all",locked:false};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildQuiz(filter,n){
  var pool=QUIZ.filter(function(q){return filter==="all"||q.m===filter;});
  pool=shuffle(pool.slice());
  if(n&&pool.length>n)pool=pool.slice(0,n);
  QZ.list=pool.map(function(q){
    var opts=q.o.map(function(txt,i){return {txt:txt,ok:i===q.a};});
    shuffle(opts);                       // <- mélange systématique des réponses
    return {q:q.q,m:q.m,e:q.e,opts:opts};
  });
  QZ.i=0;QZ.score=0;QZ.locked=false;
}
function modTitle(id){var m=MODULES.filter(function(x){return x.id===id;})[0];return m?m.title:id;}
function quizPage(){
  if(!QZ.list.length)buildQuiz(QZ.filter,15);
  return head("Pratique","🎯  Quiz mélangé",
    "Les propositions sont **mélangées à chaque tirage** : impossible de repérer la bonne réponse à sa position. Bonne réponse = **10 XP**.")+
   '<div class="qbar">'+
     '<span class="pill">Score <b id="q-sc">'+QZ.score+"</b></span>"+
     '<span class="pill">Meilleur <b>'+(state.best||0)+" %</b></span>"+
     '<select class="sel" id="q-f"><option value="all">Tous les modules</option>'+
       MODULES.map(function(m){return '<option value="'+m.id+'"'+(QZ.filter===m.id?" selected":"")+">"+esc(m.title)+"</option>";}).join("")+
     "</select>"+
     '<button class="btn ghost sm" id="q-new">Nouveau tirage</button>'+
   "</div><div id='q-zone'></div>"+pgnav();
}
function renderQ(){
  var z=document.getElementById("q-zone");if(!z)return;
  if(QZ.i>=QZ.list.length){
    var pct=Math.round(QZ.score/QZ.list.length*100);
    if(pct>(state.best||0)){state.best=pct;save();}
    checkBadges();
    var msg=pct===100?"Sans faute. Tu es prêt.":pct>=80?"Très bon niveau, quelques détails à revoir.":
            pct>=50?"Base correcte, il faut consolider.":"Reprends les modules concernés, puis relance un tirage.";
    z.innerHTML='<div class="qcard score"><div class="big">'+pct+'%</div><p style="font-size:16px;margin-top:8px">'+
      QZ.score+" / "+QZ.list.length+" bonnes réponses</p><p style=\"color:var(--muted)\">"+esc(msg)+"</p>"+
      '<div class="btnrow" style="justify-content:center"><button class="btn" id="q-again">Relancer un tirage</button>'+
      '<button class="btn ghost" data-go="cards">Réviser en flashcards</button></div></div>';
    document.getElementById("q-again").onclick=function(){buildQuiz(QZ.filter,15);renderQ();};
    bindGo();return;
  }
  var q=QZ.list[QZ.i];
  var pct=Math.round(QZ.i/QZ.list.length*100);
  z.innerHTML='<div class="qprog"><i style="width:'+pct+'%"></i></div>'+
    '<div class="qcard"><div class="qmeta"><span>Question '+(QZ.i+1)+" / "+QZ.list.length+"</span><span>"+esc(modTitle(q.m))+"</span></div>"+
    '<div class="qtext">'+md(q.q)+'</div><div class="opts">'+
    q.opts.map(function(o,i){return '<button class="opt" data-o="'+i+'"><span class="ltr">'+"ABCD"[i]+"</span><span>"+md(o.txt)+"</span></button>";}).join("")+
    '</div><div class="expl" id="q-ex"></div>'+
    '<div class="btnrow" id="q-nav" style="display:none"><button class="btn" id="q-next">Question suivante →</button></div></div>';
  QZ.locked=false;
  Array.prototype.forEach.call(z.querySelectorAll(".opt"),function(b){
    b.onclick=function(){answer(+b.getAttribute("data-o"));};
  });
}
function answer(idx){
  if(QZ.locked)return;QZ.locked=true;
  var q=QZ.list[QZ.i],z=document.getElementById("q-zone");
  var btns=z.querySelectorAll(".opt");
  Array.prototype.forEach.call(btns,function(b,i){
    b.disabled=true;
    if(q.opts[i].ok)b.classList.add("good");
    else if(i===idx)b.classList.add("bad");
  });
  var ok=q.opts[idx].ok;
  if(ok){QZ.score++;addXp(10);}
  document.getElementById("q-sc").textContent=QZ.score;
  var ex=document.getElementById("q-ex");
  ex.innerHTML="<b>"+(ok?"✅ Correct":"❌ Incorrect")+"</b> — "+md(q.e);
  ex.classList.add("on");
  document.getElementById("q-nav").style.display="flex";
  document.getElementById("q-next").onclick=function(){QZ.i++;renderQ();};
}

/* ============================================================
   10. Render & bindings
   ============================================================ */
function bindCopy(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-copy]"),function(b){
    b.onclick=function(){
      var code=CODEBANK[+b.getAttribute("data-copy")];
      var done=function(){b.textContent="copié ✓";setTimeout(function(){b.textContent="copier";},1400);};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done,done);}
      else{
        var ta=document.createElement("textarea");ta.value=code;document.body.appendChild(ta);
        ta.select();try{document.execCommand("copy");}catch(e){}ta.remove();done();
      }
    };
  });
}
function bindGo(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"),function(b){
    b.onclick=function(){go(b.getAttribute("data-go"));};
  });
}
function render(){
  var v=document.getElementById("view"),id=state.page;
  CODEBANK=[];
  var mod=MODULES.filter(function(m){return m.id===id;})[0];
  if(mod)v.innerHTML=modulePage(mod);
  else if(id==="lab")v.innerHTML=labPage();
  else if(id==="explorer")v.innerHTML=explorerPage();
  else if(id==="quiz")v.innerHTML=quizPage();
  else if(id==="cards")v.innerHTML=cardsPage();
  else if(id==="cheat")v.innerHTML=cheatPage();
  else{state.page="intro";return render();}

  bindCopy();bindGo();

  if(mod){
    var md2=document.getElementById("markdone");
    if(md2)md2.onclick=function(){
      state.done[mod.id]=1;save();buildNav();addXp(30,"module terminé");render();
    };
  }
  if(id==="lab"){
    termPrint([tl("Scaleway CLI sandbox — version pédagogique","tacc"),
      tl("Tape help pour voir les commandes disponibles.","tdim"),tl("")]);
    var inp=document.getElementById("tin");
    inp.addEventListener("keydown",function(e){
      if(e.key==="Enter"){
        var c=inp.value;if(!c.trim())return;
        TERMHIST.push(c);THIDX=TERMHIST.length;termRun(c);inp.value="";
      }else if(e.key==="ArrowUp"){
        if(THIDX>0){THIDX--;inp.value=TERMHIST[THIDX];}e.preventDefault();
      }else if(e.key==="ArrowDown"){
        if(THIDX<TERMHIST.length-1){THIDX++;inp.value=TERMHIST[THIDX];}else{THIDX=TERMHIST.length;inp.value="";}
        e.preventDefault();
      }
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-run]"),function(b){
      b.onclick=function(){var c=b.getAttribute("data-run");document.getElementById("tin").value=c;
        TERMHIST.push(c);THIDX=TERMHIST.length;termRun(c);document.getElementById("tin").value="";
        document.getElementById("tin").focus();};
    });
    inp.focus();
  }
  if(id==="explorer")explorerBind();
  if(id==="quiz"){
    renderQ();
    document.getElementById("q-f").onchange=function(){QZ.filter=this.value;buildQuiz(QZ.filter,15);document.getElementById("q-sc").textContent=0;renderQ();};
    document.getElementById("q-new").onclick=function(){buildQuiz(QZ.filter,15);document.getElementById("q-sc").textContent=0;renderQ();};
  }
  if(id==="cards"){
    renderFC();
    document.getElementById("fc").onclick=fcFlip;
    document.getElementById("fc-flip").onclick=fcFlip;
    document.getElementById("fc-next").onclick=function(){FC.i=(FC.i+1)%FC.list.length;FC.flip=false;renderFC();};
    document.getElementById("fc-prev").onclick=function(){FC.i=(FC.i-1+FC.list.length)%FC.list.length;FC.flip=false;renderFC();};
    document.getElementById("fc-sh").onclick=function(){FC.list=shuffle(FC.list.slice());FC.i=0;FC.flip=false;renderFC();};
  }
  paintXp();
}

/* ---------- Recherche ---------- */
var INDEX=[];
(function(){
  MODULES.forEach(function(m){
    INDEX.push({id:m.id,t:m.title,s:"Module",txt:(m.title+" "+m.lead).toLowerCase()});
    m.blocks.forEach(function(b){
      var txt="";
      if(b.t==="h")txt=b.x;
      else if(b.t==="p"||b.t==="note")txt=(b.b||"")+" "+b.x;
      else if(b.t==="ul"||b.t==="ol")txt=b.x.join(" ");
      else if(b.t==="code")txt=b.x;
      else if(b.t==="cards")txt=b.x.map(function(c){return c.t+" "+c.d;}).join(" ");
      else if(b.t==="table")txt=b.head.join(" ")+" "+b.rows.map(function(r){return r.join(" ");}).join(" ");
      if(txt.trim())INDEX.push({id:m.id,t:(b.t==="h"?b.x:(b.b||m.title)),s:m.icon+" "+m.title,txt:txt.toLowerCase()});
    });
  });
  CARDS.forEach(function(c){INDEX.push({id:"cards",t:c.c,s:"🃏 Flashcard",txt:(c.c+" "+c.b).toLowerCase()});});
  TOOLS.forEach(function(t){INDEX.push({id:t.id,t:t.title,s:"Outil",txt:t.title.toLowerCase()});});
})();
function doSearch(q){
  var box=document.getElementById("sres");
  q=q.trim().toLowerCase();
  if(q.length<2){box.classList.remove("on");box.innerHTML="";return;}
  var seen={},res=[];
  INDEX.forEach(function(it){
    if(res.length>=12)return;
    if(it.txt.indexOf(q)>=0){
      var k=it.id+"|"+it.t;if(seen[k])return;seen[k]=1;res.push(it);
    }
  });
  if(!res.length){box.innerHTML='<div style="cursor:default;color:var(--muted)">Aucun résultat</div>';box.classList.add("on");return;}
  box.innerHTML=res.map(function(r){
    return '<div data-sgo="'+r.id+'">'+esc(r.t.length>72?r.t.slice(0,72)+"…":r.t)+"<small>"+esc(r.s)+"</small></div>";
  }).join("");
  box.classList.add("on");
  Array.prototype.forEach.call(box.querySelectorAll("[data-sgo]"),function(d){
    d.onclick=function(){
      document.getElementById("q").value="";box.classList.remove("on");go(d.getAttribute("data-sgo"));
    };
  });
}
