<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scaleway Academy — Cloud, CLI &amp; API</title>
<style>
/* ============================================================
   Scaleway Academy — single file app
   ============================================================ */
:root{
  --purple:#8b2fff; --purple-2:#c084fc; --purple-dk:#4f0599;
  --green:#25d07a; --amber:#ffb020; --red:#ff5470; --cyan:#31d4e8;
  --bg:#08050f; --bg-2:#0f0a1c; --panel:#140d24; --panel-2:#1b1230;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --txt:#efeaf9; --muted:#a394c2; --muted-2:#7d6f9b;
  --code-bg:#0c0716;
  --shadow:0 18px 50px -22px rgba(0,0,0,.9);
}
html[data-theme="light"]{
  --bg:#f6f3fc; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f3eefc;
  --line:rgba(20,5,50,.10); --line-2:rgba(20,5,50,.2);
  --txt:#1b1030; --muted:#5c4a80; --muted-2:#7d6f9b;
  --code-bg:#160e29;
  --shadow:0 14px 40px -20px rgba(60,20,120,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(139,47,255,.22), transparent 60%),
    radial-gradient(800px 480px at 92% 6%, rgba(49,212,232,.10), transparent 62%),
    radial-gradient(700px 500px at 60% 108%, rgba(192,132,252,.10), transparent 60%);
}
html[data-theme="light"] body::before{opacity:.55}
a{color:var(--purple-2); text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:rgba(139,47,255,.4)}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(139,47,255,.35);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(139,47,255,.6);background-clip:padding-box}

.app{position:relative; z-index:1; display:grid; grid-template-columns:290px 1fr; min-height:100vh}
.side{
  border-right:1px solid var(--line); background:linear-gradient(180deg,rgba(139,47,255,.08),transparent 30%), var(--bg-2);
  padding:18px 14px 30px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
html[data-theme="light"] .side{background:linear-gradient(180deg,rgba(139,47,255,.07),transparent 30%), #fff}
.main{min-width:0; display:flex; flex-direction:column}

.brand{display:flex; align-items:center; gap:11px; padding:6px 8px 16px}
.logo{
  width:40px;height:40px;border-radius:12px;flex:none;
  background:linear-gradient(140deg,#8b2fff,#4f0599 60%,#31d4e8);
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:19px;
  box-shadow:0 8px 22px -8px rgba(139,47,255,.9);
}
.brand h1{font-size:16px;margin:0;letter-spacing:-.02em;font-weight:750}
.brand small{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}

.xpbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.xprow{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:7px}
.xprow b{color:var(--txt);font-size:13.5px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
html[data-theme="light"] .bar{background:rgba(20,5,50,.09)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8b2fff,#c084fc,#31d4e8);transition:width .5s cubic-bezier(.2,.9,.3,1)}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.bdg{font-size:15px;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);filter:grayscale(1);opacity:.35;cursor:help;transition:.25s}
.bdg.on{filter:none;opacity:1;background:rgba(139,47,255,.16);border-color:rgba(139,47,255,.5)}

.navlabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);padding:14px 10px 6px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:1px solid transparent;color:var(--muted);
  padding:8px 10px;border-radius:10px;cursor:pointer;font:inherit;font-size:13.5px;transition:.16s;
}
.nav button:hover{background:rgba(139,47,255,.10);color:var(--txt)}
.nav button.active{background:linear-gradient(90deg,rgba(139,47,255,.26),rgba(139,47,255,.06));color:#fff;border-color:rgba(139,47,255,.35)}
html[data-theme="light"] .nav button.active{color:var(--purple-dk)}
.nav button .ic{font-size:15px;width:20px;text-align:center;flex:none}
.nav button .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.14);flex:none}
.dot.done{background:var(--green);box-shadow:0 0 8px var(--green)}

.top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:12px 26px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:blur(14px);
}
.burger{display:none}
.search{position:relative;flex:1;max-width:440px}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);
  padding:9px 12px 9px 34px;border-radius:11px;font:inherit;font-size:13.5px;outline:none;transition:.2s
}
.search input:focus{border-color:rgba(139,47,255,.6);box-shadow:0 0 0 3px rgba(139,47,255,.14)}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;font-size:13px}
.sres{position:absolute;top:46px;left:0;right:0;background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;z-index:40}
.sres.on{display:block}
.sres div{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.sres div:hover{background:rgba(139,47,255,.16)}
.sres div small{display:block;color:var(--muted);font-size:11.5px}
.tools{display:flex;gap:8px;margin-left:auto}
.ibtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:15px;transition:.18s;display:grid;place-items:center}
.ibtn:hover{color:var(--txt);border-color:var(--line-2);background:var(--panel-2)}

.wrap{padding:30px 34px 90px;max-width:1120px;width:100%;margin:0 auto;flex:1}
.page-h{margin-bottom:26px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--purple-2);font-weight:700;background:rgba(139,47,255,.12);border:1px solid rgba(139,47,255,.28);padding:4px 10px;border-radius:99px}
.page-h h2{font-size:31px;line-height:1.2;margin:12px 0 8px;letter-spacing:-.03em;font-weight:780}
.page-h p.lead{color:var(--muted);font-size:15.5px;margin:0;max-width:78ch}
h3.sub{font-size:19px;margin:34px 0 10px;letter-spacing:-.02em;font-weight:720;display:flex;align-items:center;gap:9px}
h3.sub::before{content:"";width:4px;height:19px;border-radius:3px;background:linear-gradient(180deg,var(--purple),var(--cyan))}
p{margin:0 0 12px}
ul.li{margin:0 0 14px;padding-left:0;list-style:none}
ul.li li{position:relative;padding-left:20px;margin-bottom:7px}
ul.li li::before{content:"";position:absolute;left:4px;top:9px;width:6px;height:6px;border-radius:2px;background:var(--purple);transform:rotate(45deg)}
ol.st{margin:0 0 14px;padding-left:0;list-style:none;counter-reset:s}
ol.st li{counter-increment:s;position:relative;padding-left:34px;margin-bottom:9px}
ol.st li::before{content:counter(s);position:absolute;left:0;top:1px;width:23px;height:23px;border-radius:8px;background:rgba(139,47,255,.18);border:1px solid rgba(139,47,255,.4);color:var(--purple-2);font-size:11.5px;font-weight:800;display:grid;place-items:center}
code.ic{background:rgba(139,47,255,.14);border:1px solid rgba(139,47,255,.24);color:var(--purple-2);padding:1px 6px;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:nowrap}
html[data-theme="light"] code.ic{color:#6b1fc0}
b,strong{color:var(--txt);font-weight:700}

.codeb{background:var(--code-bg);border:1px solid var(--line-2);border-radius:13px;margin:0 0 16px;overflow:hidden;box-shadow:var(--shadow)}
.codeb .ch{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.codeb .ch .dots{display:flex;gap:5px}
.codeb .ch .dots i{width:9px;height:9px;border-radius:99px;display:block}
.codeb .ch .dots i:nth-child(1){background:#ff5f57}.codeb .ch .dots i:nth-child(2){background:#febc2e}.codeb .ch .dots i:nth-child(3){background:#28c840}
.codeb .ch span{font-size:11.5px;color:#9c8fbb;font-family:ui-monospace,monospace;margin-left:4px}
.codeb .ch button{margin-left:auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#cbbfe4;font-size:11px;padding:3px 9px;border-radius:7px;cursor:pointer;font-family:inherit;transition:.15s}
.codeb .ch button:hover{background:rgba(139,47,255,.35);color:#fff}
.codeb pre{margin:0;padding:14px 15px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.9px;line-height:1.72;color:#ded4f3}
.k-cmd{color:#c084fc;font-weight:600}.k-flag{color:#31d4e8}.k-str{color:#8ee89a}.k-cmt{color:#6d6188;font-style:italic}
.k-num{color:#ffb020}.k-key{color:#ff8fb1}.k-http{color:#25d07a;font-weight:700}

.note{border-radius:13px;padding:13px 15px 13px 44px;margin:0 0 16px;position:relative;border:1px solid;font-size:14px}
.note::before{position:absolute;left:14px;top:12px;font-size:16px}
.note.info{background:rgba(49,212,232,.08);border-color:rgba(49,212,232,.3)}.note.info::before{content:"\1F4A1"}
.note.warn{background:rgba(255,176,32,.09);border-color:rgba(255,176,32,.32)}.note.warn::before{content:"\26A0"}
.note.exam{background:rgba(139,47,255,.11);border-color:rgba(139,47,255,.36)}.note.exam::before{content:"\1F3AF"}
.note.ok{background:rgba(37,208,122,.09);border-color:rgba(37,208,122,.3)}.note.ok::before{content:"\2705"}
.note.bad{background:rgba(255,84,112,.09);border-color:rgba(255,84,112,.3)}.note.bad::before{content:"\26D4"}
.note b{display:block;margin-bottom:2px}

.tw{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13.4px;min-width:520px}
th{text-align:left;padding:10px 13px;background:rgba(139,47,255,.13);color:var(--txt);font-weight:700;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
td{padding:9px 13px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:rgba(139,47,255,.06)}
td code{font-family:ui-monospace,monospace;font-size:12.2px;color:var(--purple-2)}

.grid{display:grid;gap:13px;margin:0 0 18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;transition:.2s}
.card:hover{border-color:rgba(139,47,255,.45);transform:translateY(-2px);box-shadow:var(--shadow)}
.card .ci{font-size:21px;margin-bottom:7px;display:block}
.card h4{margin:0 0 5px;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.card p{margin:0;font-size:13.2px;color:var(--muted);line-height:1.6}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:rgba(139,47,255,.16);color:var(--purple-2);border:1px solid rgba(139,47,255,.3);margin-top:8px}
.tag.z{background:rgba(255,176,32,.14);color:var(--amber);border-color:rgba(255,176,32,.3)}
.tag.r{background:rgba(49,212,232,.13);color:var(--cyan);border-color:rgba(49,212,232,.3)}
.tag.g{background:rgba(37,208,122,.13);color:var(--green);border-color:rgba(37,208,122,.3)}

.btn{background:linear-gradient(135deg,var(--purple),#6d17d6);color:#fff;border:none;padding:10px 18px;border-radius:11px;font:inherit;font-weight:650;font-size:13.5px;cursor:pointer;transition:.18s;box-shadow:0 10px 26px -12px rgba(139,47,255,.9)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--panel);border:1px solid var(--line-2);color:var(--txt);box-shadow:none}
.btn.ghost:hover{border-color:rgba(139,47,255,.55);background:var(--panel-2)}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 0}

.pgnav{display:flex;gap:12px;justify-content:space-between;margin-top:44px;padding-top:22px;border-top:1px solid var(--line);flex-wrap:wrap}

.term{background:#07040d;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.term .th{display:flex;align-items:center;gap:8px;padding:9px 13px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08)}
.term .th .dots{display:flex;gap:5px}.term .th .dots i{width:10px;height:10px;border-radius:99px;display:block}
.term .th .dots i:nth-child(1){background:#ff5f57}.term .th .dots i:nth-child(2){background:#febc2e}.term .th .dots i:nth-child(3){background:#28c840}
.term .th span{font-size:11.5px;color:#9c8fbb;font-family:ui-monospace,monospace}
.term .body{height:390px;overflow-y:auto;padding:13px 15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.7px;line-height:1.65;color:#ded4f3}
.term .body .ln{white-space:pre-wrap;word-break:break-word}
.term .inrow{display:flex;align-items:center;gap:8px;border-top:1px solid rgba(255,255,255,.08);padding:9px 14px;background:rgba(255,255,255,.02)}
.term .inrow span{color:#25d07a;font-family:ui-monospace,monospace;font-size:12.7px;font-weight:700}
.term .inrow input{flex:1;background:none;border:none;outline:none;color:#ded4f3;font-family:ui-monospace,monospace;font-size:12.7px}
.terr{color:#ff5470}.tok{color:#25d07a}.tdim{color:#7d6f9b}.tacc{color:#c084fc}.twarn{color:#ffb020}.tcy{color:#31d4e8}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:11.8px;padding:5px 10px;border-radius:8px;cursor:pointer;font-family:ui-monospace,monospace;transition:.15s}
.chip:hover{border-color:rgba(139,47,255,.5);color:var(--txt);background:rgba(139,47,255,.12)}

.mission{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;gap:13px;align-items:flex-start}
.mission.done{border-color:rgba(37,208,122,.45);background:rgba(37,208,122,.07)}
.mission .mi{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(139,47,255,.16);border:1px solid rgba(139,47,255,.35);font-size:13px;font-weight:800;color:var(--purple-2)}
.mission.done .mi{background:rgba(37,208,122,.2);border-color:rgba(37,208,122,.5);color:var(--green)}
.mission h4{margin:0 0 3px;font-size:14px}
.mission p{margin:0;font-size:13px;color:var(--muted)}
.mission .hint{margin-top:6px;font-size:12px;color:var(--muted-2);font-family:ui-monospace,monospace}

.qbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:12.5px;color:var(--muted)}
.pill b{color:var(--txt)}
select.sel{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 11px;border-radius:10px;font:inherit;font-size:13px;cursor:pointer;outline:none}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:10px}
.qtext{font-size:17.5px;font-weight:650;line-height:1.45;margin-bottom:18px;letter-spacing:-.01em}
.qtext code{background:rgba(139,47,255,.14);border:1px solid rgba(139,47,255,.24);color:var(--purple-2);padding:1px 6px;border-radius:6px;font-family:ui-monospace,monospace;font-size:14.5px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel-2);border:1px solid var(--line);color:var(--txt);padding:12px 14px;border-radius:12px;cursor:pointer;font:inherit;font-size:14px;transition:.16s;width:100%}
.opt:hover:not(:disabled){border-color:rgba(139,47,255,.55);transform:translateX(3px)}
.opt .ltr{width:23px;height:23px;border-radius:7px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none;color:var(--muted)}
.opt.good{border-color:var(--green);background:rgba(37,208,122,.13)}.opt.good .ltr{background:var(--green);color:#04210f}
.opt.bad{border-color:var(--red);background:rgba(255,84,112,.13)}.opt.bad .ltr{background:var(--red);color:#2a0009}
.opt:disabled{cursor:default;opacity:.85}
.opt.good:disabled,.opt.bad:disabled{opacity:1}
.opt code{font-family:ui-monospace,monospace;font-size:12.8px;color:var(--purple-2)}
.expl{margin-top:16px;padding:13px 15px;border-radius:12px;background:rgba(49,212,232,.08);border:1px solid rgba(49,212,232,.28);font-size:13.6px;display:none}
.expl.on{display:block;animation:fade .35s}
.expl code{font-family:ui-monospace,monospace;font-size:12.6px;color:var(--cyan)}
@keyframes fade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.qprog{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:18px}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .4s}
.score{text-align:center;padding:34px 20px}
.score .big{font-size:56px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(135deg,var(--purple-2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}

.fcwrap{perspective:1400px;margin-bottom:16px}
.fc{position:relative;height:250px;transition:transform .6s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:1px solid var(--line-2);padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow)}
.fc .f{background:linear-gradient(150deg,var(--panel-2),var(--panel))}
.fc .b{background:linear-gradient(150deg,rgba(139,47,255,.22),var(--panel));transform:rotateY(180deg)}
.fc .f h4{font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em}
.fc .b p{font-size:14.5px;margin:0;color:var(--txt);max-width:60ch}
.fc .b code,.fc .f code{font-family:ui-monospace,monospace;font-size:13px;color:var(--purple-2)}
.fc small{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:var(--muted-2);font-size:11px;letter-spacing:.09em;text-transform:uppercase}

.exp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-2);font-weight:700;margin-bottom:5px}
.fld select,.fld input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--txt);padding:9px 11px;border-radius:10px;font:inherit;font-size:13.2px;outline:none}
.fld select:focus,.fld input:focus{border-color:rgba(139,47,255,.6)}
.scopebadge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.07em;padding:3px 9px;border-radius:7px;margin-left:6px}
.sc-z{background:rgba(255,176,32,.16);color:var(--amber)}
.sc-r{background:rgba(49,212,232,.16);color:var(--cyan)}
.sc-g{background:rgba(37,208,122,.16);color:var(--green)}

.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px}
.reg{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;position:relative;overflow:hidden}
.reg::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:99px;background:radial-gradient(circle,rgba(139,47,255,.25),transparent 70%)}
.reg h4{margin:0 0 2px;font-size:15.5px}
.reg .code{font-family:ui-monospace,monospace;color:var(--purple-2);font-size:12.5px}
.reg .azs{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.az{font-family:ui-monospace,monospace;font-size:11.3px;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted)}

#toast{position:fixed;right:22px;bottom:22px;z-index:99;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{background:var(--panel-2);border:1px solid rgba(139,47,255,.5);border-radius:12px;padding:11px 16px;font-size:13.5px;box-shadow:var(--shadow);animation:slide .3s;display:flex;gap:9px;align-items:center}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

.backdrop{display:none}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:280px;z-index:60;transform:translateX(-100%);transition:transform .28s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .burger{display:grid}
  .wrap{padding:22px 16px 80px}
  .page-h h2{font-size:25px}
  .exp{grid-template-columns:1fr}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}
  .backdrop.on{display:block}
}

<script>
"use strict";
/* ============================================================
   0. Helpers
   ============================================================ */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function md(s){
  return esc(s)
    /* on ré-autorise une petite liste de balises écrites à la main dans le contenu */
    .replace(/&lt;(\/?)(code|strong|em|b|br)&gt;/g,function(m,sl,tag){
      return "<"+sl+tag+(tag==="code"&&!sl?' class="ic"':"")+">";
    })
    .replace(/&amp;(lt|gt|amp|nbsp|quot);/g,"&$1;")
    .replace(/`([^`]+)`/g,'<code class="ic">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/__([^_]+)__/g,'<em>$1</em>');
}
var MODULES=[], TOOLS=[], QUIZ=[], CARDS=[], MISSIONS=[], API_PRODUCTS=[];
/* ============================================================

   ============================================================ */
MODULES.push({
id:"intro", icon:"🚀", title:"Fondamentaux Scaleway",
lead:"Qui est Scaleway, comment son cloud est organisé, et le vocabulaire que ton recruteur utilisera dans les 10 premières minutes de l'entretien.",
blocks:[
 {t:"p",x:"**Scaleway** est un cloud provider européen (groupe **Iliad**, France) qui propose une offre complète : compute, storage, network, managed databases, serverless, Kubernetes, AI. Son argument central face à AWS / GCP / Azure est la **souveraineté** (données hébergées en Europe, droit européen, pas de CLOUD Act) associée à un modèle **pay-as-you-go** à la seconde ou à l'heure selon les produits."},
 {t:"cards",x:[
  {i:"🏢",t:"Historique",d:"Online.net / Dedibox à l'origine (dedicated servers), devenu Scaleway en 2015 avec une offre cloud public complète."},
  {i:"🇪🇺",t:"Souveraineté",d:"Data centers en France, Pays-Bas, Pologne. Conformité RGPD/GDPR, certifications ISO 27001, HDS sur certains périmètres."},
  {i:"🌱",t:"Sustainability",d:"DC5 (Paris) refroidi par adiabatic cooling, sans climatisation classique, PUE très bas. Argument commercial fort chez Scaleway."},
  {i:"💶",t:"Pricing",d:"Pay-as-you-go, facturation à l'heure pour la plupart des ressources, Savings Plans, et un free tier sur plusieurs produits."}
 ]},
 {t:"h",x:"Les 4 façons de piloter Scaleway"},
 {t:"p",x:"C'est **la** question d'ouverture classique. Tout ce que fait la console passe par la même API publique : la console n'est qu'un client parmi d'autres."},
 {t:"cards",x:[
  {i:"🖥️",t:"Console",d:"L'interface web console.scaleway.com. Idéale pour découvrir, mauvaise idée pour du reproductible.",tag:"UI",tc:""},
  {i:"⌨️",t:"CLI scw",d:"Binaire Go officiel. Scriptable, sortie JSON, parfait pour l'ops et le debug.",tag:"CLI",tc:"g"},
  {i:"🔌",t:"API REST",d:"api.scaleway.com. Source de vérité : tout le reste s'appuie dessus.",tag:"API",tc:"r"},
  {i:"📦",t:"SDK / IaC",d:"SDK Go, Python, JS/TS ; Terraform / OpenTofu provider, Pulumi, Ansible, Crossplane.",tag:"IaC",tc:"z"}
 ]},
 {t:"note",k:"exam",b:"Réponse type en entretien",x:"« La console, le CLI `scw`, les SDK et le provider Terraform sont tous des **clients de la même REST API**. Pour de la production je fais du **Terraform** pour l'infra, le **CLI** pour l'exploitation et le debug, et l'**API directe** quand j'intègre Scaleway dans une application. »"},
 {t:"h",x:"Hiérarchie : Organization → Project → Resource"},
 {t:"p",x:"C'est le modèle mental le plus important. Une confusion ici se voit immédiatement en entretien."},
 {t:"table",head:["Niveau","Rôle","Identifiant"],rows:[
  ["**Organization**","Le compte racine. Porte la facturation, les users, les groupes, les policies IAM. Une seule par compte (en pratique).","<code>organization_id</code> (UUID)"],
  ["**Project**","Un conteneur logique de ressources (ex. <code>prod</code>, <code>staging</code>, <code>data</code>). Sert de périmètre d'isolation et de scope IAM. Il existe toujours un project <code>default</code>.","<code>project_id</code> (UUID)"],
  ["**Resource**","L'objet concret : Instance, bucket, cluster Kapsule, base RDB…","<code>id</code> (UUID) + zone/region"]
 ]},
 {t:"note",k:"warn",b:"Piège classique",x:"Un **Project n'est pas un compte de facturation séparé**. La facture est consolidée au niveau de l'Organization ; le Project sert à séparer les ressources, appliquer des permissions et ventiler les coûts (cost breakdown par project)."},
 {t:"note",k:"info",b:"Historique à connaître",x:"Avant l'IAM actuel, Scaleway avait des « Organizations » et des tokens globaux. Les **Projects** ont remplacé les anciens « accounts » et l'**IAM** (users, applications, groups, policies) a remplacé les tokens tout-puissants. Si tu vois du code qui envoie un `organization_id` là où on attend un `project_id`, c'est souvent du legacy."},
 {t:"h",x:"Regions & Availability Zones"},
 {t:"p",x:"Scaleway distingue trois **scopes** de ressources. Savoir si un produit est zonal, régional ou global est un réflexe indispensable, aussi bien pour l'API que pour l'architecture."},
 {t:"regions"},
 {t:"table",head:["Scope","Format","Exemples de produits"],rows:[
  ["**Zonal**","<code>fr-par-1</code>, <code>nl-ams-2</code>","Instances, Block Storage, Elastic Metal, Load Balancer (zonal), snapshots"],
  ["**Regional**","<code>fr-par</code>, <code>nl-ams</code>, <code>pl-waw</code>","Object Storage, VPC & Private Networks, Kapsule, Managed Databases, Container Registry, Serverless, Cockpit"],
  ["**Global**","(aucun)","IAM, Account/Projects, Billing, Domains & DNS, Secret Manager (multi-region)"]
 ]},
 {t:"note",k:"exam",b:"À placer absolument",x:"« Une **region** = un site géographique (`fr-par`), une **AZ** = un data center isolé dans cette region (`fr-par-1`, `fr-par-2`, `fr-par-3`). Pour de la haute disponibilité je répartis mes Instances sur **plusieurs AZ d'une même region** et je mets devant un **Load Balancer multi-AZ (regional)**. »"},
 {t:"h",x:"Facturation & quotas"},
 {t:"ul",x:[
  "**Pay-as-you-go** : facturation à l'heure entamée pour les Instances, à la seconde/requête pour le serverless, au Go stocké pour l'Object Storage.",
  "Une Instance **stopped** ne facture pas le CPU/RAM, mais **le volume (block storage) et la flexible IP réservée continuent d'être facturés**. Piège d'entretien très fréquent.",
  "**Savings Plans** : engagement mensuel/annuel sur un montant de compute en échange d'une remise.",
  "**Quotas** : limites par Organization/Project (nombre d'Instances, d'IP, de vCPU). Elles augmentent avec l'ancienneté et la vérification du compte ; sinon ticket support.",
  "**Cost Manager** + **budget alerts** pour suivre la consommation ; export de la consommation détaillée."
 ]},
 {t:"note",k:"bad",b:"Erreur qui coûte cher",x:"Supprimer une Instance sans supprimer son **volume** ni libérer sa **flexible IP** : tu continues à payer. En CLI on écrit donc `scw instance server terminate <id> with-ip=true with-volumes=all`."}
]});

MODULES.push({
id:"iam", icon:"🔐", title:"IAM, clés & sécurité",
lead:"Le sujet où l'on repère un développeur sérieux : comment on s'authentifie, comment on limite les droits, et où l'on ne met surtout pas ses secrets.",
blocks:[
 {t:"h",x:"Les principals"},
 {t:"cards",x:[
  {i:"👤",t:"User",d:"Un humain qui se connecte à la console (email + mot de passe + MFA). Peut posséder des API keys."},
  {i:"🤖",t:"Application",d:"Une identité machine : CI/CD, script, Terraform, backend applicatif. C'est ce qu'il faut utiliser pour un service."},
  {i:"👥",t:"Group",d:"Un ensemble de users et/ou d'applications, pour attacher les policies une seule fois."},
  {i:"👑",t:"Owner",d:"Le propriétaire de l'Organization. Droits absolus, ne peut pas être restreint. À ne jamais utiliser au quotidien."}
 ]},
 {t:"h",x:"Policy = Principal + Rules"},
 {t:"p",x:"Une **policy** IAM associe **un** principal (user, application ou group) à une liste de **rules**. Chaque rule = un ensemble de **permission sets** appliqué à un **scope** : soit une liste de `project_ids`, soit `organization_id` (donc tous les projects)."},
 {t:"code",lang:"json",cap:"policy (modèle mental)",x:`{
  "name": "ci-deploy-staging",
  "application_id": "5f2a...",          // le principal
  "rules": [
    {
      "permission_set_names": [
        "InstancesFullAccess",
        "ContainerRegistryFullAccess"
      ],
      "project_ids": ["c0ffee00-...-staging"]   // le scope
    },
    {
      "permission_set_names": ["ObjectStorageReadOnly"],
      "organization_id": "a1b2..."              // scope global
    }
  ]
}`},
 {t:"ul",x:[
  "Un **permission set** est un paquet de permissions prédéfini par Scaleway : `InstancesFullAccess`, `ObjectStorageReadOnly`, `KubernetesFullAccess`, `IAMManager`, `BillingReadOnly`, `AllProductsFullAccess`…",
  "Le modèle est **allow-only** : il n'y a pas de `Deny` explicite comme dans une policy AWS. On accorde, on n'interdit pas.",
  "Les droits sont **cumulatifs** : union de toutes les policies qui touchent le principal, directement ou via ses groups."
 ]},
 {t:"note",k:"exam",b:"Comparaison AWS attendue",x:"« Le modèle Scaleway est plus simple qu'IAM AWS : pas de JSON policy language avec `Effect: Deny`, pas de conditions. On attache des **permission sets** prédéfinis à un principal sur un **scope de projects**. C'est moins expressif mais beaucoup moins facile à casser. »"},
 {t:"h",x:"API keys : access key & secret key"},
 {t:"table",head:["Élément","Format","Usage"],rows:[
  ["**Access key**","<code>SCWXXXXXXXXXXXXXXXXX</code>","Identifiant public de la clé. Utilisé pour l'authentification **S3 / Object Storage** (signature AWS SigV4)."],
  ["**Secret key**","un UUID","Le secret. Envoyé dans le header <code>X-Auth-Token</code> pour l'API Scaleway, et comme secret key S3."],
  ["**Preferred project**","<code>project_id</code>","Project utilisé par défaut quand la requête n'en précise pas."]
 ]},
 {t:"note",k:"warn",b:"La secret key n'est affichée qu'une fois",x:"À la création (console ou API), la **secret key** n'est retournée qu'une seule fois. Si elle est perdue, on ne la récupère pas : on révoque la clé et on en crée une nouvelle. Les rotations doivent donc être scriptées."},
 {t:"code",lang:"bash",cap:"créer une identité machine propre",x:`# 1. une application dédiée au service
scw iam application create name=ci-runner \\
  description="GitHub Actions deploy"

# 2. une policy la plus étroite possible
scw iam policy create name=ci-runner-staging \\
  application-id=$APP_ID \\
  rules.0.permission-set-names.0=ContainerRegistryFullAccess \\
  rules.0.permission-set-names.1=ServerlessContainersFullAccess \\
  rules.0.project-ids.0=$STAGING_PROJECT_ID

# 3. la clé d API (secret affiché UNE seule fois)
scw iam api-key create application-id=$APP_ID \\
  description="gha runner" \\
  default-project-id=$STAGING_PROJECT_ID`},
 {t:"h",x:"Bonnes pratiques à réciter"},
 {t:"ul",x:[
  "**Une application par service**, jamais une clé humaine partagée dans une CI.",
  "**Least privilege** : les permission sets strictement nécessaires, scopés à un seul project.",
  "**Rotation** des clés, et révocation immédiate au départ d'un collaborateur.",
  "**Jamais de clé dans le repo** : variables d'environnement, GitHub/GitLab secrets, ou **Secret Manager**.",
  "**MFA obligatoire** sur les users de la console.",
  "**Audit Trail** activé pour tracer qui a fait quoi (qui a supprimé le bucket de prod à 3 h du matin).",
  "Le fichier `~/.config/scw/config.yaml` du CLI contient la secret key **en clair** : droits `600`, jamais commité, jamais dans une image Docker."
 ]},
 {t:"h",x:"Secret Manager & Key Manager"},
 {t:"cards",x:[
  {i:"🗝️",t:"Secret Manager",d:"Stocke et versionne des secrets (mots de passe, tokens, certificats). Accès par IAM, versions, révocation, intégration CLI/SDK.",tag:"REGIONAL",tc:"r"},
  {i:"🔏",t:"Key Manager (KMS)",d:"Gère des clés de chiffrement pour du encrypt/decrypt et de la data key generation côté application.",tag:"REGIONAL",tc:"r"},
  {i:"📜",t:"Audit Trail",d:"Journal des événements de l'Organization : création, modification, suppression de ressources, par qui et quand.",tag:"REGIONAL",tc:"r"}
 ]},
 {t:"note",k:"bad",b:"Réponse éliminatoire",x:"Dire qu'on met la secret key « dans le code, mais dans un fichier `config.js` qui n'est pas versionné ». On attend : variable d'environnement injectée par la plateforme, ou Secret Manager, avec rotation."}
]});

MODULES.push({
id:"compute", icon:"🖥️", title:"Compute : Instances & bare metal",
lead:"Le socle. Gammes d'Instances, volumes, images, security groups, cloud-init, et bare metal quand il faut du dédié.",
blocks:[
 {t:"h",x:"Les gammes d'Instances"},
 {t:"p",x:"Scaleway nomme ses Instances par **gamme + taille**, par exemple `DEV1-S`, `PRO2-M`, `POP2-HC-4C-16G`. Il n'est pas nécessaire de connaître le catalogue par cœur, mais il faut savoir **classer les familles**."},
 {t:"table",head:["Famille","Type","Pour quoi"],rows:[
  ["**Cost-Optimized** (ex. DEV1, PLAY2)","vCPU partagés","Dev, test, petits services, charges irrégulières. Le moins cher."],
  ["**General Purpose** (ex. GP1, POP2)","vCPU dédiés","Applications de production équilibrées CPU/RAM."],
  ["**Production-Optimized** (ex. PRO2, POP2-HC/HM)","vCPU dédiés, ratios spécialisés","Compute-intensive (HC = high CPU) ou memory-intensive (HM = high memory)."],
  ["**GPU** (ex. L4, L40S, H100)","GPU NVIDIA","Inference, training, rendu, transcodage."],
  ["**ARM** (ex. COPARM1)","CPU Ampere ARM64","Workloads compatibles ARM, meilleur rapport perf/prix/watt."]
 ]},
 {t:"note",k:"info",b:"Le catalogue bouge",x:"Les noms de gammes évoluent régulièrement (POP2 a succédé à GP1/PRO2 sur plusieurs zones). En entretien, parle en **familles** (cost-optimized / general purpose / production-optimized / GPU / ARM) et précise que tu vérifies le catalogue avec `scw instance server-type list zone=fr-par-1`."},
 {t:"h",x:"Volumes : local vs block"},
 {t:"table",head:["Type","Caractéristique","Conséquence"],rows:[
  ["**Local storage** (l_ssd)","SSD physiquement attaché à l'hyperviseur","Très rapide, mais la taille est liée au type d'Instance et le volume **ne survit pas** à un changement d'Instance"],
  ["**Block Storage** (b_ssd / SBS)","Volume réseau, 5 000 ou 15 000 IOPS","Détachable, redimensionnable à chaud, snapshot-able, survit à la suppression de l'Instance"],
  ["**Snapshot**","Copie ponctuelle d'un volume","Base pour créer une **image** réutilisable"],
  ["**Image**","Modèle de démarrage (OS + volumes)","Images officielles (`ubuntu_jammy`, `debian_bookworm`…) ou custom"]
 ]},
 {t:"note",k:"warn",b:"Piège",x:"Un **Block Storage volume détaché continue d'être facturé**. Idem pour les snapshots et les flexible IP réservées mais non attachées."},
 {t:"h",x:"Réseau d'une Instance"},
 {t:"ul",x:[
  "**Flexible IP** : IP publique réservable, détachable et réattachable à une autre Instance (utile pour un failover manuel). IPv4 payante, IPv6 fournie en /64.",
  "**Security Group** : firewall stateful au niveau de l'Instance, règles inbound/outbound, politique par défaut accept ou drop. C'est l'équivalent des security groups AWS.",
  "**Private Network** : interface L2 privée, rattachée au **VPC** régional, pour faire communiquer les ressources sans passer par Internet.",
  "**Placement Group** : contrainte d'ordonnancement — `max_availability` pour forcer des hyperviseurs différents (anti-affinity), `low_latency` pour les rapprocher."
 ]},
 {t:"h",x:"Cycle de vie & cloud-init"},
 {t:"code",lang:"bash",cap:"cycle de vie complet en CLI",x:`# créer, avec IP publique et 20 Go de block storage
scw instance server create \\
  type=DEV1-S \\
  image=ubuntu_jammy \\
  name=web-01 \\
  zone=fr-par-1 \\
  ip=new \\
  root-volume=block:20GB \\
  tags.0=env=staging

# injecter du cloud-init (user data)
scw instance user-data set server-id=$ID key=cloud-init \\
  content=@./cloud-init.yaml zone=fr-par-1

scw instance server start  $ID zone=fr-par-1 --wait
scw instance server stop   $ID zone=fr-par-1 --wait
# supprimer PROPREMENT : serveur + IP + volumes
scw instance server terminate $ID zone=fr-par-1 \\
  with-ip=true with-volumes=all`},
 {t:"note",k:"info",b:"States",x:"Une Instance passe par `starting` → `running` → `stopping` → `stopped`. L'API est **asynchrone** : la réponse de création arrive avant que la machine soit prête. D'où le flag `--wait` du CLI, ou du polling côté API."},
 {t:"h",x:"Au-delà des Instances"},
 {t:"cards",x:[
  {i:"⚙️",t:"Elastic Metal",d:"Serveurs bare metal provisionnés à la demande, facturés à l'heure, pilotables par API. Pour l'isolation totale, la licence liée au CPU, ou la performance brute.",tag:"ZONAL",tc:"z"},
  {i:"🗄️",t:"Dedibox",d:"Serveurs dédiés historiques, engagement mensuel, moins élastiques mais très bon rapport prix/performance.",tag:"DEDICATED",tc:""},
  {i:"🍎",t:"Apple silicon",d:"Mac mini M1/M2/M4 à l'heure, pour builder et signer des applications iOS/macOS en CI.",tag:"ZONAL",tc:"z"},
  {i:"🧠",t:"GPU Instances",d:"L4, L40S, H100… pour l'inference et le training, avec images pré-installées CUDA/Docker.",tag:"ZONAL",tc:"z"}
 ]},
 {t:"note",k:"exam",b:"Question fréquente",x:"« Instance vs Elastic Metal ? » → « Une **Instance** est une VM sur hyperviseur mutualisé, provisionnée en secondes, avec volumes réseau. **Elastic Metal** est un serveur physique dédié, provisionné en quelques minutes, sans voisin bruyant, facturé à l'heure et piloté par la même API. Je prends de l'Elastic Metal pour de la virtualisation imbriquée, des contraintes de licence CPU ou des I/O extrêmes. »"}
]});
MODULES.push({
id:"serverless", icon:"⚡", title:"Serverless : Functions, Containers, Jobs",
lead:"Le terrain préféré des recruteurs pour un profil développeur : trois produits, trois usages, et un scale-to-zero qui change le modèle de coût.",
blocks:[
 {t:"cards",x:[
  {i:"λ",t:"Serverless Functions",d:"Tu fournis du code (Node, Python, Go, PHP, Rust) et un handler. Scaleway builde et exécute. Équivalent AWS Lambda.",tag:"REGIONAL",tc:"r"},
  {i:"📦",t:"Serverless Containers",d:"Tu fournis une image OCI depuis le Container Registry. N'importe quel langage, n'importe quelle stack. Équivalent Cloud Run.",tag:"REGIONAL",tc:"r"},
  {i:"⏱️",t:"Serverless Jobs",d:"Exécution batch qui tourne jusqu'à la fin puis s'arrête. Cron, ETL, migrations. Pas de serveur HTTP.",tag:"REGIONAL",tc:"r"}
 ]},
 {t:"h",x:"Le vocabulaire commun"},
 {t:"table",head:["Notion","Ce que c'est"],rows:[
  ["**Namespace**","Le conteneur logique d'un ensemble de functions ou de containers. Porte les variables d'environnement et les secrets communs, et le registry associé."],
  ["**min-scale / max-scale**","Nombre minimum et maximum d'instances. <code>min-scale=0</code> = <strong>scale to zero</strong> : tu ne paies plus rien mais tu subis un <strong>cold start</strong>. <code>min-scale=1</code> supprime le cold start mais facture en permanence."],
  ["**Concurrency**","Nombre de requêtes traitées simultanément par une instance. C'est le déclencheur du scaling horizontal."],
  ["**Memory limit**","De 128 Mo à plusieurs Go. Le CPU alloué est <strong>proportionnel</strong> à la mémoire choisie."],
  ["**Timeout**","Durée maximale d'une invocation."],
  ["**Privacy**","<code>public</code> (endpoint ouvert) ou <code>private</code> (nécessite un token IAM dans l'appel)."],
  ["**Trigger**","Ce qui déclenche l'exécution : HTTP (par défaut), <strong>CRON</strong>, ou message NATS / SQS."]
 ]},
 {t:"note",k:"exam",b:"Function vs Container : la réponse qui marque des points",x:"« Une **Function** part de mon code source, Scaleway construit l'image pour moi : c'est plus rapide à mettre en place mais je suis limité aux runtimes supportés. Un **Container** part d'une image que je maîtrise entièrement : dépendances système, binaires, n'importe quel langage. Dès que j'ai besoin d'une lib native ou d'un runtime non supporté, je passe en Container. Les deux scalent à zéro et sont facturés à la requête et au GB-seconde. »"},
 {t:"code",lang:"bash",cap:"déployer un Serverless Container",x:`# 1. namespace
scw container namespace create name=api-prod region=fr-par

# 2. le container pointe vers une image du registry
scw container container create \\
  namespace-id=$NS_ID \\
  name=orders-api \\
  registry-image=rg.fr-par.scw.cloud/api-prod/orders:1.4.2 \\
  port=8080 \\
  min-scale=0 max-scale=10 \\
  memory-limit=512 \\
  max-concurrency=40 \\
  privacy=public \\
  environment-variables.LOG_LEVEL=info \\
  secret-environment-variables.0.key=DB_PASSWORD \\
  secret-environment-variables.0.value=$DB_PASSWORD

# 3. déploiement effectif
scw container container deploy $CONTAINER_ID --wait`},
 {t:"h",x:"Cold start : la question piège"},
 {t:"ul",x:[
  "Avec `min-scale=0`, la première requête après une période d'inactivité doit démarrer une instance : c'est le **cold start** (de quelques centaines de ms à quelques secondes selon l'image).",
  "Mitigations : `min-scale=1` (on paie une instance en permanence), **image la plus légère possible**, éviter les initialisations lourdes hors du handler, et un **CRON trigger** de keep-alive (bricolage, mais ça se dit).",
  "Un `max-scale` trop élevé sur une base de données mal dimensionnée = **connection storm**. Réponse attendue : pooling ou proxy de connexions, et un `max-scale` cohérent avec `max_connections`."
 ]},
 {t:"h",x:"Serverless Jobs"},
 {t:"p",x:"On définit une **job definition** (image, CPU, RAM, timeout, variables, éventuellement un cron) puis on déclenche des **job runs**. Chaque run a un état : `queued`, `running`, `succeeded`, `failed`."},
 {t:"code",lang:"bash",cap:"job batch planifié",x:`scw jobs definition create \\
  name=nightly-etl \\
  image-uri=rg.fr-par.scw.cloud/data/etl:latest \\
  cpu-limit=1000 memory-limit=2048 \\
  job-timeout=3600s \\
  cron.schedule="0 3 * * *" cron.timezone=Europe/Paris

scw jobs definition start $DEF_ID     # lancement manuel
scw jobs run list definition-id=$DEF_ID`},
 {t:"note",k:"info",b:"Comment choisir",x:"Requête HTTP courte et code simple → **Function**. Application web/API complète, stack maîtrisée → **Container**. Traitement qui tourne puis se termine (ETL, migration, batch nocturne) → **Job**. Charge permanente et prévisible → une **Instance** ou **Kapsule** coûte souvent moins cher que du serverless."}
]});

MODULES.push({
id:"k8s", icon:"☸️", title:"Kubernetes & Container Registry",
lead:"Kapsule, Kosmos, le registry privé, et l'intégration native avec le Load Balancer et le Block Storage.",
blocks:[
 {t:"cards",x:[
  {i:"☸️",t:"Kapsule",d:"Kubernetes managé : Scaleway gère le control plane, les nodes sont des Instances Scaleway dans tes pools.",tag:"REGIONAL",tc:"r"},
  {i:"🌍",t:"Kosmos",d:"Kubernetes managé multi-cloud : le control plane est chez Scaleway, mais les nodes peuvent être n'importe où (autre cloud, on-premise).",tag:"MULTI-CLOUD",tc:"g"},
  {i:"🗃️",t:"Container Registry",d:"Registry OCI privé ou public, endpoint rg.<region>.scw.cloud, namespaces, quotas et scan d'images.",tag:"REGIONAL",tc:"r"}
 ]},
 {t:"h",x:"Anatomie d'un cluster Kapsule"},
 {t:"ul",x:[
  "**Control plane managé** : API server, etcd, scheduler gérés par Scaleway. Offres avec ou sans SLA de haute disponibilité.",
  "**Pools** : groupes de nodes homogènes (même type d'Instance, même zone). On peut avoir plusieurs pools dans un cluster, dont des pools GPU.",
  "**Autoscaling** : `min-size` / `max-size` par pool, piloté par le cluster-autoscaler.",
  "**Autohealing** : un node en `NotReady` est automatiquement remplacé.",
  "**CNI** : Cilium par défaut (également Calico/Flannel selon les versions).",
  "**CSI** : le driver Scaleway crée automatiquement un **Block Storage** volume quand tu crées un PersistentVolumeClaim.",
  "**CCM** (Cloud Controller Manager) : un `Service type=LoadBalancer` provisionne automatiquement un **Load Balancer Scaleway**, configurable par annotations.",
  "**Upgrade** : montée de version du control plane puis des pools, avec une **maintenance window** configurable."
 ]},
 {t:"code",lang:"bash",cap:"cluster + kubeconfig en 3 commandes",x:`scw k8s cluster create \\
  name=prod-cluster \\
  version=1.31 \\
  cni=cilium \\
  region=fr-par \\
  pools.0.name=default \\
  pools.0.node-type=PRO2-XXS \\
  pools.0.size=3 \\
  pools.0.min-size=3 pools.0.max-size=8 \\
  pools.0.autoscaling=true \\
  pools.0.autohealing=true \\
  pools.0.zone=fr-par-1

# fusionne le kubeconfig dans ~/.kube/config
scw k8s kubeconfig install $CLUSTER_ID

kubectl get nodes`},
 {t:"note",k:"exam",b:"Kapsule vs Kosmos",x:"« **Kapsule** = control plane managé + nodes Scaleway, c'est le cas standard. **Kosmos** = control plane managé Scaleway mais nodes hétérogènes, y compris chez un autre provider ou on-premise. Kosmos sert aux stratégies multi-cloud ou hybrides ; en contrepartie les intégrations natives (LoadBalancer, CSI Block) ne s'appliquent qu'aux nodes Scaleway. »"},
 {t:"h",x:"Container Registry"},
 {t:"code",lang:"bash",cap:"push d'une image",x:`scw registry namespace create name=api-prod is-public=false region=fr-par

# login : l utilisateur est litteralement "nologin", le mot de passe est la secret key
docker login rg.fr-par.scw.cloud -u nologin --password-stdin <<< "$SCW_SECRET_KEY"

docker build -t rg.fr-par.scw.cloud/api-prod/orders:1.4.2 .
docker push  rg.fr-par.scw.cloud/api-prod/orders:1.4.2`},
 {t:"note",k:"info",b:"Détail qui fait mouche",x:"Le login Docker du Container Registry utilise le username littéral `nologin` et la **secret key** comme mot de passe. Pour qu'un cluster Kapsule tire une image d'un namespace **privé**, il faut un `imagePullSecret` de type `docker-registry` construit avec ces mêmes identifiants (ou rendre le namespace public)."},
 {t:"h",x:"Exposer une application"},
 {t:"code",lang:"yaml",cap:"Service LoadBalancer annoté",x:`apiVersion: v1
kind: Service
metadata:
  name: orders
  annotations:
    service.beta.kubernetes.io/scw-loadbalancer-use-hostname: "true"
    service.beta.kubernetes.io/scw-loadbalancer-protocol-http: "true"
spec:
  type: LoadBalancer   # provisionne un Load Balancer Scaleway
  selector: { app: orders }
  ports:
    - port: 80
      targetPort: 8080`},
 {t:"note",k:"warn",b:"Coût",x:"Chaque `Service type=LoadBalancer` crée **un** Load Balancer facturé. En production on met plutôt **un seul** Ingress Controller (nginx, Traefik) derrière un unique Load Balancer, et on route ensuite par Ingress."}
]});

MODULES.push({
id:"storage", icon:"🗄️", title:"Storage : Object, Block, File",
lead:"Object Storage compatible S3, Block Storage pour les Instances, et les classes de stockage qui font la différence sur la facture.",
blocks:[
 {t:"h",x:"Object Storage (S3-compatible)"},
 {t:"p",x:"C'est le produit le plus manipulé par un développeur. Il est **compatible avec l'API S3 d'AWS**, ce qui veut dire que tous les SDK et outils existants fonctionnent : `aws-cli`, `boto3`, `rclone`, `s3cmd`, `mc`, `@aws-sdk/client-s3`."},
 {t:"table",head:["Élément","Valeur"],rows:[
  ["Endpoint","<code>https://s3.fr-par.scw.cloud</code> — également <code>s3.nl-ams.scw.cloud</code>, <code>s3.pl-waw.scw.cloud</code>"],
  ["Endpoint d'un bucket","<code>https://mon-bucket.s3.fr-par.scw.cloud</code> (virtual-hosted) ou path-style"],
  ["Authentification","<strong>AWS Signature V4</strong> avec access key + secret key — <strong>pas</strong> le header <code>X-Auth-Token</code>"],
  ["Region S3","le nom de la region Scaleway : <code>fr-par</code>"],
  ["Scope","<strong>Regional</strong> : un bucket appartient à une region, son nom est unique dans cette region"]
 ]},
 {t:"note",k:"exam",b:"Piège d'entretien très courant",x:"« Comment s'authentifie-t-on sur l'Object Storage ? » La bonne réponse n'est **pas** `X-Auth-Token`. L'Object Storage suit le protocole S3, donc **SigV4** avec l'access key et la secret key. Le `X-Auth-Token` sert pour toutes les **autres** APIs Scaleway."},
 {t:"code",lang:"bash",cap:"aws-cli sur Scaleway",x:`# le CLI genere la configuration pour toi
scw object config install type=aws-cli

# puis c est du S3 standard
aws s3 ls --endpoint-url https://s3.fr-par.scw.cloud
aws s3 cp ./build s3://mon-bucket/site --recursive \\
  --endpoint-url https://s3.fr-par.scw.cloud

# URL pre-signee valable 1 h
aws s3 presign s3://mon-bucket/rapport.pdf --expires-in 3600 \\
  --endpoint-url https://s3.fr-par.scw.cloud`},
 {t:"h",x:"Classes de stockage"},
 {t:"table",head:["Classe","Usage","À savoir"],rows:[
  ["<code>STANDARD</code> (Multi-AZ)","Données chaudes, accès fréquent","Répliqué sur plusieurs AZ de la region"],
  ["<code>ONEZONE_IA</code>","Accès peu fréquent","Moins cher au Go, stocké dans une seule AZ, coût de récupération"],
  ["<code>GLACIER</code>","Archivage long terme","Le moins cher, mais <strong>restauration différée</strong> (plusieurs heures) avant de pouvoir lire l'objet"]
 ]},
 {t:"h",x:"Fonctionnalités à connaître"},
 {t:"ul",x:[
  "**Versioning** : conserve les versions successives d'un objet, protège des suppressions accidentelles.",
  "**Lifecycle rules** : transition automatique STANDARD → ONEZONE_IA → GLACIER, ou expiration après N jours. Le levier n°1 d'optimisation de coût.",
  "**Bucket website** : héberger un site statique directement depuis un bucket.",
  "**CORS** : indispensable si un front appelle le bucket depuis un navigateur.",
  "**Bucket policy** : JSON de style S3 pour ouvrir/fermer l'accès, en complément de l'IAM Scaleway.",
  "**Pre-signed URL** : donner un accès temporaire à un objet privé sans distribuer de clé.",
  "**Multipart upload** : obligatoire au-delà de quelques Go, et bien plus robuste.",
  "**Edge Services** : mettre un CDN et un nom de domaine personnalisé devant un bucket."
 ]},
 {t:"note",k:"warn",b:"Coûts cachés",x:"Le stockage n'est pas le seul poste : le **trafic sortant (egress)** et les **requêtes** sont facturés, et GLACIER facture la **restauration**. Une lifecycle rule mal réglée qui fait des allers-retours de classe peut coûter plus cher que de ne rien faire."},
 {t:"h",x:"Block Storage & File Storage"},
 {t:"cards",x:[
  {i:"💽",t:"Block Storage",d:"Volumes réseau attachés à une Instance. Paliers 5 000 et 15 000 IOPS, redimensionnables à chaud, snapshots. Un volume est attaché à une seule Instance.",tag:"ZONAL",tc:"z"},
  {i:"📁",t:"File Storage",d:"Partage NFS accessible simultanément par plusieurs Instances. Pour les cas où plusieurs machines doivent écrire dans le même répertoire.",tag:"ZONAL",tc:"z"},
  {i:"📸",t:"Snapshots & Images",d:"Snapshot = copie d'un volume. Image = modèle de démarrage complet, base pour du golden image / autoscaling.",tag:"ZONAL",tc:"z"},
  {i:"🧊",t:"Glacier",d:"Classe d'archivage de l'Object Storage, pas un produit séparé. Restauration différée avant lecture.",tag:"REGIONAL",tc:"r"}
 ]},
 {t:"note",k:"exam",b:"Object vs Block : formulation courte",x:"« **Block Storage** = un disque, attaché à **une** machine, on y met un système de fichiers, latence faible, idéal pour une base de données. **Object Storage** = une API HTTP, accès concurrent illimité, scalabilité quasi infinie, idéal pour des assets, des backups et de la data. On ne fait pas tourner une base de données sur de l'Object Storage. »"}
]});
MODULES.push({
id:"network", icon:"🌐", title:"Network : VPC, Load Balancer, Edge",
lead:"VPC régional, Private Networks, Public Gateway, Load Balancer et Edge Services : de quoi dessiner une architecture au tableau blanc.",
blocks:[
 {t:"h",x:"VPC & Private Networks"},
 {t:"ul",x:[
  "Un **VPC** est **régional** : un VPC par region et par project (un `default` est créé automatiquement).",
  "Un **Private Network** est un réseau privé **régional** à l'intérieur du VPC. Les ressources qui y sont attachées communiquent en privé, **entre AZ de la même region**.",
  "**IPAM** gère l'attribution des adresses privées (CIDR par Private Network, réservations, adresses statiques).",
  "Le **routing VPC** permet de faire communiquer plusieurs Private Networks d'un même VPC.",
  "Peuvent être attachés à un Private Network : Instances, Elastic Metal, Load Balancers, Managed Databases, Kapsule, Public Gateways."
 ]},
 {t:"note",k:"warn",b:"Évolution importante",x:"Historiquement les Private Networks étaient **zonaux** avec un DHCP porté par le Public Gateway. Depuis **VPC v2**, ils sont **régionaux** et l'adressage est géré par **IPAM**. Si un recruteur mentionne le DHCP du Public Gateway, tu sais qu'il parle de l'ancien modèle."},
 {t:"h",x:"Public Gateway"},
 {t:"p",x:"Une ressource sans IP publique, placée sur un Private Network, n'a pas d'accès Internet. Le **Public Gateway** fournit :"},
 {t:"ul",x:[
  "**NAT sortant** : les machines privées peuvent joindre Internet sans être exposées.",
  "**Port forwarding / static NAT** : exposer un port précis d'une machine privée.",
  "**SSH bastion** : un point d'entrée unique pour administrer les machines privées.",
  "(historiquement) **DHCP** et résolution DNS interne du Private Network."
 ]},
 {t:"h",x:"Load Balancer"},
 {t:"table",head:["Notion","Détail"],rows:[
  ["**Frontend**","Le point d'entrée : port d'écoute, certificat TLS, ACL."],
  ["**Backend**","Le pool de serveurs : protocole (TCP/HTTP), algorithme (round robin, least conn, first), sticky sessions."],
  ["**Health check**","TCP, HTTP, HTTPS ou custom. Un backend qui échoue est retiré de la rotation."],
  ["**ACL**","Filtrage par IP ou par règle HTTP, autorisation ou blocage avant de router vers le backend."],
  ["**Certificats**","Certificat **Let's Encrypt managé** (renouvellement automatique) ou certificat custom importé."],
  ["**Zonal vs Regional**","Un LB <strong>zonal</strong> vit dans une seule AZ. Un LB <strong>multi-AZ / regional</strong> survit à la perte d'une AZ : c'est ce qu'on veut en production."]
 ]},
 {t:"note",k:"exam",b:"Architecture HA à savoir dessiner",x:"Internet → **Load Balancer multi-AZ** (TLS Let's Encrypt) → Instances réparties sur `fr-par-1` et `fr-par-2` dans un **Private Network** → **Managed Database PostgreSQL en HA** joignable uniquement par son endpoint privé → **Public Gateway** pour le NAT sortant → **Object Storage** pour les assets, exposé via **Edge Services** → **Cockpit** pour les métriques et les logs."},
 {t:"h",x:"Edge Services, DNS, IP"},
 {t:"cards",x:[
  {i:"🛰️",t:"Edge Services",d:"CDN devant un bucket Object Storage ou un Load Balancer : cache, domaine personnalisé, certificat TLS managé.",tag:"REGIONAL",tc:"r"},
  {i:"🔤",t:"Domains & DNS",d:"Enregistrement de noms de domaine et DNS managé : zones, records A/AAAA/CNAME/MX/TXT, API complète.",tag:"GLOBAL",tc:"g"},
  {i:"📮",t:"Flexible IP",d:"IP publique réservable et déplaçable d'une Instance à une autre. IPv6 en /64 disponible.",tag:"ZONAL",tc:"z"},
  {i:"🔗",t:"Interlink",d:"Connexion privée dédiée entre un réseau on-premise et un VPC Scaleway, pour l'hybride.",tag:"REGIONAL",tc:"r"}
 ]},
 {t:"code",lang:"bash",cap:"private network + LB",x:`scw vpc private-network create name=back-net region=fr-par
scw instance private-nic create server-id=$ID \\
  private-network-id=$PN_ID zone=fr-par-1

scw lb lb create name=front type=LB-S \\
  zone=fr-par-1 assign-flexible-ip=true
scw lb backend create lb-id=$LB_ID name=web \\
  forward-protocol=http forward-port=8080 \\
  health-check-http.uri=/healthz \\
  server-ip.0=10.10.0.12 server-ip.1=10.10.0.13
scw lb frontend create lb-id=$LB_ID name=https \\
  inbound-port=443 backend-id=$BACKEND_ID`}
]});

MODULES.push({
id:"db", icon:"🐘", title:"Managed Databases & data",
lead:"PostgreSQL, MySQL, Redis, Serverless SQL, DocumentDB : ce que Scaleway gère à ta place et ce qui reste ta responsabilité.",
blocks:[
 {t:"cards",x:[
  {i:"🐘",t:"Managed DB (RDB)",d:"PostgreSQL et MySQL managés : backups automatiques, patchs, HA avec node standby, read replicas.",tag:"REGIONAL",tc:"r"},
  {i:"⚡",t:"Serverless SQL DB",d:"PostgreSQL compatible qui scale automatiquement et descend à zéro. Facturé à l'usage réel, idéal pour le dev et les charges intermittentes.",tag:"REGIONAL",tc:"r"},
  {i:"🧠",t:"Managed Redis",d:"Cache et store en mémoire managé, en cluster ou standalone.",tag:"ZONAL",tc:"z"},
  {i:"📄",t:"DocumentDB / MongoDB",d:"Base documentaire managée compatible MongoDB, pour les schémas souples.",tag:"REGIONAL",tc:"r"}
 ]},
 {t:"h",x:"Ce qu'il faut maîtriser sur RDB"},
 {t:"ul",x:[
  "**Node type** : le dimensionnement CPU/RAM de l'instance de base (`DB-DEV-S`, `DB-GP-S`…), redimensionnable.",
  "**High Availability** : un node **standby** synchrone dans une autre AZ, avec **basculement automatique**. C'est une option payante, pas le défaut.",
  "**Read replicas** : répliques en lecture seule pour décharger les requêtes analytiques. Attention au **replication lag**.",
  "**Backups automatiques** + backups manuels, avec durée de rétention configurable et restauration vers une nouvelle instance.",
  "**ACL / allowed IPs** : par défaut **rien n'est autorisé**. Il faut déclarer explicitement les CIDR qui peuvent se connecter à l'endpoint public.",
  "**Private Network endpoint** : la bonne pratique en production — la base n'a **aucune** IP publique et n'est joignable que depuis le VPC.",
  "**Users & databases** gérés par API : création d'un user applicatif avec des droits limités, plutôt que d'utiliser l'utilisateur admin.",
  "**Encryption at rest** et TLS en transit."
 ]},
 {t:"code",lang:"bash",cap:"base PostgreSQL HA, sans IP publique",x:`scw rdb instance create \\
  name=orders-db \\
  engine=PostgreSQL-15 \\
  node-type=DB-GP-S \\
  is-ha-cluster=true \\
  volume-type=bssd volume-size=100GB \\
  user-name=app_admin password=$PG_PASSWORD \\
  region=fr-par \\
  init-endpoints.0.private-network.private-network-id=$PN_ID

scw rdb database create instance-id=$DB_ID name=orders
scw rdb user create instance-id=$DB_ID name=orders_app password=$APP_PWD
scw rdb privilege set instance-id=$DB_ID \\
  database-name=orders user-name=orders_app permission=all`},
 {t:"note",k:"exam",b:"Question de responsabilité partagée",x:"« Qu'est-ce que Scaleway gère et qu'est-ce qui reste à ma charge ? » → « Scaleway gère l'infrastructure, l'installation, les patchs du moteur, les backups automatiques, le failover HA et la supervision matérielle. **Moi je reste responsable** du schéma, des index, des requêtes, du dimensionnement, des droits applicatifs et de **tester** mes restaurations. »"},
 {t:"note",k:"warn",b:"Piège",x:"Activer la HA **ne dispense pas** de sauvegardes : la HA protège d'une panne matérielle, **pas** d'un `DROP TABLE` malencontreux. Et un backup jamais restauré n'est pas un backup."},
 {t:"h",x:"Écosystème data"},
 {t:"ul",x:[
  "**Data Lab / Apache Spark** managé pour le traitement distribué.",
  "**Object Storage** comme data lake, requêtable par les outils de l'écosystème S3.",
  "**Cockpit** pour les métriques de la base (connexions, CPU, disque) et les alertes."
 ]}
]});

MODULES.push({
id:"integ", icon:"📡", title:"Messaging, Email, IA & Observabilité",
lead:"Les briques d'intégration qu'un développeur branche autour de son application, et la supervision qui va avec.",
blocks:[
 {t:"h",x:"Messaging & Queuing"},
 {t:"p",x:"Scaleway propose trois protocoles sous un même produit, avec des **credentials dédiés par protocole** :"},
 {t:"table",head:["Protocole","Modèle","Usage typique"],rows:[
  ["**NATS**","Pub/sub + JetStream (persistance)","Communication temps réel entre microservices, faible latence"],
  ["**SQS**","File de messages, compatible AWS SQS","Découplage producteur/consommateur, retry, dead-letter queue"],
  ["**SNS**","Pub/sub par topic, compatible AWS SNS","Fan-out d'un événement vers plusieurs abonnés"]
 ]},
 {t:"note",k:"info",b:"Bon argument",x:"La compatibilité **SQS/SNS** signifie que les SDK AWS (`boto3`, `@aws-sdk/client-sqs`) fonctionnent en changeant simplement l'endpoint. Combiné avec un **trigger** sur une Serverless Function ou un Container, on obtient un pipeline événementiel complet sans serveur."},
 {t:"h",x:"Transactional Email (TEM)"},
 {t:"ul",x:[
  "Envoi d'emails transactionnels par **API REST** ou **SMTP**.",
  "Il faut **vérifier le domaine** en publiant des enregistrements **SPF**, **DKIM** et idéalement **DMARC** dans le DNS.",
  "Suivi de la délivrabilité : statuts `sent`, `delivered`, `bounced`, webhooks, blocklist.",
  "Ce n'est pas un outil de campagne marketing : c'est du transactionnel (reset de mot de passe, facture, notification)."
 ]},
 {t:"h",x:"IA : Generative APIs & Managed Inference"},
 {t:"cards",x:[
  {i:"🤖",t:"Generative APIs",d:"Endpoint d'inference serverless compatible OpenAI (https://api.scaleway.ai/v1), facturé au token, sur des modèles open-weights hébergés en Europe.",tag:"SERVERLESS",tc:"g"},
  {i:"🖧",t:"Managed Inference",d:"Un modèle déployé sur des GPU dédiés, endpoint privé ou public, débit garanti et isolation.",tag:"DEDICATED",tc:"z"},
  {i:"🔎",t:"Embeddings & RAG",d:"Modèles d'embeddings servis par la même API, à combiner avec une base vectorielle (pgvector sur Managed PostgreSQL).",tag:"AI",tc:"r"}
 ]},
 {t:"code",lang:"bash",cap:"inference compatible OpenAI",x:`curl https://api.scaleway.ai/v1/chat/completions \\
  -H "Authorization: Bearer $SCW_SECRET_KEY" \\
  -H "Content-Type: application/json" \\
  -d '{
    "model": "llama-3.1-8b-instruct",
    "messages": [{"role":"user","content":"Explique le VPC Scaleway"}]
  }'`},
 {t:"h",x:"Cockpit : observabilité managée"},
 {t:"ul",x:[
  "**Cockpit** est la stack d'observabilité managée : **Grafana** pour la visualisation, **Prometheus/Mimir** pour les métriques, **Loki** pour les logs, **Tempo** pour les traces.",
  "Les produits Scaleway y poussent leurs métriques **automatiquement** (Instances, Kapsule, RDB, Load Balancer, Object Storage…).",
  "On peut y pousser ses **métriques et logs custom** via des **tokens** dédiés (push par remote write Prometheus, ou agent type Grafana Alloy / Promtail).",
  "**Alerting** : règles d'alerte et contacts de notification.",
  "**Grafana users** : on crée des utilisateurs Grafana avec un rôle viewer ou editor, distincts des users IAM."
 ]},
 {t:"note",k:"exam",b:"Phrase qui rassure un recruteur",x:"« Je n'installe pas ma propre stack Prometheus + Grafana sur une Instance : j'utilise **Cockpit**, je récupère les métriques produit gratuitement, et je pousse mes métriques applicatives avec un token de push. Les alertes partent vers l'équipe d'astreinte. »"}
]});

id:"cli", icon:"⌨️", title:"Scaleway CLI (scw)",
lead:"Installation, configuration, grammaire des commandes, formats de sortie et les astuces qui montrent que tu t'en sers vraiment.",
blocks:[
 {t:"h",x:"Installation & initialisation"},
 {t:"code",lang:"bash",cap:"install",x:`# macOS / Linux (Homebrew)
brew install scw

# Linux : binaire officiel
curl -o /usr/local/bin/scw -L \\
  "https://github.com/scaleway/scaleway-cli/releases/latest/download/scaleway-cli_linux_amd64"
chmod +x /usr/local/bin/scw

# Windows
winget install scaleway.scaleway-cli   # ou : choco install scaleway-cli

scw version
scw init          # assistant interactif : access key, secret key, project, zone`},
 {t:"p",x:"`scw init` écrit un fichier de configuration YAML — c'est **la** question suivante du recruteur."},
 {t:"code",lang:"yaml",cap:"~/.config/scw/config.yaml",x:`access_key: SCWXXXXXXXXXXXXXXXXX
secret_key: 11111111-1111-1111-1111-111111111111
default_organization_id: 22222222-2222-2222-2222-222222222222
default_project_id: 33333333-3333-3333-3333-333333333333
default_region: fr-par
default_zone: fr-par-1

profiles:
  staging:
    access_key: SCWYYYYYYYYYYYYYYYYY
    secret_key: 44444444-4444-4444-4444-444444444444
    default_project_id: 55555555-5555-5555-5555-555555555555
    default_zone: nl-ams-1`},
 {t:"note",k:"info",b:"Emplacement",x:"`~/.config/scw/config.yaml` sur Linux/macOS, `%USERPROFILE%\\.config\\scw\\config.yaml` sur Windows. Modifiable avec `SCW_CONFIG_PATH`."},
 {t:"h",x:"Profils & variables d'environnement"},
 {t:"code",lang:"bash",cap:"basculer d'environnement",x:`scw --profile staging instance server list
export SCW_PROFILE=staging          # ou via la variable d environnement
scw config profile activate staging # profil actif par defaut
scw config get default-zone
scw config set default-zone=nl-ams-1
scw config dump                     # affiche toute la configuration
scw info                            # config effective + origine de chaque valeur`},
 {t:"table",head:["Variable","Rôle"],rows:[
  ["<code>SCW_ACCESS_KEY</code> / <code>SCW_SECRET_KEY</code>","Les identifiants. Prioritaires sur le fichier de config."],
  ["<code>SCW_DEFAULT_PROJECT_ID</code>","Project par défaut des commandes."],
  ["<code>SCW_DEFAULT_ORGANIZATION_ID</code>","Organization par défaut."],
  ["<code>SCW_DEFAULT_REGION</code> / <code>SCW_DEFAULT_ZONE</code>","Scope géographique par défaut."],
  ["<code>SCW_PROFILE</code>","Profil actif."],
  ["<code>SCW_CONFIG_PATH</code>","Chemin du fichier de configuration."],
  ["<code>SCW_API_URL</code>","Surcharge de l'endpoint (tests, proxy)."]
 ]},
 {t:"note",k:"exam",b:"Ordre de précédence — question classique",x:"**Flags de la commande** > **variables d'environnement** > **profil actif du fichier de config** > **valeurs par défaut**. C'est exactement ce qui permet de faire tourner le même script en CI sans fichier de config : on injecte `SCW_ACCESS_KEY` et `SCW_SECRET_KEY` en variables d'environnement."},
 {t:"h",x:"La grammaire des commandes"},
 {t:"p",x:"Toute commande suit le même schéma : `scw <namespace> <resource> <verb> [args] [flags]`."},
 {t:"code",lang:"bash",cap:"anatomie",x:`scw   instance   server   list      zone=fr-par-1   -o json
      ^^^^^^^^   ^^^^^^   ^^^^      ^^^^^^^^^^^^^   ^^^^^^^
      namespace  resource verbe     argument         flag

# les arguments sont en cle=valeur (PAS --cle valeur)
scw instance server create type=DEV1-S image=ubuntu_jammy name=web-01

# les listes utilisent un index
scw instance server create tags.0=env=prod tags.1=team=api

# les objets imbriques utilisent un point
scw rdb instance create init-endpoints.0.private-network.private-network-id=$PN

# @fichier pour injecter un contenu
scw instance user-data set key=cloud-init content=@init.yaml server-id=$ID`},
 {t:"note",k:"warn",b:"Détail qui trahit un débutant",x:"Dans le CLI Scaleway, les **arguments** de ressource s'écrivent `cle=valeur` (sans tirets), alors que les **flags** globaux gardent la forme `--flag`. Écrire `scw instance server create --type DEV1-S` ne fonctionne pas."},
 {t:"h",x:"Formats de sortie"},
 {t:"code",lang:"bash",cap:"-o : le flag le plus utile",x:`scw instance server list -o human    # tableau lisible (defaut)
scw instance server list -o json     # pour jq et les scripts
scw instance server list -o yaml
scw instance server list -o wide     # plus de colonnes

# colonnes choisies
scw instance server list -o json | jq -r '.[] | "\\(.name) \\(.state) \\(.public_ip.address)"'

# template Go
scw instance server list -o template="{{ .Name }} -> {{ .State }}"`},
 {t:"h",x:"Les flags qui font la différence"},
 {t:"table",head:["Flag","Effet"],rows:[
  ["<code>-w</code> / <code>--wait</code>","Bloque jusqu'à ce que l'opération asynchrone soit terminée. Indispensable en script."],
  ["<code>-o</code>","Format de sortie : <code>human</code>, <code>json</code>, <code>yaml</code>, <code>wide</code>, <code>template=…</code>"],
  ["<code>-p</code> / <code>--profile</code>","Profil de configuration à utiliser"],
  ["<code>--debug</code>","Affiche les requêtes HTTP émises : parfait pour <strong>apprendre l'API</strong> à partir du CLI"],
  ["<code>-h</code> / <code>scw help</code>","Aide contextuelle sur n'importe quel niveau de commande"]
 ]},
 {t:"note",k:"exam",b:"Astuce à raconter",x:"« Quand je ne connais pas un endpoint de l'API, je lance la commande CLI équivalente avec `--debug` : je vois la **méthode**, l'**URL** et le **body** exacts. C'est ma façon la plus rapide de découvrir l'API. »"},
 {t:"h",x:"Confort & intégrations"},
 {t:"code",lang:"bash",cap:"autocomplete et outils S3",x:`scw autocomplete install        # bash, zsh, fish

MODULES.push({
id:"api", icon:"🔌", title:"L'API REST Scaleway",
lead:"Structure des URLs, authentification, pagination, filtres, erreurs, asynchronisme et SDK. Le cœur d'un entretien de développeur.",
blocks:[
 {t:"h",x:"Structure des endpoints"},
 {t:"p",x:"Tout part de `https://api.scaleway.com`, puis le chemin encode le **produit**, la **version** et le **scope**."},
 {t:"code",lang:"http",cap:"3 scopes, 3 formes d'URL",x:`# ZONAL   : /<produit>/<version>/zones/<zone>/<ressource>
GET https://api.scaleway.com/instance/v1/zones/fr-par-1/servers

# REGIONAL: /<produit>/<version>/regions/<region>/<ressource>
GET https://api.scaleway.com/rdb/v1/regions/fr-par/instances
GET https://api.scaleway.com/k8s/v1/regions/fr-par/clusters

# GLOBAL  : /<produit>/<version>/<ressource>
GET https://api.scaleway.com/iam/v1alpha1/users
GET https://api.scaleway.com/account/v3/projects`},
 {t:"note",k:"info",b:"Versions",x:"On croise `v1`, `v2`, `v1alpha1`, `v1beta1`. Les suffixes `alpha`/`beta` signalent une API encore susceptible de changer : à mentionner comme un point de vigilance si on l'utilise en production."},
 {t:"h",x:"Authentification"},
 {t:"code",lang:"bash",cap:"le header à retenir",x:`curl -H "X-Auth-Token: $SCW_SECRET_KEY" \\
     https://api.scaleway.com/instance/v1/zones/fr-par-1/servers`},
 {t:"table",head:["API","Authentification"],rows:[
  ["Toutes les APIs Scaleway","Header <code>X-Auth-Token: &lt;secret_key&gt;</code>"],
  ["Object Storage (S3)","<strong>AWS Signature V4</strong> : access key + secret key, comme sur S3"],
  ["Generative APIs (IA)","<code>Authorization: Bearer &lt;secret_key&gt;</code> (compatibilité OpenAI)"]
 ]},
 {t:"note",k:"warn",b:"Erreur fréquente",x:"Envoyer l'**access key** dans `X-Auth-Token`. Le header attend la **secret key**. L'access key ne sert qu'à identifier la clé (et à signer les requêtes S3)."},
 {t:"h",x:"Pagination, tri et filtres"},
 {t:"code",lang:"http",cap:"pagination",x:`GET /instance/v1/zones/fr-par-1/servers?page=2&per_page=50
GET /instance/v1/zones/fr-par-1/servers?name=web&state=running
GET /rdb/v1/regions/fr-par/instances?order_by=created_at_desc

Reponse :
{
  "servers": [ ... ],
  "total_count": 137
}`},
 {t:"ul",x:[
  "`page` commence à **1** (pas à 0), `per_page` est plafonné (souvent **100**).",
  "La réponse contient `total_count` : c'est ce qui permet de savoir combien de pages parcourir.",
  "Les filtres sont des **query params** simples (`name`, `state`, `tags`, `project_id`…), pas un langage de requête.",
  "`order_by` accepte des valeurs comme `created_at_asc` / `created_at_desc`.",
  "Les **SDK officiels** proposent des helpers qui itèrent automatiquement sur les pages : c'est ce qu'on utilise en vrai."
 ]},
 {t:"h",x:"Gestion des erreurs"},
 {t:"code",lang:"json",cap:"corps d'erreur typique",x:`{
  "type": "invalid_arguments",
  "message": "invalid argument(s)",
  "details": [
    { "argument": "volumes.0.size", "reason": "constraint", "help_message": "must be a multiple of 1GB" }
  ]
}`},
 {t:"table",head:["Code","Signification","Réflexe"],rows:[
  ["<code>400</code>","<code>invalid_arguments</code> — payload invalide","Lire <code>details</code>, corriger le champ"],
  ["<code>401</code>","<code>unauthenticated</code> — token absent ou invalide","Vérifier <code>X-Auth-Token</code> (secret key, pas access key)"],
  ["<code>403</code>","<code>permissions_denied</code> — authentifié mais pas autorisé","Ajouter le bon permission set sur le bon project"],
  ["<code>404</code>","<code>not_found</code>","Mauvais ID, ou <strong>mauvaise zone/region</strong> dans l'URL"],
  ["<code>409</code>","Conflit / ressource dans un état incompatible","Attendre la fin de l'opération en cours puis réessayer"],
  ["<code>412</code>","<code>precondition_failed</code>","Une dépendance manque (volume attaché, IP utilisée…)"],
  ["<code>429</code>","Rate limit / quota dépassé","<strong>Backoff exponentiel</strong> avec jitter, ou demande d'augmentation de quota"],
  ["<code>5xx</code>","Erreur côté plateforme","Retry idempotent avec backoff"]
 ]},
 {t:"note",k:"exam",b:"Le 404 qui n'en est pas un",x:"Un `404` alors que la ressource existe bien est presque toujours une **erreur de scope** : on interroge `fr-par-1` alors que la ressource est dans `fr-par-2`, ou on tape l'URL régionale d'un produit zonal. C'est une excellente réponse à « racontez-moi un bug d'intégration API »."},
 {t:"h",x:"Asynchronisme"},
 {t:"p",x:"La plupart des créations sont **asynchrones** : l'API répond `200/201` immédiatement avec un objet dont le champ `state` (ou `status`) vaut par exemple `starting`, `provisioning`, `creating`. La ressource n'est pas encore utilisable."},
 {t:"code",lang:"bash",cap:"polling propre",x:`# 1. creation : retour immediat
ID=$(curl -s -X POST -H "X-Auth-Token: $SCW_SECRET_KEY" \\
  -H "Content-Type: application/json" \\
  -d '{"name":"web-01","commercial_type":"DEV1-S","image":"ubuntu_jammy","project":"'$PROJECT_ID'"}' \\
  https://api.scaleway.com/instance/v1/zones/fr-par-1/servers | jq -r .server.id)

# 2. polling avec backoff jusqu a l etat cible
until [ "$(curl -s -H "X-Auth-Token: $SCW_SECRET_KEY" \\
  https://api.scaleway.com/instance/v1/zones/fr-par-1/servers/$ID | jq -r .server.state)" = "running" ]; do
  sleep 5
done`},
 {t:"note",k:"info",b:"En pratique",x:"On ne réécrit pas ce polling à la main : les **SDK** exposent des `WaitForServer(...)` / `wait_for_*`, et le CLI expose `--wait`. Le savoir montre qu'on a compris que l'API est asynchrone."},
 {t:"h",x:"SDK & Infrastructure as Code"},
 {t:"cards",x:[
  {i:"🐹",t:"SDK Go",d:"scaleway-sdk-go — le plus complet, c'est celui qui alimente le CLI et le provider Terraform.",tag:"OFFICIEL",tc:"g"},
  {i:"🐍",t:"SDK Python",d:"scaleway-sdk-python, versions sync et async, générée depuis les specs de l'API.",tag:"OFFICIEL",tc:"g"},
  {i:"🟨",t:"SDK JS/TS",d:"@scaleway/sdk, typé, utilisable côté Node.",tag:"OFFICIEL",tc:"g"},
  {i:"🏗️",t:"Terraform / OpenTofu",d:"provider scaleway/scaleway : la référence pour décrire l'infra en IaC.",tag:"IaC",tc:"z"},
  {i:"🧩",t:"Pulumi / Ansible",d:"Pulumi pour l'IaC en langage généraliste, collection Ansible pour la config management.",tag:"IaC",tc:"z"},
  {i:"📐",t:"OpenAPI",d:"Les spécifications OpenAPI publiques permettent de générer un client dans n'importe quel langage.",tag:"SPEC",tc:"r"}
 ]},
 {t:"code",lang:"hcl",cap:"Terraform : le format attendu en entretien",x:`terraform {
  required_providers {
    scaleway = { source = "scaleway/scaleway", version = "~> 2.0" }
  }
}

provider "scaleway" {
  zone   = "fr-par-1"
  region = "fr-par"
  # access_key / secret_key / project_id via SCW_* env vars
}

resource "scaleway_vpc_private_network" "back" { name = "back-net" }

resource "scaleway_instance_server" "web" {
  count = 2
  name  = "web-0"
  type  = "DEV1-S"
  image = "ubuntu_jammy"
  zone  = count.index == 0 ? "fr-par-1" : "fr-par-2"

  private_network { pn_id = scaleway_vpc_private_network.back.id }
}`},
 {t:"code",lang:"python",cap:"SDK Python",x:`from scaleway import Client
from scaleway.instance.v1 import InstanceV1API

client = Client.from_config_file_and_env()   # lit ~/.config/scw/config.yaml puis les SCW_*
api = InstanceV1API(client)

res = api.list_servers(zone="fr-par-1", state="running")
for s in res.servers:
    print(s.id, s.name, s.public_ip.address if s.public_ip else "-")

srv = api.create_server(zone="fr-par-1", name="web-01",
                        commercial_type="DEV1-S", image="ubuntu_jammy")
api.wait_for_server(server_id=srv.server.id, zone="fr-par-1")`}
]});

                          |
                [ Edge Services / CDN ]  --> Object Storage (assets, front statique)
                          |
              [ Load Balancer multi-AZ + TLS ]
                          |
        +-----------------+------------------+
        |                                    |

     (fr-par-1)                      (fr-par-2)
        |                                    |
        +----------- Private Network --------+
                          |

  (endpoint prive uniquement)

 ]}
