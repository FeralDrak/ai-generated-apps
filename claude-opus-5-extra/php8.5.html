{cat:'Arrays', q:"Quelle est la différence entre array_merge($a, $b) et $a + $b ?",
 opts:["array_merge réindexe les clés numériques ; + conserve la valeur de gauche","Elles sont équivalentes","+ réindexe, array_merge non","+ ne fonctionne que sur les listes"],
 correct:0, why:"`array_merge()` réindexe les clés numériques et **écrase** les clés string avec la valeur de droite. L'opérateur `+` fait une union qui **garde la valeur de gauche** et ne réindexe rien."},

{cat:'Arrays', q:"Que faut-il faire après un array_filter() sur une liste destinée à json_encode() ?",
 opts:["Appeler array_values() pour réindexer","Rien, les clés sont déjà réindexées","Appeler array_merge()","Caster en (array)"],
 correct:0, why:"`array_filter()` **préserve les clés** : après filtrage, la liste a des trous et `json_encode()` produit alors un **objet** `{\"1\":…}` au lieu d'un tableau. `array_values()` corrige cela."},

{cat:'Arrays', q:"Après un foreach ($a as &$v), pourquoi écrire unset($v) ?",
 opts:["Parce que $v reste une référence sur le dernier élément et corrompt la boucle suivante","Pour libérer de la mémoire","Pour réindexer le tableau","Ce n'est jamais nécessaire"],
 correct:0, why:"Sans `unset($v)`, la variable reste une **référence** vers le dernier élément : un second `foreach` utilisant `$v` écrase silencieusement cette dernière case. C'est le bug PHP le plus classique."},

{cat:'Fonctions', q:"Quelle différence entre fn() => et function () use () ?",
 opts:["fn capture automatiquement par valeur et se limite à une expression","fn capture par référence","function ne peut pas retourner de valeur","fn est plus lente"],
 correct:0, why:"L'**arrow function** (7.4) capture automatiquement les variables du scope parent **par valeur** et n'accepte qu'une seule expression. La closure classique exige `use` et accepte plusieurs instructions et la capture par référence."},

{cat:'Fonctions', q:"Que produit strlen(...) en PHP 8.1+ ?",
 opts:["Un objet Closure","La chaîne 'strlen'","Un tableau callable","Une erreur de syntaxe"],
 correct:0, why:"C'est la **first-class callable syntax** : elle crée un objet `Closure`, équivalent typé et analysable de `Closure::fromCallable('strlen')`."},

{cat:'Sécurité', q:"Quelle est la parade de référence contre l'injection SQL ?",
 opts:["Les prepared statements avec ATTR_EMULATE_PREPARES => false","addslashes() sur chaque variable","htmlspecialchars() avant la requête","Échapper les guillemets manuellement"],
 correct:0, why:"Une **prepared statement** envoie la requête et les données séparément : les valeurs ne peuvent jamais être interprétées comme du SQL. Désactiver l'émulation garantit que c'est bien le serveur SQL qui prépare."},

{cat:'Sécurité', q:"Quelle fonction hacher un mot de passe en PHP ?",
 opts:["password_hash()","md5()","sha1()","crypt() avec un sel fixe"],
 correct:0, why:"`password_hash()` (avec `PASSWORD_ARGON2ID` ou `PASSWORD_BCRYPT`) génère un sel aléatoire et un hash lent. On vérifie avec `password_verify()` et on re-hash via `password_needs_rehash()`."},

{cat:'Sécurité', q:"Que faut-il faire juste après une authentification réussie ?",
 opts:["session_regenerate_id(true)","session_destroy()","session_write_close()","Rien de particulier"],
 correct:0, why:"Régénérer l'identifiant de session empêche la **session fixation** : un attaquant ayant imposé un ID avant login ne peut plus réutiliser la session authentifiée."},

{cat:'Sécurité', q:"Où faut-il échapper les données pour éviter une faille XSS ?",
 opts:["À la sortie, dans le contexte d'affichage","À l'entrée, avant stockage","Dans la base de données","Dans le fichier .htaccess"],
 correct:0, why:"L'échappement dépend du **contexte de sortie** (HTML, attribut, JS, URL). Nettoyer à l'entrée corrompt les données et ne protège pas les autres contextes. En pratique on laisse le moteur de template auto-échapper."},

{cat:'Performance', q:"Quel réglage apporte le plus gros gain de performance en production ?",
 opts:["Activer OPcache","Activer le JIT","Augmenter memory_limit","Désactiver les sessions"],
 correct:0, why:"**OPcache** met en cache le bytecode compilé et évite de recompiler chaque fichier à chaque requête. Le JIT n'apporte presque rien sur une application web classique, dont le goulot est la base de données et les I/O."},

{cat:'Performance', q:"Quel est le principal intérêt d'un generator ?",
 opts:["Itérer sur de gros volumes avec une mémoire constante","Paralléliser les traitements","Accélérer les calculs mathématiques","Mettre en cache les résultats"],
 correct:0, why:"Un generator produit ses valeurs **à la demande** : on ne construit jamais le tableau complet. C'est la réponse type à « comment traiter un CSV de 5 Go ? »."},

{cat:'Performance', q:"Qu'est-ce que le problème N+1 ?",
 opts:["Une requête par entité dans une boucle, au lieu d'une requête groupée","Une fuite mémoire dans les closures","Un débordement de pile en récursion","Un conflit de versions Composer"],
 correct:0, why:"Le **N+1 query problem** : une requête pour la liste, puis une requête par élément pour ses relations. Solution : `JOIN`, eager loading, ou une requête d'hydratation groupée."},

{cat:'Outillage', q:"Quelle commande utiliser lors d'un déploiement en production ?",
 opts:["composer install --no-dev --optimize-autoloader","composer update","composer require --dev","composer dump-autoload --dev"],
 correct:0, why:"`composer install` installe **exactement** ce que contient le `composer.lock` (reproductible). `composer update` recalcule les versions : à ne jamais faire en production."},

{cat:'Outillage', q:"Que signifie la contrainte ^3.2 dans composer.json ?",
 opts:[">=3.2.0 et <4.0.0",">=3.2.0 et <3.3.0","exactement 3.2","3.2 ou supérieur, sans limite"],
 correct:0, why:"Le caret suit le **semantic versioning** : il autorise toutes les versions qui ne contiennent pas de breaking change. `~3.2` est plus restrictif (`>=3.2 <3.3`)."},

{cat:'Outillage', q:"À quoi sert Rector ?",
 opts:["Automatiser les refactorings et les migrations de version PHP","Analyser statiquement les types","Mesurer la couverture de tests","Formater le code selon PSR-12"],
 correct:0, why:"**Rector** applique des règles de transformation du code (sets `PHP_84`, `PHP_85`, Symfony, PHPUnit…). Le citer montre que vous savez industrialiser une montée de version."},

{cat:'Namespaces', q:"Que suppose la convention PSR-4 ?",
 opts:["Le FQCN correspond au chemin du fichier à partir d'un préfixe de namespace","Tous les fichiers doivent être dans src/","Les noms de classes doivent être en snake_case","Chaque fichier peut contenir plusieurs classes"],
 correct:0, why:"**PSR-4** mappe un préfixe de namespace (`App\\`) vers un répertoire (`src/`) : `App\\Billing\\Invoice` → `src/Billing/Invoice.php`. Composer génère l'autoloader correspondant."},

{cat:'Output', q:"Que produit ce code ?", code:`<?php
$a = ['x' => 1, 'y' => 2, 'z' => 3];
$b = array_filter($a, fn($v) => $v > 1);
echo json_encode(array_values($b));`,
 opts:["[2,3]","{\"y\":2,\"z\":3}","[1,2,3]","{\"0\":2,\"1\":3}"],
 correct:0, why:"`array_filter()` conserve les clés `y` et `z`, mais `array_values()` les remplace par `0` et `1` : `json_encode()` produit alors un vrai tableau JSON `[2,3]`."},

{cat:'Output', q:"Que produit ce code en PHP 8 ?", code:`<?php
var_dump(0 == 'foo');
var_dump('1' == '01');
var_dump(null ?? 'default');`,
 opts:["false, true, 'default'","true, true, null","false, false, 'default'","true, false, null"],
 correct:0, why:"Depuis PHP 8 : `0 == 'foo'` → **false** (le nombre est converti en string). `'1' == '01'` → **true** (les deux sont numériques, comparaison numérique). `??` retourne la valeur de droite car l'opérande gauche est null."},

{cat:'Output', q:"Que vaut $items après ce code ?", code:`<?php
$items = [1, 2, 3];
foreach ($items as &$v) { $v *= 2; }
foreach ($items as $v) { }
print_r($items);`,
 opts:["[2, 4, 4]","[2, 4, 6]","[1, 2, 3]","[2, 4, 8]"],
 correct:0, why:"Le piège classique : `$v` est resté une **référence vers le dernier élément**. La seconde boucle y écrit successivement 2, 4, puis 4 (la valeur qu'elle vient d'écrire). Il fallait `unset($v)` après la première boucle."},

{cat:'Output', q:"Que produit ce code PHP 8.5 ?", code:`<?php
$result = '  Hello World  '
    |> trim(...)
    |> strtolower(...)
    |> (fn(string $s) => str_replace(' ', '_', $s));
echo $result;`,
 opts:["hello_world","Hello_World","  hello world  ","hello world"],
 correct:0, why:"Le pipe applique les transformations **de gauche à droite** : trim → lowercase → remplacement des espaces. Résultat : `hello_world`."},

{cat:'Output', q:"Que se passe-t-il ici en PHP 8 ?", code:`<?php
$status = 'unknown';
echo match ($status) {
    'active' => 'Actif',
    'banned' => 'Banni',
};`,
 opts:["Une UnhandledMatchError est levée","Le code affiche une chaîne vide","Une Warning est émise","Le code affiche null"],
 correct:0, why:"`match` est **exhaustif** : sans branche `default` et sans cas correspondant, PHP lève une `UnhandledMatchError`. C'est justement ce qui le rend plus sûr que `switch`."},

const CARDS = [
{cat:'PHP 8.5', q:"Pipe operator", a:"`|>` passe la valeur de gauche comme **unique argument** de la callable de droite. On l'utilise avec la first-class callable syntax (`trim(...)`) ou une arrow function. Lecture de **gauche à droite**, plus d'appels imbriqués."},
{cat:'PHP 8.5', q:"Clone with", a:"`clone($object, ['prop' => $value])` : clone l'objet en surchargeant des propriétés, **y compris readonly**, depuis le scope de la classe. Implémente le pattern **wither** sans recopier le constructeur."},
{cat:'PHP 8.5', q:"#[\\NoDiscard]", a:"Attribut qui émet un **Warning** si la valeur de retour n'est pas utilisée. Pour ignorer volontairement : `(void) maFonction();`. Idéal pour les APIs immuables et les retours de statut."},
{cat:'PHP 8.5', q:"array_first() / array_last()", a:"Retournent la première / dernière **valeur** d'un tableau, ou **null** si vide. Remplacent `reset()`/`end()` (qui déplacent le pointeur interne) et `$a[array_key_last($a)]`."},
{cat:'PHP 8.5', q:"Extension URI", a:"Deux implémentations natives : `Uri\\Rfc3986\\Uri` (stricte) et `Uri\\WhatWg\\Url` (comportement navigateur). Remplace `parse_url()`, qui n'a jamais été conforme aux specs."},
{cat:'PHP 8.5', q:"Backtraces sur fatal errors", a:"Directive `fatal_error_backtraces` (ON par défaut) : les erreurs fatales (memory exhausted, timeout) affichent enfin une **stack trace**. Gain majeur pour le debug en production."},
{cat:'PHP 8.5', q:"get_error_handler()", a:"Avec `get_exception_handler()`, permet de **lire** le handler installé sans l'écraser. Auparavant il fallait l'astuce `set_error_handler(null)` + `restore_error_handler()`."},
{cat:'PHP 8.5', q:"Closures en expression constante", a:"Les `static` closures et les first-class callables sont autorisées dans les **constant expressions** : attributs, valeurs par défaut de paramètres, constantes de classe."},
{cat:'PHP 8.5', q:"Deprecations 8.5", a:"Backtick operator, casts non canoniques `(integer)`/`(boolean)`/`(double)`/`(binary)`, `__sleep`/`__wakeup`, `null` comme offset de tableau, `case X;` avec point-virgule, `curl_close()`, `mysqli_execute()`."},
{cat:'PHP 8.4', q:"Property hooks", a:"`public string $x { get => …; set (string $v) { … } }` : getters/setters natifs. Déclarables dans une **interface**. Permettent d'ajouter validation ou calcul sans casser l'API publique."},
{cat:'PHP 8.4', q:"Asymmetric visibility", a:"`public private(set) string $status;` — lecture publique, écriture restreinte. PHP 8.5 l'étend aux propriétés **statiques**."},
{cat:'PHP 8.4', q:"array_find / any / all", a:"`array_find()` → 1re valeur qui matche ou **null** ; `array_find_key()` → la clé ; `array_any()` / `array_all()` → booléens. Évitent les `foreach` avec `break`."},
{cat:'PHP 8.4', q:"Lazy objects", a:"`newLazyGhost()` / `newLazyProxy()` via la Reflection : l'initialisation coûteuse est **repoussée au premier accès**. Utilisé par les conteneurs DI et les ORM."},
{cat:'PHP 8.3', q:"Typed class constants", a:"`const string ENV = 'prod';` — le type est vérifié, y compris lors d'un override dans une classe fille."},
{cat:'PHP 8.3', q:"#[\\Override]", a:"Erreur de compilation si la méthode ne surcharge rien (typo, renommage dans la classe mère). PHP 8.5 l'étend aux **propriétés**."},
{cat:'PHP 8.2', q:"readonly class", a:"`final readonly class Dto {}` : toutes les propriétés d'instance deviennent `readonly`. Les dynamic properties y sont interdites."},
{cat:'PHP 8.2', q:"DNF types", a:"**Disjunctive Normal Form** : combiner union et intersection, ex. `(Countable&Traversable)|null`. Les intersections doivent être entre parenthèses."},
{cat:'PHP 8.2', q:"Dynamic properties dépréciées", a:"Affecter une propriété non déclarée émet un deprecation (Error en PHP 9). Échappatoire pour le legacy : `#[\\AllowDynamicProperties]`."},
{cat:'PHP 8.1', q:"Enum", a:"Type énuméré vrai. **Pure enum** (cases sans valeur) ou **backed enum** (`: string` / `: int`). `cases()`, `from()`, `tryFrom()`, `->name`, `->value`. Pas d'état, pas d'héritage, mais méthodes, constantes et interfaces."},
{cat:'PHP 8.1', q:"readonly property", a:"Initialisable **une seule fois**, depuis le scope de déclaration, et doit être typée. Ce n'est pas une constante : la valeur est calculée à l'exécution."},
{cat:'PHP 8.1', q:"First-class callable syntax", a:"`strlen(...)`, `$this->handle(...)`, `Service::create(...)` créent un objet **Closure** typé et analysable par les IDE, en remplacement de `'strlen'` ou `[$this, 'handle']`."},
{cat:'PHP 8.1', q:"Fiber", a:"Coroutine complète : elle peut se **suspendre depuis n'importe quel niveau de la pile** (`Fiber::suspend()`), contrairement au generator. Brique de base de ReactPHP, Amp, FrankenPHP."},
{cat:'PHP 8.0', q:"match", a:"Expression, comparaison **stricte** (`===`), pas de fallthrough, `UnhandledMatchError` si aucun cas ne correspond. `match(true)` remplace les cascades de `if/elseif`."},
{cat:'PHP 8.0', q:"Constructor promotion", a:"`public function __construct(private string $name) {}` : déclare la propriété, le paramètre et l'affectation en une fois. En 8.5 on peut y ajouter `final`."},
{cat:'PHP 8.0', q:"Nullsafe operator", a:"`$a?->b?->c` court-circuite toute la chaîne et retourne `null` dès qu'un maillon est null. Ne fonctionne pas sur les offsets de tableau."},
{cat:'PHP 8.0', q:"Attributes", a:"Métadonnées natives `#[Attr(...)]`, lues par la **Reflection** (`getAttributes()` puis `newInstance()`). Base du routing, de l'ORM et de la validation dans les frameworks modernes."},
{cat:'Bases', q:"declare(strict_types=1)", a:"Directive **par fichier** qui désactive la coercition : un mauvais type lève une `TypeError`. Elle s'applique au fichier **appelant**, pas au fichier appelé."},
{cat:'Bases', q:"self vs static", a:"`self` = classe où le code est écrit (résolu à la compilation). `static` = classe réellement appelée (**late static binding**, résolu à l'exécution). Toujours `static` pour une factory héritable."},
{cat:'Bases', q:"Error vs Exception", a:"Les deux implémentent `Throwable` mais sont deux branches distinctes. `Error` (TypeError, ValueError, DivisionByZeroError) vient du **moteur** ; `catch (Exception)` ne l'attrape pas."},
{cat:'Bases', q:"?? vs ?:", a:"`??` teste **null ou clé inexistante**, sans warning. `?:` (elvis) teste **falsy** : `0 ?: 'x'` vaut `'x'`, ce qui est rarement voulu."},
{cat:'Bases', q:"array_merge vs +", a:"`array_merge()` réindexe les clés numériques et écrase les clés string avec la **droite**. `+` fait une union qui garde la valeur de **gauche** et ne réindexe rien."},
{cat:'Bases', q:"foreach par référence", a:"Après `foreach ($a as &$v)`, il faut `unset($v)` : sinon `$v` reste une référence vers le dernier élément et la boucle suivante l'écrase silencieusement."},
{cat:'Bases', q:"isset / empty / array_key_exists", a:"`isset()` = existe **et** non null. `empty()` = falsy (`0`, `''`, `'0'`, `[]`, `null`, `false`). `array_key_exists()` = la clé existe, même si la valeur est null."},
{cat:'Bases', q:"Generator", a:"Fonction contenant `yield` : produit les valeurs **à la demande**, mémoire constante. `yield from` délègue, `->send()` injecte, `->getReturn()` récupère la valeur finale."},
{cat:'Sécurité', q:"Prepared statement", a:"La requête et les données partent **séparément** : les valeurs ne peuvent jamais être interprétées comme du SQL. Toujours avec `PDO::ATTR_EMULATE_PREPARES => false`. Ne protège pas les identifiants (table, colonne, ORDER BY) → allow-list."},
{cat:'Sécurité', q:"password_hash", a:"`password_hash($p, PASSWORD_ARGON2ID)` génère un sel aléatoire ; `password_verify()` compare en temps constant ; `password_needs_rehash()` permet la migration d'algorithme transparente."},
{cat:'Sécurité', q:"Cookie de session sûr", a:"`secure` (HTTPS only), `httponly` (inaccessible en JS, anti-XSS), `samesite=Lax` (anti-CSRF), puis `session_regenerate_id(true)` après le login (anti session fixation)."},
{cat:'Perf', q:"OPcache", a:"Cache du **bytecode** compilé : le gain n°1 en production. En prod, `validate_timestamps=0` et invalidation au déploiement. Le JIT, lui, n'apporte presque rien sur du web classique."},
{cat:'Perf', q:"Problème N+1", a:"Une requête pour la liste puis **une requête par élément** pour ses relations. Solution : `JOIN`, eager loading, ou requête d'hydratation groupée. Détectable avec un profiler ou la debug bar."},
{cat:'Archi', q:"Dependency Inversion", a:"Le **D** de SOLID : dépendre d'**abstractions** (interfaces) injectées par le constructeur, jamais d'implémentations concrètes instanciées à l'intérieur. C'est ce qui rend le code testable."},
{cat:'Archi', q:"PSR à citer", a:"PSR-12 (style), PSR-4 (autoload), PSR-3 (logger), PSR-7/15/17 (HTTP, middlewares), PSR-11 (container), PSR-6/16 (cache), PSR-14 (events)."},
{cat:'Archi', q:"Composition vs héritage", a:"L'héritage crée un couplage fort et une hiérarchie rigide (« est un »). La composition injecte un collaborateur remplaçable (« a un ») : plus testable, plus flexible. Préférer la composition par défaut."},

{q:"Comment migreriez-vous une application de PHP 8.1 vers 8.5 ?", a:[
['ul',[
"**1.** Vérifier la compatibilité des dépendances ([[composer outdated]], [[composer audit]]) et monter les majeures une par une.",
"**2.** Lancer la suite de tests sur 8.5 avec [[error_reporting=E_ALL]] et traiter **toutes** les deprecations.",
"**3.** Passer **Rector** avec le set [[PHP_85]] (et [[PHP_82]] à [[PHP_84]] si on saute des versions) pour automatiser les réécritures.",
"**4.** Traiter les BC breaks connus : dynamic properties (8.2), nullables implicites (8.4), casts non canoniques et backtick operator (8.5).",
"**5.** Renforcer le filet : **PHPStan** au niveau max sur les zones touchées.",
"**6.** Déployer en **canary** sur un sous-ensemble de trafic, surveiller les logs, puis généraliser."
]],
['p',"Mentionnez aussi que PHP 8.5 aide la migration elle-même : les **backtraces sur fatal errors** rendent enfin diagnosticables les erreurs mémoire rencontrées pendant les tests de charge."]
]},
{q:"Qu'est-ce que le late static binding ?", a:[
['p',"C'est la capacité de [[static::]] à résoudre la classe **réellement appelée** à l'exécution, alors que [[self::]] est figé à la compilation sur la classe où le code est écrit."],
['code',`<?php
abstract class Model
{
    public static function create(): static { return new static(); }
    public static function wrong(): self   { return new self(); }
}
final class User extends Model {}

User::create();  // User
User::wrong();   // Error : Model est abstraite`,'static vs self'],
['p',"Indispensable pour les **factories**, les **fluent interfaces** héritables et les Active Record."]
]},
{q:"Quelle différence entre == et === ? Donnez un piège.", a:[
['p',"[[==]] compare après **type juggling**, [[===]] compare **type et valeur**. Depuis PHP 8, une comparaison nombre/string non numérique convertit le nombre en string, ce qui a corrigé le pire piège historique."],
['code',`<?php
0 == 'foo';       // PHP 7: true  | PHP 8: false
'1' == '01';      // true  — deux strings numériques → comparaison numérique
'10' == '1e1';    // true
100 == '1e2';     // true
null == false;    // true
[] == false;      // true
in_array('abc', [0, 1]);        // PHP 7: true (!) | PHP 8: false
in_array('abc', [0, 1], true);  // false — TOUJOURS passer le 3e argument`,'Pièges de comparaison'],
['p',"Réflexe à afficher : **[[===]] par défaut**, et le troisième argument [[strict]] systématique sur [[in_array()]] et [[array_search()]]."]
]},
{q:"Comment testez-vous votre code ?", a:[
['ul',[
"**Tests unitaires** (PHPUnit / Pest) sur la logique métier pure, avec des **test doubles** pour les collaborateurs.",
"L'**injection de dépendances** est ce qui rend le test possible : on injecte un [[InMemoryRepository]] ou un mock à la place de la vraie base.",
"**Tests d'intégration** sur les repositories avec une base réelle (conteneur Docker), transaction rollback entre les tests.",
"**Data providers** pour couvrir les cas limites sans dupliquer le test.",
"**PHPStan / Psalm** en complément : ils suppriment toute une catégorie de tests (typage) statiquement.",
"**Mutation testing** (Infection) pour mesurer la qualité réelle des assertions, pas seulement la couverture."
]],
['itw',"Si on vous demande votre taux de couverture, répondez qu'un taux seul ne veut rien dire : une couverture de 90 % sans assertions pertinentes est inutile, d'où l'intérêt du mutation testing."]
]},
{q:"Comment fonctionne l'autoloading en PHP ?", a:[
['p',"Quand PHP rencontre une classe inconnue, il appelle les fonctions enregistrées via [[spl_autoload_register()]]. Composer en enregistre une, construite à partir de la section [[autoload]] du [[composer.json]]."],
['code',`<?php
spl_autoload_register(static function (string $fqcn): void {
    $prefix = 'App\\\\';
    if (!str_starts_with($fqcn, $prefix)) { return; }
    $path = __DIR__ . '/src/' . str_replace('\\\\', '/', substr($fqcn, strlen($prefix))) . '.php';
    if (is_file($path)) { require $path; }
});`,'Un autoloader PSR-4 minimal'],
['p',"En production, [[composer dump-autoload --optimize]] génère un **classmap** statique : plus aucune résolution de chemin à l'exécution."]
]},
{q:"Enum : quels usages concrets en avez-vous ?", a:[
['ul',[
"Remplacer les **constantes de classe** non typées : on peut désormais type-hinter [[Status $status]].",
"Centraliser le comportement lié à un état avec [[match($this)]] : libellé, couleur, transitions autorisées.",
"[[tryFrom()]] à la **frontière** (payload HTTP, colonne en base) pour gérer proprement une valeur inconnue.",
"Implémenter une interface pour rendre l'enum interchangeable ([[HasLabel]], [[JsonSerializable]])."
]],
['code',`<?php
enum OrderStatus: string
{
    case Pending = 'pending';
    case Paid    = 'paid';
    case Shipped = 'shipped';

    public function canTransitionTo(self $next): bool
    {
        return in_array($next, match ($this) {
            self::Pending => [self::Paid],
            self::Paid    => [self::Shipped],
            self::Shipped => [],
        }, true);
    }
}`,'State machine légère']
]},
{q:"Qu'est-ce qui fait la performance d'une application PHP ?", a:[
['ul',[
"**OPcache** activé (gain n°1) ; en prod [[validate_timestamps=0]] avec invalidation au déploiement.",
"La **base de données** : index, absence de N+1, requêtes projetées plutôt qu'hydratation complète.",
"Le **cache applicatif** (Redis, APCu) pour les données coûteuses et stables.",
"L'**I/O réseau** : appels HTTP parallélisés ([[curl_multi]]), et en 8.5 des **share handles persistants** qui réutilisent DNS et connexions entre requêtes.",
"Le **JIT** n'intervient que sur du CPU-bound ; sur du web classique, l'impact est marginal.",
"Mesurer d'abord : Blackfire, Xdebug profiler, [[hrtime()]]. Sans profil, on optimise au hasard."
]]
]},
{q:"Que sont les property hooks et qu'est-ce que ça change ?", a:[
['code',`<?php
class Product
{
    public string $slug {
        get => strtolower(str_replace(' ', '-', $this->name));
    }

    public int $price {
        set (int $v) {
            if ($v < 0) { throw new InvalidArgumentException('Prix négatif'); }
            $this->price = $v;
        }
    }

    public function __construct(public string $name) {}
}`,'PHP 8.4'],
['ul',[
"Suppriment la majorité des getters/setters manuels.",
"Permettent de transformer une propriété publique en propriété calculée **sans casser l'API publique** : le code appelant ne change pas.",
"Peuvent être déclarés dans une **interface** ([[public string $title { get; }]]), ce qui était impossible avec de simples propriétés.",
"Se combinent avec l'**asymmetric visibility** pour exposer une lecture publique et une écriture contrôlée."
]]
]},
{q:"Comment gérez-vous la configuration et les secrets ?", a:[
['ul',[
"Configuration **par environnement** via variables d'environnement (12-factor), jamais de fichier de config commité avec des secrets.",
"[[.env]] en local uniquement (Dotenv) ; en production, les variables sont injectées par l'orchestrateur ou un **secret manager** (Vault, SSM, Secrets Manager).",
"Un [[.env.example]] versionné documente les clés attendues, sans valeur.",
"Valider la configuration **au démarrage** (fail fast) plutôt que de découvrir une clé manquante en pleine requête.",
"Rotation des secrets et [[composer audit]] dans la CI."
]]
]},
{q:"Expliquez les generators et donnez un cas réel.", a:[
['p',"Une fonction contenant [[yield]] retourne un [[Generator]] qui produit ses valeurs **à la demande**. Elle ne construit jamais le tableau complet, donc la mémoire reste constante."],
['ul',[
"Lecture de **gros fichiers** ou de **curseurs SQL** ligne à ligne.",
"**Pagination transparente** d'une API : le generator enchaîne les pages sans que l'appelant le sache.",
"Pipelines de transformation composables ([[yield from]]).",
"Limite à connaître : un generator n'est parcourable **qu'une fois** et ne supporte pas [[count()]] ni l'accès par index."
]],
['code',`<?php
function apiPages(HttpClient $c, string $url): Generator
{
    $page = 1;
    do {
        $data = $c->get($url, ['page' => $page]);
        yield from $data['items'];
        $page++;
    } while ($data['has_more']);
}`,'Pagination lazy']
]},
{q:"Qu'est-ce que SOLID, avec un exemple concret ?", a:[
['ul',[
"**S**ingle Responsibility — une classe, une seule raison de changer. Un contrôleur qui valide, calcule la TVA et envoie un mail en a trois.",
"**O**pen/Closed — ajouter un nouveau moyen de paiement doit se faire en **ajoutant** une classe, pas en modifiant un [[switch]].",
"**L**iskov — une sous-classe ne doit pas renforcer les préconditions ni affaiblir les postconditions (le classique [[Square extends Rectangle]]).",
"**I**nterface Segregation — [[Readable]] et [[Writable]] séparés valent mieux qu'un gros [[Storage]] que personne n'implémente entièrement.",
"**D**ependency Inversion — [[__construct(private MailerInterface $mailer)]] et non [[new SmtpMailer()]] au milieu d'une méthode."
]],
['itw',"Préparez **un** exemple vécu par principe. Réciter les cinq noms sans illustration est le meilleur moyen de perdre le recruteur."]
]},
{q:"Comment concevez-vous une API REST en PHP ?", a:[
['ul',[
"Ressources au pluriel, verbes HTTP porteurs de sens, **codes de statut** corrects (201 création, 204 no content, 409 conflit, 422 validation).",
"**Validation en entrée** dans un DTO typé, jamais [[new Entity(...$_POST)]] (mass assignment).",
"Sérialisation explicite ([[JsonSerializable]] ou un serializer), jamais l'entité Doctrine brute.",
"Gestion d'erreurs uniformisée : un **exception handler** global qui traduit chaque exception métier en réponse JSON (RFC 7807 problem+json).",
"Pagination, filtrage, tri via **allow-list** de colonnes ; versionner l'API ([[/v1]]).",
"Authentification par token (JWT ou opaque), rate limiting, CORS explicite.",
"Standards PSR-7 / PSR-15 pour les middlewares, et [[json_encode(..., JSON_THROW_ON_ERROR)]]."
]]
]},
{q:"Que regardez-vous dans une code review ?", a:[
['ul',[
"**Correction** d'abord : le code fait-il ce que dit le ticket, les cas limites sont-ils couverts par un test ?",
"**Frontières** : validation des entrées externes, gestion des erreurs, transactions correctement délimitées.",
"**Typage** : types déclarés partout, pas de [[mixed]] par facilité, [[strict_types]] présent.",
"**Lisibilité** : nommage, fonctions courtes, absence de logique dans les templates.",
"**Sécurité** : requêtes paramétrées, échappement en sortie, secrets absents du diff.",
"**Conception** : couplage, responsabilités, duplication — mais sans réécrire la PR du collègue.",
"Ton : commentaires factuels, questions plutôt qu'injonctions, et distinguer le bloquant du « nice to have »."
]]
]},
{q:"Quelles questions poser au recruteur à la fin ?", a:[
['ul',[
"Quelle version de PHP tourne en production, et quelle est la stratégie de montée de version ?",
"Quel est l'état de la suite de tests et de l'analyse statique (PHPStan level) ?",
"Comment sont gérés les déploiements : CI/CD, feature flags, rollback ?",
"Quelle part du temps est consacrée à la dette technique ?",
"Comment se passe une code review dans l'équipe ?",
"Quel sera mon premier chantier concret sur les trois premiers mois ?"
]],
['itw',"Ces questions montrent que vous raisonnez en **ingénieur logiciel**, pas seulement en exécutant. Elles vous servent aussi à évaluer l'équipe."]
]},
];

   DONNÉES — CHEATSHEET
   ========================================================================= */
const CHEAT = [
['h','Le squelette d\'un fichier moderne'],
['code',`<?php

declare(strict_types=1);

namespace App\\Billing;

use App\\Customer\\Customer;
use Psr\\Log\\LoggerInterface;

final readonly class InvoiceService
{
    public function __construct(
        private InvoiceRepository $repository,
        private LoggerInterface $logger,
    ) {}

    public function issue(Customer $customer, Money $amount): Invoice
    {
        $invoice = new Invoice(reference: $this->nextReference(), amount: $amount);
        $this->repository->save($invoice);
        $this->logger->info('Invoice issued', ['ref' => $invoice->reference]);

        return $invoice;
    }
}`,'Template'],
['h','Timeline des versions'],
['table',[
['Version','Sortie','À retenir'],
['**8.0**','nov. 2020','named args, attributes, promotion, union types, match, nullsafe, JIT'],
['**8.1**','nov. 2021','enums, readonly, fibers, never, first-class callables, new in initializers'],
['**8.2**','déc. 2022','readonly classes, DNF types, constantes dans les traits, fin des dynamic properties'],
['**8.3**','nov. 2023','typed class constants, [[#[\\Override]]], [[json_validate()]]'],
['**8.4**','nov. 2024','property hooks, asymmetric visibility, [[array_find]], lazy objects, [[new X()->y()]]'],
['**8.5**','nov. 2025','[[|>]], clone with, [[#[\\NoDiscard]]], extension URI, [[array_first/last]], fatal backtraces'],
]],
['h','Les 12 syntaxes à ne pas confondre'],
['code',`<?php
$a ?? $b;              // null coalescing : $a si défini ET non null
$a ?: $b;              // elvis : $a si TRUTHY
$a ??= $b;             // assigne seulement si $a est null
$a <=> $b;             // spaceship : -1, 0, 1
$obj?->method();       // nullsafe : null si $obj est null
$obj::class;           // FQCN d'une instance (8.0)
fn($x) => $x * 2;      // arrow function : capture auto par valeur
strlen(...);           // first-class callable → Closure (8.1)
$v |> trim(...);       // pipe operator (8.5)
clone($o, ['x' => 1]); // clone with (8.5)
match (true) { … };    // remplace if/elseif
(void) f();            // ignore volontairement un retour #[\\NoDiscard] (8.5)`,'Mémo syntaxe'],
['h','Checklist « je suis prêt pour l\'entretien »'],

/* =========================================================================
   NAVIGATION & ÉTAT
   ========================================================================= */
const NAV = [
  {group:'Parcours', items:[{route:'#/', icon:'\u{1F3E0}', label:'Accueil'}]},
  {group:'Les bases', items: MODULES.map(m => ({route:'#/m/' + m.id, icon:m.icon, label:m.title, key:'m:' + m.id}))},
  {group:'Nouveautés', items: VERSIONS.map(v => ({route:'#/v/' + v.id, icon:'\u{1F4E1}', label:'PHP ' + v.v, key:'v:' + v.id, hot:v.hot}))},
  {group:"S'entraîner", items:[
    {route:'#/quiz',      icon:'\u{1F9E0}', label:'Quiz'},
    {route:'#/cards',     icon:'\u{1F0CF}', label:'Flashcards'},
    {route:'#/interview', icon:'\u{1F4BC}', label:'Questions d\'entretien'},
    {route:'#/cheat',     icon:'\u{1F4CB}', label:'Cheatsheet'},
  ]},
];

const KEY = 'php85academy.v1';
let S = {done:{}, xp:0, best:0, played:0, theme:'dark', cardsKnown:{}};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

const TOTAL_LESSONS = MODULES.length + VERSIONS.length;
const LEVELS = [[0,'Débutant'],[60,'Junior'],[160,'Confirmé'],[320,'Senior'],[520,'Expert PHP']];
function levelName(xp){ let n = LEVELS[0][1]; for (const [t, name] of LEVELS) if (xp >= t) n = name; return n; }

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1900);
}
function addXp(n){ S.xp += n; save(); refreshSide(); }

/* ---------- sidebar ---------- */
function buildNav(){
  const cur = curRoute();
  document.getElementById('nav').innerHTML = NAV.map(g =>
    '<div class="navgroup"><span>' + esc(g.group) + '</span>' + g.items.map(it => {
      const active = cur === it.route ? ' active' : '';
      const done = it.key && S.done[it.key] ? ' done' : '';
      const right = it.hot ? '<span class="pill">8.5</span>' : (it.key ? '<span class="dot"></span>' : '');
      return '<div class="navitem' + active + done + '" onclick="go(\'' + it.route + '\')">'
        + '<i>' + it.icon + '</i><span>' + esc(it.label) + '</span>' + right + '</div>';
    }).join('') + '</div>'
  ).join('');
}
function refreshSide(){
  const done = Object.keys(S.done).length;
  const pct = TOTAL_LESSONS ? Math.round(done / TOTAL_LESSONS * 100) : 0;
  const circ = 2 * Math.PI * 17;
  document.getElementById('ringfg').setAttribute('stroke-dashoffset', String(circ - circ * pct / 100));
  document.getElementById('ringtxt').textContent = pct + '%';
  document.getElementById('lvname').textContent = levelName(S.xp);
  document.getElementById('lvxp').textContent = S.xp + ' XP';
  buildNav();
}
function openSide(){ document.getElementById('side').classList.add('open'); document.getElementById('scrim').classList.add('on'); }
function closeSide(){ document.getElementById('side').classList.remove('open'); document.getElementById('scrim').classList.remove('on'); }
function toggleTheme(){
  S.theme = S.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', S.theme);
  document.getElementById('themebtn').innerHTML = S.theme === 'dark' ? '&#9790;' : '&#9728;';
  save();
}
function resetAll(){
  if (!confirm('Réinitialiser toute la progression (leçons lues, XP, meilleur score) ?')) return;
  S = {done:{}, xp:0, best:0, played:0, theme:S.theme, cardsKnown:{}};
  save(); refreshSide(); render(); toast('Progression réinitialisée');
}

/* ---------- routeur ---------- */
let CURRENT = '#/';
const curRoute = () => location.hash || CURRENT;
function go(route){
  CURRENT = route;
  try { location.hash = route; } catch(e) {}
  render(); closeSide();
}
window.addEventListener('hashchange', () => { CURRENT = location.hash || CURRENT; render(); });

function render(){
  const h = curRoute();
  const view = document.getElementById('view');
  window.scrollTo({top:0});
  if (h.startsWith('#/m/'))        view.innerHTML = viewLesson(MODULES.find(m => m.id === h.slice(4)), 'm');
  else if (h.startsWith('#/v/'))   view.innerHTML = viewVersion(VERSIONS.find(v => v.id === h.slice(4)));
  else if (h === '#/quiz')         quizHome();
  else if (h === '#/cards')        cardsHome();
  else if (h === '#/interview')    view.innerHTML = viewInterview();
  else if (h === '#/cheat')        view.innerHTML = viewCheat();
  else                             view.innerHTML = viewHome();
  buildNav();
}

/* ---------- vues statiques ---------- */
function viewHome(){
  const done = Object.keys(S.done).length;
  const pct = TOTAL_LESSONS ? Math.round(done / TOTAL_LESSONS * 100) : 0;
  return `
  <div class="hero">
    <div class="v">\u{1F680} PHP 8.5 — sortie le 20 novembre 2025</div>
    <h2>Révisez PHP, des bases aux nouveautés 8.5</h2>
    <p>Un parcours complet pour arriver serein à votre entretien : ${MODULES.length} modules de fondamentaux,
       ${VERSIONS.length} versions décryptées, ${QUIZ.length} questions de quiz, ${CARDS.length} flashcards
       et ${INTERVIEW.length} questions d'entretien corrigées.</p>
    <div class="cta">
      <button class="btn primary" onclick="go('#/v/v85')">Commencer par PHP 8.5 →</button>
      <button class="btn ghost" onclick="go('#/quiz')">Lancer un quiz</button>
      <button class="btn ghost" onclick="go('#/interview')">Questions d'entretien</button>
    </div>
  </div>

  <div class="grid g3">
    <div class="stat"><b>${pct}%</b><span>du cours parcouru</span></div>
    <div class="stat"><b>${S.xp}</b><span>XP — niveau ${levelName(S.xp)}</span></div>
    <div class="stat"><b>${S.best}%</b><span>meilleur score au quiz</span></div>
    <div class="stat"><b>${S.played}</b><span>quiz terminés</span></div>
  </div>

  <h3 class="sec">Votre progression</h3>
  <div class="card">
    <p style="margin:0 0 4px">${done} / ${TOTAL_LESSONS} chapitres marqués comme lus.</p>
    <div class="prog"><i style="width:${pct}%"></i></div>
  </div>

  <h3 class="sec">Par où commencer ?</h3>
  <div class="grid g2">
    <div class="tilelink" onclick="go('#/v/v85')">
      <span class="arw">→</span><div class="ic">\u{1F680}</div>
      <b>Les nouveautés PHP 8.5</b>
      <span>Pipe operator, clone with, #[\\NoDiscard], extension URI, array_first/last, backtraces sur fatal errors.</span>
    </div>
    <div class="tilelink" onclick="go('#/m/types')">
      <span class="arw">→</span><div class="ic">\u{1F4DA}</div>
      <b>Réviser les fondamentaux</b>
      <span>Types, strings, arrays, POO, enums, exceptions, sécurité, performance : ${MODULES.length} modules condensés.</span>
    </div>
    <div class="tilelink" onclick="go('#/quiz')">
      <span class="arw">→</span><div class="ic">\u{1F9E0}</div>
      <b>Se tester</b>
      <span>${QUIZ.length} questions, réponses mélangées à chaque tentative, avec explication détaillée.</span>
    </div>
    <div class="tilelink" onclick="go('#/cheat')">
      <span class="arw">→</span><div class="ic">\u{1F4CB}</div>
      <b>Réviser 10 minutes avant</b>
      <span>Timeline des versions, syntaxes à ne pas confondre, checklist finale.</span>
    </div>
  </div>

  <div class="callout tip" style="margin-top:26px">
    <b>Astuce :</b> <kbd>Ctrl</kbd> <kbd>K</kbd> ouvre la recherche globale. Dans le quiz, les touches
    <kbd>1</kbd> à <kbd>4</kbd> répondent et <kbd>Entrée</kbd> passe à la question suivante.
  </div>`;
}

function doneBar(key){
  const on = S.done[key] ? ' on' : '';
  return `<div class="donebar">
    <div class="chk${on}" onclick="toggleDone('${key}')">✓</div>
    <span>Marquer ce chapitre comme lu (+15 XP)</span>
  </div>`;
}
function toggleDone(key){
  if (S.done[key]) { delete S.done[key]; S.xp = Math.max(0, S.xp - 15); }
  else { S.done[key] = 1; S.xp += 15; toast('Chapitre validé  +15 XP'); }
  save(); refreshSide(); render();
}

function neighbours(list, id, prefix){
  const i = list.findIndex(x => x.id === id);
  const prev = i > 0 ? list[i - 1] : null;
  const next = i < list.length - 1 ? list[i + 1] : null;
  let html = '<div class="pagenav">';
  html += prev
    ? `<button class="btn line" onclick="go('${prefix}${prev.id}')">← ${esc(prev.title || ('PHP ' + prev.v))}</button>`
    : '<span style="flex:1"></span>';
  html += next
    ? `<button class="btn line r" onclick="go('${prefix}${next.id}')">${esc(next.title || ('PHP ' + next.v))} →</button>`
    : '<span style="flex:1"></span>';
  return html + '</div>';
}

function viewLesson(m, kind){
  if (!m) return viewHome();
  const idx = MODULES.indexOf(m) + 1;
  return `<div class="crumbs"><span>Les bases</span> / <span class="k">${esc(m.title)}</span>
            <span style="margin-left:auto">Module ${idx} / ${MODULES.length}</span></div>
          <h2 class="page">${m.icon} ${esc(m.title)}</h2>
          <p class="page-sub">${esc(m.sub)}</p>
          ${blocks(m.blocks)}
          ${doneBar('m:' + m.id)}
          ${neighbours(MODULES, m.id, '#/m/')}`;
}

function viewVersion(v){

  return `<div class="crumbs"><span>Nouveautés</span> / <span class="k">PHP ${esc(v.v)}</span>
            <span style="margin-left:auto">${esc(v.date)}</span></div>
          <h2 class="page">PHP ${esc(v.v)} ${v.hot ? '<span class="badge b-new" style="vertical-align:middle">nouveau</span>' : ''}</h2>
          <p class="page-sub">${esc(v.sub)}</p>

          ${doneBar('v:' + v.id)}
          ${neighbours(VERSIONS, v.id, '#/v/')}`;

function viewInterview(){

    <p class="page-sub">${INTERVIEW.length} questions fréquentes en entretien PHP, avec une réponse structurée.
       Formulez la vôtre à voix haute avant d'ouvrir la correction.</p>
    ${INTERVIEW.map((it, i) => `
      <div class="acc" id="acc${i}">
        <div class="acch" onclick="toggleAcc(${i})">
          <span class="num">${i + 1}</span><span>${esc(it.q)}</span><span class="arw">❯</span>

}
function toggleAcc(i){ document.getElementById('acc' + i).classList.toggle('open'); }

function viewCheat(){

/* =========================================================================
   QUIZ
   ========================================================================= */
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
/* Mélange les propositions ET recalcule l'index de la bonne réponse :
   la bonne réponse n'est donc jamais à une position prévisible. */
function prepareQuestion(q){
  const answer = q.opts[q.correct];
  const opts = shuffle(q.opts);
  return {cat:q.cat, q:q.q, code:q.code, why:q.why, opts, correct:opts.indexOf(answer)};
}

const QUIZ_CATS = [...new Set(QUIZ.map(q => q.cat))];
let QZ = null;

function quizHome(){
  QZ = null;
  document.getElementById('view').innerHTML = `
    <h2 class="page">\u{1F9E0} Quiz</h2>
    <p class="page-sub">${QUIZ.length} questions sur les fondamentaux et les nouveautés.
       Les propositions sont <strong>mélangées à chaque tentative</strong> — impossible de retenir « c'est toujours la B ».</p>

    <div class="card">
      <h3 class="sec" style="margin-top:0">Choisir un thème</h3>
      <div class="grid g3" style="margin-bottom:18px">
        <select id="qcat" class="btn line" style="width:100%;padding:11px 14px">
          <option value="all">Tous les thèmes (${QUIZ.length} questions)</option>
          ${QUIZ_CATS.map(c => `<option value="${esc(c)}">${esc(c)} (${QUIZ.filter(q => q.cat === c).length})</option>`).join('')}
        </select>
      </div>
      <div class="fcbar" style="justify-content:flex-start">
        <button class="btn solid" onclick="startQuiz(10)">Quiz rapide — 10 questions</button>
        <button class="btn line" onclick="startQuiz(20)">Entraînement — 20 questions</button>
        <button class="btn line" onclick="startQuiz(999)">Marathon — tout</button>
      </div>
    </div>

    <div class="grid g3">
      <div class="stat"><b>${S.best}%</b><span>meilleur score</span></div>
      <div class="stat"><b>${S.played}</b><span>quiz terminés</span></div>
      <div class="stat"><b>${QUIZ_CATS.length}</b><span>thèmes couverts</span></div>
    </div>

    <div class="callout tip">Raccourcis : <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> pour répondre,
      <kbd>Entrée</kbd> pour passer à la suivante.</div>`;
}

function startQuiz(n){
  const cat = document.getElementById('qcat') ? document.getElementById('qcat').value : 'all';
  const pool = cat === 'all' ? QUIZ : QUIZ.filter(q => q.cat === cat);
  QZ = {
    deck: shuffle(pool).slice(0, Math.min(n, pool.length)).map(prepareQuestion),
    i: 0, score: 0, streak: 0, bestStreak: 0, answered: null, wrong: [],
  };
  renderQuestion();
}

function renderQuestion(){
  const q = QZ.deck[QZ.i];
  const pct = Math.round(QZ.i / QZ.deck.length * 100);
  const letters = ['A','B','C','D','E'];
  document.getElementById('view').innerHTML = `
    <div class="qhead">
      <span class="meta">Question ${QZ.i + 1} / ${QZ.deck.length}</span>
      <div class="qbar"><i style="width:${pct}%"></i></div>
      <span class="meta">${QZ.score} bonne${QZ.score > 1 ? 's' : ''}</span>
      ${QZ.streak > 1 ? `<span class="streak">\u{1F525} ${QZ.streak} d'affilée</span>` : ''}
    </div>
    <div class="qcard">
      <div class="qcat">${esc(q.cat)}</div>
      <div class="qtext">${md(q.q)}</div>
      ${q.code ? codeBlock(q.code, 'Code') : ''}
      <div class="opts" id="opts">
        ${q.opts.map((o, i) => `<button class="opt" onclick="answer(${i})">
            <span class="key">${letters[i]}</span><span>${md(o)}</span></button>`).join('')}
      </div>
      <div id="expl"></div>
    </div>
    <div class="fcbar" style="justify-content:space-between">
      <button class="btn line" onclick="go('#/quiz')">Abandonner</button>
      <button class="btn solid" id="nextbtn" disabled onclick="nextQuestion()">Suivant →</button>
    </div>`;
}

function answer(choice){
  if (QZ.answered !== null) return;
  const q = QZ.deck[QZ.i];
  QZ.answered = choice;
  const ok = choice === q.correct;
  if (ok){ QZ.score++; QZ.streak++; QZ.bestStreak = Math.max(QZ.bestStreak, QZ.streak); addXp(5); }
  else { QZ.streak = 0; QZ.wrong.push(q); }

  [...document.querySelectorAll('#opts .opt')].forEach((el, i) => {
    el.classList.add('locked');
    if (i === q.correct) el.classList.add('good');
    else if (i === choice) el.classList.add('bad');
    else el.classList.add('dim');
    el.onclick = null;
  });
  document.getElementById('expl').innerHTML = `<div class="expl">
      <span class="verdict ${ok ? 'ok' : 'no'}">${ok ? '✓ Correct  (+5 XP)' : '✕ Incorrect'}</span>
      ${md(q.why)}</div>`;
  const b = document.getElementById('nextbtn');
  b.disabled = false;
  b.textContent = QZ.i === QZ.deck.length - 1 ? 'Voir le résultat →' : 'Suivant →';
  b.focus();
}

function nextQuestion(){
  if (QZ.answered === null) return;
  QZ.answered = null;
  QZ.i++;
  if (QZ.i >= QZ.deck.length) finishQuiz(); else renderQuestion();
}

function finishQuiz(){
  const pct = Math.round(QZ.score / QZ.deck.length * 100);
  S.played++;
  if (pct > S.best) S.best = pct;
  save(); refreshSide();
  const verdict =
    pct >= 90 ? "Excellent. Vous pouvez parler de PHP 8.5 sans trembler." :
    pct >= 70 ? "Bon niveau. Relisez les chapitres correspondant à vos erreurs." :
    pct >= 50 ? "Des bases solides, mais les nouveautés récentes méritent une relecture." :
                "Reprenez les modules « Les bases » puis la page PHP 8.5, et retentez.";
  document.getElementById('view').innerHTML = `
    <div class="card result">
      <div class="score">${pct}%</div>
      <h3>${QZ.score} / ${QZ.deck.length} bonnes réponses</h3>
      <p>${esc(verdict)}${QZ.bestStreak > 2 ? ` Meilleure série : ${QZ.bestStreak} d'affilée.` : ''}</p>
      <div class="fcbar">
        <button class="btn solid" onclick="startQuiz(${QZ.deck.length})">Rejouer (nouveau mélange)</button>
        <button class="btn line" onclick="go('#/quiz')">Changer de thème</button>
      </div>
      ${QZ.wrong.length ? `<div class="reviewlist">
        <h3 class="sec">À revoir (${QZ.wrong.length})</h3>
        ${QZ.wrong.map(q => `<div class="revitem"><b>${esc(q.cat)}</b><span>${md(q.q)}<br>→ ${md(q.opts[q.correct])}</span></div>`).join('')}
      </div>` : ''}
    </div>`;
}

/* =========================================================================
   FLASHCARDS
   ========================================================================= */
const CARD_CATS = [...new Set(CARDS.map(c => c.cat))];
let FC = {deck:[], i:0, flip:false, cat:'all'};

function cardsHome(){
  buildDeck(FC.cat);
  renderCards();
}
function buildDeck(cat){
  FC.cat = cat;
  FC.deck = shuffle(cat === 'all' ? CARDS : CARDS.filter(c => c.cat === cat));
  FC.i = 0; FC.flip = false;
}
function setCardCat(cat){ buildDeck(cat); renderCards(); }
function flipCard(){ FC.flip = !FC.flip; renderCards(); }
function moveCard(d){
  FC.i = (FC.i + d + FC.deck.length) % FC.deck.length;
  FC.flip = false; renderCards();
}
function markCard(known){
  const c = FC.deck[FC.i];
  const id = c.cat + '|' + c.q;
  if (known){ if (!S.cardsKnown[id]) { S.cardsKnown[id] = 1; addXp(2); } }
  else delete S.cardsKnown[id];
  save(); moveCard(1);
}

function renderCards(){
  const c = FC.deck[FC.i];
  const knownCount = Object.keys(S.cardsKnown).length;
  document.getElementById('view').innerHTML = `
    <h2 class="page">\u{1F0CF} Flashcards</h2>
    <p class="page-sub">${CARDS.length} notions à réciter. Cliquez la carte (ou <kbd>Espace</kbd>) pour la retourner,
       <kbd>←</kbd> <kbd>→</kbd> pour naviguer.</p>

    <div class="fcbar" style="margin-bottom:18px">
      <select class="btn line" style="padding:10px 14px" onchange="setCardCat(this.value)">
        <option value="all"${FC.cat === 'all' ? ' selected' : ''}>Toutes les cartes (${CARDS.length})</option>
        ${CARD_CATS.map(x => `<option value="${esc(x)}"${FC.cat === x ? ' selected' : ''}>${esc(x)} (${CARDS.filter(k => k.cat === x).length})</option>`).join('')}
      </select>
      <button class="btn line" onclick="setCardCat(FC.cat)">\u{1F500} Mélanger</button>
      <span class="meta" style="color:var(--muted);font-size:12.5px">${knownCount} carte${knownCount > 1 ? 's' : ''} maîtrisée${knownCount > 1 ? 's' : ''}</span>
    </div>

    <div class="fcstage">
      <div class="fc${FC.flip ? ' flip' : ''}" onclick="flipCard()">
        <div class="fcface">
          <div class="tagline">${esc(c.cat)}</div>
          <div class="q">${md(c.q)}</div>
          <div class="hint">Cliquez pour voir la réponse</div>
        </div>
        <div class="fcface back">
          <div class="tagline">${esc(c.cat)} — réponse</div>
          <div class="a">${md(c.a)}</div>
        </div>
      </div>
    </div>

    <div class="fcbar">
      <button class="btn line" onclick="moveCard(-1)">← Précédente</button>
      <span style="font-size:13px;color:var(--muted);min-width:70px;text-align:center">${FC.i + 1} / ${FC.deck.length}</span>
      <button class="btn line" onclick="moveCard(1)">Suivante →</button>
    </div>
    <div class="fcbar" style="margin-top:12px">
      <button class="btn line" onclick="markCard(false)">\u{1F504} À revoir</button>
      <button class="btn solid" onclick="markCard(true)">✓ Je maîtrise (+2 XP)</button>
    </div>`;
}

/* =========================================================================
   RECHERCHE GLOBALE
   ========================================================================= */
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const INDEX = [];
MODULES.forEach(m => {
  INDEX.push({label:m.title, sub:m.sub, route:'#/m/' + m.id, cat:'Module'});
  m.blocks.forEach(b => { if (b[0] === 'h') INDEX.push({label:b[1], sub:m.title, route:'#/m/' + m.id, cat:'Section'}); });
});
VERSIONS.forEach(v => {
  INDEX.push({label:'PHP ' + v.v, sub:v.sub, route:'#/v/' + v.id, cat:'Version'});
  v.blocks.forEach(b => { if (b[0] === 'h') INDEX.push({label:b[1], sub:'PHP ' + v.v, route:'#/v/' + v.id, cat:'Nouveauté'}); });
});
CARDS.forEach(c => INDEX.push({label:c.q, sub:c.cat, route:'#/cards', cat:'Flashcard'}));
INTERVIEW.forEach(it => INDEX.push({label:it.q, sub:"Question d'entretien", route:'#/interview', cat:'Entretien'}));
INDEX.push({label:'Cheatsheet', sub:'Mémo final', route:'#/cheat', cat:'Page'});
INDEX.push({label:'Quiz', sub:QUIZ.length + ' questions', route:'#/quiz', cat:'Page'});

let palSel = 0, palHits = [];
function openPal(){
  document.getElementById('pal').classList.add('on');
  const inp = document.getElementById('palin');
  inp.value = ''; inp.focus(); palSearch('');
}
function closePal(){ document.getElementById('pal').classList.remove('on'); }
function palSearch(q){
  const n = norm(q.trim());
  palHits = n === ''
    ? INDEX.slice(0, 9)
    : INDEX.filter(x => norm(x.label + ' ' + x.sub).includes(n)).slice(0, 24);
  palSel = 0;
  paintPal();
}
function paintPal(){
  const el = document.getElementById('palres');
  if (!palHits.length){ el.innerHTML = '<div class="palempty">Aucun résultat</div>'; return; }
  el.innerHTML = palHits.map((h, i) =>
    `<div class="palitem${i === palSel ? ' sel' : ''}" onclick="palGo(${i})">
       <span>${esc(h.label)}</span><span class="ct">${esc(h.cat)}</span></div>`).join('');
}
function palGo(i){
  const h = palHits[i];
  if (!h) return;
  closePal(); go(h.route);
}

/* =========================================================================
   CLAVIER & INIT
   ========================================================================= */
document.getElementById('palin').addEventListener('input', e => palSearch(e.target.value));
document.getElementById('palin').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ e.preventDefault(); palSel = Math.min(palSel + 1, palHits.length - 1); paintPal(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); palSel = Math.max(palSel - 1, 0); paintPal(); }
  else if (e.key === 'Enter'){ e.preventDefault(); palGo(palSel); }
  else if (e.key === 'Escape'){ closePal(); }
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPal(); return; }
  if (document.getElementById('pal').classList.contains('on')) return;
  if (['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  const h = curRoute();

  if (h === '#/quiz' && QZ){
    if (['1','2','3','4'].includes(e.key)){
      const btns = document.querySelectorAll('#opts .opt');
      const idx = Number(e.key) - 1;
      if (btns[idx] && QZ.answered === null){ e.preventDefault(); answer(idx); }
    } else if (e.key === 'Enter' || e.key === ' '){
      if (QZ.answered !== null){ e.preventDefault(); nextQuestion(); }
    }
  }
  if (h === '#/cards'){
    if (e.key === ' '){ e.preventDefault(); flipCard(); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); moveCard(1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); moveCard(-1); }
  }
});

document.documentElement.setAttribute('data-theme', S.theme || 'dark');
document.getElementById('themebtn').innerHTML = (S.theme === 'light') ? '&#9728;' : '&#9790;';
refreshSide();
render();
</script>
