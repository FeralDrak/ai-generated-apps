<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHP 8.5 Academy — Préparation entretien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0a0c16; --bg-grad1:#1b1040; --bg-grad2:#06121f;
  --surface:#12162a; --surface2:#1a1f38; --surface3:#232948;
  --border:#282e4e; --border-soft:#1e2340;
  --text:#e9ecff; --text-dim:#a9b0d6; --muted:#7b83ad;
  --accent:#8b5cf6; --accent-b:#a78bfa; --accent-c:#22d3ee;
  --php:#787CB5; --ok:#34d399; --warn:#fbbf24; --err:#fb7185; --new:#f472b6;
  --radius:18px; --radius-s:11px;
  --shadow:0 18px 50px -18px rgba(0,0,0,.75);
  --ff:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
}
[data-theme="light"]{
  --bg:#f5f6fc; --bg-grad1:#e5ddff; --bg-grad2:#dcf1fb;
  --surface:#ffffff; --surface2:#f3f4fb; --surface3:#e9ebf7;
  --border:#dfe2f2; --border-soft:#ebedf8;
  --text:#161a33; --text-dim:#454c73; --muted:#767d9f;
  --shadow:0 18px 44px -22px rgba(40,30,90,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--ff); background:var(--bg); color:var(--text);
  min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.6;
  overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
  background:
    radial-gradient(900px 500px at 12% -8%, var(--bg-grad1), transparent 60%),
    radial-gradient(800px 460px at 92% 4%, var(--bg-grad2), transparent 62%);
}
::selection{background:var(--accent);color:#fff}
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box;border:3px solid transparent}

/* ============ LAYOUT ============ */
.app{display:flex;position:relative;z-index:1;min-height:100vh}
aside{
  width:282px;flex-shrink:0;height:100vh;position:sticky;top:0;
  background:color-mix(in srgb,var(--surface) 78%,transparent);
  backdrop-filter:blur(18px);
  border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;z-index:60;
}
.brand{padding:20px 18px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-soft)}
.logo{
  width:44px;height:44px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(140deg,var(--accent),var(--accent-c));
  display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;
  box-shadow:0 8px 22px -8px var(--accent);letter-spacing:-.5px;
}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
.brand small{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.3px}
.searchbtn{
  margin:12px 14px 6px;padding:9px 12px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface2);color:var(--muted);font-family:inherit;font-size:13px;
  display:flex;align-items:center;gap:8px;cursor:pointer;transition:.18s;width:calc(100% - 28px)
}
.searchbtn:hover{border-color:var(--accent);color:var(--text)}
.searchbtn kbd{margin-left:auto}
kbd{
  font-family:var(--fm);font-size:10px;padding:2px 5px;border-radius:5px;
  background:var(--surface3);border:1px solid var(--border);color:var(--text-dim)
}
nav{flex:1;overflow-y:auto;padding:8px 10px 18px}
.navgroup{margin-top:14px}
.navgroup>span{
  display:block;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--muted);padding:6px 10px
}
.navitem{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
  cursor:pointer;font-size:13.5px;color:var(--text-dim);transition:.16s;
  border:1px solid transparent;position:relative;font-weight:500;
}
.navitem:hover{background:var(--surface2);color:var(--text)}
.navitem.active{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.navitem.active::before{content:'';position:absolute;left:-10px;top:50%;translate:0 -50%;width:3px;height:18px;border-radius:9px;background:var(--accent)}
.navitem i{font-style:normal;font-size:15px;width:20px;text-align:center;flex-shrink:0}
.navitem .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--ok);opacity:0;transition:.2s;flex-shrink:0}
.navitem.done .dot{opacity:1}
.navitem .pill{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:6px;background:var(--new);color:#fff}
.sidefoot{padding:12px 14px;border-top:1px solid var(--border-soft);display:flex;align-items:center;gap:10px}
.ring{width:42px;height:42px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.sidefoot .lv{font-size:12px;line-height:1.3}
.sidefoot .lv b{display:block;font-size:12.5px}
.sidefoot .lv span{color:var(--muted);font-size:10.5px}
.iconbtn{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text-dim);cursor:pointer;display:grid;place-items:center;
  font-size:14px;transition:.16s;flex-shrink:0
}
.iconbtn.push{margin-left:auto}
.iconbtn:hover{border-color:var(--accent);color:var(--text);transform:translateY(-1px)}

main{flex:1;min-width:0;padding:34px 44px 90px;max-width:1080px;margin:0 auto;width:100%}
.burger{display:none}
.scrim{display:none}

/* ============ TYPO ============ */
h2.page{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-bottom:6px}
.page-sub{color:var(--text-dim);font-size:15px;margin-bottom:28px;max-width:70ch}
h3.sec{font-size:20px;font-weight:700;letter-spacing:-.4px;margin:34px 0 12px;display:flex;align-items:center;gap:10px}
h3.sec::before{content:'';width:4px;height:19px;border-radius:9px;background:linear-gradient(var(--accent),var(--accent-c))}
p{color:var(--text-dim);margin-bottom:12px;font-size:14.8px}
p strong,li strong,td strong{color:var(--text);font-weight:600}
ul.bul{margin:0 0 14px 2px;list-style:none}
ul.bul li{color:var(--text-dim);font-size:14.6px;padding-left:20px;position:relative;margin-bottom:7px}
ul.bul li::before{content:'\25B8';position:absolute;left:2px;color:var(--accent-b);font-size:12px;top:1px}
code.inl{
  font-family:var(--fm);font-size:.855em;padding:2px 6px;border-radius:6px;
  background:color-mix(in srgb,var(--accent) 15%,transparent);
  color:var(--accent-b);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
  overflow-wrap:anywhere;
}
[data-theme="light"] code.inl{color:#6d28d9}
a{color:var(--accent-b)}

/* ============ CODE ============ */
.codewrap{
  border-radius:var(--radius-s);overflow:hidden;margin:6px 0 18px;
  border:1px solid #232845;background:#0d1020;box-shadow:var(--shadow)
}
.codehead{
  display:flex;align-items:center;gap:8px;padding:7px 12px;background:#141935;
  border-bottom:1px solid #232845;font-size:11px;color:#8890bd;font-weight:600;letter-spacing:.4px
}
.codehead .dots{display:flex;gap:5px;margin-right:4px}
.codehead .dots i{width:9px;height:9px;border-radius:50%;background:#333a63;display:block}
.codehead .dots i:first-child{background:#f0526d}
.codehead .dots i:nth-child(2){background:#f5b53f}
.codehead .dots i:nth-child(3){background:#3ecf8e}
.copy{
  margin-left:auto;background:transparent;border:1px solid #2c3257;color:#8890bd;
  font-family:inherit;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:7px;cursor:pointer;transition:.16s
}
.copy:hover{border-color:var(--accent);color:#fff}
.copy.ok{border-color:var(--ok);color:var(--ok)}
pre{
  margin:0;padding:15px 16px;overflow-x:auto;font-family:var(--fm);
  font-size:13px;line-height:1.72;color:#c9d0f5;tab-size:2
}
pre .c{color:#5d6592;font-style:italic}
pre .s{color:#8ee6a8}
pre .v{color:#8ecdf5}
pre .kw{color:#f472b6;font-weight:600}
pre .ty{color:#fbbf24}
pre .fn{color:#a78bfa}
pre .cls{color:#5ee3d1}
pre .n{color:#fca17d}
pre .o{color:#8b93bd}
pre .at{color:#f9a8d4;font-weight:600}
pre .tag{color:#f472b6;font-weight:700}

/* ============ CARDS / CALLOUTS ============ */
.card{
  background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--border-soft);
  border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;transition:.2s
}
.grid{display:grid;gap:14px;margin-bottom:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(285px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.callout{
  border-radius:var(--radius-s);padding:13px 16px 13px 44px;margin:6px 0 18px;position:relative;
  font-size:14.2px;border:1px solid;line-height:1.62;color:var(--text-dim)
}
.callout::before{position:absolute;left:14px;top:12px;font-size:16px}
.callout b,.callout strong{font-weight:700;color:var(--text)}
.callout.tip{background:color-mix(in srgb,var(--accent-c) 11%,transparent);border-color:color-mix(in srgb,var(--accent-c) 30%,transparent)}
.callout.tip::before{content:'\1F4A1'}
.callout.warn{background:color-mix(in srgb,var(--warn) 11%,transparent);border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.callout.warn::before{content:'\26A0\FE0F'}
.callout.itw{background:color-mix(in srgb,var(--accent) 13%,transparent);border-color:color-mix(in srgb,var(--accent) 34%,transparent)}
.callout.itw::before{content:'\1F3A4'}
.callout.new{background:color-mix(in srgb,var(--new) 12%,transparent);border-color:color-mix(in srgb,var(--new) 32%,transparent)}
.callout.new::before{content:'\2728'}
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.5px;
  padding:3px 9px;border-radius:99px;text-transform:uppercase;white-space:nowrap
}
.b-new{background:color-mix(in srgb,var(--new) 20%,transparent);color:var(--new)}
.b-dep{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.b-brk{background:color-mix(in srgb,var(--err) 20%,transparent);color:var(--err)}
.b-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.b-v{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent-b)}

.tbwrap{overflow-x:auto;margin:4px 0 20px;-webkit-overflow-scrolling:touch}
.tbwrap table.tb{margin:0;min-width:320px}
table.tb{width:100%;border-collapse:collapse;margin:4px 0 20px;font-size:13.8px;border:1px solid var(--border-soft);border-radius:var(--radius-s);overflow:hidden}
table.tb td{word-break:break-word}
table.tb th{text-align:left;padding:10px 14px;background:var(--surface2);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
table.tb td{padding:10px 14px;border-top:1px solid var(--border-soft);color:var(--text-dim);vertical-align:top}
table.tb tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}

/* ============ HOME ============ */
.hero{
  border-radius:24px;padding:38px 36px;margin-bottom:26px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--surface)),color-mix(in srgb,var(--accent-c) 16%,var(--surface)));
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
}
.hero::after{
  content:'';position:absolute;right:-70px;top:-70px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent-c) 34%,transparent),transparent 70%)
}
.hero .v{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:1px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:99px;margin-bottom:16px}
.hero h2{font-size:42px;font-weight:800;letter-spacing:-1.6px;line-height:1.05;margin-bottom:10px;position:relative}
.hero p{font-size:16px;color:var(--text);opacity:.85;max-width:56ch;position:relative;margin-bottom:22px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.btn{
  font-family:inherit;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:12px;
  border:1px solid transparent;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:8px
}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px -12px rgba(0,0,0,.8)}
.btn.ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:var(--text)}
.btn.ghost:hover{background:rgba(255,255,255,.2)}
.btn.solid{background:var(--accent);color:#fff}
.btn.solid:hover{background:var(--accent-b);transform:translateY(-2px)}
.btn.line{background:var(--surface2);border-color:var(--border);color:var(--text-dim)}
.btn.line:hover{border-color:var(--accent);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

.stat{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:18px 20px;display:flex;flex-direction:column;gap:2px
}
.stat b{font-size:28px;font-weight:800;letter-spacing:-1px;background:linear-gradient(120deg,var(--accent-b),var(--accent-c));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.stat span{font-size:12px;color:var(--muted);font-weight:500}

.tilelink{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:18px 20px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden
}
.tilelink:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:var(--shadow)}
.tilelink .ic{font-size:22px;margin-bottom:4px}
.tilelink b{font-size:15px;font-weight:700;letter-spacing:-.2px}
.tilelink span{font-size:12.8px;color:var(--muted);line-height:1.5}
.tilelink .arw{position:absolute;right:16px;top:16px;opacity:0;transition:.2s;color:var(--accent-b)}
.tilelink:hover .arw{opacity:1;transform:translateX(3px)}
.prog{height:6px;border-radius:99px;background:var(--surface3);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-c));transition:width .5s cubic-bezier(.3,1,.4,1)}

/* ============ LESSON PAGE ============ */
.crumbs{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumbs span.k{color:var(--accent-b);font-weight:600}
.pagenav{display:flex;gap:12px;margin-top:40px;padding-top:24px;border-top:1px solid var(--border-soft)}
.pagenav button{flex:1;text-align:left}
.pagenav button.r{text-align:right}
.donebar{
  display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border-soft);
  border-radius:var(--radius-s);padding:12px 16px;margin:26px 0 0;flex-wrap:wrap
}
.donebar span{font-size:13.5px;color:var(--text-dim)}
.chk{
  width:22px;height:22px;border-radius:7px;border:2px solid var(--border);display:grid;place-items:center;
  cursor:pointer;transition:.18s;font-size:12px;color:transparent;flex-shrink:0;background:var(--surface2)
}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06281c}

/* ============ QUIZ ============ */
.qhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.qhead .meta{font-size:12.5px;color:var(--muted);font-weight:600}
.qbar{flex:1;min-width:140px;height:8px;border-radius:99px;background:var(--surface3);overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-c));transition:width .4s}
.streak{font-size:12.5px;font-weight:700;color:var(--warn)}
.qcard{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:26px 28px;margin-bottom:16px}
.qcat{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent-b);margin-bottom:10px}
.qtext{font-size:19px;font-weight:600;letter-spacing:-.3px;line-height:1.45;margin-bottom:18px;color:var(--text)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface2);cursor:pointer;transition:.16s;
  font-size:14.5px;color:var(--text-dim);text-align:left;font-family:inherit;line-height:1.5
}
.opt:hover:not(.locked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface2));color:var(--text);transform:translateX(3px)}
.opt .key{
  width:24px;height:24px;border-radius:7px;background:var(--surface3);display:grid;place-items:center;
  font-size:11.5px;font-weight:700;flex-shrink:0;color:var(--muted);font-family:var(--fm);margin-top:1px
}
.opt code{font-family:var(--fm);font-size:.9em}
.opt.locked{cursor:default}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--text)}
.opt.good .key{background:var(--ok);color:#06281c}
.opt.bad{border-color:var(--err);background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--text)}
.opt.bad .key{background:var(--err);color:#3d0713}
.opt.dim{opacity:.45}
.expl{
  margin-top:16px;padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.62;
  background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);
  animation:slideIn .28s cubic-bezier(.3,1,.4,1)
}
.expl b{color:var(--text)}
.expl .verdict{display:block;font-weight:700;margin-bottom:6px;font-size:14.5px}
.expl .verdict.ok{color:var(--ok)}
.expl .verdict.no{color:var(--err)}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.result{text-align:center;padding:40px 24px}
.result .score{font-size:64px;font-weight:800;letter-spacing:-3px;background:linear-gradient(120deg,var(--accent-b),var(--accent-c));-webkit-background-clip:text;background-clip:text;color:transparent}
.result h3{font-size:24px;font-weight:700;margin-bottom:8px}
.result p{max-width:46ch;margin:0 auto 22px}
.reviewlist{text-align:left;margin-top:28px}
.revitem{padding:12px 16px;border-radius:11px;border:1px solid var(--border-soft);background:var(--surface2);margin-bottom:8px;font-size:13.6px;color:var(--text-dim);display:flex;gap:10px}
.revitem b{flex-shrink:0}

/* ============ FLASHCARDS ============ */
.fcstage{perspective:1600px;margin:0 auto 20px;max-width:620px}
.fc{
  position:relative;width:100%;min-height:290px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .62s cubic-bezier(.4,.2,.2,1)
}
.fc.flip{transform:rotateY(180deg)}
.fcface{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:30px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);overflow:auto
}
.fcface.back{transform:rotateY(180deg);background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface));align-items:flex-start;text-align:left;justify-content:flex-start}
.fcface .tagline{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-b);margin-bottom:14px}
.fcface .q{font-size:23px;font-weight:700;letter-spacing:-.5px;line-height:1.35}
.fcface .hint{margin-top:auto;padding-top:18px;font-size:11.5px;color:var(--muted)}
.fcface.back .a{font-size:14.6px;color:var(--text-dim);line-height:1.66;width:100%}
.fcface.back .a code.inl{white-space:normal}

<script>
/* =========================================================================
   PHP 8.5 Academy — application mono-fichier
   Cours en français, terminologie technique en anglais.
   ========================================================================= */

/* ---------- utils ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md  = t => esc(t)
  .replace(/\[\[([\s\S]*?)\]\](?!\])/g, '<code class="inl">$1</code>')
  .replace(/`([^`]+)`/g, '<code class="inl">$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

const KW = new Set(['abstract','and','as','break','case','catch','class','clone','const','continue','declare','default','do','echo','else','elseif','empty','enum','extends','final','finally','fn','for','foreach','function','global','goto','if','implements','include','include_once','instanceof','insteadof','interface','isset','list','match','namespace','new','or','print','private','protected','public','readonly','require','require_once','return','static','switch','throw','trait','try','unset','use','var','while','xor','yield','exit','die']);
const TY = new Set(['int','float','string','bool','object','mixed','void','never','null','false','true','self','parent','iterable','this','array','callable']);

const RE_PHP = /(?:<<<(['"]?)([A-Za-z_]\w*)\1[\s\S]*?\n[ \t]*\2)|(\/\*[\s\S]*?\*\/)|(\/\/[^\n]*)|(#\[)|(#[^\n]*)|('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*")|(\$[A-Za-z_]\w*)|(<\?php|<\?=|\?>)|(\b\d[\d_]*(?:\.[\d_]+)?(?:[eE][+-]?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|(\|>|\?->|<=>|\?\?=|\?\?|===|!==|=>|->|::|\.{3}|[-+*\/%=<>!&|^~?:.])/g;

function hl(code){
  let out = '', last = 0, m;
  RE_PHP.lastIndex = 0;
  while ((m = RE_PHP.exec(code)) !== null){
    if (m.index === RE_PHP.lastIndex) { RE_PHP.lastIndex++; continue; }
    out += esc(code.slice(last, m.index));
    last = RE_PHP.lastIndex;
    const t = m[0];
    if (m[2] !== undefined)      out += '<span class="s">' + esc(t) + '</span>';
    else if (m[3] || m[4] || m[6]) out += '<span class="c">' + esc(t) + '</span>';
    else if (m[5])               out += '<span class="at">' + esc(t) + '</span>';
    else if (m[7])               out += '<span class="s">' + esc(t) + '</span>';
    else if (m[8])               out += '<span class="v">' + esc(t) + '</span>';
    else if (m[9])               out += '<span class="tag">' + esc(t) + '</span>';
    else if (m[10])              out += '<span class="n">' + esc(t) + '</span>';
    else if (m[11]){
      const low = t.toLowerCase();
      const rest = code.slice(RE_PHP.lastIndex);
      const isCall = /^\s*\(/.test(rest);
      let cls = '';
      if (KW.has(low)) cls = 'kw';
      else if (TY.has(low)) cls = 'ty';
      else if (isCall) cls = 'fn';
      else if (/^[A-Z]/.test(t)) cls = 'cls';
      out += cls ? '<span class="' + cls + '">' + esc(t) + '</span>' : esc(t);
    }
    else out += '<span class="o">' + esc(t) + '</span>';
  }
  out += esc(code.slice(last));
  return out;
}

let cbId = 0;
const CODE_STORE = {};
function codeBlock(src, label){
  const id = 'cb' + (cbId++);
  CODE_STORE[id] = src;
  return '<div class="codewrap"><div class="codehead"><span class="dots"><i></i><i></i><i></i></span>'
    + esc(label || 'PHP')
    + '<button class="copy" onclick="copyCode(this,\'' + id + '\')">Copier</button></div>'
    + '<pre><code>' + hl(src) + '</code></pre></div>';
}
function copyCode(btn, id){
  navigator.clipboard.writeText(CODE_STORE[id]).then(() => {
    btn.textContent = 'Copié !'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copier'; btn.classList.remove('ok'); }, 1400);
  }).catch(() => toast('Copie impossible dans ce contexte'));
}

function blocks(list){
  return list.map(b => {
    const [t, a, c] = b;
    switch(t){
      case 'p':    return '<p>' + md(a) + '</p>';
      case 'h':    return '<h3 class="sec">' + md(a) + '</h3>';
      case 'ul':   return '<ul class="bul">' + a.map(x => '<li>' + md(x) + '</li>').join('') + '</ul>';
      case 'code': return codeBlock(a, c);
      case 'tip':  return '<div class="callout tip">' + md(a) + '</div>';
      case 'warn': return '<div class="callout warn">' + md(a) + '</div>';
      case 'itw':  return '<div class="callout itw"><b>En entretien :</b> ' + md(a) + '</div>';
      case 'new':  return '<div class="callout new">' + md(a) + '</div>';
      case 'table':return '<div class="tbwrap"><table class="tb"><thead><tr>' + a[0].map(x => '<th>' + md(x) + '</th>').join('')
                   + '</tr></thead><tbody>' + a.slice(1).map(r => '<tr>' + r.map(x => '<td>' + md(x) + '</td>').join('') + '</tr>').join('')
                   + '</tbody></table></div>';
      default: return '';
    }
  }).join('');
}

/* =========================================================================
   DONNÉES — LES BASES
   ========================================================================= */
const MODULES = [
{
id:'types', icon:'\u{1F524}', title:'Types & variables', sub:'Le type system de PHP moderne : strict types, unions, readonly.',
blocks:[
['p',"PHP est un langage **dynamically typed** mais **gradually typed** : on peut déclarer des types partout (paramètres, retours, propriétés, constantes) et laisser le moteur les vérifier à l'exécution (runtime)."],
['code',`<?php
declare(strict_types=1); // ← toujours, en première ligne de CHAQUE fichier

$name   = 'Marie';        // string
$age    = 37;             // int
$ratio  = 1.5;            // float
$active = true;           // bool
$tags   = ['php', 'sql']; // array
$nothing = null;          // null

var_dump(get_debug_type($age)); // string(3) "int"  (PHP 8.0+, préférez-le à gettype)`,'Types scalaires'],
['h','declare(strict_types=1) : la ligne qui change tout'],
['p',"Sans elle, PHP est en **coercive mode** : il convertit silencieusement les valeurs. Avec elle, un mauvais type lève une [[TypeError]]. C'est le réflexe attendu d'un développeur senior."],
['code',`<?php
function add(int $a, int $b): int { return $a + $b; }

// coercive mode (par défaut)
add('5', '10');   // 15  — les strings numériques sont converties

// strict_types=1
add('5', '10');   // TypeError: add(): Argument #1 ($a) must be of type int, string given`,'Coercive vs strict'],
['warn',"[[strict_types]] s'applique **au fichier appelant**, pas au fichier appelé. C'est une question piège classique en entretien."],
['h','Les types disponibles'],
['table',[
['Type','Depuis','Note'],
['[[int]] [[float]] [[string]] [[bool]]','5.0 / 7.0','scalar types'],
['[[array]] [[object]] [[callable]] [[iterable]]','—','[[callable]] interdit sur les propriétés'],
['[[void]]','7.1','la fonction ne retourne rien'],
['[[?Type]] (nullable)','7.1','sucre syntaxique pour [[Type|null]]'],
['[[mixed]]','8.0','« tout », y compris null'],
['[[static]] (return)','8.0','late static binding, pour les fluent APIs'],
['[[A|B]] union types','8.0','« l\'un ou l\'autre »'],
['[[never]]','8.1','la fonction **ne rend jamais la main** (throw ou exit)'],
['[[A&B]] intersection types','8.1','doit satisfaire les deux interfaces'],
['[[null]] [[false]] [[true]] seuls','8.2','types autonomes'],
['[[(A&B)|null]] DNF types','8.2','Disjunctive Normal Form'],
]],
['code',`<?php
declare(strict_types=1);

function findUser(int $id): ?User { /* … */ }              // nullable return
function parse(string|Stringable $input): array { /* … */ } // union type
function render(Countable&Traversable $c): string { /* … */ } // intersection
function fail(string $msg): never { throw new RuntimeException($msg); }

// DNF (8.2) : combinaison d'union et d'intersection
function handle((Countable&Traversable)|null $items): void {}`,'Types composés'],
['h','readonly : l\'immuabilité intégrée'],
['code',`<?php
final class Money
{
    public function __construct(
        public readonly int $amount,
        public readonly string $currency,
    ) {}
}

$m = new Money(1000, 'EUR');
$m->amount = 20; // Error: Cannot modify readonly property Money::$amount

// PHP 8.2 : toute la classe en readonly
final readonly class Point
{
    public function __construct(public int $x, public int $y) {}
}`,'readonly properties (8.1) et readonly classes (8.2)'],
['ul',[
"Une propriété [[readonly]] ne peut être **initialisée qu'une fois**, depuis l'intérieur de la classe (scope de déclaration).",
"[[readonly]] exige un type déclaré : pas de [[readonly]] sans type.",
"Ce n'est pas un [[const]] : la valeur est décidée à l'exécution, pas à la compilation.",
"Jusqu'à PHP 8.4 inclus, modifier une propriété readonly dans [[__clone]] est autorisé (depuis 8.3) — PHP 8.5 ajoute [[clone with]] pour faire ça proprement."
]],
['h','Constantes'],
['code',`<?php
define('LEGACY_MODE', true);      // runtime, déconseillé
const APP_NAME = 'Billing';       // compile time, scopé au namespace

class Config
{
    const int MAX_RETRY = 3;      // PHP 8.3 : typed class constant
    final const string ENV = 'prod'; // PHP 8.1 : final const (interdit l'override)
}

echo Config::MAX_RETRY;
$k = 'MAX_RETRY';
echo Config::{$k};                // PHP 8.3 : dynamic class constant fetch`,'Constantes'],
['h','Comparaisons & type juggling'],
['table',[
['Expression','PHP 7','PHP 8+'],
['[[0 == "foo"]]','true','**false**'],
['[[0 == ""]]','true','**false**'],
['[["abc" == 0]]','true','**false**'],
['[["1" == "01"]]','true','true (numériques des deux côtés)'],
['[[100 == "1e2"]]','true','true'],
['[[null == false]]','true','true'],
]],
['tip',"Depuis PHP 8.0 (**Saner string to number comparisons**), quand on compare un nombre à une string non numérique, c'est **le nombre qui est converti en string**. Utilisez [[===]] par défaut : c'est la seule comparaison sans surprise."],
['itw',"« Quelle est la différence entre [[==]] et [[===]] ? » puis « et entre [[isset()]], [[empty()]] et [[is_null()]] ? ». Réponse courte : [[isset()]] = existe et n'est pas null ; [[empty()]] = falsy (0, '', '0', [], null, false) ; [[is_null()]] = strictement null."]
]},

{
id:'strings', icon:'\u{1F9F5}', title:'Strings', sub:'Interpolation, heredoc, fonctions modernes et multibyte.',
blocks:[
['p',"Quatre façons d'écrire une string : simple quote (aucune interpolation), double quote (interpolation), **heredoc** (= double quote multi-ligne) et **nowdoc** (= simple quote multi-ligne)."],
['code',`<?php
$user = 'Marie';
$arr  = ['key' => 'value'];
$obj  = new stdClass(); $obj->name = 'Léa';

echo 'Bonjour $user';          // Bonjour $user  (littéral)
echo "Bonjour $user";          // Bonjour Marie
echo "Clé : {$arr['key']}";    // syntaxe {$…} : toujours la préférer
echo "Nom : {$obj->name}";

$html = <<<HTML
    <p>Bonjour {$user}</p>
    <p>Bienvenue.</p>
    HTML;   // PHP 7.3+ : l'indentation du marqueur final est retirée

$raw = <<<'SQL'
    SELECT * FROM users WHERE name = $notInterpolated
    SQL;`,'Interpolation & heredoc/nowdoc'],
['h','Les fonctions à connaître'],
['code',`<?php
str_contains('Hello World', 'World');     // true   — PHP 8.0
str_starts_with('Hello', 'He');           // true   — PHP 8.0
str_ends_with('image.png', '.png');       // true   — PHP 8.0

str_pad('7', 3, '0', STR_PAD_LEFT);       // "007"
str_repeat('-', 20);
substr('abcdef', 1, 3);                   // "bcd"
ucfirst('marie'); ucwords('marie curie'); strtolower('ÉTÉ');
trim("  x \\n"); rtrim('a/b/', '/');
explode(',', 'a,b,c');                    // ['a','b','c']
implode(' | ', ['a','b']);                // "a | b"
str_replace(['a','b'], ['1','2'], 'ab');  // "12"
sprintf('%s a %d ans (%.2f)', 'Marie', 37, 1.5); // formatage
number_format(1234.567, 2, ',', ' ');     // "1 234,57"
nl2br("a\\nb"); strrev('abc'); str_split('abcdef', 2);
preg_match('/^\\d{5}$/', '75001', $m);     // regex PCRE
preg_replace_callback('/\\d+/', fn($m) => $m[0] * 2, 'a1b2');`,'Boîte à outils'],
['warn',"Avant PHP 8.0 on utilisait [[strpos(\$h, \$n) !== false]]. [[str_contains()]] est plus lisible **et** évite le bug classique du [[!= false]] quand la position vaut 0."],
['h','Multibyte : le piège UTF-8'],
['code',`<?php
$s = 'Crème brûlée';
strlen($s);        // 15  ← octets !
mb_strlen($s);     // 12  ← caractères

strtoupper($s);    // "CRèME BRûLéE"  (cassé)
mb_strtoupper($s); // "CRÈME BRÛLÉE"

mb_substr($s, 0, 5);      // "Crème"
mb_str_pad($s, 20);       // PHP 8.3
mb_trim($s);              // PHP 8.4
grapheme_strlen('👨‍👩‍👧');  // 1  — un grapheme, plusieurs code points`,'mb_* vs fonctions binaires'],
['tip',"Règle simple : dès qu'il s'agit de **texte affiché à un humain**, utilisez les fonctions [[mb_*]]. Les fonctions historiques travaillent sur des **bytes**, pas des caractères."],
['h','Sécurité : échapper au bon endroit'],
['code',`<?php
// Sortie HTML
echo htmlspecialchars($userInput, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');

// Sortie JSON
echo json_encode($data, JSON_THROW_ON_ERROR | JSON_UNESCAPED_UNICODE);

// SQL : JAMAIS de concaténation — voir le module « Web, DB & sécurité »

['itw',"« Comment éviter une faille XSS ? » Réponse : échapper **à la sortie**, dans le contexte de sortie (HTML, attribut, JS, URL), jamais « nettoyer » à l'entrée. En pratique, on délègue au moteur de template (Twig auto-escape, Blade [[{{ }}]])."]
]},

{
id:'arrays', icon:'\u{1F4DA}', title:'Arrays', sub:'Le couteau suisse de PHP : listes, maps, spread, destructuring.',
blocks:[
['p',"En PHP, un [[array]] est en réalité une **ordered hash map**. Il sert à la fois de liste (clés 0..n) et de dictionnaire (clés string). [[array_is_list()]] (PHP 8.1) dit si c'est une vraie liste."],
['code',`<?php
$list = ['php', 'sql', 'js'];              // clés 0,1,2
$map  = ['name' => 'Marie', 'age' => 37];  // clés string
$mixed = [1, 'a' => 2, 3];                 // légal mais à éviter

array_is_list($list); // true   — PHP 8.1
array_is_list($map);  // false

$list[] = 'go';                 // push
unset($list[1]);                // supprime SANS réindexer
$list = array_values($list);    // réindexe`,'Deux natures, un seul type'],
['h','Spread & destructuring'],
['code',`<?php
$a = [1, 2];
$b = [0, ...$a, 3];                       // [0,1,2,3]

$x = ['a' => 1];
$y = ['b' => 2, ...$x];                   // PHP 8.1 : spread avec clés string

// destructuring
[$first, $second] = [10, 20];
['name' => $name, 'age' => $age] = $map;  // par clé
foreach ($rows as ['id' => $id, 'label' => $label]) { /* … */ }

[$a, $b] = [$b, $a];                      // swap`,'Unpacking'],
['h','Les fonctions array les plus utiles'],
['code',`<?php
$users = [
    ['name' => 'Marie', 'age' => 37, 'admin' => true],
    ['name' => 'Léo',   'age' => 24, 'admin' => false],
];

array_map(fn($u) => $u['name'], $users);        // ['Marie','Léo']
array_filter($users, fn($u) => $u['admin']);    // conserve les clés !
array_reduce($users, fn($c, $u) => $c + $u['age'], 0); // 61
array_column($users, 'name', 'age');            // [37=>'Marie', 24=>'Léo']
array_combine(['a','b'], [1,2]);
array_merge($a, $b);       // réindexe les clés numériques
$a + $b;                    // union : garde la clé de GAUCHE
array_unique($list); array_flip($map); array_fill(0, 3, null);
in_array('php', $list, true);  // ← le 3e argument strict est important
array_search('php', $list, true);
array_key_exists('name', $map); // ≠ isset() si la valeur est null
usort($users, fn($x, $y) => $x['age'] <=> $y['age']); // spaceship`,'Manipulation'],

id:'control', icon:'\u{1F500}', title:'Contrôle de flux', sub:'match, null coalescing, nullsafe, boucles.',
blocks:[
['h','match (PHP 8.0) : le switch sans les pièges'],
['code',`<?php
$statusCode = 403;

// switch : comparaison lâche (==), fallthrough, ne retourne rien
switch ($statusCode) {
    case 403: $label = 'Interdit'; break;
    default:  $label = 'Inconnu';
}

// match : comparaison stricte (===), expression, exhaustif
$label = match ($statusCode) {
    200, 201, 204 => 'OK',
    301, 302      => 'Redirection',
    403           => 'Interdit',
    404           => 'Introuvable',
    default       => 'Inconnu',
};

// match(true) : remplace les cascades de if/elseif
$tier = match (true) {
    $amount >= 10000 => 'gold',
    $amount >= 1000  => 'silver',
    default          => 'bronze',
};`,'match'],
['table',[
['','[[switch]]','[[match]]'],
['Comparaison','[[==]] (lâche)','[[===]] (stricte)'],
['Nature','statement','**expression** (retourne une valeur)'],
['Fallthrough','oui, [[break]] obligatoire','non'],
['Cas non couvert','silencieux','[[UnhandledMatchError]]'],
['Corps multi-lignes','oui','une seule expression'],

$city = $user?->getAddress()?->getCity();  // marche aussi sur les méthodes

$value = $a ?: $b;                         // elvis : teste falsy, pas null !

['warn',"Le nullsafe operator ne **court-circuite que la chaîne d'accès**. [[\$a?->b(\$this->compute())]] : si [[\$a]] est null, [[compute()]] n'est pas appelé. En revanche [[foo(\$a?->b)]] appelle bien [[foo(null)]]."],

foreach ($users as $i => $user) { /* … */ }
foreach ($users as $key => &$value) { $value *= 2; }
unset($value); // ← INDISPENSABLE : sinon $value reste une référence sur le dernier élément

for ($i = 0; $i < 10; $i++) {}
while ($row = $stmt->fetch()) {}

declare(strict_types=1);

function slugify(string $text, string $separator = '-', bool $lower = true): string

['h','Variadics et spread'],
['code',`<?php
function sum(int ...$numbers): int
{
    return array_sum($numbers);

function log(string $level, string ...$lines): void {}`,'...$args'],

['code',`<?php
$multiplier = 3;

// closure classique : capture EXPLICITE via use
$times = function (int $n) use ($multiplier): int {
    return $n * $multiplier;
};

// arrow function (7.4) : capture IMPLICITE par valeur, une seule expression
$times = fn(int $n): int => $n * $multiplier;

// capture par référence
$total = 0;
$add = function (int $n) use (&$total): void { $total += $n; };

id:'oop', icon:'\u{1F3D7}', title:'POO : classes & objets', sub:'Constructor promotion, visibility, statics, magic methods, property hooks.',
blocks:[
['code',`<?php
declare(strict_types=1);

final class Invoice
{
    private array $lines = [];

    // constructor property promotion (PHP 8.0)
    public function __construct(
        public readonly string $reference,
        private Customer $customer,
        private string $currency = 'EUR',
    ) {}

    public function addLine(string $label, int $cents): static
    {
        $this->lines[] = compact('label', 'cents');
        return $this; // fluent interface
    }

    public function total(): int
    {
        return array_sum(array_column($this->lines, 'cents'));
    }
}

$invoice = (new Invoice('FA-001', $customer))
    ->addLine('Audit', 120000)
    ->addLine('Formation', 80000);`,'Une classe moderne'],
['tip',"La **constructor property promotion** supprime le triple boilerplate (propriété + paramètre + affectation). En PHP 8.5, on peut même écrire [[public final readonly string \$ref]] dans le constructeur."],
['h','Visibilité'],
['table',[
['Modificateur','Accessible depuis'],
['[[public]]','partout'],
['[[protected]]','la classe et ses enfants'],
['[[private]]','la classe de déclaration uniquement'],
['[[public private(set)]]','lecture publique, **écriture privée** — asymmetric visibility, PHP 8.4'],
]],
['code',`<?php
class Order
{
    // PHP 8.4 : asymmetric visibility
    public private(set) string $status = 'draft';

    public function pay(): void { $this->status = 'paid'; }
}

$o = new Order();
echo $o->status;     // OK
$o->status = 'paid'; // Error: Cannot modify private(set) property`,'Asymmetric visibility (8.4)'],
['h','static, self, parent, $this'],
['code',`<?php
class Model
{
    public static int $instances = 0;

    public static function create(): static   // late static binding
    {
        static::$instances++;
        return new static();                   // la classe RÉELLEMENT appelée
    }

    public function copySelf(): self { return new self(); } // toujours Model
}

class User extends Model {}

User::create();          // retourne un User
(new User())->copySelf(); // retourne un Model`,'self vs static'],
['warn',"[[self]] est résolu **à la compilation** (la classe où le code est écrit) ; [[static]] est résolu **à l'exécution** (late static binding). Pour une factory ou une fluent API héritable, utilisez toujours [[static]]."],
['h','Magic methods'],
['code',`<?php
class Bag implements Stringable
{
    private array $data = [];

    public function __get(string $k): mixed  { return $this->data[$k] ?? null; }
    public function __set(string $k, mixed $v): void { $this->data[$k] = $v; }
    public function __isset(string $k): bool { return isset($this->data[$k]); }
    public function __unset(string $k): void { unset($this->data[$k]); }
    public function __call(string $m, array $args): mixed { /* … */ }
    public static function __callStatic(string $m, array $args): mixed { /* … */ }
    public function __invoke(): string { return 'appelé comme une fonction'; }
    public function __toString(): string { return json_encode($this->data); }
    public function __clone(): void { /* deep copy des objets internes */ }
    public function __serialize(): array { return $this->data; }
    public function __unserialize(array $d): void { $this->data = $d; }
}`,'Les magic methods'],
['warn',"PHP 8.2 **déprécie les dynamic properties** : écrire [[\$obj->inconnu = 1]] sur une classe qui ne les déclare pas émet un deprecation (et sera une erreur en PHP 9). Solution : déclarer la propriété, ou l'attribut [[#[\\AllowDynamicProperties]]]. En 8.5, [[__sleep]] / [[__wakeup]] sont soft-deprecated au profit de [[__serialize]] / [[__unserialize]]."],
['h','Property hooks (PHP 8.4)'],
['code',`<?php
class Temperature
{
    public float $celsius = 0.0;

    public float $fahrenheit {
        get => $this->celsius * 9 / 5 + 32;
        set (float $value) { $this->celsius = ($value - 32) * 5 / 9; }
    }

    // hook sur une propriété « normale » : validation à l'écriture
    public string $email {
        set (string $value) {
            if (!filter_var($value, FILTER_VALIDATE_EMAIL)) {
                throw new InvalidArgumentException('Email invalide');
            }
            $this->email = $value;
        }
    }
}`,'Getters/setters natifs'],

// PHP 8.4 : plus besoin de parenthèses autour de « new »
$name = new ReflectionClass($obj)->getShortName();

{
    public function __construct(

    ) {}
}`,'new sans parenthèses (8.4)'],

interface PaymentGateway
{
    public const string VERSION = '2';   // PHP 8.3 : typed constant

interface Refundable

final class StripeGateway implements PaymentGateway, Refundable

abstract class Repository
{
    public function __construct(protected PDO $pdo) {}

    abstract protected function table(): string;   // à implémenter

    public function find(int $id): ?array          // comportement partagé
    {
        $stmt = $this->pdo->prepare("SELECT * FROM {$this->table()} WHERE id = :id");
        $stmt->execute(['id' => $id]);
        return $stmt->fetch(PDO::FETCH_ASSOC) ?: null;
    }
}

final class UserRepository extends Repository
{

trait Timestampable
{
    private ?DateTimeImmutable $createdAt = null;

    public function touch(): void
    {

    }

final class Article

    const string SOURCE = 'cms';  // PHP 8.2 : constantes dans les traits

}`,'trait'],

        Csv::export insteadof Excel;

id:'enums', icon:'\u{1F39B}', title:'Enums', sub:'PHP 8.1 : des types énumérés vrais, pas des constantes déguisées.',
blocks:[
['p',"Avant 8.1, on simulait les enums avec des constantes de classe : aucune garantie de type, n'importe quelle string pouvait passer. L'enum est un **vrai type**, donc type-hintable."],
['code',`<?php
enum Suit                    // pure enum : pas de valeur scalaire
{
    case Hearts;
    case Spades;
}

enum Status: string          // backed enum : adossée à un int ou une string
{
    case Draft     = 'draft';
    case Published = 'published';
    case Archived  = 'archived';

    public function label(): string
    {
        return match ($this) {
            Status::Draft     => 'Brouillon',
            Status::Published => 'Publié',
            Status::Archived  => 'Archivé',
        };
    }

    public function isEditable(): bool
    {
        return $this !== self::Archived;
    }

    public static function default(): self { return self::Draft; }
}`,'Pure enum vs backed enum'],
['code',`<?php
Status::Published->value;          // 'published'
Status::Published->name;           // 'Published'
Status::cases();                   // [Status::Draft, Status::Published, Status::Archived]

Status::from('draft');             // Status::Draft
Status::from('boom');              // ValueError
Status::tryFrom('boom');           // null   ← à privilégier sur des données externes

function publish(Status $status): void {}  // impossible de passer autre chose`,'API d\'un enum'],
['h','Enum + interface + constante'],
['code',`<?php
interface HasColor { public function color(): string; }

enum Level: int implements HasColor
{
    case Info    = 1;
    case Warning = 2;
    case Error   = 3;

    const Level DEFAULT = self::Info;   // constante dans l'enum

    public function color(): string
    {
        return match($this) {
            self::Info    => 'blue',
            self::Warning => 'orange',
            self::Error   => 'red',
        };
    }
}`,'Enums avancés'],
['ul',[
"Un enum est un **singleton par case** : [[Status::Draft === Status::Draft]] est toujours vrai, on compare avec [[===]].",
"Un enum **ne peut pas avoir d'état** : pas de propriétés, uniquement des méthodes et des constantes.",
"Un enum ne peut pas être instancié ni étendu ; il peut implémenter des interfaces et utiliser des traits.",
"[[UnitEnum]] et [[BackedEnum]] sont les interfaces natives ; [[JsonSerializable]] est utile pour contrôler la sérialisation."
]],
['tip',"Combo gagnant en entretien : [[match(\$this)]] dans l'enum + [[tryFrom()]] à la frontière (HTTP, DB). Vous montrez que vous savez où valider les données externes."],
['itw',"« Comment persister un enum en base ? » — Doctrine gère nativement les backed enums via [[enumType]] ; sinon on stocke [[->value]] et on relit avec [[tryFrom()]] en gérant le cas null (donnée legacy invalide)."]
]},

id:'errors', icon:'\u{1F6A8}', title:'Erreurs & exceptions', sub:'Throwable, hiérarchie, try/catch/finally, handlers globaux.',
blocks:[
['code',`<?php
// Hiérarchie
Throwable (interface)
 ├── Error                      ← erreurs du moteur, NE PAS rattraper à la légère
 │    ├── TypeError
 │    ├── ValueError            (8.0)
 │    ├── ArithmeticError → DivisionByZeroError
 │    ├── ArgumentCountError
 │    └── UnhandledMatchError   (8.0)
 └── Exception                  ← erreurs métier
      ├── RuntimeException      → LogicException est son pendant « bug du dev »
      ├── InvalidArgumentException
      ├── JsonException
      └── PDOException`,'La hiérarchie Throwable'],
['tip',"Règle mentale : **[[LogicException]] = bug de programmation** (à corriger, pas à rattraper) ; **[[RuntimeException]] = accident d'exécution** (réseau, fichier, DB) qu'on peut gérer."],
['code',`<?php
declare(strict_types=1);

final class PaymentDeclined extends RuntimeException
{
    public function __construct(
        public readonly string $reference,
        string $message = 'Paiement refusé',
        ?Throwable $previous = null,
    ) {
        parent::__construct($message, 402, $previous);
    }
}

try {
    $gateway->charge($amount, $token);
} catch (PaymentDeclined $e) {
    $logger->warning($e->getMessage(), ['ref' => $e->reference]);
    return Response::error(402);
} catch (NetworkException | TimeoutException $e) {   // multi-catch (7.1)
    throw new PaymentDeclined($ref, previous: $e);   // exception chaining
} catch (Throwable) {                                 // non-capturing catch (8.0)
    return Response::error(500);
} finally {
    $gateway->close();   // toujours exécuté
}`,'Exceptions métier'],
['ul',[
"[[finally]] s'exécute **même après un [[return]]** dans le [[try]] ou le [[catch]].",
"Chaîner avec [[previous]] conserve la cause racine — indispensable pour le debug.",
"[[catch (Throwable)]] sans variable (PHP 8.0) quand on n'utilise pas l'objet.",
"Ne rattrapez jamais [[Throwable]] pour le **silencer** : loggez ou relancez."
]],
['h','Handlers globaux'],
['code',`<?php
set_error_handler(static function (int $no, string $str, string $file, int $line): bool {
    throw new ErrorException($str, 0, $no, $file, $line); // warnings → exceptions
});

set_exception_handler(static function (Throwable $e): void {
    error_log((string) $e);
    http_response_code(500);
});

register_shutdown_function(static function (): void {
    $err = error_get_last();
    if ($err !== null && $err['type'] === E_ERROR) { /* fatal */ }
});

// PHP 8.5 : on peut enfin LIRE les handlers en place
$current = get_error_handler();      // ?callable
$currentEx = get_exception_handler(); // ?callable`,'Error & exception handlers'],
['new',"**PHP 8.5** ajoute les **backtraces sur les fatal errors** (ini [[fatal_error_backtraces=1]], activé par défaut) : un memory exhausted ou un timeout affiche enfin la stack trace. Énorme gain en production."],
['h','Le reporting'],
['code',`<?php
// php.ini — développement
error_reporting = E_ALL
display_errors = On

// php.ini — production
display_errors = Off
log_errors = On
error_log = /var/log/php/error.log`,'Configuration'],
['warn',"L'opérateur [[@]] (error suppression) est à bannir : il masque aussi les erreurs que vous n'attendiez pas. Depuis PHP 8, il ne masque plus les erreurs fatales."],
['itw',"« [[Error]] vs [[Exception]] ? » — les deux implémentent [[Throwable]], mais [[Error]] signale un problème **du moteur PHP** (type, division par zéro, méthode inexistante) et n'hérite **pas** de [[Exception]] : un [[catch (Exception \$e)]] ne les attrape pas. C'est un piège très fréquent."]
]},
);

        return slugify($c->name) . '-' . $date->format('Ymd');
    }
}`,'Namespaces'],
['ul',[
"[[namespace]] doit être la **première instruction** du fichier (après [[declare]]).",
"Un nom **sans antislash initial** est résolu relativement au namespace courant ; préfixé d'un antislash, il est absolu.",

]],

]],

{
id:'generators', icon:'\u{267E}', title:'Generators & iterators', sub:'Traiter des millions de lignes sans exploser la mémoire.',
blocks:[
['p',"Un **generator** est une fonction qui contient [[yield]]. Elle retourne un objet [[Generator]] (qui implémente [[Iterator]]) et produit ses valeurs **à la demande**, sans jamais construire le tableau complet en mémoire."],
['code',`<?php
// ❌ charge tout le fichier en RAM
function readAll(string $path): array
{
    return file($path);   // 2 Go de CSV = 2 Go de RAM
}

// ✅ lazy : une ligne à la fois
function readLines(string $path): Generator
{
    $handle = fopen($path, 'rb');
    try {
        while (($line = fgets($handle)) !== false) {
            yield rtrim($line, "\\r\\n");
        }
    } finally {
        fclose($handle);
    }
}

foreach (readLines('huge.csv') as $i => $line) {
    // mémoire constante, quel que soit le volume
}`,'Generator'],
['code',`<?php
function keyed(): Generator
{
    yield 'a' => 1;              // yield avec clé
    yield from ['b' => 2];       // délégation à un autre iterable
    $received = yield 3;         // valeur renvoyée par ->send()
    return 'terminé';            // récupérée via ->getReturn()
}

$gen = keyed();
$gen->current(); $gen->next(); $gen->send('x'); $gen->getReturn();`,'yield from, send, getReturn'],
['h','Iterator et IteratorAggregate'],
['code',`<?php
final class Collection implements IteratorAggregate, Countable, JsonSerializable
{
    public function __construct(private array $items = []) {}

    public function getIterator(): Generator
    {
        yield from $this->items;   // le plus simple
    }

    public function count(): int { return count($this->items); }
    public function jsonSerialize(): array { return $this->items; }

    public function map(callable $fn): static
    {
        return new static(array_map($fn, $this->items));
    }
}`,'Collection idiomatique'],
['tip',"Préférez [[IteratorAggregate]] à [[Iterator]] : une seule méthode ([[getIterator]]) au lieu de cinq ([[current]], [[key]], [[next]], [[rewind]], [[valid]])."],
['h','SPL : la bibliothèque standard'],
['table',[
['Classe','Usage'],
['[[ArrayObject]] / [[ArrayIterator]]','array manipulable comme un objet'],
['[[SplStack]] / [[SplQueue]]','LIFO / FIFO'],
['[[SplObjectStorage]]','set d\'objets, ou map objet → donnée'],
['[[SplFixedArray]]','tableau de taille fixe, mémoire réduite'],
['[[SplPriorityQueue]] / [[SplHeap]]','files à priorité'],
['[[WeakMap]] (8.0)','cache par objet sans empêcher le garbage collection'],
]],
['h','Fibers (PHP 8.1)'],
['code',`<?php
$fiber = new Fiber(function (string $start): string {
    $received = Fiber::suspend($start . ' → suspendu');
    return $received . ' → terminé';
});

$out = $fiber->start('début');   // 'début → suspendu'
$res = $fiber->resume('repris'); // le fiber reprend
$fiber->getReturn();             // 'repris → terminé'`,'Fibers'],
['itw',"« Generator vs Fiber ? » — un generator est une **coroutine unidirectionnelle** pilotée par l'appelant, conçue pour l'itération lazy. Un fiber est une **coroutine complète** qui peut se suspendre depuis n'importe quel niveau de la pile : c'est la brique bas niveau utilisée par ReactPHP, Amp, Swoole ou FrankenPHP pour l'asynchrone."]
]},

{
id:'attributes', icon:'\u{1F3F7}', title:'Attributes & Reflection', sub:'Métadonnées natives : la base des frameworks modernes.',
blocks:[
['p',"Les **attributes** (PHP 8.0) remplacent les annotations en docblock. Ce sont de vraies classes, vérifiées par le compilateur et lues via la **Reflection API**."],
['code',`<?php
#[Attribute(Attribute::TARGET_METHOD | Attribute::IS_REPEATABLE)]
final class Route
{
    public function __construct(
        public string $path,
        public string $method = 'GET',
        public ?string $name = null,
    ) {}
}

final class UserController
{
    #[Route('/users', name: 'user_index')]
    #[Route('/users/', method: 'POST')]
    public function index(): Response { /* … */ }
}`,'Définir et poser un attribute'],
['code',`<?php
$rc = new ReflectionClass(UserController::class);

foreach ($rc->getMethods() as $method) {
    foreach ($method->getAttributes(Route::class) as $attribute) {
        $route = $attribute->newInstance();   // instancie réellement l'objet Route
        $router->add($route->path, $route->method, [$rc->getName(), $method->getName()]);
    }
}`,'Les lire par Reflection'],
['h','Les attributes natifs'],
['table',[
['Attribute','Depuis','Rôle'],
['[[#[\\Attribute]]]','8.0','déclare qu\'une classe est un attribute'],
['[[#[\\ReturnTypeWillChange]]]','8.1','silence une incompatibilité de signature'],
['[[#[\\SensitiveParameter]]]','8.2','masque un argument dans les stack traces'],
['[[#[\\AllowDynamicProperties]]]','8.2','réautorise les propriétés dynamiques'],
['[[#[\\Override]]]','8.3','**erreur** si la méthode ne surcharge rien (8.5 : aussi sur les propriétés)'],
['[[#[\\Deprecated]]]','8.4','marque comme déprécié (8.5 : aussi les constantes et traits)'],
['[[#[\\NoDiscard]]]','8.5','warning si la valeur de retour est ignorée'],
['[[#[\\DelayedTargetValidation]]]','8.5','reporte la validation de cible à la Reflection'],
]],
['code',`<?php
final class Session
{
    #[\\Override]                    // garantit qu'on surcharge vraiment
    public function close(): void {}

    public function login(
        string $user,
        #[\\SensitiveParameter] string $password,  // n'apparaîtra pas dans les logs
    ): void {}
}

#[\\Deprecated(message: 'Utilisez Clock::now()', since: '3.2')]
function now(): DateTimeImmutable { return new DateTimeImmutable(); }`,'Attributes natifs en pratique'],
['new',"**PHP 8.5** : les attributes peuvent cibler les **constantes** ([[#[\\Deprecated] const OLD = 1;]]) et accepter des **closures** en argument, ce qui ouvre la porte à des attributs porteurs de logique."],
['h','Reflection : à quoi ça sert vraiment'],
['ul',[
"**Dependency injection containers** : lire les types du constructeur pour autowirer.",
"**Routing** : scanner les contrôleurs et leurs attributes.",
"**ORM** : mapper les propriétés vers des colonnes.",
"**Serializers / validators** : lire les contraintes déclarées.",
"**Tests** : instancier et inspecter du code privé."
]],
['warn',"La Reflection a un **coût**. Tous les frameworks sérieux la font tourner une fois puis **compilent le résultat en cache** (conteneur compilé Symfony, metadata cache Doctrine). Ne l'utilisez jamais dans une boucle chaude."],
['itw',"« Comment fonctionne l'autowiring de Symfony ? » — le conteneur utilise [[ReflectionMethod::getParameters()]] sur le constructeur, lit le [[ReflectionNamedType]] de chaque paramètre, résout le service correspondant, puis **compile** le tout en PHP dans le cache pour ne plus payer la Reflection à l'exécution."]
]},

{
id:'web', icon:'\u{1F512}', title:'Web, DB & sécurité', sub:'Requête HTTP, PDO, sessions, hashing, OWASP.',
blocks:[
['h','Le cycle de vie d\'une requête'],
['ul',[
"PHP est **share-nothing** : chaque requête part d'un état vierge, tout est détruit à la fin.",
"**PHP-FPM** gère un pool de workers ; le serveur web (nginx) lui passe la requête via FastCGI.",
"Les runtimes long-running (Swoole, RoadRunner, FrankenPHP) gardent le process vivant : attention aux **fuites d'état** dans les statics et singletons."
]],
['code',`<?php
$_GET; $_POST; $_SERVER; $_FILES; $_COOKIE; $_SESSION; $_ENV;

// Toujours valider / filtrer les entrées
$id    = filter_input(INPUT_GET, 'id', FILTER_VALIDATE_INT);
$email = filter_var($raw, FILTER_VALIDATE_EMAIL);
if ($id === false || $id === null) { http_response_code(400); exit; }

// PHP 8.4 : parser un body non-POST (PUT/PATCH multipart)
[$post, $files] = request_parse_body();`,'Superglobales & validation'],
['h','PDO : la seule bonne façon de parler à une base'],
['code',`<?php
$pdo = new PDO(
    'mysql:host=localhost;dbname=app;charset=utf8mb4',
    $user,
    $pass,
    [
        PDO::ATTR_ERRMODE            => PDO::ERRMODE_EXCEPTION, // défaut depuis 8.0
        PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
        PDO::ATTR_EMULATE_PREPARES   => false,  // vraies prepared statements
    ],
);

// ✅ prepared statement : les données ne sont JAMAIS interprétées comme du SQL
$stmt = $pdo->prepare('SELECT * FROM users WHERE email = :email AND active = :active');
$stmt->execute(['email' => $email, 'active' => 1]);
$user = $stmt->fetch();

// Transaction
$pdo->beginTransaction();
try {
    $pdo->prepare('UPDATE accounts SET balance = balance - ? WHERE id = ?')->execute([100, 1]);
    $pdo->prepare('UPDATE accounts SET balance = balance + ? WHERE id = ?')->execute([100, 2]);
    $pdo->commit();
} catch (PDOException $e) {
    $pdo->rollBack();
    throw $e;
}`,'PDO'],
['warn',"Une prepared statement protège les **valeurs**, jamais les **identifiants** (noms de table/colonne) ni le [[ORDER BY]]. Pour ceux-là, utilisez une **allow-list** explicite."],
['h','Mots de passe'],
['code',`<?php
// Hash (bcrypt par défaut, argon2id recommandé)
$hash = password_hash($plain, PASSWORD_ARGON2ID);

// Vérification — comparaison en temps constant
if (password_verify($plain, $hash)) {
    if (password_needs_rehash($hash, PASSWORD_ARGON2ID)) {
        $hash = password_hash($plain, PASSWORD_ARGON2ID); // re-hash transparent
    }
}

// Jamais md5/sha1 pour un mot de passe.
// Comparaison de secrets (tokens, signatures) :
hash_equals($expected, $given);
bin2hex(random_bytes(32));   // token cryptographiquement sûr`,'password_* '],
['h','Sessions & cookies'],
['code',`<?php
session_set_cookie_params([
    'lifetime' => 0,
    'path'     => '/',
    'secure'   => true,       // HTTPS uniquement
    'httponly' => true,       // inaccessible en JS → anti-XSS
    'samesite' => 'Lax',      // anti-CSRF
]);
session_start();
session_regenerate_id(true);  // après un login → anti session fixation

// PHP 8.5 : cookies partitionnés (CHIPS)
setcookie('id', $v, ['partitioned' => true, 'secure' => true, 'samesite' => 'None']);`,'Session hardening'],
['h','Le top OWASP en PHP'],
['table',[
['Faille','Parade'],
['**SQL injection**','prepared statements, jamais de concaténation'],
['**XSS**','[[htmlspecialchars()]] à la sortie, auto-escape du moteur de template, CSP'],
['**CSRF**','token synchronizer par formulaire + [[SameSite]]'],
['**Session fixation**','[[session_regenerate_id(true)]] après authentification'],
['**Path traversal**','[[realpath()]] + vérification du préfixe autorisé'],
['**File upload**','vérifier le MIME réel ([[finfo]]), renommer, stocker hors webroot'],
['**Mass assignment**','DTO explicite plutôt que [[new User(...$_POST)]]'],
['**Secrets en dur**','variables d\'environnement, jamais dans le dépôt'],
]],
['itw',"Attendez-vous à : « comment empêchez-vous une injection SQL ? ». Ne répondez pas « j'échappe avec [[addslashes]] » : la réponse est **prepared statements avec [[ATTR_EMULATE_PREPARES => false]]**, et allow-list pour tout ce qui n'est pas une valeur."]
]},

{
id:'perf', icon:'\u{26A1}', title:'Performance & architecture', sub:'OPcache, JIT, SOLID, DI, testing.',
blocks:[
['h','OPcache & JIT'],
['ul',[
"**OPcache** met en cache le **bytecode** compilé : c'est le gain n°1, à activer en production. Sans lui, PHP recompile chaque fichier à chaque requête.",
"**Preloading** (7.4) charge des classes en mémoire partagée au démarrage du process.",
"Le **JIT** (8.0) compile le bytecode en code machine. Gain majeur sur du calcul pur, **quasi nul sur du web classique** (le goulot est la DB et les I/O).",
"PHP 8.4 a retravaillé le JIT (nouvelle représentation intermédiaire) ; il reste désactivé par défaut."
]],
['code',`; php.ini production
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0     ; invalidation manuelle au déploiement
opcache.jit_buffer_size=64M
opcache.jit=tracing               ; ou "disable" sur une app web classique
realpath_cache_size=4096k`,'Configuration'],
['h','Mesurer avant d\'optimiser'],
['table',[
['Outil','Usage'],
['**Xdebug**','debug pas à pas, profiling, coverage (⚠ lent en prod)'],
['**Blackfire** / **Tideways**','profiling continu, comparaison avant/après'],
['**SPX**','profiler léger open-source'],
['[[memory_get_peak_usage(true)]]','pic mémoire réel'],
['[[hrtime(true)]]','chronométrage nanoseconde'],
]],
['warn',"Le vrai piège de performance en PHP n'est presque jamais le langage : c'est le **N+1 query problem** (une requête par entité dans une boucle). Réponse : [[JOIN]], eager loading, ou requête d'hydratation groupée."],
['h','SOLID en une carte'],
['table',[
['','Principe','En pratique'],
['**S**','Single Responsibility','une classe, une raison de changer'],
['**O**','Open/Closed','ouverte à l\'extension, fermée à la modification (interfaces, stratégies)'],
['**L**','Liskov Substitution','une sous-classe doit pouvoir remplacer sa classe mère sans surprise'],
['**I**','Interface Segregation','plusieurs petites interfaces valent mieux qu\'une grosse'],
['**D**','Dependency Inversion','dépendre d\'abstractions, injectées par le constructeur'],
]],
['code',`<?php
// ❌ dépendance concrète, non testable
final class Newsletter
{
    public function send(): void
    {
        (new SmtpMailer())->send(/* … */);   // couplage dur
    }
}

// ✅ injection de dépendance via une interface
final class Newsletter
{
    public function __construct(private MailerInterface $mailer) {}

    public function send(): void { $this->mailer->send(/* … */); }
}

// en test :
$newsletter = new Newsletter(new InMemoryMailer());`,'Dependency Injection'],
['h','Qualité & outillage'],
['table',[
['Outil','Rôle'],
['**PHPUnit** / **Pest**','tests unitaires et d\'intégration'],
['**PHPStan** / **Psalm**','static analysis (visez le level 8+)'],
['**PHP-CS-Fixer** / **Pint**','formatage PSR-12 automatique'],
['**Rector**','refactoring et migration automatisés (ex. PHP 8.4 → 8.5)'],
['**Infection**','mutation testing : teste la qualité de vos tests'],
['**Deptrac**','vérifie les règles d\'architecture entre couches'],
]],
['tip',"Mentionner **Rector** en entretien est un signal fort : c'est l'outil qui automatise les migrations de version PHP (il applique les nouvelles syntaxes, par exemple convertir un [[switch]] en [[match]] ou adopter la constructor promotion)."],
['itw',"« Comment migreriez-vous une app de PHP 8.1 à 8.5 ? » Plan en 5 points : (1) [[composer audit]] et mise à jour des dépendances, (2) exécuter la suite de tests sur 8.5 avec [[E_ALL]] pour repérer les deprecations, (3) passer **Rector** avec le set [[PHP_85]], (4) relire les BC breaks du changelog (casts non canoniques, [[null]] comme offset, backtick operator), (5) déployer progressivement (canary) en surveillant les logs."]
]},
);

/* =========================================================================
   DONNÉES — LES NOUVEAUTÉS PAR VERSION
   ========================================================================= */
const VERSIONS = [
{
id:'v85', v:'8.5', date:'20 novembre 2025', hot:true,
sub:'La version au cœur de votre entretien : pipe operator, clone with, NoDiscard, extension URI.',
blocks:[
['h','1. Pipe operator |> — le nouveau chouchou'],
['p',"L'opérateur [[|>]] passe la valeur de gauche comme **unique argument** de la callable de droite. Il remplace les appels imbriqués illisibles et les variables temporaires."],
['code',`<?php
$title = '  PHP 8.5 Released  ';

// ❌ avant : lecture de droite à gauche
$slug = strtolower(str_replace(' ', '-', trim($title)));

// ❌ ou variables jetables
$tmp = trim($title);
$tmp = str_replace(' ', '-', $tmp);
$slug = strtolower($tmp);

// ✅ PHP 8.5 : lecture de gauche à droite
$slug = $title
    |> trim(...)
    |> (fn(string $s) => str_replace(' ', '-', $s))
    |> (fn(string $s) => str_replace('.', '', $s))
    |> strtolower(...);
// "php-85-released"`,'Pipe operator'],
['ul',[
"La partie droite doit être un **callable à un seul argument** : d'où l'usage massif de la first-class callable syntax [[trim(...)]] et des arrow functions.",
"Pour une fonction à plusieurs paramètres, on l'enveloppe : [[|> (fn(\$x) => explode(',', \$x))]].",
"[[|>]] a une priorité plus basse que les opérateurs arithmétiques et plus haute que [[??]] ou les comparaisons.",
"Ce n'est **pas** un pipe shell : rien n'est asynchrone, tout reste synchrone et typé."
]],
['tip',"Argument à sortir en entretien : le pipe operator rend les **transformations de données** (parsing, normalisation, sanitization) déclaratives, sans introduire de framework ni de collection library."],
['h','2. Clone with — l\'immuabilité enfin ergonomique'],
['p',"Jusqu'ici, faire évoluer un objet [[readonly]] demandait de recopier tout le constructeur. PHP 8.5 permet de cloner **en surchargeant des propriétés**, y compris [[readonly]]."],
['code',`<?php
final readonly class Color
{
    public function __construct(
        public int $red,
        public int $green,
        public int $blue,
        public int $alpha = 255,
    ) {}

    // ❌ avant : recopie manuelle, fragile à chaque nouveau champ
    public function withAlphaOld(int $alpha): self
    {
        return new self($this->red, $this->green, $this->blue, $alpha);
    }

    // ✅ PHP 8.5
    public function withAlpha(int $alpha): self
    {
        return clone($this, ['alpha' => $alpha]);
    }
}

$base = new Color(255, 0, 0);
$ghost = $base->withAlpha(40);   // nouvel objet, $base intact`,'clone with'],
['ul',[
"Les propriétés sont assignées **après** le clonage et **avant** l'appel à [[__clone()]].",
"Cela fonctionne sur les propriétés [[readonly]] **depuis l'intérieur de la classe** (scope de déclaration).",
"C'est le pattern **wither** (objets immuables type [[DateTimeImmutable]], PSR-7) sans boilerplate."
]],
['h','3. #[\\NoDiscard] — ne plus ignorer un retour'],
['code',`<?php
#[\\NoDiscard('le résultat contient la liste des erreurs de validation')]
function validate(array $data): ValidationResult { /* … */ }

// Warning: The return value of function validate() should either be used
// or intentionally ignored by casting it as (void)

(void) validate($input);   // intention explicite : aucun warning
$result = validate($input); // usage normal`,'NoDiscard'],
['tip',"Parfait pour les APIs **immuables** ([[\$date->modify()]] ne modifie rien sur un [[DateTimeImmutable]]) et pour tout ce qui retourne un statut d'erreur. Le cast [[(void)]] est un nouvel usage introduit pour cet attribut."],
['h','4. Closures dans les expressions constantes'],
['p',"Les [[static]] closures et les first-class callables sont désormais autorisées partout où une **constant expression** est attendue : attributs, valeurs par défaut de paramètres, constantes, propriétés statiques."],
['code',`<?php
#[AccessControl(static function (Request $r, Post $p): bool {
    return $r->user === $p->getAuthor();
})]
final class PostController
{
    public const FORMATTER = strtoupper(...);

    public function __construct(
        private \\Closure $normalizer = static fn(string $s): string => trim($s),
    ) {}
}`,'Closures constantes'],
['h','5. Attributes : nouvelles cibles'],
['code',`<?php
class Config
{
    #[\\Deprecated(since: '3.4', message: 'Utilisez Config::TIMEOUT_MS')]
    public const TIMEOUT = 30;          // attribut sur une CONSTANTE (8.5)
}

class Base { public string $name = ''; }

class Child extends Base
{
    #[\\Override]                        // sur une PROPRIÉTÉ (8.5)

}

#[\\Deprecated]

#[\\DelayedTargetValidation]             // valide la cible à la Reflection, pas à la compilation
#[SomeAttribute]
const FEATURE_X = true;`,'Nouvelles cibles'],
['h','6. Propriétés : final promoted et static asymétriques'],
['code',`<?php
class Service
{
    // « final » directement dans la constructor promotion (8.5)
    public function __construct(
        public final readonly string $id,
    ) {}

    // asymmetric visibility sur une propriété STATIQUE (8.5)

}`,'Propriétés'],
['h','7. array_first() et array_last()'],
['code',`<?php
$queue = ['a' => 1, 'b' => 2, 'c' => 3];

array_first($queue);   // 1
array_last($queue);    // 3
array_first([]);       // null  — aucune erreur, aucun warning

// ❌ avant
reset($queue);                        // déplace le pointeur interne
$queue[array_key_first($queue)];      // notice si le tableau est vide
end($queue);`,'array_first / array_last'],
['h','8. Debugging : backtraces et handlers lisibles'],
['code',`<?php
// Les fatal errors affichent enfin une stack trace (ini fatal_error_backtraces=1, ON par défaut)
// Fatal error: Allowed memory size exhausted in /app/Import.php on line 42
// Stack trace:
// #0 /app/Import.php(42): str_repeat('x', 999999999)
// #1 /app/run.php(7): Import->process()

// Lire les handlers en place, sans les écraser
$previous = get_error_handler();       // ?callable  (8.5)
$previousEx = get_exception_handler(); // ?callable  (8.5)

{cat:'PHP 8.5', q:"Quel apport de PHP 8.5 aide le plus au debug en production ?",
