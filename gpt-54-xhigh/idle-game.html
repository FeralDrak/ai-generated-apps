<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axiom Drift</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    :root {
      --bg:#060913;
      --bg2:#0f1828;
      --panel:rgba(8,13,24,.8);
      --line:rgba(148,191,255,.16);
      --text:#edf4ff;
      --muted:#9bb0cf;
      --gold:#ffcf78;
      --cyan:#79e7ff;
      --green:#98f0bc;
      --red:#ff8f8b;
      --violet:#d2a7ff;
      --shadow:0 24px 70px rgba(0,0,0,.36);
      --body:"Trebuchet MS","Lucida Sans Unicode","Segoe UI Variable",sans-serif;
      --head:"Palatino Linotype","Book Antiqua","Times New Roman",serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;color:var(--text);font-family:var(--body);background:
      radial-gradient(circle at 15% 15%,rgba(255,207,120,.16),transparent 24%),
      radial-gradient(circle at 82% 8%,rgba(121,231,255,.12),transparent 22%),
      radial-gradient(circle at 50% 80%,rgba(210,167,255,.08),transparent 26%),
      linear-gradient(150deg,var(--bg) 0%,var(--bg2) 60%,#120d18 100%)}
    body:before,body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
    body:before{background-image:
      radial-gradient(circle at 20% 35%,rgba(255,255,255,.75) 0 1px,transparent 1.4px),
      radial-gradient(circle at 80% 20%,rgba(255,255,255,.7) 0 1px,transparent 1.5px),
      radial-gradient(circle at 40% 75%,rgba(255,255,255,.6) 0 .8px,transparent 1.4px);
      background-size:320px 320px,280px 280px,360px 360px;opacity:.55;animation:drift 80s linear infinite}
    body:after{background:radial-gradient(circle at 50% 50%,transparent 0%,rgba(6,9,19,.16) 55%,rgba(6,9,19,.7) 100%)}
    @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-120px,60px,0)}}
    .app{position:relative;z-index:1;width:min(1400px,calc(100% - 28px));margin:20px auto 32px}
    .hero,.panel{border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.03),transparent 28%),var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(14px)}
    .hero{padding:26px;border-radius:30px;overflow:hidden}
    .hero:before{content:"";position:absolute;top:-80px;right:-90px;width:260px;height:260px;border-radius:50%;filter:blur(8px);background:radial-gradient(circle at 35% 35%,rgba(255,220,160,.95),rgba(255,170,80,.12) 34%,transparent 60%)}
    .heroGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;position:relative}
    .kicker,.pill,.tag{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);font-size:.8rem}
    .kicker{color:var(--gold);text-transform:uppercase;letter-spacing:.14em;border-color:rgba(255,207,120,.22)}
    h1,h2{font-family:var(--head);margin:0;line-height:.95}
    h1{font-size:clamp(2.9rem,5vw,4.6rem);margin-top:14px}
    h2{font-size:1.9rem}
    p,.sub,.meta,.note,.labelSmall{color:var(--muted);line-height:1.6}
    .directive{margin-top:18px;padding:16px 18px;border-radius:18px;background:rgba(7,12,22,.72);border:1px solid rgba(121,231,255,.16)}
    .summary,.resources,.layout,.modes,.actions3,.targets,.missions,.research,.buildings,.status,.logs{display:grid;gap:12px}
    .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
    .tile,.card,.resource{padding:15px 16px;border-radius:18px;background:rgba(7,12,22,.78);border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden}
    .tile strong,.big{display:block;margin-top:10px;font-size:1.45rem}
    .resource:after,.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--cyan));opacity:.9}
    .resource:after{left:0;right:0;top:auto;bottom:0;height:3px;width:auto}
    .resourceName,.eyebrow,.mini{text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:.75rem}
    .resources{grid-template-columns:repeat(7,minmax(0,1fr));margin-top:18px}
    .layout{grid-template-columns:repeat(12,minmax(0,1fr));margin-top:18px}
    .span7{grid-column:span 7}.span5{grid-column:span 5}.span8{grid-column:span 8}.span4{grid-column:span 4}
    .panel{padding:22px;border-radius:24px}
    .panelHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
    .panel p{margin:0}
    .bar{height:12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.05);overflow:hidden}
    .fill{height:100%;background:linear-gradient(90deg,var(--gold),#ffe7bb 65%,var(--cyan));box-shadow:0 0 20px rgba(255,207,120,.35)}
    .row{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .modes{grid-template-columns:repeat(3,minmax(0,1fr));margin:16px 0}
    .actions3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .targets,.missions,.research,.buildings{grid-template-columns:repeat(2,minmax(0,1fr))}
    .status{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px}
    .card.active{border-color:rgba(121,231,255,.3);box-shadow:inset 0 0 0 1px rgba(121,231,255,.14)}
    .common{--accent:var(--cyan)}.rare{--accent:var(--gold)}.anomaly{--accent:var(--violet)}.done{--accent:var(--green)}
    .energy{--accent:var(--gold)}.data{--accent:var(--cyan)}.science{--accent:var(--green)}.alloy{--accent:#ffbf8f}.heat{--accent:var(--red)}.mission{--accent:var(--violet)}
    button{appearance:none;border:0;cursor:pointer;font:inherit}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 14px;border-radius:999px;color:var(--text);border:1px solid rgba(255,255,255,.08);background:linear-gradient(135deg,rgba(255,207,120,.2),rgba(121,231,255,.12));transition:transform .12s ease,opacity .12s ease}
    .btn:hover:not(:disabled){transform:translateY(-1px)}
    .btn.alt{background:rgba(255,255,255,.04)}
    .btn.warn{background:rgba(255,143,139,.13);border-color:rgba(255,143,139,.16)}
    .btn.prestige{background:linear-gradient(135deg,rgba(210,167,255,.22),rgba(121,231,255,.14));border-color:rgba(210,167,255,.22)}
    .full{width:100%;margin-top:14px}
    .btn:disabled{opacity:.42;cursor:not-allowed}
    .good{color:#d4ffe3;background:rgba(152,240,188,.12);border-color:rgba(152,240,188,.2)}
    .bad{color:#ffd9d6;background:rgba(255,143,139,.12);border-color:rgba(255,143,139,.2)}
    .log.good{background:rgba(152,240,188,.08);border-color:rgba(152,240,188,.16)}
    .log.bad{background:rgba(255,143,139,.08);border-color:rgba(255,143,139,.18)}
    .log.accent{background:rgba(210,167,255,.08);border-color:rgba(210,167,255,.18)}
    .empty{padding:18px;border-radius:18px;border:1px dashed rgba(255,255,255,.09);color:var(--muted);background:rgba(255,255,255,.03)}
    @media (max-width:1200px){.heroGrid{grid-template-columns:1fr}.resources{grid-template-columns:repeat(4,minmax(0,1fr))}.span7,.span5,.span8,.span4{grid-column:span 12}}
    @media (max-width:860px){.app{width:min(100% - 18px,100%)}.hero,.panel{padding:18px}.summary,.resources,.modes,.actions3,.targets,.missions,.research,.buildings,.status{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  const { useEffect, useMemo, useRef, useState } = React;
  const h = React.createElement;
  const SAVE = "axiom-drift-v1";

  const STRUCTURES = [
    { id:"solar", name:"Heliostat veil", txt:"+2.8 energie/s", cls:"energy", growth:1.23, cost:{alloys:10, minerals:12} },
    { id:"relay", name:"Signal lattice", txt:"+0.72 donnees/s", cls:"data", growth:1.26, cost:{alloys:12, data:30} },
    { id:"lab", name:"Theory vault", txt:"Convertit donnees en science", cls:"science", growth:1.3, cost:{alloys:15, data:40, science:10} },
    { id:"fabricator", name:"Matter kiln", txt:"Transforme minerais en alliages", cls:"alloy", growth:1.32, cost:{alloys:20, minerals:28, data:30} },
    { id:"coolant", name:"Cryo spine", txt:"Refroidit le reseau", cls:"heat", growth:1.28, cost:{alloys:16, science:18} },
    { id:"dock", name:"Launch cradle", txt:"+1 slot expedition", cls:"mission", growth:1.34, cost:{alloys:24, science:28, data:60} }
  ];

  const MODES = {
    wide:{ id:"wide", name:"Wide sweep", txt:"Vite, stable, ouvre la carte.", speed:1.15, data:.85, energy:.75, anomaly:.03, rare:.07 },
    deep:{ id:"deep", name:"Deep field", txt:"Plus lent, meilleur rendement.", speed:.78, data:1.45, energy:1.15, anomaly:.08, rare:.16 },
    resonance:{ id:"resonance", name:"Resonance sweep", txt:"Cherche les anomalies fortes.", speed:.92, data:1.1, energy:1.65, anomaly:.16, rare:.24 }
  };

  const RESEARCH = [
    { id:"droneLattice", name:"Treillis de drones", txt:"Scan +35%.", req:{sectors:2}, cost:{science:18, data:50} },
    { id:"cryoCooling", name:"Cryo discipline", txt:"Cap thermique +8.", req:{sectors:2}, cost:{science:26, alloys:16} },
    { id:"tightbeam", name:"Tightbeam relays", txt:"+1 mission et retour meilleur.", req:{sectors:3}, cost:{science:24, alloys:12, data:60} },
    { id:"solarSkin", name:"Peau heliophage", txt:"Energie solaire +60%.", req:{sectors:4}, cost:{science:34, alloys:20} },
    { id:"autoLabs", name:"Auto theoristes", txt:"Science labo +40%.", req:{sectors:5}, cost:{science:46, data:90, alloys:18} },
    { id:"matterForge", name:"Forge asymetrique", txt:"Alliages +45%.", req:{sectors:5}, cost:{science:54, alloys:26, minerals:24} },
    { id:"quantumCartography", name:"Cartographie quantique", txt:"Anomalies plus frequentes.", req:{sectors:6}, cost:{science:72, data:120, alloys:40} },
    { id:"exoAnthology", name:"Exo anthology", txt:"Ruines et anomalies plus savantes.", req:{sectors:7, research:["quantumCartography"]}, cost:{science:86, data:80, alloys:32, fragments:25} },
    { id:"horizonProtocol", name:"Horizon protocol", txt:"Chaque reset donne +1 axiom.", req:{sectors:10, research:["exoAnthology"]}, cost:{science:120, alloys:60, fragments:45} }
  ];

  const TARGETS = [
    { min:0, rarity:"common", kind:"resource", names:["Veine ferreuse","Ceinture nickel","Mine flottante"], note:"Depot dense pret a etre fore.", time:[38,62], energy:[8,14], success:[.9,.96], rewards:{minerals:[14,26], data:[4,10]} },
    { min:1, rarity:"common", kind:"survey", names:["Lune cryo","Arc de glace","Noyau de comete"], note:"Bon rendement data.", time:[52,78], energy:[10,16], success:[.86,.94], rewards:{minerals:[8,16], data:[12,20], science:[2,5]} },
    { min:2, rarity:"rare", kind:"ruin", names:["Relais mort","Archive orbital","Dock abandonne"], note:"Science haute, risque modere.", time:[70,104], energy:[14,22], success:[.76,.88], rewards:{data:[18,34], science:[6,12], fragments:[3,8]} },
    { min:4, rarity:"rare", kind:"bio", names:["Jardin poussiere","Atoll fongique","Bassin ambre"], note:"Echantillons rares et signaux propres.", time:[82,118], energy:[16,24], success:[.72,.86], rewards:{data:[18,30], science:[10,16], fragments:[4,10]} },
    { min:6, rarity:"anomaly", kind:"anomaly", names:["Faille de lentille","Puits gamma","Noeud impossible"], note:"Tres instable mais excellente source de fragments.", time:[110,150], energy:[20,30], success:[.62,.8], rewards:{data:[20,36], science:[10,18], fragments:[10,18]} }
  ];

  const META = {
    energy:["Energie","#ffcf78"], data:["Donnees","#79e7ff"], science:["Science","#98f0bc"], minerals:["Minerais","#ffc58f"], alloys:["Alliages","#ffb8aa"], fragments:["Fragments","#d2a7ff"], axioms:["Axioms","#ffffff"]
  };

  const clamp = (n,a,b) => Math.min(Math.max(n,a),b);
  const roll = (a,b) => a + Math.random() * (b - a);
  const id = (p) => p + Math.random().toString(36).slice(2,8);
  const has = (s,k) => s.research.includes(k);
  const costOk = (res,cost) => Object.entries(cost).every(([k,v]) => res[k] >= v);
  const spend = (res,cost) => Object.entries(cost).forEach(([k,v]) => { res[k] -= v; });
  const reward = (res,gain,m=1) => Object.entries(gain).forEach(([k,v]) => { res[k] += v * m; });
  const stamp = () => new Date().toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
  const fmt = (n,d=1) => { const a=Math.abs(n); if (a>=1e6) return (n/1e6).toFixed(a>=1e7?1:2)+"M"; if (a>=1e3) return (n/1e3).toFixed(a>=1e4?1:2)+"k"; if (a>=100) return n.toFixed(0); if (a>=10) return n.toFixed(1); return n===0?"0":n.toFixed(d); };
  const rate = (n) => (n>=0?"+":"") + fmt(n,2) + "/s";
  const secs = (n) => { n=Math.max(0,Math.round(n)); const m=Math.floor(n/60), s=n%60; if (m<1) return s+"s"; if (m<60) return m+"m "+String(s).padStart(2,"0")+"s"; const h=Math.floor(m/60); return h+"h "+String(m%60).padStart(2,"0")+"m"; };
  const push = (s,text,tone="",silent=false) => { if (silent) return; s.log.unshift({ id:id("l"), at:stamp(), tone, text }); s.log=s.log.slice(0,12); };

  const startTargets = () => [
    { id:id("t"), name:"Veine ferreuse Eos-12", rarity:"common", kind:"resource", duration:46, remaining:46, energyCost:10, success:.94, note:"Carte archivee du systeme interne.", rewards:{ minerals:18, data:6 } },
    { id:id("t"), name:"Relais mort Umbra-3", rarity:"rare", kind:"ruin", duration:74, remaining:74, energyCost:14, success:.86, note:"Station oubliee chargee de logs.", rewards:{ data:18, science:6, fragments:4 } }
  ];

  const make = (axioms=0, cycles=0) => ({
    resources:{ energy:90+axioms*8, data:28, science:10+Math.floor(axioms/2)*4, minerals:24, alloys:14, fragments:0, axioms, heat:0 },
    structures:{ solar:2, relay:1, lab:1, fabricator:0, coolant:1, dock:1 },
    observatory:{ mode:"wide", progress:18, sectors:0 },
    fleet:{ targets:startTargets(), active:[] },
    research:[],
    cycles,
    log:[{ id:id("l"), at:stamp(), tone:"accent", text:"Observation deck aligne. Deux cibles archivees sont deja pretes." }]
  });

  const copy = (s) => ({
    resources:{ ...s.resources },
    structures:{ ...s.structures },
    observatory:{ ...s.observatory },
    fleet:{ targets:s.fleet.targets.map((x)=>({ ...x })), active:s.fleet.active.map((x)=>({ ...x })) },
    research:[...s.research],
    cycles:s.cycles,
    log:s.log.map((x)=>({ ...x }))
  });
  const bonus = (s) => ({
    scan:1+s.resources.axioms*.12+(has(s,"droneLattice")?.35:0),
    data:1+s.resources.axioms*.08+(has(s,"tightbeam")?.2:0),
    energy:1+s.resources.axioms*.08+(has(s,"solarSkin")?.6:0),
    science:1+s.resources.axioms*.06+(has(s,"autoLabs")?.4:0),
    alloy:1+s.resources.axioms*.06+(has(s,"matterForge")?.45:0),
    slots:(has(s,"tightbeam")?1:0),
    mission:s.resources.axioms*.05+(has(s,"tightbeam")?.12:0),
    success:(has(s,"exoAnthology")?.04:0)+s.resources.axioms*.005,
    anomaly:has(s,"quantumCartography")?.08:0,
    coolCap:has(s,"cryoCooling")?8:0,
    coolPow:has(s,"cryoCooling")?1.5:0,
    lore:has(s,"exoAnthology")?.35:0,
    rewrite:has(s,"horizonProtocol")?1:0
  });

  const coolCap = (s,b) => 6 + s.structures.coolant * 4 + b.coolCap;
  const slots = (s,b) => s.structures.dock + 1 + b.slots;
  const sectorNeed = (n) => 72 + n * 21;
  const rewriteCost = (s) => 100 + s.resources.axioms * 60;
  const rewriteGain = (s,b) => s.resources.fragments < rewriteCost(s) ? 0 : Math.max(1, Math.floor((s.resources.fragments - rewriteCost(s)) / 70) + 1 + b.rewrite);
  const reqOk = (s,r) => (!r.req?.sectors || s.observatory.sectors >= r.req.sectors) && (!r.req?.research || r.req.research.every((k) => has(s,k)));
  const reqTxt = (r) => [r.req?.sectors ? r.req.sectors + " secteurs" : "", ...(r.req?.research || []).map((k) => RESEARCH.find((x) => x.id === k)?.name || k)].filter(Boolean).join(" + ");
  const buildingCost = (b, count) => Object.fromEntries(Object.entries(b.cost).map(([k,v]) => [k, Math.ceil(v * Math.pow(b.growth, count))]));

  function targetFor(sector, rareOnly=false) {
    const pool = TARGETS.filter((t) => t.min <= sector && (!rareOnly || t.rarity !== "common"));
    const t = pool[Math.floor(Math.random() * pool.length)] || TARGETS[0];
    const name = t.names[Math.floor(Math.random() * t.names.length)] + " " + ["A","B","C","D","E","F"][Math.floor(Math.random()*6)] + "-" + Math.round(10 + Math.random() * 88);
    const rewards = {};
    Object.entries(t.rewards).forEach(([k, range]) => { rewards[k] = Math.round(roll(range[0], range[1]) * (1 + sector * .06)); });
    return {
      id:id("t"), name, rarity:t.rarity, kind:t.kind, note:t.note,
      duration:Math.round(roll(t.time[0], t.time[1]) * (1 + sector * .035)),
      remaining:0,
      energyCost:Math.round(roll(t.energy[0], t.energy[1]) * (1 + sector * .04)),
      success:clamp(roll(t.success[0], t.success[1]) - sector * .005, .56, .97),
      rewards
    };
  }

  function sectorUp(next, mode, b, silent) {
    next.observatory.sectors += 1;
    const n = next.observatory.sectors;
    next.resources.data += 12 + n * 2.5;
    const main = targetFor(n, false);
    next.fleet.targets.unshift(main);
    if (Math.random() < mode.rare) next.fleet.targets.unshift(targetFor(n + 1, true));
    next.fleet.targets = next.fleet.targets.slice(0, 9);
    if (Math.random() < mode.anomaly + b.anomaly) {
      const gain = 4 + Math.floor(n / 2);
      next.resources.fragments += gain;
      push(next, "Secteur " + n + " cartographie: anomalie faible stabilisee, +" + gain + " fragments.", "accent", silent);
    } else {
      push(next, "Secteur " + n + " cartographie: " + main.name + " ajoute a la file.", "good", silent);
    }
  }

  function missionDone(next, m, b, silent) {
    const ok = Math.random() < clamp(m.success + b.success, .08, .99);
    if (ok) {
      reward(next.resources, m.rewards, 1 + b.mission);
      if ((m.kind === "ruin" || m.kind === "anomaly" || m.kind === "bio") && b.lore > 0) next.resources.science += 4 + next.observatory.sectors * b.lore;
      push(next, m.name + " traite avec succes.", "good", silent);
    } else {
      next.resources.energy = Math.max(0, next.resources.energy - (6 + m.energyCost * .5));
      next.resources.heat = Math.min(next.resources.heat + 4.5, coolCap(next, b) + 18);
      if (m.kind === "anomaly") next.resources.fragments += 2;
      push(next, m.name + " a rompu le lien. Surcharge du reseau.", "bad", silent);
    }
  }

  function tick(s, dt, silent=false) {
    const next = copy(s);
    const b = bonus(next);
    const mode = MODES[next.observatory.mode];
    const cap = coolCap(next, b);
    const hot = next.fleet.active.length;
    const heatIn = next.structures.solar*.12 + next.structures.relay*.05 + next.structures.lab*.22 + next.structures.fabricator*.18 + hot*.16 + (mode.id === "resonance" ? .4 : .08);
    const cooling = .8 + next.structures.coolant * 1.5 + b.coolPow;
    next.resources.heat = clamp(next.resources.heat + (heatIn - cooling) * dt, 0, cap + 20);
    const efficiency = clamp(1 - Math.max(0, next.resources.heat - cap) / (cap + 10), .42, 1);

    next.resources.energy += next.structures.solar * 2.8 * b.energy * efficiency * dt;
    next.resources.data += next.structures.relay * .72 * b.data * efficiency * dt;

    const power = next.resources.energy > mode.energy * dt ? 1 : .35;
    const scanRate = (.62 + next.structures.relay*.08 + next.structures.dock*.04) * mode.speed * b.scan * efficiency * power;
    next.observatory.progress += scanRate * dt;
    next.resources.data += scanRate * dt * .28 * mode.data * b.data;
    next.resources.energy = Math.max(0, next.resources.energy - mode.energy * dt);

    const sci = Math.min(next.structures.lab * .2 * b.science * efficiency * dt, next.resources.data / 1.8, next.resources.energy / .8);
    if (sci > 0) {
      next.resources.science += sci;
      next.resources.data -= sci * 1.8;
      next.resources.energy -= sci * .8;
    }

    const alloy = Math.min(next.structures.fabricator * .24 * b.alloy * efficiency * dt, next.resources.minerals / 1.6, next.resources.energy / .7);
    if (alloy > 0) {
      next.resources.alloys += alloy;
      next.resources.minerals -= alloy * 1.6;
      next.resources.energy -= alloy * .7;
    }

    let need = sectorNeed(next.observatory.sectors);
    while (next.observatory.progress >= need) {
      next.observatory.progress -= need;
      sectorUp(next, mode, b, silent);
      need = sectorNeed(next.observatory.sectors);
    }

    const done = [];
    next.fleet.active = next.fleet.active.filter((m) => { m.remaining -= dt; if (m.remaining <= 0) { done.push(m); return false; } return true; });
    done.forEach((m) => missionDone(next, m, b, silent));
    return next;
  }

  function offline(s, seconds) {
    let next = copy(s);
    let left = Math.min(seconds, 60 * 60 * 4);
    if (left <= 5) return next;
    while (left > 0) {
      const step = Math.min(5, left);
      next = tick(next, step, true);
      left -= step;
    }
    push(next, "Chronologie reprise: " + secs(seconds) + " hors ecran.", "accent");
    return next;
  }

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(SAVE) || "null");
      if (!raw?.state) return make();
      let s = raw.state;
