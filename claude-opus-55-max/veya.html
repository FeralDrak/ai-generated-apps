<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veya — vidéo motion design 15 s</title>
<meta name="description" content="Veya : découvrir, choisir et réserver les pros indépendants de la beauté, du sport et du bien-être. Vidéo de présentation en motion design, 15 secondes, rendue en temps réel.">
<meta name="theme-color" content="#0E0A12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root { --ink:#0E0A12; --cream:#FBF4EC; --coral:#FF6A55; --rose:#F2508C; --violet:#7B5CFF; --peach:#FFB48A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #050307; color: var(--cream); overflow: hidden;
    font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; margin: auto; background: #000;
    width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); }
  #cv { display: block; width: 100%; height: 100%; }

  #poster { position: absolute; inset: 0; border: 0; margin: 0; padding: 0; cursor: pointer; color: #fff; font: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: clamp(10px, 1.4vw, 16px); padding-bottom: 9.5%;
    background: linear-gradient(180deg, rgba(14,10,18,0) 45%, rgba(14,10,18,.38)); transition: opacity .45s ease; }
  #poster.hide { opacity: 0; pointer-events: none; }
  #poster .ring { width: clamp(64px, 8.5vw, 112px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.16); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.7), 0 24px 70px rgba(0,0,0,.35);
    transition: transform .35s cubic-bezier(.2,.9,.3,1.35), background .3s; }
  #poster:hover .ring, #poster:focus-visible .ring { transform: scale(1.08); background: rgba(255,255,255,.24); }
  #poster:focus-visible { outline: none; }
  #poster .ring svg { width: 36%; margin-left: 7%; fill: #fff; }
  #poster .t2 { font-weight: 600; font-size: clamp(10px, .95vw, 13px); letter-spacing: .24em; text-transform: uppercase; opacity: .75; }
  #poster.loading .ring { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.94); opacity: .7; } }

  #bar { position: absolute; left: 50%; bottom: max(10px, 1.8vh); transform: translateX(-50%); z-index: 5;
    width: min(780px, calc(100vw - 20px)); display: flex; align-items: center; gap: 4px; padding: 6px 10px;
    border-radius: 999px; background: rgba(14,10,18,.58); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: 0 12px 40px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.09); transition: opacity .4s ease, transform .4s ease; }
  body.idle #bar { opacity: 0; transform: translate(-50%, 14px); pointer-events: none; }
  body.idle { cursor: none; }
  #bar button { flex: none; height: 38px; min-width: 38px; padding: 0 9px; border: 0; border-radius: 999px; background: transparent;
    color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;
    font: 700 13px/1 "Plus Jakarta Sans", system-ui, sans-serif; transition: background .2s, color .2s; }
  #bar button:hover { background: rgba(255,255,255,.12); }
  #bar button:focus-visible { outline: 2px solid var(--peach); outline-offset: 1px; }
  #bar button[aria-pressed="true"] { color: var(--peach); }
  #bar svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #bar svg .solid { fill: currentColor; stroke: none; }
  #time { flex: none; min-width: 74px; text-align: center; font-size: 12.5px; font-weight: 700; opacity: .85; font-variant-numeric: tabular-nums; }
  #scrub { position: relative; flex: 1; height: 38px; cursor: pointer; touch-action: none; margin: 0 6px; }
  #scrub .track, #scrub .fill { position: absolute; left: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 4px; }
  #scrub .track { right: 0; background: rgba(255,255,255,.18); }
  #scrub .fill { width: 0; background: linear-gradient(90deg, var(--peach), var(--coral), var(--rose), var(--violet)); }
  #scrub .head { position: absolute; top: 50%; left: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.45); }
  #scrub .mark { position: absolute; top: 50%; width: 2px; height: 10px; margin: -5px 0 0 -1px; border-radius: 2px; background: rgba(255,255,255,.4); }
  #scrub:focus-visible { outline: 2px solid var(--peach); outline-offset: 2px; border-radius: 8px; }
  #toast { position: absolute; left: 50%; top: 18px; transform: translate(-50%, -8px); z-index: 6; padding: 10px 18px; border-radius: 999px;
    background: rgba(14,10,18,.78); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font-size: 13.5px; font-weight: 700;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 600px) { #bExport span, #time { display: none; } #bar { gap: 0; padding: 4px 6px; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" role="img" aria-label="Vidéo de présentation de Veya, application de réservation de pros de la beauté, du sport et du bien-être"></canvas>
  <button id="poster" class="loading" aria-label="Lire la vidéo">
    <span class="ring"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l11.6-7.2a1 1 0 0 0 0-1.72L8.5 3.94A1 1 0 0 0 7 4.8z"/></svg></span>
    <span class="t2" id="posterSub">Chargement…</span>
  </button>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<div id="bar">
  <button id="bPlay" title="Lecture / pause (Espace)" aria-label="Lecture">
    <svg viewBox="0 0 24 24" id="icPlay"><path class="solid" d="M7 4.8v14.4a1 1 0 0 0 1.5.86l11.6-7.2a1 1 0 0 0 0-1.72L8.5 3.94A1 1 0 0 0 7 4.8z"/></svg>
  </button>
  <button id="bRestart" title="Revenir au début (0)" aria-label="Revenir au début">
    <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
  </button>
  <span id="time">0,0 / 15,0 s</span>
  <div id="scrub" tabindex="0" role="slider" aria-label="Position dans la vidéo" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0">
    <div class="track"></div><div class="fill"></div><div class="head"></div>
  </div>
  <button id="bLoop" title="Lecture en boucle (L)" aria-label="Boucle" aria-pressed="true">
    <svg viewBox="0 0 24 24"><path d="M17 2.5l3 3-3 3"/><path d="M4 11.5v-1a5 5 0 0 1 5-5h11"/><path d="M7 21.5l-3-3 3-3"/><path d="M20 12.5v1a5 5 0 0 1-5 5H4"/></svg>
  </button>
  <button id="bMute" title="Son (M)" aria-label="Couper le son" aria-pressed="false">
    <svg viewBox="0 0 24 24" id="icSnd"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.3 6.3a8 8 0 0 1 0 11.4"/></svg>
  </button>
  <button id="bExport" title="Exporter la vidéo (1920×1080, avec le son)" aria-label="Exporter la vidéo">
    <svg viewBox="0 0 24 24"><path d="M12 3.5v11"/><path d="M7.5 10l4.5 4.5 4.5-4.5"/><path d="M4.5 16.5v2a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2"/></svg><span>Exporter</span>
  </button>
  <button id="bFull" title="Plein écran (F)" aria-label="Plein écran">
    <svg viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9"/><path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9"/><path d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15"/><path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg>
  </button>
</div>
<script>
'use strict';
/* ============================================================
   VEYA — vidéo motion design de 15 s, rendue image par image.
   Tout est fonction du temps t (0 → 15 s) : on peut lire, mettre
   en pause, scruber, boucler et exporter en vidéo à l'identique.
   ============================================================ */

// ---------- Horloge musicale (128 BPM : 32 temps = 15 s pile) ----------
const W = 1920, H = 1080, DUR = 15, BPM = 128, B = 60 / BPM;
const G0 = 6 * B;                      // 2,8125 s : premier temps fort du groove
const BAR = n => G0 + n * 4 * B;       // mesures du groove : 2,81 · 4,69 · 6,56 · 8,44 · 10,31 · 12,19

// ---------- Maths & easings ----------
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: x => x,
  inQuad: x => x * x,
  outQuad: x => 1 - (1 - x) * (1 - x),
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  inQuart: x => x * x * x * x,
  outQuart: x => 1 - Math.pow(1 - x, 4),
  inOutQuart: x => (x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2),
  outQuint: x => 1 - Math.pow(1 - x, 5),
  inExpo: x => (x === 0 ? 0 : Math.pow(2, 10 * x - 10)),
  outExpo: x => (x === 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  inOutExpo: x => (x === 0 ? 0 : x === 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2),
  outBack: x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2),
  outBackS: x => 1 + 3.2 * Math.pow(x - 1, 3) + 2.2 * Math.pow(x - 1, 2),
  inBack: x => 2.70158 * x * x * x - 1.70158 * x * x,
  outSine: x => Math.sin(x * Math.PI / 2),
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
};
const A = (t, t0, d, e = E.outExpo) => e(prog(t, t0, t0 + d));
// Ressort amorti (réponse indicielle) : x en secondes depuis le départ
function spring(x, f = 3, z = .42) {
  if (x <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
// Keyframes : [[t, v, easeVersSuivant], ...]
function K(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, v0, e] = keys[i], [t1, v1] = keys[i + 1];
    if (t < t1) return lerp(v0, v1, (e || E.inOutCubic)((t - t0) / (t1 - t0)));
  }
  return keys[keys.length - 1][1];
}
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// ---------- Palette ----------
const C = {
  ink: '#0E0A12', night: '#170D1C', plum: '#2B1633', cream: '#FBF4EC', sand: '#F3E7DB', paper: '#FFFAF6',
  coral: '#FF6A55', peach: '#FFB48A', rose: '#F2508C', violet: '#7B5CFF', lilac: '#CBBEFF', white: '#FFFFFF',
  grey: '#8C8290', line: '#EDE3E8', mint: '#16A56F', gold: '#FFC56B',
};
const _rgb = {};
function rgb(h) {
  if (_rgb[h]) return _rgb[h];
  const n = parseInt(h.slice(1), 16);
  return (_rgb[h] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]);
}
const rgba = (h, a) => { const c = rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
function mixHex(h1, h2, p) {
  const a = rgb(h1), b = rgb(h2);
  const c = a.map((v, i) => Math.round(lerp(v, b[i], p)));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}

// ---------- Canvas ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });
let PX = 1, exporting = false, dirty = true;
let GA = 1;                                   // alpha global du groupe en cours (fondus de scène)
const ga = a => (ctx.globalAlpha = a * GA);
function fit() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = exporting ? 1920 : Math.round(clamp(r.width * dpr, 640, 2560));
  const h = Math.round(w * 9 / 16);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  PX = w / W; dirty = true;
}

// ---------- Typo ----------
const SERIF = '"Instrument Serif", "Iowan Old Style", Georgia, serif';
const SANS = '"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif';
function font(size, w = 600, serif = false, italic = false, g = ctx) {
  g.font = `${italic ? 'italic ' : ''}${serif ? 400 : w} ${size}px ${serif ? SERIF : SANS}`;
}
const mw = s => ctx.measureText(s).width;
function setLS(px, g = ctx) { if ('letterSpacing' in g) g.letterSpacing = px + 'px'; }
function waitCss() {
  const l = document.getElementById('gf');
  return new Promise(res => {
    if (!l || l.sheet) return res();
    l.addEventListener('load', res, { once: true }); l.addEventListener('error', res, { once: true });
    setTimeout(res, 2500);
  });
}
async function loadFonts() {
  if (!document.fonts || !document.fonts.load) return;
  await waitCss();
  const sample = 'AaBbZz 0123456789 Mokotów Służew zł ÉéèêàçôœŁłŚśŻż…·–!?';
  const specs = ['italic 400 64px "Instrument Serif"', '400 64px "Instrument Serif"',
    ...[500, 600, 700, 800].map(w => `${w} 64px "Plus Jakarta Sans"`)];
  await Promise.race([
    Promise.all(specs.map(s => document.fonts.load(s, sample).catch(() => null))),
    new Promise(r => setTimeout(r, 3500)),
  ]);
}

// ---------- Icônes (grille 24×24, tracés maison) ----------
const ICON_D = {
  search: 'M10.5 4a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13z M15.4 15.4L20 20',
  pin: 'M12 21.3s-6.6-5.8-6.6-11.3a6.6 6.6 0 0 1 13.2 0c0 5.5-6.6 11.3-6.6 11.3z M12 7.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5z',
  cal: 'M6.5 4.5h11A2.5 2.5 0 0 1 20 7v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18V7a2.5 2.5 0 0 1 2.5-2.5z M4 9.5h16 M8.5 2.6v3.8 M15.5 2.6v3.8',
  clock: 'M12 3.5a8.5 8.5 0 1 0 0 17a8.5 8.5 0 1 0 0-17z M12 7.5v4.8l3.2 2',
  check: 'M5 12.6l4.4 4.4L19.2 7.2',
  insta: 'M7.6 3h8.8A4.6 4.6 0 0 1 21 7.6v8.8a4.6 4.6 0 0 1-4.6 4.6H7.6A4.6 4.6 0 0 1 3 16.4V7.6A4.6 4.6 0 0 1 7.6 3z M12 8.1a3.9 3.9 0 1 0 0 7.8a3.9 3.9 0 1 0 0-7.8z M17.1 6.7v.1',
  scissors: 'M6.2 3.4a2.8 2.8 0 1 0 0 5.6a2.8 2.8 0 1 0 0-5.6z M6.2 15a2.8 2.8 0 1 0 0 5.6a2.8 2.8 0 1 0 0-5.6z M20 4.6L8.4 15.6 M14.4 14.3L20 19.4 M8.4 8.4L11.8 11.6',
  glove: 'M9.2 3.2h5.2A5.6 5.6 0 0 1 20 8.8v2.6a5.6 5.6 0 0 1-5.6 5.6H9.6A4.6 4.6 0 0 1 5 12.4V7.4a4.2 4.2 0 0 1 4.2-4.2z M5.1 9.4c2.9-.1 5 .7 5 2.9c0 1.8-1.6 2.7-3.5 2.6 M8.2 17v3.8h7.6V17',
  lotus: 'M12 20.4c-4.4-1.1-7.9-4.5-7.9-9.2c3.4.4 6.2 2.4 7.9 5.4c1.7-3 4.5-5 7.9-5.4c0 4.7-3.5 8.1-7.9 9.2z M12 16.4c-1.7-3.3-1.6-7.8 0-12.1c1.6 4.3 1.7 8.8 0 12.1z',
  camera: 'M4.6 7.6h2.8l1.8-2.6h5.6l1.8 2.6h2.8A1.6 1.6 0 0 1 21 9.2v8.9a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 18.1V9.2a1.6 1.6 0 0 1 1.6-1.6z M12 9.6a3.9 3.9 0 1 0 0 7.8a3.9 3.9 0 1 0 0-7.8z',
  comb: 'M3.5 8.2h17v3.6h-17z M6 11.8v7 M9 11.8v7 M12 11.8v7 M15 11.8v7 M18 11.8v7',
  dumbbell: 'M6.6 6v12 M17.4 6v12 M3.6 9v6 M20.4 9v6 M6.6 12h10.8',
  arrow: 'M5 12h14 M13.4 6.4L19 12l-5.6 5.6',
  back: 'M14.6 5.4L8 12l6.6 6.6',
  heart: 'M12 19.6s-7.4-4.5-7.4-10a4.3 4.3 0 0 1 7.4-2.9a4.3 4.3 0 0 1 7.4 2.9c0 5.5-7.4 10-7.4 10z',
  share: 'M12 3.6v10.8 M7.6 8L12 3.6L16.4 8 M5 13v5.4A1.6 1.6 0 0 0 6.6 20h10.8a1.6 1.6 0 0 0 1.6-1.6V13',
  sync: 'M19.4 12a7.4 7.4 0 0 1-13 4.8 M4.6 12a7.4 7.4 0 0 1 13-4.8 M17.8 3.4v3.8H14 M6.2 20.6v-3.8H10',
  chev: 'M9.4 5.6L15.8 12l-6.4 6.4',
  x: 'M6.5 6.5l11 11 M17.5 6.5l-11 11',
  mic: 'M12 3.6a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0v-5a3 3 0 0 0-3-3z M5.6 11a6.4 6.4 0 0 0 12.8 0 M12 17.4v3',
  bolt: 'M13.2 2.8L5.6 13.4h5.6l-1 7.8l7.6-10.6h-5.6z',
};
const ICON_FILL = {
  sparkle: 'M12 2.4c.7 5.3 3.3 7.9 8.6 8.6c-5.3.7-7.9 3.3-8.6 8.6c-.7-5.3-3.3-7.9-8.6-8.6c5.3-.7 7.9-3.3 8.6-8.6z',
  sparkles: 'M10 3c.6 4.5 2.8 6.7 7.3 7.3c-4.5.6-6.7 2.8-7.3 7.3c-.6-4.5-2.8-6.7-7.3-7.3c4.5-.6 6.7-2.8 7.3-7.3z M18.4 13.6c.3 2.2 1.4 3.3 3.6 3.6c-2.2.3-3.3 1.4-3.6 3.6c-.3-2.2-1.4-3.3-3.6-3.6c2.2-.3 3.3-1.4 3.6-3.6z',
  play: 'M8 5.2v13.6l11-6.8z',
};
const ICONS = {};
for (const k in ICON_D) ICONS[k] = { p: new Path2D(ICON_D[k]), fill: false };
for (const k in ICON_FILL) ICONS[k] = { p: new Path2D(ICON_FILL[k]), fill: true };
function icon(name, x, y, size, color, lw = 2, g = ctx) {
  const ic = ICONS[name]; if (!ic) return;
  g.save(); g.translate(x - size / 2, y - size / 2); g.scale(size / 24, size / 24);
  if (ic.fill) { g.fillStyle = color; g.fill(ic.p); }
  else { g.strokeStyle = color; g.lineWidth = lw * 24 / size; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(ic.p); }
  g.restore();
}

// ---------- Sprites : halos, grain ----------
const _glow = {};
function glowSprite(hex) {
  if (_glow[hex]) return _glow[hex];
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, rgba(hex, 1)); gr.addColorStop(.3, rgba(hex, .62)); gr.addColorStop(.62, rgba(hex, .2)); gr.addColorStop(1, rgba(hex, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return (_glow[hex] = c);
}
function glow(hex, x, y, r, a = 1, g = ctx) {
  if (a <= 0) return;
  const m = g === ctx ? GA : 1;
  g.globalAlpha = a * m; g.drawImage(glowSprite(hex), x - r, y - r, r * 2, r * 2); g.globalAlpha = m;
}
const NOISE = [];
function makeNoise() {
  for (let k = 0; k < 4; k++) {

// ---------- confettis (espace canvas : ils débordent du téléphone) ----------
const CONF = (() => {
  const r = rng(77), a = [], cols = [C.peach, C.coral, C.rose, C.violet, C.gold, C.cream];
  for (let i = 0; i < 70; i++) {
    const ang = -Math.PI / 2 + (r() - .5) * 3.4, sp = 700 + r() * 1300;
    a.push({ vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, rot: r() * 6, vr: (r() - .5) * 16, c: cols[i % 6], k: i % 3, s: 11 + r() * 13, d: r() * .07, fl: 6 + r() * 8 });
  }
  return a;
})();
function confetti(t, x0, y0, t0) {

  for (const p of CONF) {

    ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot + p.vr * u); ctx.scale(1, Math.cos(u * p.fl + p.rot));

const SR = 48000;

// ---------- partition (fa majeur, 128 BPM) ----------
function score(X) {

    Dm: { b: 38, p: [50, 53, 57, 60, 64] },    // Dm9
    Bb: { b: 34, p: [46, 50, 53, 57, 60] },    // Bbmaj9

  whoosh(X, 2.55, .26, 4000, 500, .14, .4, -.4);

  for (let b = 0; ; b++) {

  click(X, TAP1, .2);

// =====================================================================
// LECTEUR — lecture/pause, scrub, boucle, son, plein écran, export vidéo
// =====================================================================
const $ = id => document.getElementById(id);

  stopAudio();

  updateUI();
}

function frame() {
  requestAnimationFrame(frame);
  if (playing) {
    const t = t0 + (clockNow() - clk0);
    if (t >= DUR) {

    dirty = true;
  }

    if (exporting) toast(`Export en cours… ${fmt(T)} / 15 s — garde cet onglet ouvert`);
  }
}
const fmt = t => t.toFixed(1).replace('.', ',');
function updateTime() {
  const t = started ? T : 0, p = t / DUR * 100;
  $('time').textContent = `${fmt(t)} / 15,0 s`;
  scrub.querySelector('.fill').style.width = p + '%';
  scrub.querySelector('.head').style.left = p + '%';
  scrub.setAttribute('aria-valuenow', t.toFixed(1));
}
const IC_PLAY = '<path class="solid" d="M7 4.8v14.4a1 1 0 0 0 1.5.86l11.6-7.2a1 1 0 0 0 0-1.72L8.5 3.94A1 1 0 0 0 7 4.8z"/>';
const IC_PAUSE = '<rect class="solid" x="6" y="4.5" width="4.2" height="15" rx="1.4"/><rect class="solid" x="13.8" y="4.5" width="4.2" height="15" rx="1.4"/>';
const IC_SND = '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.3 6.3a8 8 0 0 1 0 11.4"/>';
const IC_MUTE = '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/>';
function updateUI() {
  $('icPlay').innerHTML = playing ? IC_PAUSE : IC_PLAY;
  $('bPlay').setAttribute('aria-label', playing ? 'Pause' : 'Lecture');
  $('bLoop').setAttribute('aria-pressed', String(loop));
  $('bMute').setAttribute('aria-pressed', String(muted));
  $('bMute').setAttribute('aria-label', muted ? 'Activer le son' : 'Couper le son');
  $('icSnd').innerHTML = muted ? IC_MUTE : IC_SND;
  bar.style.pointerEvents = exporting ? 'none' : '';
  bar.style.opacity = exporting ? '.4' : '';
  updateTime();
}
let toastTimer = 0;
function toast(msg, ms = 0) {
  clearTimeout(toastTimer);
  if (!msg) { toastEl.classList.remove('show'); return; }
  toastEl.textContent = msg; toastEl.classList.add('show');
  if (ms) toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}
let idleTimer = 0;
function nudgeIdle() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (playing && !dragging) document.body.classList.add('idle'); }, 2200);
}

// ---------- scrub ----------
let dragging = false, wasPlaying = false;
function scrubAt(e) { const r = scrub.getBoundingClientRect(); seek(clamp((e.clientX - r.left) / r.width) * DUR); }
scrub.addEventListener('pointerdown', e => {
  if (exporting) return;
  dragging = true; wasPlaying = playing; if (playing) pause();
  scrub.setPointerCapture(e.pointerId); scrubAt(e);
});
scrub.addEventListener('pointermove', e => { if (dragging) scrubAt(e); });
const endDrag = () => { if (!dragging) return; dragging = false; if (wasPlaying) play(T); };
scrub.addEventListener('pointerup', endDrag); scrub.addEventListener('pointercancel', endDrag);
scrub.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); seek(T + (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 1 / 30 : .5)); }
});
[[G0, 'Recherche IA'], [MORPH1, 'Vitrine'], [SHEET0, 'Réservation'], [LOGO0, 'Logo']].forEach(([t, name]) => {
  const m = document.createElement('div'); m.className = 'mark'; m.style.left = (t / DUR * 100) + '%'; m.title = name;
  scrub.insertBefore(m, scrub.querySelector('.fill'));
});

// ---------- boutons & clavier ----------
poster.addEventListener('click', () => { ensureCtx(); play(0); });
$('bPlay').addEventListener('click', () => { ensureCtx(); toggle(); });
$('bRestart').addEventListener('click', () => { ensureCtx(); if (playing) play(0); else seek(0); });
$('bLoop').addEventListener('click', () => { loop = !loop; updateUI(); toast(loop ? 'Lecture en boucle' : 'Lecture unique', 1400); });
function setMute(m) { muted = m; if (outGain) outGain.gain.value = muted ? 0 : 1; updateUI(); }
$('bMute').addEventListener('click', () => setMute(!muted));
function fullscreen() {
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else { const el = d.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
}
$('bFull').addEventListener('click', fullscreen);
$('bExport').addEventListener('click', exportVideo);
window.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'k') { e.preventDefault(); ensureCtx(); if (!started) play(0); else toggle(); }
  else if (k === 'arrowleft' || k === 'arrowright') { e.preventDefault(); seek(T + (k === 'arrowleft' ? -1 : 1) * (e.shiftKey ? 1 / 30 : 1)); }
  else if (k === 'home' || k === '0') seek(0);
  else if (k === 'l') $('bLoop').click();
  else if (k === 'm') setMute(!muted);
  else if (k === 'f') fullscreen();
  nudgeIdle();
});
['pointermove', 'pointerdown', 'touchstart'].forEach(ev => window.addEventListener(ev, nudgeIdle, { passive: true }));
window.addEventListener('resize', () => fit());
document.addEventListener('fullscreenchange', () => setTimeout(fit, 50));

// ---------- export vidéo (canvas + bande-son, en temps réel) ----------
async function exportVideo() {
  if (exporting) return;
  if (!window.MediaRecorder || !cv.captureStream) { toast('Export vidéo non pris en charge par ce navigateur', 3200); return; }
  const types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4',
    'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = types.find(m => MediaRecorder.isTypeSupported(m));
  if (!mime) { toast('Aucun format vidéo disponible', 3000); return; }
  ensureCtx();
  toast('Préparation de l’export…');
  try { await buildAudio(); } catch (e) { }
  if (actx) { try { await actx.resume(); } catch (e) { } }
  pause();
  exporting = true; fit(); render(0);
  const stream = cv.captureStream(60);
  if (actx) { recDest = actx.createMediaStreamDestination(); recDest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr)); }
  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 20e6, audioBitsPerSecond: 256e3 });
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach(tr => tr.stop());
    const blob = new Blob(chunks, { type: mime.split(';')[0] });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'veya-motion-15s.' + (mime.includes('mp4') ? 'mp4' : 'webm');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    exporting = false; recDest = null; recorder = null; fit(); updateUI();
    toast(`Vidéo exportée ✓ (${(blob.size / 1048576).toFixed(1).replace('.', ',')} Mo)`, 3200);
  };
  recorder.start(250);
  updateUI();
  await play(0);
}

// ---------- démarrage ----------
window.__veya = {
  render: t => { T = clamp(t, 0, DUR); started = true; poster.classList.add('hide'); render(T); updateTime(); },
  seek, play, pause, buildAudio,
  get T() { return T; }, get buf() { return AUDIO_BUF; },
  times: { G0, HOOK_END, TYPE_END, SEND_T, CARDS_T, TAP1, MORPH0, MORPH1, SHEET0, SEL_T, CONF_T, DONE_T, ZOOM0, LOGO0 },
};
(async function boot() {
  fit(); makeNoise();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#050307'; ctx.fillRect(0, 0, cv.width, cv.height);
  await loadFonts();
  layout(); logoGeom();
  for (const n of ['glove', 'bag', 'ring']) photo(n, 400, 300);
  for (const n of TILES) photo(n, 140, 140);
  photo('portrait', 120, 120);
  dirty = true;
  requestAnimationFrame(frame);
  render(POSTER_T);
  $('posterSub').textContent = 'Motion design · 15 s · son conseillé';
  poster.classList.remove('loading');
  updateUI();
  setTimeout(() => buildAudio().catch(() => { }), 60);
})();
</script>
