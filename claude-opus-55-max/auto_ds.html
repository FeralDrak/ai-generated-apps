<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission AutoDS — prépa entretien</title>
<meta name="description" content="Application éducative et ludique (non officielle) pour tout apprendre sur AutoDS — histoire, produit, business, tech, culture — et préparer un entretien développeur : leçons, mini-jeux, quiz, flashcards, simulateur d'entretien.">
<meta name="theme-color" content="#090A13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<script>try{var s=JSON.parse(localStorage.getItem('mission-autods-v1')||'{}');document.documentElement.dataset.theme=s.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');}catch(e){}</script>
<style>
:root{
  --bg:#090A13;--bg-2:#0D0F1E;--surface:#121427;--surface-2:#181B33;--surface-3:#22264A;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.15);
  --text:#ECEEFF;--muted:#A3A9CF;--faint:#6F769C;
  --primary:#7C6CFF;--primary-2:#A094FF;--blue:#3D9BFF;--mint:#2EE6A6;--amber:#FFB547;--coral:#FF5D73;--pink:#F472B6;--cyan:#3DD5F3;
  --primary-soft:rgba(124,108,255,.15);--mint-soft:rgba(46,230,166,.12);--coral-soft:rgba(255,93,115,.13);--amber-soft:rgba(255,181,71,.13);--blue-soft:rgba(61,155,255,.13);
  --on-mint:#03271B;
  --grad:linear-gradient(135deg,#7C6CFF 0%,#3D9BFF 55%,#2EE6A6 100%);
  --grad-warm:linear-gradient(90deg,#FF5D73,#FFB547);
  --shadow:0 14px 34px -16px rgba(0,0,0,.65);
  --shadow-lg:0 30px 70px -24px rgba(0,0,0,.75);
  --r:18px;--r-sm:12px;
  --code-bg:#0B0D1B;--code-text:#D9DCF7;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4F5FB;--bg-2:#ECEEF8;--surface:#FFFFFF;--surface-2:#F5F6FC;--surface-3:#E6E8F5;
  --line:rgba(22,25,60,.09);--line-2:rgba(22,25,60,.17);
  --text:#14162B;--muted:#535A80;--faint:#868CAE;
  --primary:#5A48F5;--primary-2:#5A48F5;--blue:#1F7FE6;--mint:#0BA877;--amber:#B86E00;--coral:#DC3049;--pink:#D63F8C;--cyan:#0E9FC0;
  --primary-soft:rgba(90,72,245,.10);--mint-soft:rgba(11,168,119,.10);--coral-soft:rgba(220,48,73,.08);--amber-soft:rgba(232,150,20,.12);--blue-soft:rgba(31,127,230,.09);
  --on-mint:#FFFFFF;
  --shadow:0 14px 30px -18px rgba(30,35,90,.28);
  --shadow-lg:0 30px 60px -26px rgba(30,35,90,.38);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(26px,3.4vw,36px);font-weight:800}
h2{font-size:clamp(20px,2.4vw,25px);font-weight:800}
h3{font-size:16.5px;font-weight:700}
h4{font-size:15px;font-weight:700}
p{margin:0 0 .8em}
sup{font-size:.7em}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
code,kbd{font-family:var(--mono);font-size:.86em}
code{background:var(--surface-3);padding:.08em .4em;border-radius:6px;word-break:break-word}
kbd{padding:1px 6px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);font-size:12px}
.aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 520px at 88% -12%,rgba(124,108,255,.20),transparent 60%),
  radial-gradient(700px 520px at -12% 28%,rgba(61,155,255,.10),transparent 60%),
  radial-gradient(640px 420px at 62% 112%,rgba(46,230,166,.08),transparent 60%)}
:root[data-theme="light"] .aurora{opacity:.75}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
::selection{background:rgba(124,108,255,.35)}
.ic{width:20px;height:20px;flex:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}
.center{text-align:center}
.hidden,[hidden]{display:none!important}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px}
.linkish:hover{color:var(--coral)}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px;border-right:1px solid var(--line);background:var(--bg-2);background:color-mix(in srgb,var(--bg-2) 75%,transparent);backdrop-filter:blur(14px);display:flex;flex-direction:column;z-index:40;scrollbar-width:thin}
.scrim{display:none}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 14px;text-decoration:none}
.brand svg{width:40px;height:40px;flex:none;filter:drop-shadow(0 8px 16px rgba(124,108,255,.45))}
.brand b{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:11.5px;color:var(--faint);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-sec{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:11px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--primary-soft);color:var(--text)}
.nav a.on .ic{color:var(--primary-2)}
.nav .count{margin-left:auto;font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;background:var(--surface-3);color:var(--muted)}
.nav .count.hot{background:var(--coral);color:#fff}
.nav-mods{display:flex;flex-direction:column;gap:1px;margin:2px 0 2px 12px;padding-left:10px;border-left:1px solid var(--line)}
.nav-mods a{font-size:13px;padding:6px 8px;gap:9px}
.nav-mods .num{width:22px;text-align:center;font-size:14px;flex:none}
.nav-mods .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots3{display:flex;gap:3px;flex:none}
.dots3 i{width:6px;height:6px;border-radius:50%;background:var(--surface-3)}
.dots3 i.on{background:var(--mint)}
.side-foot{margin-top:auto;padding:16px 10px 4px;font-size:11.5px;line-height:1.5;color:var(--faint);border-top:1px solid var(--line)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:11px 28px;background:var(--bg);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line);min-height:62px}
.tb-title{font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.chip-btn .ic{width:17px;height:17px;color:var(--muted)}
.chip-btn.hot{border-color:color-mix(in srgb,var(--coral) 55%,transparent);background:var(--coral-soft)}
.chip-btn.hot .ic{color:var(--coral)}
.chip-btn.streak .ic{color:var(--amber)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text);border-color:var(--line-2)}
.icon-btn .ic{width:19px;height:19px}
.menu-btn{display:none}
.xp-pill{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.xp-pill .lv{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--grad);font-size:15px;flex:none}
.xp-pill .xpm{display:flex;flex-direction:column;gap:3px}
.xp-pill small{font-size:11px;color:var(--muted);font-weight:700;line-height:1.1;white-space:nowrap}
.xp-pill .xpb{width:96px;height:6px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.xp-pill .xpb i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.xp-pill .xpn{font-size:13px;font-weight:800;white-space:nowrap}
.view{width:100%;max-width:1120px;margin:0 auto;padding:30px 28px 96px;outline:none}
.view.enter{animation:viewIn .32s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}

/* ---------- Generic UI ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;transition:transform .12s,background .15s,border-color .15s,filter .15s;white-space:nowrap;color:var(--text)}
.btn:hover{border-color:var(--primary)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn .ic{width:18px;height:18px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 12px 26px -12px rgba(124,108,255,.85)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{border-color:color-mix(in srgb,var(--coral) 50%,transparent);color:var(--coral);background:transparent}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.lg{height:50px;padding:0 22px;font-size:15px;border-radius:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--surface-3);color:var(--muted);white-space:nowrap;letter-spacing:.01em}
.tag.p{background:var(--primary-soft);color:var(--primary-2)}
.tag.m{background:var(--mint-soft);color:var(--mint)}
.tag.a{background:var(--amber-soft);color:var(--amber)}
.tag.c{background:var(--coral-soft);color:var(--coral)}
.tag.b{background:var(--blue-soft);color:var(--blue)}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--primary-2)}
.src{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.45}
.src::before{content:"Source : ";font-weight:700}
.page-head{margin-bottom:22px}
.page-head p{max-width:780px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:36px 0 14px}
.sec-title h2{margin:0}
.sec-title a{font-size:13px;font-weight:700;color:var(--muted);text-decoration:none}
.sec-title a:hover{color:var(--text)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter button{border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:99px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.filter button:hover{color:var(--text)}
.filter button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring circle{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring b{position:relative;font-size:11.5px;font-weight:800}
.bar{height:7px;border-radius:7px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:7px;transition:width .5s}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px;font-weight:600}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sw{width:40px;height:23px;border-radius:99px;background:var(--surface-3);position:relative;transition:background .2s;flex:none}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.switch input:checked+.sw{background:var(--mint)}
.switch input:checked+.sw::after{transform:translateX(17px)}
.switch input:focus-visible+.sw{outline:2px solid var(--primary);outline-offset:2px}
.input,.ta{width:100%;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface-2);color:var(--text);font:15px/1.55 var(--font)}
.input{height:44px;padding:0 14px}
.ta{padding:13px 14px;min-height:150px;resize:vertical}
.input:focus,.ta:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}

/* ---------- Home ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:32px;background:linear-gradient(135deg,rgba(124,108,255,.24),rgba(61,155,255,.10) 55%,rgba(46,230,166,.10)),var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
.hero h1{font-size:clamp(28px,3.9vw,42px);margin:10px 0 12px}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:16.5px;color:var(--muted);margin-bottom:22px}
.live{border-radius:20px;background:var(--bg-2);background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line-2);padding:14px;box-shadow:var(--shadow-lg)}
.live-top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted);padding:2px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(46,230,166,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(46,230,166,0)}100%{box-shadow:0 0 0 0 rgba(46,230,166,0)}}
.live-feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-height:252px}
.live-feed li{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-size:13px;animation:fadeIn .45s both}
.live-feed li .le{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);font-size:16px;flex:none}
.live-feed li b{display:block;font-size:13px}
.live-feed li small{color:var(--faint);font-size:11.5px}
.live-feed li .amt{margin-left:auto;font-weight:800;font-size:12.5px;white-space:nowrap}
.track-card{margin-top:18px}
.track-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.track-head .tn{font-family:var(--mono);font-size:12px;color:var(--faint)}
.track{position:relative;margin:30px 4px 4px}
.track-line{position:absolute;left:10%;right:10%;top:18px;height:4px;border-radius:4px;background:var(--surface-3)}
.track-line i{display:block;height:100%;border-radius:4px;background:var(--grad);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.truck{position:absolute;top:-30px;width:34px;height:24px;transform:translateX(-50%);transition:left 1.1s cubic-bezier(.2,.8,.2,1);color:var(--text)}
.track-steps{position:relative;display:flex}
.tstep{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.tstep .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line-2);font-size:17px;position:relative;z-index:1}
.tstep.done .dot{background:var(--grad);border-color:transparent}
.tstep.cur .dot{border-color:var(--primary);box-shadow:0 0 0 6px var(--primary-soft)}
.tstep b{font-size:12.5px;line-height:1.2}
.tstep small{font-size:11px;color:var(--faint)}
.mods-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.mcard{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:transform .18s,border-color .18s,box-shadow .18s;overflow:hidden;box-shadow:var(--shadow)}
.mcard:hover{transform:translateY(-3px);border-color:var(--mc);box-shadow:var(--shadow-lg)}
.mcard::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--mc)}
.mc-top{display:flex;justify-content:space-between;align-items:center}
.mi{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--mc) 18%,transparent)}
.mcard h3{margin:3px 0 4px}
.mcard p{font-size:13.2px;color:var(--muted);margin:0}
.steps3{display:flex;gap:6px;margin-top:auto}
.steps3 span{flex:1;height:5px;border-radius:5px;background:var(--surface-3)}
.steps3 span.on{background:var(--mc)}
.mc-foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--faint);font-weight:700}
.mc-foot .go{color:var(--text)}
.widget h3{display:flex;align-items:center;gap:8px}
.fact-txt{font-size:15px;line-height:1.55;min-height:70px}
.big-n{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}

/* ---------- Parcours ---------- */
.path{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:34px}
.path::before{content:"";position:absolute;left:13px;top:20px;bottom:20px;width:3px;border-radius:3px;background:linear-gradient(var(--primary),var(--blue),var(--mint))}
.pnode{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.pnode::before{content:"";position:absolute;left:-28px;top:50%;width:15px;height:15px;margin-top:-7px;border-radius:50%;background:var(--bg);border:3px solid var(--mc)}
.pnode.done::before{background:var(--mc)}
.pnode .mi{width:54px;height:54px;font-size:26px}
.pnode h3{margin:2px 0 3px}
.pnode p{margin:0;font-size:13.5px;color:var(--muted)}
.pnode .pbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:700;text-decoration:none;border:1px solid var(--line-2);color:var(--muted)}
.pbtn.on{background:var(--mint-soft);border-color:color-mix(in srgb,var(--mint) 45%,transparent);color:var(--mint)}
.pbtn:hover{color:var(--text);border-color:var(--primary)}

/* ---------- Module ---------- */
.mod-head{margin-bottom:24px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;margin-bottom:14px}
.back .ic{width:16px;height:16px}
.back:hover{color:var(--text)}
.mh-row{display:flex;gap:16px;align-items:center}
.mh-ic{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;font-size:32px;background:color-mix(in srgb,var(--mc) 20%,transparent);border:1px solid color-mix(in srgb,var(--mc) 45%,transparent);flex:none}
.mh-row h1{margin:3px 0 4px}
.mh-row p{margin:0}
.tabs3{display:flex;gap:6px;margin-top:20px;padding:5px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:max-content;max-width:100%;overflow-x:auto}
.tabs3 a{display:flex;align-items:center;gap:9px;padding:9px 16px;border-radius:12px;text-decoration:none;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs3 a .n{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--surface-3)}
.tabs3 a:hover{color:var(--text)}
.tabs3 a.on{background:var(--surface-3);color:var(--text)}
.tabs3 a.done .n{background:var(--mint);color:var(--on-mint)}
.mod-nav{display:flex;justify-content:space-between;gap:10px;margin-top:38px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.lblock{margin-bottom:22px}
.lh{margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.lh::after{content:"";flex:1;height:1px;background:var(--line)}
.lead{font-size:17px;line-height:1.7;max-width:860px}
.fact{padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.fact .fi{font-size:24px;margin-bottom:8px;line-height:1}
.fact h3{margin-bottom:6px}
.fact p,.fact li{color:var(--muted);font-size:14.2px}
.fact p:last-of-type{margin-bottom:0}
.fact ul{margin:0;padding-left:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.stat{padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.35;display:block;margin-top:4px}
.person{display:flex;gap:14px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.avatar{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;background:var(--grad);flex:none;letter-spacing:.02em}
.person h3{margin:0}
.person .role{font-size:12.5px;font-weight:800;color:var(--primary-2);margin-bottom:6px}
.person p{margin:0;font-size:13.8px;color:var(--muted)}
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--primary),var(--blue),var(--mint))}
.tl-item{position:relative;padding:2px 0 18px}
.tl-item::before{content:"";position:absolute;left:-26px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--primary)}
.tl-item.hl::before{border-color:var(--mint);box-shadow:0 0 0 5px var(--mint-soft)}
.tl-date{font-size:11.5px;font-weight:800;color:var(--primary-2);letter-spacing:.06em;text-transform:uppercase}
.tl-item h4{margin:2px 0 3px}
.tl-item p{margin:0;color:var(--muted);font-size:14px}
.callout{display:flex;gap:14px;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2)}
.callout.tip{background:var(--mint-soft);border-color:color-mix(in srgb,var(--mint) 35%,transparent)}
.callout.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 38%,transparent)}
.callout.info{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 35%,transparent)}
.callout .ci{font-size:22px;line-height:1.2}
.callout p:last-child,.callout ul:last-child{margin-bottom:0}
.callout ul{margin:6px 0 0;padding-left:18px}
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th,.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);background:var(--surface-2)}
.tbl td:first-child{font-weight:700}
details.acc{border:1px solid var(--line);border-radius:15px;background:var(--surface);margin-bottom:10px;overflow:hidden}
details.acc summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:700}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";margin-left:auto;font-size:20px;line-height:1;color:var(--faint);transition:transform .2s}
details.acc[open] summary::after{transform:rotate(45deg)}
details.acc summary:hover{background:var(--surface-2)}
.acc-ic{font-size:19px;width:26px;text-align:center;flex:none}
.acc-body{padding:2px 16px 16px 54px;color:var(--muted);font-size:14.2px}
.say{margin-top:12px;padding:10px 13px;border-radius:11px;background:var(--primary-soft);color:var(--text);font-size:13.8px}
.say b{color:var(--primary-2)}
.pillars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.pillar{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);position:relative;box-shadow:var(--shadow)}
.pillar .pn{font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.08em}
.pillar h3{display:flex;gap:8px;align-items:center;margin:4px 0 8px;font-size:15.5px}
.pillar ul{margin:0;padding:0;list-style:none}
.pillar li{font-size:13px;color:var(--muted);padding:6px 0;border-top:1px dashed var(--line);line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip .lg{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex:none}
.chip.big{border-radius:14px;padding:10px 14px}
.chip small{display:block;font-size:11.5px;color:var(--faint);font-weight:600}
.code-chips{display:flex;flex-wrap:wrap;gap:6px}
.code-chips code{font-size:12px;padding:4px 9px;border-radius:8px;background:var(--code-bg);color:var(--code-text);border:1px solid rgba(255,255,255,.06)}
.deal p{color:var(--muted)}
.deal-row{margin:16px 0}
.deal-row .lbl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700;margin-bottom:7px}
.deal-bar{display:flex;height:36px;border-radius:11px;overflow:hidden;background:var(--surface-3)}
.deal-bar span{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.hb{display:grid;grid-template-columns:136px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:12.5px;font-weight:700}
.hb .tr{height:10px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:6px}
.hb .v{text-align:right;color:var(--muted)}
.mini{padding:16px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line)}
.mini h4{margin-bottom:8px}
.mini p{font-size:13.5px;margin:0}
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:14px 0}
.fnode{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:15px;background:var(--surface-2);border:1.5px solid var(--line);text-align:center;font-size:12.5px;font-weight:700;transition:all .3s;line-height:1.25}
.fnode .fe{font-size:25px;line-height:1}
.fnode.on{background:var(--primary-soft);border-color:var(--primary);transform:translateY(-4px);box-shadow:0 14px 26px -14px rgba(124,108,255,.9)}
.fnode.done{border-color:color-mix(in srgb,var(--mint) 55%,transparent)}
.flog{list-style:none;margin:0;padding:0;font-size:13.5px;min-height:44px}
.flog li{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);animation:fadeIn .3s both}
.flog li.ph{color:var(--faint);border:0}
.flog .t{font-family:var(--mono);font-size:12px;color:var(--primary-2);min-width:52px;padding-top:1px}
.flow-sum{margin-top:12px;font-size:14px}
.archi{display:flex;flex-direction:column;align-items:stretch;gap:0}
.arow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.abox{flex:1 1 150px;max-width:230px;padding:11px 12px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line-2);text-align:center;font-size:12.8px;font-weight:700;line-height:1.3}
.abox small{display:block;font-weight:600;color:var(--faint);font-size:11px;margin-top:3px}
.abox.k{border-color:color-mix(in srgb,var(--primary) 55%,transparent);background:var(--primary-soft)}
.abox.x{border-style:dashed}
.alabel{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:center;margin:4px 0 6px}
.adown{text-align:center;color:var(--faint);font-size:18px;line-height:1;margin:6px 0}
.values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.value{position:relative;padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow)}
.value::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--vc);opacity:.13}
.value .ve{font-size:28px}
.value h3{font-size:21px;margin:8px 0 2px;letter-spacing:-.02em}
.value .vfr{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.value ul{margin:0;padding-left:18px;font-size:13.8px}
.value li{margin-bottom:4px}
.vsteps{counter-reset:s;display:grid;gap:10px}
.vstep{display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;padding:15px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.vstep::before{counter-increment:s;content:counter(s);width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;background:var(--grad);color:#fff}
.vstep h4{margin:2px 0 3px}
.vstep p{margin:0;font-size:13.8px;color:var(--muted)}
.job{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.job h4{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:6px}
.job ul{margin:0;padding-left:18px;font-size:13.8px;color:var(--muted)}
.job li{margin-bottom:3px}
.lesson-end{margin-top:30px;padding:22px;border-radius:20px;border:1px dashed var(--line-2);display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface-2)}
.lesson-end p{margin:0;flex:1;min-width:220px}

/* ---------- Activities ---------- */
.act-head{margin-bottom:18px}
.act-head h2{margin-bottom:6px}
.act-head p{max-width:780px;margin:0}
.act-foot{margin-top:16px}
.done-banner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;background:var(--mint-soft);border:1px solid color-mix(in srgb,var(--mint) 40%,transparent);margin:16px 0;animation:pop .45s both;flex-wrap:wrap}
.done-banner .de{font-size:28px}
.done-banner p{margin:0;flex:1;min-width:200px}
.so-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.so-list.locked .so-handle,.so-list.locked .so-arrows{visibility:hidden}
.so-item{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 6px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line-2);user-select:none;-webkit-user-select:none;position:relative;transition:border-color .2s,background .2s,box-shadow .2s}
.so-item.dragging{z-index:5;box-shadow:var(--shadow-lg);border-color:var(--primary);background:var(--surface-2);transition:none}
.so-handle{width:30px;height:40px;display:grid;place-items:center;cursor:grab;color:var(--faint);touch-action:none;border-radius:8px;flex:none}
.so-handle:hover{color:var(--text);background:var(--surface-2)}
.so-handle .ic{width:18px;height:18px}
.so-pos{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface-3);flex:none}
.so-txt{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.35}
.so-txt small{display:block;font-weight:500;color:var(--muted);font-size:12.8px;margin-top:2px}
.so-meta{font-size:12px;font-weight:800;color:var(--primary-2);white-space:nowrap}
.so-arrows{display:flex;flex-direction:column;gap:3px;flex:none}
.so-arrows button{width:30px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:9px;line-height:1;color:var(--muted)}
.so-arrows button:hover{color:var(--text);border-color:var(--primary)}
.so-item.ok{border-color:var(--mint);background:var(--mint-soft)}
.so-item.ok .so-pos{background:var(--mint);color:var(--on-mint)}
.so-item.ko{border-color:var(--coral);background:var(--coral-soft)}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
.ctrl{display:flex;flex-direction:column;gap:14px}
.rng{display:flex;flex-direction:column;gap:6px}
.rng .rl{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700}
.rng .rl b{font-family:var(--mono);font-size:13px;color:var(--primary-2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:var(--surface-3);outline:none;margin:6px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--primary);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:4px solid var(--primary);cursor:pointer}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--primary-soft)}
.price-big{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.kpi{padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.kpi small{display:block;font-size:11.5px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-size:20px;font-weight:800}
.kpi.good b{color:var(--mint)}.kpi.bad b{color:var(--coral)}
.stack{display:flex;height:30px;border-radius:9px;overflow:hidden;margin-top:14px;background:var(--surface-3)}
.stack span{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#fff;overflow:hidden;white-space:nowrap;transition:width .35s}
.chal{display:flex;flex-direction:column;gap:10px}
.chal-item{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.chal-item .cb{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;border:1.5px solid var(--line-2);flex:none;font-size:13px;font-weight:800}
.chal-item.on{border-color:color-mix(in srgb,var(--mint) 45%,transparent);background:var(--mint-soft)}
.chal-item.on .cb{background:var(--mint);border-color:var(--mint);color:var(--on-mint)}
.chal-item b{display:block;font-size:14px}
.chal-item p{margin:2px 0 0;font-size:13.2px;color:var(--muted)}
.shock{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:13.5px;animation:fadeIn .3s both}
.shock.bad{background:var(--coral-soft);border:1px solid color-mix(in srgb,var(--coral) 40%,transparent)}
.shock.good{background:var(--mint-soft);border:1px solid color-mix(in srgb,var(--mint) 40%,transparent)}
.dash{border-radius:22px;background:var(--surface);border:1px solid var(--line-2);padding:18px;box-shadow:var(--shadow-lg);max-width:820px;margin:0 auto}
.dash-top{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:12px;flex-wrap:wrap}
.dash-top .dot{width:10px;height:10px;border-radius:50%}
.notif{display:flex;gap:14px;align-items:center;padding:16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);margin:4px 0 16px;animation:pop .4s both}
.notif .ne{font-size:30px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--surface-3);flex:none}
.notif small{font-size:11.5px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.notif p{margin:2px 0 0;font-size:16px;font-weight:700;line-height:1.4}
.swot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.quad{min-height:160px;padding:14px;border-radius:17px;border:2px dashed var(--line-2);background:var(--surface);cursor:pointer;transition:border-color .2s,background .2s;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.quad.armed{border-color:var(--primary);background:var(--primary-soft)}
.quad .qh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.quad .qh small{font-weight:600;color:var(--faint);font-size:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:14px;border-radius:17px;background:var(--surface-2);border:1px solid var(--line);min-height:68px;margin-bottom:14px}
.pool:empty::after{content:"Toutes les cartes sont placées 👌";color:var(--faint);font-size:13px;align-self:center}
.scard{padding:9px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line-2);font-size:13px;font-weight:600;cursor:pointer;text-align:left;line-height:1.35;color:var(--text)}
.scard:hover{border-color:var(--primary)}
.scard.sel{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.quad .scard{width:100%}
.scard.ok{border-color:var(--mint);background:var(--mint-soft)}
.scard.ko{border-color:var(--coral);background:var(--coral-soft)}
.scard .why{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:4px}
.lab-tabs{margin-bottom:18px}
.code{background:var(--code-bg);color:var(--code-text);border-radius:15px;padding:12px 0;font-family:var(--mono);font-variant-ligatures:none;font-size:13px;line-height:1.7;overflow-x:auto;border:1px solid rgba(255,255,255,.07);margin:12px 0}
.code .ln{display:flex;padding-right:16px;cursor:pointer;white-space:pre;min-width:max-content;transition:background .15s}
.code.static .ln{cursor:default}
.code .ln:hover{background:rgba(124,108,255,.14)}
.code.static .ln:hover{background:none}
.code .no{width:42px;text-align:right;padding-right:14px;color:#5B618F;user-select:none;flex:none}
.code .ln.hit{background:rgba(255,93,115,.2)}
.code .ln.good{background:rgba(46,230,166,.18)}
.code .ln.miss{animation:shake .35s}
.code .cm{color:#7B83B8;font-style:italic}.code .kw{color:#C792EA}.code .st{color:#C3E88D}.code .fn{color:#82AAFF}.code .nu{color:#F78C6C}
.bug-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bug-nav button{width:36px;height:36px;border-radius:11px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:800;cursor:pointer;color:var(--muted)}
.bug-nav button.on{border-color:var(--primary);color:var(--text)}
.bug-nav button.ok{background:var(--mint);border-color:var(--mint);color:var(--on-mint)}
.fermi-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.scn{max-width:820px;margin:0 auto}
.scn-card{padding:24px;border-radius:22px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-lg)}
.scn-sit{font-size:clamp(17px,2vw,20px);font-weight:700;line-height:1.45;margin:8px 0 18px}
.vtag{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--primary-soft);color:var(--primary-2);margin-top:8px}
.pitch-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checklist li{display:flex;gap:10px;align-items:flex-start;font-size:13.6px;color:var(--muted);line-height:1.4}
.checklist .cb{width:21px;height:21px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;transition:all .2s}
.checklist li.on{color:var(--text)}
.checklist li.on .cb{background:var(--mint);border-color:var(--mint);color:var(--on-mint)}
.meter{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint);font-weight:700;margin-top:8px;gap:10px;flex-wrap:wrap}
.asks{display:grid;gap:8px}
.ask{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;font-size:14px;text-align:left;width:100%;line-height:1.45}
.ask .cb{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;margin-top:1px}
.ask.on{border-color:var(--primary);background:var(--primary-soft)}
.ask.on .cb{background:var(--primary);border-color:var(--primary);color:#fff}

/* ---------- Quiz ---------- */
.quiz{max-width:780px;margin:0 auto}
.q-top{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.q-top .combo{color:var(--amber)}
.quiz>.bar{margin-bottom:20px}
.tbar{height:5px;border-radius:5px;background:var(--surface-3);overflow:hidden;margin:-12px 0 18px}
.tbar i{display:block;height:100%;width:100%;background:var(--grad-warm);transform-origin:left center}
.q-mod{display:inline-flex;margin-bottom:6px}
.q-text{font-size:clamp(19px,2.3vw,23px);margin:6px 0 18px;line-height:1.38}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 15px;border-radius:15px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:14.8px;font-weight:600;line-height:1.4;transition:border-color .15s,background .15s,opacity .2s}
.opt:hover:not([disabled]){border-color:var(--primary);background:var(--surface-2)}
.opt .key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:var(--surface-3);flex:none;color:var(--muted)}
.opt.ok{border-color:var(--mint);background:var(--mint-soft);opacity:1}
.opt.ok .key{background:var(--mint);color:var(--on-mint)}
.opt.ko{border-color:var(--coral);background:var(--coral-soft);animation:shake .35s;opacity:1}
.opt.ko .key{background:var(--coral);color:#fff}
.opt[disabled]{cursor:default;opacity:.55}
.opt.mid{border-color:var(--amber);background:var(--amber-soft);opacity:1}
.opt.mid .key{background:var(--amber);color:#fff}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.feedback{margin-top:16px;padding:14px 16px;border-radius:15px;font-size:14.5px;display:none}
.feedback.show{display:block;animation:fadeIn .25s both}
.feedback.ok{background:var(--mint-soft);border:1px solid color-mix(in srgb,var(--mint) 40%,transparent)}
.feedback.ko{background:var(--coral-soft);border:1px solid color-mix(in srgb,var(--coral) 40%,transparent)}
.feedback.mid{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent)}
.feedback>b:first-child{display:block;margin-bottom:3px}
.q-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:16px}
.result{max-width:700px;margin:0 auto;text-align:center}
.big-score{font-size:66px;font-weight:800;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
.review{text-align:left;margin-top:22px;display:grid;gap:10px}
.review .rv{padding:14px 16px;border-radius:15px;background:var(--surface);border:1px solid var(--line)}
.review .rv b{display:block;margin-bottom:4px}
.review .rv p{margin:0;font-size:13.5px;color:var(--muted)}
.review .rv .ans{color:var(--mint);font-weight:700;font-size:13.8px;margin:2px 0 4px}
.modbars{display:grid;gap:8px;text-align:left;margin-top:18px}
.mbr{display:grid;grid-template-columns:150px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.cert{position:relative;margin:22px auto 0;max-width:620px;padding:34px 28px;border-radius:24px;background:radial-gradient(circle at 100% 0,rgba(124,108,255,.35),transparent 55%),radial-gradient(circle at 0 100%,rgba(46,230,166,.25),transparent 55%),var(--surface);border:1px solid var(--line-2);text-align:center;box-shadow:var(--shadow-lg)}
.cert .seal{font-size:46px}
.cert h2{font-size:26px;margin:6px 0}
.cert .nm{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:10px 0}

/* ---------- Flashcards ---------- */
.fc-stage{perspective:1400px;max-width:640px;margin:0 auto}
.fc{position:relative;height:310px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);border-radius:24px}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:34px 30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line-2);box-shadow:var(--shadow-lg);overflow:auto}
.fc-front{background:linear-gradient(160deg,var(--surface-2),var(--surface))}
.fc-back{background:linear-gradient(160deg,rgba(124,108,255,.22),rgba(46,230,166,.10)),var(--surface);transform:rotateY(180deg)}
.fq{font-size:clamp(19px,2.6vw,24px);font-weight:800;line-height:1.3}
.fa{font-size:clamp(15.5px,2vw,18px);font-weight:600;line-height:1.5}
.fc-cat{position:absolute;top:16px;left:18px}
.fc-box{position:absolute;top:16px;right:18px}
.fc-hint{position:absolute;bottom:14px;left:0;right:0;font-size:12px;color:var(--faint)}
.rate{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.rate .btn{min-width:140px}
.fc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.boxes{display:flex;gap:6px;align-items:flex-end;height:46px}
.boxes span{flex:1;border-radius:6px 6px 3px 3px;background:var(--grad);min-height:4px;opacity:.85}

/* ---------- Interview ---------- */
.iv-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.iv-card{padding:26px;border-radius:24px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-lg)}
.iv-q{font-size:clamp(20px,2.6vw,26px);font-weight:800;line-height:1.3;margin:12px 0 6px;letter-spacing:-.02em}
.iv-en{font-size:15px;color:var(--muted);font-style:italic;margin:0}
.timer{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:.02em;line-height:1}
.timer.low{color:var(--coral)}
.iv-tools{display:flex;align-items:center;gap:10px;margin:20px 0 4px;padding:14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);flex-wrap:wrap}
.reveal{margin-top:18px;animation:fadeIn .3s both}
.reveal h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:14px 0 6px}
.reveal ul{margin:0;padding-left:20px}
.reveal li{margin-bottom:5px;font-size:14.5px}
.trap{margin-top:12px;padding:11px 14px;border-radius:12px;background:var(--coral-soft);font-size:13.8px}
.enph{margin-top:10px;padding:11px 14px;border-radius:12px;background:var(--blue-soft);font-size:13.8px}
.enph li{font-style:italic}
.iv-side{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto;padding:16px}
.iv-list{display:grid;gap:6px;margin-top:12px}
.iv-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;background:var(--surface-2);border:1px solid transparent;cursor:pointer;text-align:left;width:100%;font-size:13px;font-weight:600;line-height:1.35;color:var(--text)}
.iv-row:hover{border-color:var(--line-2)}
.iv-row.on{border-color:var(--primary);background:var(--primary-soft)}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--surface-3);flex:none;border:1px solid var(--line-2)}
.rdot.r0{background:var(--coral);border-color:transparent}.rdot.r1{background:var(--amber);border-color:transparent}.rdot.r2{background:var(--mint);border-color:transparent}

/* ---------- Badges / glossary / sheet ---------- */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px}
.bdg{padding:20px 16px;border-radius:19px;background:var(--surface);border:1px solid var(--line);text-align:center}
.bdg .be{font-size:40px;display:block;margin-bottom:8px;filter:grayscale(1);opacity:.32;line-height:1.1}
.bdg h3{font-size:15px;margin-bottom:4px}
.bdg p{font-size:12.8px;color:var(--muted);margin:0}
.bdg small{display:block;margin-top:8px;font-size:11.5px;color:var(--faint);font-weight:700}
.bdg.on{border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:linear-gradient(180deg,var(--amber-soft),transparent 70%),var(--surface)}
.bdg.on .be{filter:none;opacity:1}
.levels{display:grid;gap:8px;margin:12px 0}
.lvl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.lvl.on{border-color:var(--primary);background:var(--primary-soft)}
.lvl.lock{opacity:.55}
.lvl .le{font-size:20px;width:28px;text-align:center}
.gl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gl{padding:14px 16px;border-radius:15px;background:var(--surface);border:1px solid var(--line)}
.gl dt{font-weight:800;display:flex;align-items:center;gap:8px;justify-content:space-between}
.gl dd{margin:4px 0 0;font-size:13.8px;color:var(--muted)}
mark{background:rgba(255,181,71,.35);color:inherit;border-radius:3px;padding:0 1px}
.search{position:relative;margin-bottom:12px}
.search .input{padding-left:42px}
.search .ic{position:absolute;left:14px;top:12px;color:var(--faint)}
.sheet{columns:2 340px;column-gap:16px}
.sheet .blk{break-inside:avoid;margin-bottom:16px;padding:16px 18px;border-radius:17px;background:var(--surface);border:1px solid var(--line);display:inline-block;width:100%}
.sheet h3{font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.sheet ul{margin:0;padding-left:18px;font-size:13.5px}
.sheet li{margin-bottom:4px}
.sheet p{font-size:13.6px;margin:0}
.sources{display:grid;gap:10px}
.srcrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px 16px;border-radius:15px;background:var(--surface);border:1px solid var(--line)}
.srcrow .n{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface-3)}
.srcrow a{font-weight:700;text-decoration:none;word-break:break-word}
.srcrow a:hover{text-decoration:underline}
.srcrow p{margin:2px 0 0;font-size:13px;color:var(--muted)}

/* ---------- Toasts / modal / confetti ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{display:flex;gap:12px;align-items:center;min-width:220px;max-width:340px;padding:12px 16px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);transform:translateY(16px) scale(.96);opacity:0;transition:transform .35s cubic-bezier(.2,.9,.3,1.25),opacity .3s}
.toast.in{transform:none;opacity:1}
.toast .t-ic{font-size:22px;line-height:1}
.toast b{display:block;font-size:14px;line-height:1.3}
.toast small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.toast.xp{border-color:color-mix(in srgb,var(--primary) 55%,transparent)}
.toast.badge,.toast.level{border-color:color-mix(in srgb,var(--amber) 60%,transparent);background:linear-gradient(135deg,var(--amber-soft),transparent),var(--surface-2)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120}
.modal-ov{position:fixed;inset:0;z-index:90;background:rgba(5,6,15,.62);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;opacity:0;transition:opacity .22s}
.modal-ov.in{opacity:1}
.modal{width:min(540px,100%);max-height:calc(100vh - 36px);overflow:auto;padding:26px;border-radius:24px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);transform:translateY(12px) scale(.98);transition:transform .25s}
.modal-ov.in .modal{transform:none}
.modal h2{margin-bottom:6px}
.onb-list{display:grid;gap:8px;margin:14px 0 18px;padding:0;list-style:none}
.onb-list li{display:flex;gap:10px;align-items:center;font-size:14px}
.onb-list li span{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);flex:none}

/* ---------- Responsive ---------- */
@media (max-width:1180px){.pillars{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1050px){.iv-layout{grid-template-columns:1fr}.iv-side{position:static;max-height:none}}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:auto;width:290px;max-width:86vw;transform:translateX(-104%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--bg-2);box-shadow:none}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .menu-btn{display:grid}
  .topbar{padding:10px 16px}
  .view{padding:22px 16px 90px}
  .hero-grid,.calc,.pitch-grid{grid-template-columns:1fr}
  .tb-title{display:none}
  .xp-pill .xpb{width:60px}
}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.values{grid-template-columns:1fr}}
@media (max-width:760px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))}.gl-list,.job{grid-template-columns:1fr}.fc-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .g2,.g3,.g4,.opts.g2,.swot{grid-template-columns:1fr}
  .pillars{grid-template-columns:1fr}
  .hero{padding:22px 18px}
  .live-feed{min-height:0}
  .live-feed li:nth-child(n+4){display:none}
  .xp-pill small,.xp-pill .xpb,.hide-sm{display:none!important}
  .xp-pill{padding-right:10px}
  .pnode{grid-template-columns:auto minmax(0,1fr)}
  .pnode .ring{display:none}
  .mbr{grid-template-columns:110px minmax(0,1fr) 44px}
  .hb{grid-template-columns:96px minmax(0,1fr) 48px}
  .tstep b{font-size:11px}.tstep small{display:none}
  .tstep .dot{width:34px;height:34px;font-size:15px}
  .track-line{top:15px}
  .fc{height:340px}
  .chip-btn span.lbl{display:none}
  .topbar{gap:7px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{
  :root,:root[data-theme]{--bg:#fff;--bg-2:#fff;--surface:#fff;--surface-2:#f6f6f6;--surface-3:#e9e9e9;--text:#111;--muted:#333;--faint:#666;--line:#ddd;--line-2:#ccc;--shadow:none;--shadow-lg:none}
  body{background:#fff;color:#111}
  .sidebar,.topbar,.no-print,.toasts,#confetti,.aurora,.scrim{display:none!important}
  .app{display:block}.view{padding:0;max-width:none;animation:none}
  .sheet{columns:2}.sheet .blk{border:1px solid #ccc}
  .cert{box-shadow:none}
}
</style>
</head>

    { t: 'cards', cols: 2, items: [
      { i: '🖥️', h: 'L’app web', p: '<code>platform.autods.com</code> est une <b>SPA React buildée avec Vite</b>, avec <b>Sentry</b> pour les erreurs (releases taggées) et des retours de paiement <b>Stripe</b>.' },

    ], src: 'code source public de platform.autods.com et autods.com, consulté le 15/10/2026' },
    { t: 'html', html: '<div class="card"><h3>🔁 Les routes de retour d’intégration visibles dans l’app</h3><p class="muted small">Chaque intégration = un flux d’autorisation (OAuth ou équivalent) à maintenir : tokens, scopes, expirations, changements d’API…</p><div class="code-chips"><code>/shopify_callback</code><code>/woocommerce_callback</code><code>/wix_callback</code><code>/etsy_callback</code><code>/amazon_callback</code><code>/tiktok_callback</code><code>/facebook_oauth_callback</code><code>/aliexpress_success</code><code>/stripe_callback</code><code>/payoneer_account_success</code><code>/hubspot_auth</code></div></div>' },
    { t: 'job' },
    { t: 'h', text: 'Une architecture plausible' },
    { t: 'archi' },
    { t: 'h', text: 'Les 13 concepts à maîtriser' },
    { t: 'acc', items: [
      { i: '🔑', h: 'OAuth 2.0 : connecter une boutique', p: 'Flux « authorization code » : redirection vers la plateforme → le marchand accepte les <i>scopes</i> → retour sur le callback avec un <code>code</code> → échange <b>serveur à serveur</b> contre un access token (jamais exposé au navigateur) → stockage chiffré. Paramètre <code>state</code> contre le CSRF, scopes minimaux, gestion des expirations et refresh tokens selon la plateforme.', say: '« Chaque canal a ses particularités d’OAuth ; je centraliserais ça derrière une interface commune, avec rotation des tokens et alerte en cas de révocation. »' },
      { i: '🪝', h: 'Webhooks fiables', p: 'Ex. <code>orders/create</code> chez Shopify. 1) Vérifier la signature : HMAC-SHA256 du <b>corps brut</b> avec le secret de l’app, header <code>X-Shopify-Hmac-Sha256</code>. 2) Répondre 200 en quelques secondes, sinon l’envoi est considéré en échec et réessayé. 3) Mettre en file, traiter en asynchrone. 4) Dédoublonner : livraison « au moins une fois » → ID d’événement + contrainte d’unicité. 5) Réconcilier périodiquement par polling.', say: '« Un webhook peut arriver deux fois, en retard ou jamais : je le traite comme un signal, pas comme la source de vérité. »' },
      { i: '🚦', h: 'Rate limits', p: 'Shopify REST : seau (« leaky bucket ») de 40 requêtes qui se vide à 2 req/s sur les plans standard. GraphQL Admin : limite basée sur le <b>coût calculé</b> des requêtes. Shopify a classé l’API REST Admin en « legacy » (oct. 2024) : les nouvelles apps publiques doivent passer par GraphQL depuis avril 2025. Bonnes pratiques : limiteur par boutique, lecture des quotas renvoyés, backoff exponentiel + jitter sur les 429, files prioritaires, opérations en masse.', say: '« Je mettrais un limiteur par boutique et par API, et je prioriserais les commandes sur les mises à jour de catalogue. »' },
      { i: '👁️', h: 'Surveillance prix & stock à l’échelle', p: 'Scheduler → file de messages → workers de collecte (API partenaires ou scraping) → normalisation → détection de changement (diff/hash vs dernier état) → règles de prix → synchronisation boutique → alertes. Leviers : <b>dédoublonner</b> les produits fournisseurs suivis par plusieurs vendeurs, <b>prioriser</b> ceux qui vendent, détecter les anomalies (un prix × 10 est probablement une erreur de parsing).', say: '« Je commencerais par une estimation : produits × fréquence = débit, puis la loi de Little pour dimensionner la concurrence. »' },
      { i: '🧾', h: 'Commandes = machine à états', p: 'Nouvelle → En attente (prix max dépassé, solde insuffisant) → Commandée → Expédiée → Livrée, plus Annulée/Retour. Chaque transition est <b>idempotente</b> (clé par ligne de commande) ; les échecs déclenchent un retry avec backoff, la bascule vers un autre fournisseur ou une notification (pattern <i>saga</i> avec compensation).', say: '« Le pire bug ici, c’est la double commande : état persistant et idempotence avant tout appel externe. »' },
      { i: '🗂️', h: 'Modèle de données e-commerce', p: 'Produit ↔ variantes ↔ SKU ; mapping variante boutique ↔ variante fournisseur (les tailles et couleurs ne portent pas le même nom !) ; montants en <b>centimes entiers</b> + devise ; historique des prix ; multi-boutiques et multi-utilisateurs (assistants virtuels) → permissions par compte.', say: '« Le mapping des variantes est un nid à bugs : je le testerais avec des fixtures réelles de chaque fournisseur. »' },
      { i: '🕷️', h: 'Scraping ou API ?', p: 'Le scraping casse dès que le DOM change, se heurte aux anti-bots et pose des questions de conditions d’utilisation. Les API partenaires (cf. le partenariat AliExpress de 2023 et la route <code>/aliexpress_success</code>) sont plus stables. En pratique : un adaptateur par fournisseur, des tests de contrat sur des pages enregistrées, une alerte quand le taux d’erreur d’un connecteur grimpe.', say: '« J’isolerais chaque fournisseur dans un adaptateur avec ses tests et ses métriques, pour qu’une casse ne contamine pas les autres. »' },
      { i: '🧩', h: 'Extension Chrome (Manifest V3)', p: 'Le background devient un <b>service worker</b> événementiel (pas d’état global persistant → <code>chrome.storage</code>). Les <b>content scripts</b> s’injectent dans les pages fournisseurs pour lire les produits et ajouter le bouton « + ». Communication par messages, permissions et <code>host_permissions</code> minimales, aucun code distant exécuté.', say: '« Je garderais l’extension légère : extraction côté page, logique métier côté API, pour corriger sans republier sur le Chrome Web Store. »' },
      { i: '🐘', h: 'WordPress & WooCommerce', p: 'Un plugin, ce sont des <b>hooks</b> : <code>add_action</code> (réagir à un événement) et <code>add_filter</code> (transformer une valeur). Sécurité : <code>check_admin_referer</code>/nonces (CSRF), <code>current_user_can</code>, <code>sanitize_*</code> en entrée, <code>esc_*</code> en sortie, <code>$wpdb->prepare</code>. Pour connecter une app à WooCommerce : <code>/wc-auth/v1/authorize</code> → le marchand approuve → WooCommerce envoie la paire <i>consumer key / secret</i> au <code>callback_url</code>. Attention : WP-Cron ne tourne que s’il y a du trafic.', say: '« Ma checklist de PR WordPress : nonce, capability, sanitize en entrée, escape en sortie, requêtes préparées. »' },
      { i: '⚛️', h: 'React moderne', p: 'Hooks (<code>useState</code>, <code>useEffect</code>, <code>useMemo</code>, hooks maison) vs HOC (composants d’ordre supérieur, encore présents dans les bases anciennes). <b>TanStack Query</b> pour l’état serveur : clés de requête, <code>staleTime</code> (0 par défaut), invalidation après mutation, mises à jour optimistes. <b>Storybook</b> pour développer les composants isolément. <b>Next.js</b> : CSR (dashboard), SSR (contenu personnalisé), SSG/ISR (pages SEO).', say: '« Je sépare l’état serveur (TanStack Query) de l’état d’interface : ça élimine la plupart des useEffect fragiles. »' },
      { i: '🪪', h: 'AWS Cognito & JWT', p: 'Les <b>User Pools</b> gèrent inscription et connexion et émettent ID token, access token et refresh token (JWT). Côté API : vérifier la signature via le JWKS du pool, puis <code>exp</code>, <code>iss</code>, l’audience/<code>client_id</code>. Les <b>Identity Pools</b> fournissent des credentials AWS temporaires.', say: '« Je validerais les JWT dans la gateway pour que les services internes reçoivent une identité déjà vérifiée. »' },
      { i: '🔗', h: 'MCP (Model Context Protocol)', p: 'Protocole ouvert lancé par Anthropic fin 2024 pour brancher des assistants IA sur des outils et des données. Client ↔ serveur en <b>JSON-RPC 2.0</b>, transports <b>stdio</b> (local) ou <b>Streamable HTTP</b> (distant, avec OAuth). Le serveur expose des <b>tools</b> (actions), des <b>resources</b> (données) et des <b>prompts</b>. Pour un e-commerce : outils bornés, aperçu avant les actions de masse, confirmations, journal d’audit, rate limiting… et méfiance envers l’<b>injection de prompt</b> cachée dans des descriptions produits importées.', say: '« Pour le connecteur Claude, je séparerais outils de lecture et d’écriture, avec un mode “dry run” avant toute modification en masse. »' },
      { i: '🦾', h: 'Coder avec des agents IA', p: 'L’offre parle de <b>context management</b> et de <b>harness engineering</b> : donner à l’agent le bon contexte (fichier <code>CLAUDE.md</code>/<code>AGENTS.md</code>, conventions, commandes de test), de bons outils (serveurs MCP, scripts), des garde-fous (tests, linters, permissions, sandbox) et des boucles de feedback rapides. Puis relire chaque diff comme celui d’un collègue : sécurité, cas limites, cohérence avec la codebase.', say: '« L’IA écrit vite ; mon rôle est de cadrer, découper, vérifier — et d’assumer le code mergé. »' },
    ] },
    { t: 'callout', tone: 'tip', icon: '💡', html: '<b>Astuce :</b> cite ces observations avec humilité — « j’ai jeté un œil au code source public de la page de connexion : React, Vite, Cognito, et une route de callback par canal… Comment organisez-vous la maintenance de toutes ces intégrations ? » Tu montres ta curiosité sans prétendre connaître leur architecture interne.' },

/* ---------------- Flashcards ---------------- */
VIEWS.flashcards = (root) => {
  let cat = 'all', queue = [], cur = null, flipped = false, started = false, sN = 0, sGood = 0;
  const today = dayStr();
  const cards = () => FLASH.map((c, id) => ({ id, cat: c[0], q: c[1], a: c[2] })).filter((c) => cat === 'all' || c.cat === cat);
  const isDue = (c) => !S.fc[c.id] || S.fc[c.id].d <= today;

    if (!cur || (e.target.closest && e.target.closest('input, textarea, button, a'))) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!flipped) flip(); }

  };

      <div class="filter" id="fcCats">${[['all', 'Toutes'], ...Object.entries(FC_CATS)].map(([k, l]) => `<button type="button" data-c="${k}" class="${k === cat ? 'on' : ''}">${l}</button>`).join('')}</div>

    } else if (cur) {

          <div class="fc-face fc-back"><span class="tag m fc-cat">Réponse</span><div class="fa">${cur.a}</div><div class="fc-hint">Note-toi : 1 · 2 · 3</div></div></div>
        <div class="rate" id="fcRate"></div><p class="center small muted" style="margin-top:12px">Carte ${sN + 1} · encore ${queue.length} dans la session</p></div>`;

      if (Object.keys(S.iv).length >= 10) award('speaker');
      sfx('ok'); setQ(pickNext()); renderSidebar();
    }
  });
  root.addEventListener('change', (e) => { if (e.target.id === 'ivEn') { en = e.target.checked; renderCard(); } });
  render();
};

VIEWS.glossaire = (root) => {
  let q = '', cat = 'all';
  root.innerHTML = `<div class="page-head"><div class="eyebrow">Vocabulaire</div><h1>Glossaire</h1><p class="muted">${GLOSSARY.length} termes de dropshipping, de business, de tech et d’IA à manier avec aisance.</p></div>
    <div class="search">${ico('search')}<input class="input" id="glQ" type="search" placeholder="Rechercher un terme (ex. webhook, ROAS, MCP)…" autocomplete="off" aria-label="Rechercher dans le glossaire"></div>
    <div class="filter" id="glCats">${[['all', 'Tous'], ...Object.entries(GL_CATS)].map(([k, l]) => `<button type="button" data-c="${k}" class="${k === 'all' ? 'on' : ''}">${l}</button>`).join('')}</div>
    <dl class="gl-list" id="glList"></dl>`;
  const hq = (text, nq) => { if (!nq) return esc(text); const n = norm(text); if (n.length !== text.length) return esc(text); let out = '', i = 0, k; while ((k = n.indexOf(nq, i)) !== -1) { out += esc(text.slice(i, k)) + '<mark>' + esc(text.slice(k, k + nq.length)) + '</mark>'; i = k + nq.length; } return out + esc(text.slice(i)); };
  const draw = () => {
    const nq = norm(q.trim());
    const items = GLOSSARY.filter(([t, c, d]) => (cat === 'all' || c === cat) && (!nq || norm(t + ' ' + d).includes(nq)));
    $('#glList', root).innerHTML = items.length ? items.map(([t, c, d]) => `<div class="gl"><dt>${hq(t, nq)}<span class="tag">${GL_CATS[c]}</span></dt><dd>${hq(d, nq)}</dd></div>`).join('') : '<p class="muted">Aucun terme ne correspond.</p>';
  };
  $('#glQ', root).addEventListener('input', (e) => { q = e.target.value; draw(); });
  $('#glCats', root).addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; cat = b.dataset.c; $$('#glCats button', root).forEach((x) => x.classList.toggle('on', x === b)); draw(); });
  draw();
};
