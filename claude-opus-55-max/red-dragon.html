<script>
  // Filet de sécurité : si three.js ne se charge pas (hors ligne, CDN bloqué), on le dit clairement.
  function dragonLoadError() {
    const e = document.getElementById('ldErr');
    if (e && !e.textContent) { e.style.display = 'block'; e.textContent = "Impossible de charger le moteur 3D (three.js) : vérifiez votre connexion Internet puis rechargez la page."; }
  }
  setTimeout(() => { if (!window.__dragon) dragonLoadError(); }, 25000);
  addEventListener('error', (ev) => {
    const e = document.getElementById('ldErr');
    if (!window.__dragon && e && !e.textContent) { e.style.display = 'block'; e.textContent = 'Le dragon refuse de se réveiller : ' + (ev.message || 'erreur inconnue'); }
  });
</script>
<script type="importmap">
{

<script type="module" onerror="dragonLoadError()">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   Outils
   ===================================================================== */
const V3 = THREE.Vector3, QT = THREE.Quaternion, M4 = THREE.Matrix4;
const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const bell = (x, c, w) => Math.exp(-((x - c) * (x - c)) / (2 * w * w));
const crs = (p0, p1, p2, p3, t) => {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (2 * p1 + (p2 - p0) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (3 * p1 - p0 - 3 * p2 + p3) * t3);
};
let _seed = 0x2f6b1d3;
const rnd = () => { _seed = (_seed + 0x6D2B79F5) | 0; let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const PN = new ImprovedNoise();
const noise3 = (x, y, z) => PN.noise(x, y, z);
const fbm3 = (x, y, z, o = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * noise3(x * f, y * f, z * f); f *= 2.03; a *= 0.5; } return s; };
const ridge3 = (x, y, z, o = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { const n = 1 - Math.abs(noise3(x * f, y * f, z * f)); s += a * n * n; f *= 2.07; a *= 0.5; } return s; };
const col = (hex) => new THREE.Color(hex);
const lin = (r, g, b) => new THREE.Color().setRGB(r, g, b);

const $ = (id) => document.getElementById(id);
const yieldUI = () => new Promise((res) => {
  if (document.hidden) { const ch = new MessageChannel(); ch.port1.onmessage = () => res(); ch.port2.postMessage(0); }
  else requestAnimationFrame(() => setTimeout(res, 0));
});
async function progress(p, msg) { $('ldBar').style.width = Math.round(p * 100) + '%'; if (msg) $('ldMsg').textContent = msg; await yieldUI(); }

/* =====================================================================
   Rendu, scène, caméra
   ===================================================================== */
const canvas = $('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  $('ldErr').style.display = 'block';
  $('ldErr').textContent = "WebGL n'est pas disponible sur ce navigateur : impossible d'éveiller le dragon.";
  throw e;
}
const DPR = Math.min(window.devicePixelRatio || 1, 1.6);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const FOG_COL = lin(0.15, 0.052, 0.036);
scene.fog = new THREE.FogExp2(FOG_COL, 0.0018);
scene.background = FOG_COL.clone();

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(15, 5.2, 23);

const U = {
  time: { value: 0 },
  glow: { value: 0 },
  glowCol: { value: lin(1.0, 0.3, 0.04) },
};

/* =====================================================================
   Textures procédurales
   ===================================================================== */
function makeDataTex(w, h, data, { srgb = false, wrapS = true, wrapT = true } = {}) {
  const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
  t.wrapS = wrapS ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  t.wrapT = wrapT ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  t.anisotropy = ANISO;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.needsUpdate = true;
  return t;
}
function tileNoise(period) {
  const g = new Float32Array(period * period);
  for (let i = 0; i < g.length; i++) g[i] = rnd();
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    let fx = x - xi, fy = y - yi; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const x0 = ((xi % period) + period) % period, y0 = ((yi % period) + period) % period;
    const x1 = (x0 + 1) % period, y1 = (y0 + 1) % period;
    return lerp(lerp(g[y0 * period + x0], g[y0 * period + x1], fx), lerp(g[y1 * period + x0], g[y1 * period + x1], fx), fy);
  };
}
function heightToNormal(H, w, h, k, wrapU = true, wrapV = true) {
  const out = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const xl = wrapU ? (x + w - 1) % w : Math.max(x - 1, 0), xr = wrapU ? (x + 1) % w : Math.min(x + 1, w - 1);
    const yd = wrapV ? (y + h - 1) % h : Math.max(y - 1, 0), yu = wrapV ? (y + 1) % h : Math.min(y + 1, h - 1);
    const nx = -(H[y * w + xr] - H[y * w + xl]) * 0.5 * k, ny = -(H[yu * w + x] - H[yd * w + x]) * 0.5 * k;
    const l = Math.hypot(nx, ny, 1), i = (y * w + x) * 4;
    out[i] = (nx / l * 0.5 + 0.5) * 255; out[i + 1] = (ny / l * 0.5 + 0.5) * 255; out[i + 2] = (1 / l * 0.5 + 0.5) * 255; out[i + 3] = 255;
  }
  return out;
}
const grayTex = (N, M, fn, opts) => {
  const d = new Uint8Array(N * M * 4);
  for (let i = 0; i < N * M; i++) { const v = clamp(fn(i), 0, 1) * 255; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255; }
  return makeDataTex(N, M, d, opts);
};

// Écailles imbriquées (tuile 4 x 6, répétable). v croît vers la tête : le bord libre pointe vers la queue.
function genScaleMaps() {
  const N = 512, cols = 4, rows = 6, rx = 0.64, ry = 0.95, yo = 0.25;
  const H = new Float32Array(N * N), SID = new Float32Array(N * N);
  const tnF = tileNoise(64), tnC = tileNoise(16);
  const hs = (a, b) => { let h = (Math.imul(a + 17, 374761393) + Math.imul(b + 31, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  for (let y = 0; y < N; y++) {
    const Y = (y + 0.5) / N * rows, r0 = Math.floor(Y);
    for (let x = 0; x < N; x++) {
      const X = (x + 0.5) / N * cols;
      let h = 0.02, sid = 0;
      search: for (let r = r0 + 2; r >= r0 - 1; r--) {
        const off = (r & 1) ? 0.5 : 0, cy = r + 0.5 - yo, dy = (Y - cy) / ry;
        if (dy <= -1 || dy >= 1) continue;
        const cb = Math.round(X - off - 0.5);
        for (let c = cb - 1; c <= cb + 1; c++) {
          const dx = (X - (c + off + 0.5)) / rx, d2 = dx * dx + dy * dy;
          if (d2 >= 1) continue;
          const d = Math.sqrt(d2), tilt = (1 - dy) * 0.5, edge = smooth(1, 0.78, d);
          h = (0.12 + 0.88 * Math.pow(tilt, 0.9)) * (0.62 + 0.38 * (1 - dx * dx)) * (0.55 + 0.45 * edge) + 0.07 * Math.exp(-dx * dx / 0.03) * tilt;
          sid = hs(((c % cols) + cols) % cols, ((r % rows) + rows) % rows);
          break search;
        }
      }
      const u = (x + 0.5) / N, v = (y + 0.5) / N;
      H[y * N + x] = h + 0.03 * (tnF(u * 64, v * 64) - 0.5) + 0.02 * (tnC(u * 16, v * 16) - 0.5);
      SID[y * N + x] = sid;
    }
  }
  const alb = new Uint8Array(N * N * 4), rgh = new Uint8Array(N * N * 4), glw = new Uint8Array(N * N * 4);
  for (let i = 0; i < N * N; i++) {
    const h = H[i], s = SID[i], ao = smooth(0.0, 0.45, h), w = (s * 7.31) % 1;
    const b = (0.26 + 0.74 * ao) * (0.8 + 0.34 * s);
    alb[i * 4] = clamp(b * (1.0 + 0.06 * (w - 0.5)) * 255, 0, 255);
    alb[i * 4 + 1] = clamp(b * (0.95 + 0.12 * (w - 0.5)) * 255, 0, 255);
    alb[i * 4 + 2] = clamp(b * 0.93 * 255, 0, 255);
    alb[i * 4 + 3] = 255;
    const rv = clamp(0.26 + 0.42 * (1 - ao) + 0.12 * s, 0, 1) * 255;
    rgh[i * 4] = rgh[i * 4 + 1] = rgh[i * 4 + 2] = rv; rgh[i * 4 + 3] = 255;
    const g = smooth(0.32, 0.06, h) * 255;
    glw[i * 4] = glw[i * 4 + 1] = glw[i * 4 + 2] = g; glw[i * 4 + 3] = 255;
  }
  return {
    map: makeDataTex(N, N, alb, { srgb: true }), normal: makeDataTex(N, N, heightToNormal(H, N, N, 4.5)),
    rough: makeDataTex(N, N, rgh), glow: makeDataTex(N, N, glw),
  };
}

// Plaques ventrales (une plaque par tuile le long du corps).
function genBellyMaps() {
  const N = 256, H = new Float32Array(N * N), tn = tileNoise(32);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = (x + 0.5) / N, v = (y + 0.5) / N, a = 2 * u - 1;
    let h = 0.1 + 0.9 * Math.pow(1 - v, 1.1);
    h *= 0.55 + 0.45 * smooth(0, 0.045, v);
    h *= 0.72 + 0.28 * (1 - a * a);
    h *= 0.6 + 0.4 * smooth(0, 0.06, u) * smooth(1, 0.94, u);
    h += 0.012 * Math.sin(v * TAU * 11) * (1 - v) + 0.025 * (tn(u * 32, v * 32) - 0.5);
    H[y * N + x] = h;
  }
  const alb = new Uint8Array(N * N * 4), rgh = new Uint8Array(N * N * 4), glw = new Uint8Array(N * N * 4);
  for (let i = 0; i < N * N; i++) {
    const h = H[i], ao = smooth(0.0, 0.36, h), b = 0.42 + 0.58 * ao;
    alb[i * 4] = b * 255; alb[i * 4 + 1] = b * 0.97 * 255; alb[i * 4 + 2] = b * 0.92 * 255; alb[i * 4 + 3] = 255;
    rgh[i * 4] = rgh[i * 4 + 1] = rgh[i * 4 + 2] = clamp(0.42 + 0.34 * (1 - ao), 0, 1) * 255; rgh[i * 4 + 3] = 255;
    glw[i * 4] = glw[i * 4 + 1] = glw[i * 4 + 2] = smooth(0.26, 0.05, h) * 255; glw[i * 4 + 3] = 255;
  }
  const o = { wrapS: false };
  return {
    map: makeDataTex(N, N, alb, { srgb: true, ...o }), normal: makeDataTex(N, N, heightToNormal(H, N, N, 3.2, false, true), o),
    rough: makeDataTex(N, N, rgh, o), glow: makeDataTex(N, N, glw, o),
  };
}

// Membrane des ailes : veines ramifiées + plis.
function genMembraneMaps() {
  const N = 512;
  const cv = document.createElement('canvas'); cv.width = cv.height = N;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, N, N);
  ctx.strokeStyle = '#fff'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const vein = (x, y, ang, w, len, depth) => {
    let px = x, py = y, a = ang;
    const steps = 44, st = len / steps;
    for (let i = 0; i < steps && px < N + 20 && py > -20 && py < N + 20; i++) {
      a += rr(-0.1, 0.1); a *= 0.96;
      const nx = px + Math.cos(a) * st, ny = py + Math.sin(a) * st;
      ctx.lineWidth = Math.max(0.7, w * (1 - (i / steps) * 0.75));
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(nx, ny); ctx.stroke();
      px = nx; py = ny;
      if (depth < 2 && rnd() < 0.075) vein(px, py, a + rr(0.35, 0.85) * (rnd() < 0.5 ? -1 : 1), w * 0.55, (steps - i) * st * 0.7, depth + 1);
    }
  };
  for (let k = 0; k < 6; k++) vein(-6, ((k + 0.5) / 6) * N + rr(-18, 18), rr(-0.05, 0.05), rr(5, 7.5), N * 1.1, 0);
  ctx.globalAlpha = 0.16;
  for (let i = 0; i < 420; i++) {
    const x = rr(0, N), y = rr(0, N); ctx.lineWidth = rr(0.6, 1.5);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + rr(-6, 6), y + rr(8, 16), x + rr(-4, 4), y + rr(18, 40)); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const cv2 = document.createElement('canvas'); cv2.width = cv2.height = N;
  const c2 = cv2.getContext('2d'); c2.filter = 'blur(1.4px)'; c2.drawImage(cv, 0, 0);
  const px = c2.getImageData(0, 0, N, N).data;
  const V = new Float32Array(N * N); for (let i = 0; i < N * N; i++) V[i] = px[i * 4] / 255;
  const tn = tileNoise(32);
  const opts = { wrapS: false, wrapT: false };
  return {
    map: grayTex(N, N, (i) => (0.84 + 0.16 * tn((i % N) / N * 32, Math.floor(i / N) / N * 32)) * (1 - 0.42 * V[i]), { srgb: true, ...opts }),
    normal: makeDataTex(N, N, heightToNormal(V, N, N, 2.4, false, false), opts),
    vein: grayTex(N, N, (i) => V[i], opts),
  };
}

// Atlas 2x2 de flammèches / fumée.
function genPuffAtlas() {
  const N = 128, S = 256, d = new Uint8Array(S * S * 4);
  for (let q = 0; q < 4; q++) {
    const ox = (q & 1) * N, oy = (q >> 1) * N, off = q * 13.7 + 2.1;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const u = ((x + 0.5) / N) * 2 - 1, v = ((y + 0.5) / N) * 2 - 1;
      const r = Math.hypot(u, v);
      const n = fbm3(u * 2.1 + off, v * 2.1 - off, off, 4);
      let a = smooth(1.0, 0.1, r * (1 + 0.6 * n));
      a *= clamp(0.7 + 0.6 * fbm3(u * 4.5 + off, v * 4.5, off + 3, 3), 0, 1.2);
      a = clamp(a, 0, 1) * smooth(1.0, 0.85, r);
      const i = ((oy + y) * S + ox + x) * 4;
      d[i] = d[i + 1] = d[i + 2] = a * 255; d[i + 3] = 255;
    }
  }
  const t = makeDataTex(S, S, d, { wrapS: false, wrapT: false });
  t.anisotropy = 1;
  return t;
}

// Tube statique (cornes, dents, griffes, pointes) le long d'un chemin, section elliptique.
function tubeGeo(pathFn, radFn, nR, nS, { ref = new V3(1, 0, 0), colorFn = null, capStart = false } = {}) {
  const P = [], T = [];
  for (let i = 0; i <= nR; i++) P.push(pathFn(i / nR));
  for (let i = 0; i <= nR; i++) T.push(new V3().subVectors(P[Math.min(i + 1, nR)], P[Math.max(i - 1, 0)]).normalize());
  const pos = [], cols = [], idx = [];
  const n = ref.clone().addScaledVector(T[0], -ref.dot(T[0]));
  if (n.lengthSq() < 1e-6) n.set(0, 0, 1).addScaledVector(T[0], -T[0].z);
  n.normalize();
  const b = new V3(), tmp = new V3(), c = new THREE.Color();
  for (let i = 0; i <= nR; i++) {
    const t = i / nR;
    if (i > 0) n.addScaledVector(T[i], -n.dot(T[i])).normalize();
    b.crossVectors(T[i], n);
    const [rx, ry] = radFn(t);
    for (let k = 0; k < nS; k++) {
      const ph = (k / nS) * TAU, cs = Math.cos(ph), sn = Math.sin(ph);
      tmp.copy(P[i]).addScaledVector(n, rx * cs).addScaledVector(b, ry * sn);
      pos.push(tmp.x, tmp.y, tmp.z);
      if (colorFn) colorFn(t, ph, c); else c.setRGB(1, 1, 1);
      cols.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < nR; i++) for (let k = 0; k < nS; k++) {
    const a = i * nS + k, b2 = i * nS + ((k + 1) % nS), cc = a + nS, d = b2 + nS;
    idx.push(a, b2, cc, b2, d, cc);
  }
  if (capStart) {
    const ci = pos.length / 3;
    pos.push(P[0].x - T[0].x * 0.002, P[0].y - T[0].y * 0.002, P[0].z - T[0].z * 0.002);
    if (colorFn) colorFn(0, 0, c); cols.push(c.r, c.g, c.b);
    for (let k = 0; k < nS; k++) idx.push(ci, (k + 1) % nS, k);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Tube dynamique recalculé chaque image (pattes, bras des ailes, doigts).
const _e0 = new V3(), _e3 = new V3(), _tn = new V3(), _tb = new V3();
class DynTube {
  constructor({ nCtrl, rps, segs, radii, bulge = null, mat, colorFn = null, glowFn = null, uTiles = 2 }) {
    Object.assign(this, { nCtrl, rps, segs, radii, bulge, uTiles });
    const nR = (this.nR = (nCtrl - 1) * rps + 1), S1 = segs + 1, nV = nR * S1;
    const g = (this.geo = new THREE.BufferGeometry());
    this.pos = new Float32Array(nV * 3); this.nrm = new Float32Array(nV * 3); this.uv = new Float32Array(nV * 2);
    const colr = new Float32Array(nV * 3), glow = new Float32Array(nV), c = new THREE.Color();
    for (let i = 0; i < nR; i++) for (let k = 0; k <= segs; k++) {
      const v = i * S1 + k, t = i / (nR - 1), ph = (k / segs) * TAU;
      if (colorFn) colorFn(t, ph, c); else c.setRGB(1, 1, 1);
      colr[v * 3] = c.r; colr[v * 3 + 1] = c.g; colr[v * 3 + 2] = c.b;
      glow[v] = glowFn ? glowFn(t, ph) : 0;
    }
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('normal', new THREE.BufferAttribute(this.nrm, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('uv', new THREE.BufferAttribute(this.uv, 2));
    g.setAttribute('color', new THREE.BufferAttribute(colr, 3));
    g.setAttribute('aGlow', new THREE.BufferAttribute(glow, 1));
    const idx = [];
    for (let i = 0; i < nR - 1; i++) for (let k = 0; k < segs; k++) {
      const a = i * S1 + k, b = a + 1, cc = a + S1, d = cc + 1;
      idx.push(a, b, cc, b, d, cc);
    }
    g.setIndex(idx);
    this.mesh = new THREE.Mesh(g, mat);
    this.mesh.frustumCulled = false; this.mesh.castShadow = true; this.mesh.receiveShadow = true;
    this.C = Array.from({ length: nR }, () => new V3());
    this.T = Array.from({ length: nR }, () => new V3());
    this.rad = new Float32Array(nR * 2);
    this.first = true;
  }
  update(P, ref) {
    const { nCtrl, rps, segs, nR, C, T, rad } = this, S1 = segs + 1;
    let r = 0;
    for (let k = 0; k < nCtrl - 1; k++) {
      const p1 = P[k], p2 = P[k + 1];
      const p0 = k > 0 ? P[k - 1] : _e0.copy(p1).multiplyScalar(2).sub(p2);
      const p3 = k + 2 < nCtrl ? P[k + 2] : _e3.copy(p2).multiplyScalar(2).sub(p1);
      const r1 = this.radii[k], r2 = this.radii[k + 1], bl = this.bulge ? this.bulge[k] : 0;
      for (let i = 0; i < rps; i++, r++) {
        const t = i / rps, w = t * t * (3 - 2 * t), bb = bl * Math.sin(PI * t);
        C[r].set(crs(p0.x, p1.x, p2.x, p3.x, t), crs(p0.y, p1.y, p2.y, p3.y, t), crs(p0.z, p1.z, p2.z, p3.z, t));
        rad[r * 2] = lerp(r1[0], r2[0], w) + bb; rad[r * 2 + 1] = lerp(r1[1], r2[1], w) + bb;
      }
    }
    C[r].copy(P[nCtrl - 1]); rad[r * 2] = this.radii[nCtrl - 1][0]; rad[r * 2 + 1] = this.radii[nCtrl - 1][1];
    for (let i = 0; i < nR; i++) T[i].subVectors(C[Math.min(i + 1, nR - 1)], C[Math.max(i - 1, 0)]).normalize();
    _tn.copy(ref).addScaledVector(T[0], -ref.dot(T[0]));
    if (_tn.lengthSq() < 1e-8) _tn.set(T[0].y, -T[0].x, 0);
    _tn.normalize();
    const pos = this.pos, nrm = this.nrm;
    for (let i = 0; i < nR; i++) {
      if (i > 0) _tn.addScaledVector(T[i], -_tn.dot(T[i])).normalize();
      _tb.crossVectors(T[i], _tn);
      const rx = rad[i * 2], ry = rad[i * 2 + 1];
      const ia = Math.max(i - 1, 0), ib = Math.min(i + 1, nR - 1);
      const dl = C[ia].distanceTo(C[ib]) || 1;
      const dr = ((rad[ib * 2] + rad[ib * 2 + 1]) - (rad[ia * 2] + rad[ia * 2 + 1])) * 0.5 / dl;
      const ti = T[i], ci = C[i];
      for (let k = 0; k <= segs; k++) {
        const ph = (k / segs) * TAU, cs = Math.cos(ph), sn = Math.sin(ph), v = (i * S1 + k) * 3;
        pos[v] = ci.x + _tn.x * rx * cs + _tb.x * ry * sn;
        pos[v + 1] = ci.y + _tn.y * rx * cs + _tb.y * ry * sn;
        pos[v + 2] = ci.z + _tn.z * rx * cs + _tb.z * ry * sn;
        let nx = _tn.x * cs / rx + _tb.x * sn / ry, ny = _tn.y * cs / rx + _tb.y * sn / ry, nz = _tn.z * cs / rx + _tb.z * sn / ry;
        let l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
        nx -= ti.x * dr; ny -= ti.y * dr; nz -= ti.z * dr;
        l = Math.hypot(nx, ny, nz) || 1;
        nrm[v] = nx / l; nrm[v + 1] = ny / l; nrm[v + 2] = nz / l;
      }
    }
    if (this.first) {
      this.first = false;
      let vAcc = 0;
      for (let i = 0; i < nR; i++) {
        if (i > 0) vAcc += C[i].distanceTo(C[i - 1]) * this.uTiles / (PI * (rad[i * 2] + rad[i * 2 + 1]) + 1e-3);
        for (let k = 0; k <= segs; k++) { const v = i * S1 + k; this.uv[v * 2] = (k / segs) * this.uTiles; this.uv[v * 2 + 1] = vAcc; }
      }
      this.geo.attributes.uv.needsUpdate = true;
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.normal.needsUpdate = true;
  }
}

// Surface "loft" (tête, mâchoire) : anneaux successifs, couture placée en dessous.
function loftGeo(nT, nTh, fn, colFn, TU = 6) {
  const S1 = nTh + 1, nV = (nT + 1) * S1;
  const pos = new Float32Array(nV * 3), uv = new Float32Array(nV * 2), colr = new Float32Array(nV * 3), glow = new Float32Array(nV);
  const p = new V3(), c = new THREE.Color(), prev = new V3(), perim = new Float32Array(nT + 1), cz = new Float32Array(nT + 1);
  for (let i = 0; i <= nT; i++) {
    const t = i / nT;
    let per = 0, zs = 0;
    for (let k = 0; k <= nTh; k++) {
      const th0 = PI + (k / nTh) * TAU, th = Math.atan2(Math.sin(th0), Math.cos(th0));
      const a = fn(t, th, p), v = i * S1 + k;
      pos[v * 3] = p.x; pos[v * 3 + 1] = p.y; pos[v * 3 + 2] = p.z;
      glow[v] = colFn(t, th, a, p, c) || 0;
      colr[v * 3] = c.r; colr[v * 3 + 1] = c.g; colr[v * 3 + 2] = c.b;
      if (k > 0) per += p.distanceTo(prev);
      prev.copy(p); zs += p.z;
    }
    perim[i] = per; cz[i] = zs / S1;
  }
  let pm = 0; for (let i = 0; i <= nT; i++) pm += perim[i]; pm /= nT + 1;
  for (let i = 0; i <= nT; i++) for (let k = 0; k <= nTh; k++) {
    const v = i * S1 + k; uv[v * 2] = (k / nTh) * TU; uv[v * 2 + 1] = (cz[i] * TU) / pm;
  }
  const idx = [];
  for (let i = 0; i < nT; i++) for (let k = 0; k < nTh; k++) {
    const a = i * S1 + k, b = a + 1, cc = a + S1, d = cc + 1;
    idx.push(a, cc, b, b, cc, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.BufferAttribute(colr, 3));
  g.setAttribute('aGlow', new THREE.BufferAttribute(glow, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  const n = g.attributes.normal.array;
  for (let i = 0; i <= nT; i++) {
    const a = (i * S1) * 3, b = (i * S1 + nTh) * 3;
    for (let q = 0; q < 3; q++) { const m = (n[a + q] + n[b + q]) * 0.5; n[a + q] = m; n[b + q] = m; }
  }
  for (const i of [0, nT]) {
    let sx = 0, sy = 0, sz = 0;
    for (let k = 0; k <= nTh; k++) { const v = (i * S1 + k) * 3; sx += n[v]; sy += n[v + 1]; sz += n[v + 2]; }
    const l = Math.hypot(sx, sy, sz) || 1;
    for (let k = 0; k <= nTh; k++) { const v = (i * S1 + k) * 3; n[v] = sx / l; n[v + 1] = sy / l; n[v + 2] = sz / l; }
  }
  return g;
}

   Le pic de basalte (perchoir) et le terrain
   ===================================================================== */
const perchR = (ph) => 12.6 + 1.4 * noise3(Math.cos(ph) * 1.4 + 4.1, Math.sin(ph) * 1.4 + 2.7, 0.37) + 0.55 * noise3(Math.cos(ph) * 4.2 + 1.3, Math.sin(ph) * 4.2 + 9.1, 1.71);
const perchTop = (x, z) => 0.2 * fbm3(x * 0.16 + 3.3, 0.51, z * 0.16 + 1.1, 3) + 0.05 * noise3(x * 1.3 + 0.5, 2.2, z * 1.3);
const VOLC = new V3(-330, 0, -520);
const LAVA_Y = -25.3;
function terrainH(x, z) {
  const r = Math.hypot(x, z);
  let h = -23.6 + 2.4 * fbm3(x * 0.022 + 11, 0.7, z * 0.022 - 4, 4);
  h += 17 * smooth(40, 12, r) * (0.75 + 0.5 * noise3(x * 0.08, 3.1, z * 0.08));
  const ch = Math.abs(noise3(x * 0.011 + 7.3, 0.5, z * 0.011 + 3.1));
  h -= 3.4 * smooth(0.12, 0.0, ch) * smooth(24, 44, r) * smooth(250, 170, r);
  const pool = Math.hypot(x - 34, z - 44) + 6 * noise3(x * 0.06, 1.3, z * 0.06);
  h -= 4.5 * smooth(18, 7, pool);
  const m = smooth(190, 520, r);
  h += m * (10 + 72 * ridge3(x * 0.0042 + 5, 0.3, z * 0.0042 + 2, 5));
  const dv = Math.hypot(x - VOLC.x, z - VOLC.z);
  h += 150 * Math.pow(Math.max(0, 1 - dv / 200), 1.45) * (0.9 + 0.1 * noise3(x * 0.05, 8.1, z * 0.05));
  h += 10 * ridge3(x * 0.03, 2.2, z * 0.03, 3) * smooth(200, 60, dv);
  h -= 26 * smooth(22, 7, dv);
  return h;
}
function lavaAt(x, z) {
  const dv = Math.hypot(x - VOLC.x, z - VOLC.z);
  return smooth(16, 6, dv);
}
function groundY(x, z) {
  const r = Math.hypot(x, z);
  if (r < perchR(Math.atan2(z, x)) - 0.8) return perchTop(x, z);
  return Math.max(terrainH(x, z), -30);
}

function buildPerch() {
  const NA = 240, NT = 30, NB = 9, NW = 72, rows = NT + NB + NW, B = 1.6;
  const pos = [], cols = [], idx = [];
  const cTop = col('#2f2724'), cDust = col('#4b3f39'), cEdge = col('#54463e'), cWall = col('#2a201c'), cDeep = col('#3a1d15');
  const c = new THREE.Color();
  for (let i = 0; i < rows; i++) for (let a = 0; a <= NA; a++) {
    const ph = (a / NA) * TAU, cs = Math.cos(ph), sn = Math.sin(ph), R = perchR(ph);
    let r, y, wall = 0, depth = 0;
    const ey = perchTop(cs * (R - B), sn * (R - B));
    if (i < NT) { r = (R - B) * Math.pow(i / (NT - 1), 0.8); y = perchTop(cs * r, sn * r); }
    else if (i < NT + NB) { const al = ((i - NT + 1) / NB) * (PI / 2); r = R - B + B * Math.sin(al); y = ey - B * (1 - Math.cos(al)); wall = (al / (PI / 2)) * 0.6; }
    else { const w = (i - NT - NB + 1) / NW; depth = Math.pow(w, 1.3) * 38; r = R + depth * 0.3; y = ey - B - depth; wall = 1; }
    if (wall > 0) {
      const d = 1.2 * ridge3(cs * 2.6 + 7, y * 0.09, sn * 2.6 + 3, 4) + 0.5 * noise3(cs * 11, y * 0.45, sn * 11) + 0.7 * noise3(cs * 3, y * 0.05 + 4, sn * 3) + 0.25 * noise3(cs * 26, y * 1.3, sn * 26);
      r += d * wall * 1.3;
      y += 0.35 * noise3(cs * 6, y * 0.3, sn * 6) * wall;
    }
    pos.push(cs * r, y, sn * r);
    if (i < NT) {
      const n = fbm3(cs * r * 0.3, 4.4, sn * r * 0.3, 3);
      c.copy(cTop).lerp(cDust, smooth(-0.1, 0.35, n));
      c.multiplyScalar(0.85 + 0.3 * noise3(cs * r * 2.1, 8.8, sn * r * 2.1));
    } else if (i < NT + NB) c.copy(cTop).lerp(cEdge, wall * 1.4);
    else {
      c.copy(cWall).lerp(cDeep, smooth(6, 34, depth));
      c.multiplyScalar(0.75 + 0.5 * Math.abs(noise3(cs * 9, y * 0.2, sn * 9)));
    }
    cols.push(c.r, c.g, c.b);
  }
  const S1 = NA + 1;
  for (let i = 0; i < rows - 1; i++) for (let a = 0; a < NA; a++) {
    const p = i * S1 + a, q = p + 1, s = p + S1, t = s + 1;
    idx.push(p, q, s, q, t, s);
  }
  let g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setIndex(idx);
  g = mergeVertices(g, 1e-3);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, MAT.rock);
  m.receiveShadow = true; m.castShadow = true;
  return m;
}

// Roche : relief et fissures procédurales en espace monde (pas d'UV nécessaires).
const ROCK_GLSL = /* glsl */`
uniform float uTime; varying vec3 vWPos;
float rk_hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float rk_noise(vec3 x) { vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(rk_hash(i), rk_hash(i + vec3(1, 0, 0)), f.x), mix(rk_hash(i + vec3(0, 1, 0)), rk_hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(rk_hash(i + vec3(0, 0, 1)), rk_hash(i + vec3(1, 0, 1)), f.x), mix(rk_hash(i + vec3(0, 1, 1)), rk_hash(i + vec3(1, 1, 1)), f.x), f.y), f.z); }
float rk_fbm(vec3 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * rk_noise(p); p = p * 2.07 + 1.3; a *= 0.5; } return s; }`;
function rockMaterial(glowCracks) {
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0, envMapIntensity: 0.5 });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.time;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n\tvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + ROCK_GLSL)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
	float rkL = rk_fbm(vWPos * 0.45);
	float rkH = rkL * 0.6 + rk_fbm(vWPos * 1.7 + 7.0) * 0.4;
	float crack = smoothstep(0.022, 0.0, abs(rk_fbm(vWPos * vec3(0.45, 0.3, 0.45) + 3.0) - 0.5));
	diffuseColor.rgb *= (0.68 + 0.64 * rkL) * (1.0 - crack * 0.6);
	{
		vec3 dpx = dFdx(-vViewPosition), dpy = dFdy(-vViewPosition);
		float dhx = dFdx(rkH), dhy = dFdy(rkH);
		vec3 r1 = cross(dpy, normal), r2 = cross(normal, dpx);
		float det = dot(dpx, r1);
		vec3 grad = sign(det) * (dhx * r1 + dhy * r2);
		normal = normalize(abs(det) * normal - grad * 0.75);
	}
	${glowCracks ? 'totalEmissiveRadiance += vec3(1.0, 0.2, 0.03) * crack * smoothstep(-12.0, -28.0, vWPos.y) * (0.9 + 0.3 * sin(uTime * 1.7 + vWPos.x));' : ''}`);
  };
  m.customProgramCacheKey = () => 'rock-' + glowCracks;
  return m;
}
MAT.rock = rockMaterial(true);
MAT.boulder = rockMaterial(false);

// Blocs de basalte éparpillés sur le plateau (en évitant le dragon).
function scatterBoulders() {
  let geo = new THREE.IcosahedronGeometry(1, 3);
  geo.deleteAttribute('normal'); geo.deleteAttribute('uv');
  geo = mergeVertices(geo);
  const p = geo.attributes.position, v = new V3(), cols = [], c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const k = 1 + 0.3 * fbm3(v.x * 1.5 + 3, v.y * 1.5, v.z * 1.5, 3) + 0.08 * noise3(v.x * 5, v.y * 5, v.z * 5);
    v.multiplyScalar(k);
    if (v.y < 0) v.y *= 0.45;
    p.setXYZ(i, v.x, v.y, v.z);
    c.copy(col('#2c2420')).lerp(col('#4a3e37'), smooth(-0.2, 0.9, v.y + 0.3 * noise3(v.x * 3, 1, v.z * 3)));
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  const spots = [];
  for (let tries = 0; spots.length < 50 && tries < 4000; tries++) {
    const ph = rr(0, TAU), r = Math.sqrt(rnd()) * (perchR(ph) - 1.8), x = Math.cos(ph) * r, z = Math.sin(ph) * r;
    const big = spots.length < 16, s = big ? rr(0.6, 1.5) : rr(0.15, 0.35);
    let ok = true;
    for (let j = 0; j < NJ && ok; j += 2) { profAt(j * JSTEP); if (Math.hypot(JP[j].x - x, JP[j].z - z) < _prof[0] + s + (big ? 1.4 : 0.5)) ok = false; }
    for (const l of LEGS) if (Math.hypot(l.foot.x - x, l.foot.z - z) < s + 1.3) ok = false;
    for (const q of spots) if (Math.hypot(q.x - x, q.z - z) < q.s + s + 0.3) ok = false;
    if (ok) spots.push({ x, z, s });
  }

  spots.forEach((o, i) => {
    q.setFromEuler(e.set(rr(-0.3, 0.3), rr(0, TAU), rr(-0.3, 0.3)));
    sc.set(o.s * rr(0.8, 1.3), o.s * rr(0.55, 0.9), o.s * rr(0.8, 1.3));
    m.compose(v.set(o.x, perchTop(o.x, o.z) - 0.12 * o.s, o.z), q, sc);
    mesh.setMatrixAt(i, m);
  });
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
}

function lavaMaterial() {
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.94, metalness: 0, envMapIntensity: 0.4 });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.time;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute float aLava;\nvarying float vLava;\nvarying vec3 vWPos;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n\tvLava = aLava;\n\tvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
	float rkH = rk_fbm(vWPos * 0.16) * 0.6 + rk_fbm(vWPos * 0.7 + 7.0) * 0.4;
	diffuseColor.rgb *= 0.7 + 0.6 * rkH;
	{
		vec3 dpx = dFdx(-vViewPosition), dpy = dFdy(-vViewPosition);
		float dhx = dFdx(rkH), dhy = dFdy(rkH);
		vec3 r1 = cross(dpy, normal), r2 = cross(normal, dpx);
		float det = dot(dpx, r1);
		vec3 grad = sign(det) * (dhx * r1 + dhy * r2);
		normal = normalize(abs(det) * normal - grad * 1.6);
	}`)
      .replace('#include <common>', `#include <common>
${ROCK_GLSL}
varying float vLava;
float l_hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float l_noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(l_hash(i), l_hash(i + vec2(1, 0)), f.x), mix(l_hash(i + vec2(0, 1)), l_hash(i + vec2(1, 1)), f.x), f.y); }
float l_fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * l_noise(p); p = p * 2.03 + vec2(3.1, 1.7); a *= 0.5; } return s; }`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
	if (vLava > 0.002) {
		vec2 q = vWPos.xz * 0.09;
		float n = l_fbm(q + vec2(uTime * 0.035, uTime * 0.021));
		float n2 = l_fbm(q * 2.7 - vec2(uTime * 0.05, -uTime * 0.02));
		float crust = smoothstep(0.5, 0.72, n2 * 0.65 + n * 0.45);
		vec3 hot = mix(vec3(1.0, 0.16, 0.02), vec3(1.0, 0.58, 0.14), n);
		float pulse = 0.85 + 0.15 * sin(uTime * 1.3 + n * 9.0);
		totalEmissiveRadiance += hot * vLava * (1.0 - crust * 0.88) * (2.2 + 2.6 * n) * pulse;
		diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.035, 0.02, 0.02), vLava);
	}`);
  };
  m.customProgramCacheKey = () => 'lava-ground';
  return m;
}

function buildTerrain() {
  const NA = 360, N1 = 150, NR = 205;
  const pos = [], cols = [], lava = [], idx = [];
  const cBas = col('#1c1613'), cAsh = col('#3d3430'), cRock = col('#2b221e'), cHot = col('#461a0c');
  const c = new THREE.Color();
  for (let i = 0; i < NR; i++) {
    const r = i < N1 ? 10 + 260 * Math.pow(i / (N1 - 1), 1.35) : 270 + 1250 * Math.pow((i - N1 + 1) / (NR - N1), 1.7);
    for (let a = 0; a <= NA; a++) {
      const ph = (a / NA) * TAU, x = Math.cos(ph) * r, z = Math.sin(ph) * r, y = terrainH(x, z), l = lavaAt(x, z);
      pos.push(x, y, z); lava.push(l);
      const n = fbm3(x * 0.04, 1.9, z * 0.04, 3), hgt = smooth(-10, 60, y);
      c.copy(cBas).lerp(cAsh, smooth(-0.15, 0.35, n) * 0.7).lerp(cRock, hgt * 0.8);
      c.lerp(cHot, smooth(LAVA_Y + 2.2, LAVA_Y + 0.2, y) * 0.8 + smooth(0, 0.6, l) * 0.6);
      c.multiplyScalar(0.8 + 0.4 * Math.abs(noise3(x * 0.3, 7.7, z * 0.3)));
      cols.push(c.r, c.g, c.b);
    }
  }
  const S1 = NA + 1;
  for (let i = 0; i < NR - 1; i++) for (let a = 0; a < NA; a++) {
    const p = i * S1 + a, q = p + 1, s = p + S1, t = s + 1;
    idx.push(p, q, s, q, t, s);
  }
  let g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setAttribute('aLava', new THREE.Float32BufferAttribute(lava, 1));
  g.setIndex(idx);
  g = mergeVertices(g, 1e-3);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, lavaMaterial());
  m.receiveShadow = true;
  return m;
}

// Mer de lave : un plan émissif animé sous le terrain, visible dans les creux et les rivières.
function buildLavaPlane() {
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: U.time, uFog: { value: FOG_COL }, uFogD: { value: scene.fog.density } },
    vertexShader: /* glsl */`
      varying vec3 vW; varying float vDist;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vW = w.xyz;
        vec4 mv = viewMatrix * w;
        vDist = length(mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform float uTime; uniform vec3 uFog; uniform float uFogD;
      varying vec3 vW; varying float vDist;
      float l_hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
      float l_noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(l_hash(i), l_hash(i + vec2(1, 0)), f.x), mix(l_hash(i + vec2(0, 1)), l_hash(i + vec2(1, 1)), f.x), f.y); }
      float l_fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * l_noise(p); p = p * 2.03 + vec2(3.1, 1.7); a *= 0.5; } return s; }
      void main() {
        vec2 q = vW.xz * 0.055;
        float n = l_fbm(q + vec2(uTime * 0.018, uTime * 0.011));
        float n2 = l_fbm(q * 3.0 + n * 1.5 - vec2(uTime * 0.035, -uTime * 0.02));
        float crust = smoothstep(0.47, 0.68, n2 * 0.72 + n * 0.38);
        vec3 hot = mix(vec3(1.0, 0.17, 0.02), vec3(1.0, 0.6, 0.16), smoothstep(0.3, 0.8, n));
        vec3 c = hot * (1.8 + 2.6 * n) * (1.0 - 0.92 * crust) + vec3(0.035, 0.014, 0.01) * crust;
        float vein = 1.0 - smoothstep(0.0, 0.035, abs(n2 - 0.62));
        c += vec3(1.0, 0.3, 0.04) * vein * crust * 1.6;
        c *= 0.88 + 0.12 * sin(uTime * 1.1 + n * 12.0);
        float f = 1.0 - exp(-uFogD * uFogD * vDist * vDist);
        gl_FragColor = vec4(mix(c, uFog, f), 1.0);
      }`,
  });
  const mesh = new THREE.Mesh(new THREE.CircleGeometry(300, 120).rotateX(-PI / 2), m);
  mesh.position.y = LAVA_Y;
  return mesh;
}

/* =====================================================================
   LE DRAGON — squelette
   ===================================================================== */
const dragon = new THREE.Group();
dragon.position.set(0, 0, 2.2);
scene.add(dragon);
dragon.updateMatrixWorld(true);

// Colonne : du bout de la queue (s = 0) jusqu'à la base du crâne.
const SPINE_PTS = [
  [0, 0.3, -11.9], [0, 0.36, -10.0], [0, 0.6, -8.1], [0, 1.08, -6.3], [0, 1.75, -4.45], [0, 2.4, -2.7],
  [0, 2.8, -1.0], [0, 2.92, 0.6], [0, 3.05, 2.15],
  [0, 3.6, 3.4], [0, 4.5, 4.3], [0, 5.4, 4.95], [0, 6.15, 5.55], [0, 6.65, 6.25],
].map((a) => new V3(...a));
// Demi-largeur, hauteur dorsale, profondeur ventrale à chaque point de contrôle.
const SPINE_PROF = [
  [0.045, 0.04, 0.04], [0.19, 0.17, 0.15], [0.32, 0.29, 0.26], [0.46, 0.42, 0.38], [0.62, 0.56, 0.52], [0.82, 0.72, 0.7],
  [1.05, 0.86, 0.9], [1.04, 0.88, 1.08], [1.2, 0.98, 1.28],
  [0.9, 0.8, 0.95], [0.72, 0.65, 0.76], [0.6, 0.57, 0.64], [0.54, 0.52, 0.58], [0.5, 0.49, 0.53],
];
const spineCurve = new THREE.CatmullRomCurve3(SPINE_PTS, false, 'centripetal');
spineCurve.arcLengthDivisions = 3000;
const cumL = spineCurve.getLengths(3000);
const SL = cumL[3000];
const sCtrl = SPINE_PTS.map((_, k) => cumL[Math.round((k / (SPINE_PTS.length - 1)) * 3000)]);
const S_PELVIS = sCtrl[6], S_WAIST = sCtrl[7], S_CHEST = sCtrl[8], S_NECK = sCtrl[9];
const profKeys = SPINE_PROF.map((p, k) => [sCtrl[k], ...p]);
const _prof = [0, 0, 0];
function profAt(s, out = _prof) {
  let i = 0;
  while (i < profKeys.length - 2 && s > profKeys[i + 1][0]) i++;
  const k0 = profKeys[Math.max(i - 1, 0)], k1 = profKeys[i], k2 = profKeys[i + 1], k3 = profKeys[Math.min(i + 2, profKeys.length - 1)];
  const t = clamp((s - k1[0]) / (k2[0] - k1[0]), 0, 1);
  for (let c = 0; c < 3; c++) out[c] = Math.max(0.02, crs(k0[c + 1], k1[c + 1], k2[c + 1], k3[c + 1], t));
  return out;
}

const NJ = Math.round(SL / 0.4) + 1, JSTEP = SL / (NJ - 1);
const bindP = [], bindQ = [];
{
  const X = new V3(1, 0, 0);
  for (let j = 0; j < NJ; j++) {
    const u = j / (NJ - 1);
    const p = spineCurve.getPointAt(u), t = spineCurve.getTangentAt(u).normalize();
    const up = new V3().crossVectors(t, X).normalize(), x = new V3().crossVectors(up, t).normalize();
    bindP.push(p); bindQ.push(new QT().setFromRotationMatrix(new M4().makeBasis(x, up, t)));
  }
}
const J_PELVIS = Math.round(S_PELVIS / JSTEP), J_CHEST = Math.round(S_CHEST / JSTEP), J_NECK = Math.round(S_NECK / JSTEP), J_HEAD = NJ - 1;
const joints = [], jBindLQ = [], jUpL = [];
for (let j = 0; j < NJ; j++) joints.push(new THREE.Object3D());
function attachJoint(j, pj) {
  const o = joints[j];
  if (pj < 0) { o.position.copy(bindP[j]); o.quaternion.copy(bindQ[j]); dragon.add(o); }
  else {
    const iq = bindQ[pj].clone().invert();
    o.position.copy(bindP[j]).sub(bindP[pj]).applyQuaternion(iq);
    o.quaternion.copy(iq).multiply(bindQ[j]);
    joints[pj].add(o);
  }
  jBindLQ[j] = o.quaternion.clone();
  jUpL[j] = new V3(0, 1, 0).applyQuaternion(bindQ[j].clone().invert());
}
attachJoint(J_PELVIS, -1);
for (let j = J_PELVIS + 1; j < NJ; j++) attachJoint(j, j - 1);
for (let j = J_PELVIS - 1; j >= 0; j--) attachJoint(j, j + 1);

  st.glow = damp(st.glow, st.glowT, 2.4, dt);
  st.spread = damp(st.spread, st.spreadT, 2.0, dt);
  st.flapAmp = damp(st.flapAmp, st.flapAmpT, 2.5, dt);
  st.wingRaise = damp(st.wingRaise, st.wingRaiseT, 2.5, dt);
  st.flapPhase += dt * TAU * st.flapRate;
  const fs = Math.sin(st.flapPhase);
  if (st.flapAmp > 0.25 && st.lastFlapSin > 0 && fs <= 0) sound.whoosh(st.flapAmp * 1.5);
  st.lastFlapSin = fs;
  // clignement
  st.blinkT -= dt;
  if (st.blinkT < 0) { st.blinkP = 0; st.blinkT = rr(2.5, 6.5); }
  if (st.blinkP >= 0) { st.blinkP += dt / 0.24; if (st.blinkP >= 1) st.blinkP = -1; }
  st.shake = Math.max(0, st.shake - dt * 0.35);
}

const NECK_W = (() => { const n = J_HEAD - J_NECK, w = []; let s = 0; for (let j = 1; j <= n; j++) { const v = Math.pow(1 - (j - 1) / n, 1.5); w.push(v); s += v; } return w.map((v) => v / s); })();
function poseDragon() {
  const t = st.t, br = Math.sin(st.breath), air = FLY.air;
  for (let j = 0; j < J_PELVIS; j++) {
    const q = (J_PELVIS - j) / J_PELVIS;
    YAW[j] = (1 - air) * st.tailCurl * 0.08 * (0.3 + q) + (0.045 + 0.02 * air) * Math.sin(t * (0.75 + 0.5 * air) - q * 4.2) * (0.25 + q);
    PITCH[j] = 0.03 * Math.sin(t * 1.25 - q * 5.0) * smooth(0.5, 1, q) + (J_PELVIS - j <= 4 ? air * 0.065 : 0);
  }
  for (let j = J_PELVIS; j <= J_NECK; j++) { YAW[j] = 0.006 * Math.sin(t * 0.4); PITCH[j] = -0.004 * br; }
  const nN = J_HEAD - J_NECK, lift = st.lift + 0.06 * br;
  for (let j = J_NECK + 1; j <= J_HEAD; j++) {
    const q = (j - J_NECK) / nN;
    YAW[j] = (st.yaw * 0.6) / nN;
    PITCH[j] = (-st.pitch * 0.3) / nN + lift * (q < 0.55 ? -0.075 : 0.055) + air * 0.78 * NECK_W[j - J_NECK - 1];
  }
  for (let j = 0; j < NJ; j++) {
    _qa.setFromAxisAngle(jUpL[j], YAW[j]);
    _qb.setFromAxisAngle(XA, PITCH[j]);
    joints[j].quaternion.copy(jBindLQ[j]).multiply(_qa).multiply(_qb);
  }
  _qa.setFromAxisAngle(YA, st.yaw * 0.4);
  _qb.setFromAxisAngle(XA, -st.pitch * 0.7 + st.lift * 0.06 - air * 0.72);
  head.quaternion.copy(headBindLQ).multiply(_qa).multiply(_qb);
  jaw.rotation.x = st.jaw;
  const blink = st.blinkP >= 0 ? Math.sin(PI * st.blinkP) : 0;
  for (const e of EYES) e.lid.rotation.x = lerp(-0.62 + 0.2 * st.glow, 1.55, blink);
}

function updateFire(dt) {
  // bouche
  _mouth.set(0, -0.14, 2.05); head.localToWorld(_mouth);
  const ja = 0.12 + st.jaw * 0.3;
  _fdir.set(0, -Math.sin(ja), Math.cos(ja)).transformDirection(head.matrixWorld);
  _mvel.subVectors(_mouth, _prevMouth).divideScalar(Math.max(dt, 1e-3));
  if (_mvel.lengthSq() > 400) _mvel.set(0, 0, 0);
  _prevMouth.copy(_mouth);
  let rate = 0, small = false;
  if (st.firing) rate = 520;
  else if (st.mode === 'fire' && st.mt > 0.4) { rate = 26; small = true; }
  if (rate > 0) {
    st.fireAcc += rate * dt;
    _tmp.subVectors(st.fireTarget, _mouth).normalize();
    const dir = _v2.copy(_fdir).lerp(_tmp, small ? 0 : 0.65).normalize();
    while (st.fireAcc >= 1) {
      st.fireAcc -= 1;
      const sp = small ? rr(1, 3) : rr(29, 38), jt = small ? 0.5 : 0.1;
      _v.set(dir.x + rr(-jt, jt), dir.y + rr(-jt, jt), dir.z + rr(-jt, jt)).normalize();
      const pre = rnd() * dt, o = 0.15 + sp * pre;
      const i = FIRE.spawn(_mouth.x + _v.x * o, _mouth.y + _v.y * o, _mouth.z + _v.z * o,
        _v.x * sp + _mvel.x * 0.4, _v.y * sp + _mvel.y * 0.4 + (small ? 1 : 0), _v.z * sp + _mvel.z * 0.4,
        small ? rr(0.25, 0.45) : rr(1.15, 1.6), small ? rr(0.05, 0.1) : rr(0.16, 0.28), small ? rr(0.22, 0.4) : rr(1.4, 2.6));
      if (i >= 0) FIRE.age[i] = pre;
    }
  } else st.fireAcc = 0;
  // fumée des naseaux au repos
  st.puffTimer -= dt;
  if (st.puffTimer < 0 && st.mode === 'idle') {
    st.puffTimer = rr(5, 10);
    for (const sd of [-1, 1]) for (let k = 0; k < 9; k++) {
      _v.set(sd * 0.17, 0.2, 2.02); head.localToWorld(_v);
      _tmp.set(sd * 0.3, 0.6, 1).transformDirection(head.matrixWorld);
      const si = SMOKE.spawn(_v.x, _v.y, _v.z, _tmp.x * rr(0.3, 1.0), _tmp.y * rr(0.3, 1.0) + 0.4, _tmp.z * rr(0.3, 1.0), rr(1.2, 2.0), 0.04, rr(0.25, 0.45));
      if (si >= 0) SMOKE.seed[si] += 2;
    }
  }
  // simulation du feu
  let cx = 0, cy = 0, cz = 0, cn = 0;
  for (let i = FIRE.n - 1; i >= 0; i--) {
    FIRE.age[i] += dt;
    const k = FIRE.age[i] / FIRE.life[i], i3 = i * 3;
    if (k >= 1) {
      if (rnd() < 0.22 && FIRE.s1[i] > 1) SMOKE.spawn(FIRE.p[i3], FIRE.p[i3 + 1], FIRE.p[i3 + 2], FIRE.v[i3] * 0.2, 1.5 + rnd() * 1.5, FIRE.v[i3 + 2] * 0.2, rr(2.5, 4.2), 1.2, rr(5, 8));
      FIRE.kill(i); continue;
    }
    const v = FIRE.v, p = FIRE.p, drag = Math.exp(-(0.85 + 0.8 * k) * dt), sd = FIRE.seed[i] * 40, ag = FIRE.age[i], tb = (4 + 22 * k) * dt;
    v[i3] = v[i3] * drag + Math.sin(ag * 7.1 + sd) * tb;
    v[i3 + 1] = v[i3 + 1] * drag + (2.5 + 6.5 * k) * dt + Math.cos(ag * 5.3 + sd * 1.3) * tb * 0.6;
    v[i3 + 2] = v[i3 + 2] * drag + Math.sin(ag * 6.3 + sd * 0.7) * tb;
    p[i3] += v[i3] * dt; p[i3 + 1] += v[i3 + 1] * dt; p[i3 + 2] += v[i3 + 2] * dt;
    FIRE.rot[i] += FIRE.rv[i] * dt;
    if (p[i3 + 1] < 0.6) {
      const gy = groundY(p[i3], p[i3 + 2]) + 0.25;
      if (p[i3 + 1] < gy) {
        p[i3 + 1] = gy;
        if (v[i3 + 1] < 0) {
          const hs = Math.hypot(v[i3], v[i3 + 2]) + 1e-3, sp = -v[i3 + 1] * 0.6;
          v[i3] += (v[i3] / hs) * sp; v[i3 + 2] += (v[i3 + 2] / hs) * sp; v[i3 + 1] *= -0.08;
          if (k < 0.7 && FIRE.s1[i] > 1 && rnd() < 0.1) GEMB.spawn(p[i3] + rr(-0.7, 0.7), gy - 0.05, p[i3 + 2] + rr(-0.7, 0.7), 0, 0, 0, rr(3.5, 7), rr(0.3, 0.55), rr(0.5, 0.95));
        }
      }
    }
    if (k < 0.5) { cx += p[i3]; cy += p[i3 + 1]; cz += p[i3 + 2]; cn++; }
  }
  for (let i = SMOKE.n - 1; i >= 0; i--) {
    SMOKE.age[i] += dt;
    if (SMOKE.age[i] >= SMOKE.life[i]) { SMOKE.kill(i); continue; }
    const i3 = i * 3, v = SMOKE.v, p = SMOKE.p, drag = Math.exp(-0.6 * dt);
    v[i3] = v[i3] * drag + 0.25 * dt; v[i3 + 1] = v[i3 + 1] * drag + 0.9 * dt; v[i3 + 2] *= drag;
    p[i3] += v[i3] * dt; p[i3 + 1] += v[i3 + 1] * dt; p[i3 + 2] += v[i3 + 2] * dt;
    SMOKE.rot[i] += SMOKE.rv[i] * 0.3 * dt;
  }
  for (let i = GEMB.n - 1; i >= 0; i--) {
    GEMB.age[i] += dt;
    const k = GEMB.age[i] / GEMB.life[i], i3 = i * 3;
    if (k >= 1) { GEMB.kill(i); continue; }
    const p = GEMB.p;
    if (k < 0.6 && rnd() < 2.6 * dt) FIRE.spawn(p[i3] + rr(-0.3, 0.3), p[i3 + 1] + 0.1, p[i3 + 2] + rr(-0.3, 0.3), rr(-0.4, 0.4), rr(1.5, 3.5), rr(-0.4, 0.4), rr(0.5, 0.9), 0.12, rr(0.5, 0.95));
    if (rnd() < 0.5 * dt) SMOKE.spawn(p[i3], p[i3 + 1] + 0.6, p[i3 + 2], rr(-0.3, 0.3), rr(1, 2), rr(-0.3, 0.3), rr(2.5, 4), 0.4, rr(2, 3.5));
  }
  FIRE.upload(); SMOKE.upload(); GEMB.upload();
  // lumière du feu
  if (cn > 0) {
    fireLight.position.set(cx / cn, cy / cn + 1, cz / cn);
    fireLight.intensity = Math.min(1, cn / 300) * (480 + 160 * Math.sin(st.t * 31) * Math.sin(st.t * 17));
  } else fireLight.intensity = damp(fireLight.intensity, 0, 8, dt);
  if (st.glow > 0.3) { fireLight.position.copy(_mouth); fireLight.intensity = Math.max(fireLight.intensity, 60 * st.glow); }
}

function updateDragon(dt) {
  behave(dt);
  updateFlight(dt);
  poseDragon();
  dragon.updateMatrixWorld(true);
  readJoints();
  BODY.update(Math.sin(st.breath) * (st.mode === 'fire' && st.mt < 0.95 ? 2.2 : 1));
  SPIKES.update();
  for (const l of LEGS) l.update(FLY.air);
  for (const w of WINGS) w.update(st);
  TOES.instanceMatrix.needsUpdate = true; CLAWS.instanceMatrix.needsUpdate = true;
  U.glow.value = st.glow * (0.9 + 0.1 * Math.sin(st.t * 13));
}

/* =====================================================================
   Interactions
   ===================================================================== */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downXY = null, downT = 0;
canvas.addEventListener('pointerdown', (e) => { downXY = [e.clientX, e.clientY]; downT = performance.now(); sound.init(); });
canvas.addEventListener('pointerup', (e) => {
  if (!downXY) return;
  const dx = e.clientX - downXY[0], dy = e.clientY - downXY[1];
  downXY = null;
  if (dx * dx + dy * dy > 36 || performance.now() - downT > 450) return;
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  // le dragon ? (sphères le long de la colonne)
  let hitDragon = Infinity;
  for (let j = 0; j < NJ; j += 1) {
    profAt(j * JSTEP);
    const rad = Math.max(_prof[0], _prof[2]) * 1.15 + 0.2;
    const d = ray.ray.distanceSqToPoint(JP[j]);
    if (d < rad * rad) hitDragon = Math.min(hitDragon, ray.ray.origin.distanceTo(JP[j]));
  }
  _v.setFromMatrixPosition(head.matrixWorld).add(_v2.set(0, 0, 1).transformDirection(head.matrixWorld));
  if (ray.ray.distanceSqToPoint(_v) < 1.4) hitDragon = Math.min(hitDragon, ray.ray.origin.distanceTo(_v));
  const hits = ray.intersectObjects([perch, terrain], false);
  const gd = hits.length ? hits[0].distance : Infinity;
  if (hitDragon < gd) startRoar();
  else if (hits.length) startFire(hits[0].point);
});
$('bFire').addEventListener('click', () => { sound.init(); startFire(null); });
$('bRoar').addEventListener('click', () => { sound.init(); startRoar(); });
$('bWings').addEventListener('click', () => { sound.init(); setWings(!st.wingsOpen); });
$('bFly').addEventListener('click', () => { sound.init(); toggleFlight(); });
$('bCam').addEventListener('click', () => { autoCam = !autoCam; $('bCam').classList.toggle('on', autoCam); controls.autoRotate = autoCam; userTouchT = -99; });
$('bSound').addEventListener('click', () => {
  sound.init(); sound.setEnabled(!sound.enabled);
  $('bSound').classList.toggle('on', sound.enabled);
  for (const c of ['.w1', '.w2']) $('bSound').querySelector(c).style.opacity = sound.enabled ? 1 : 0.15;
});
addEventListener('keydown', (e) => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'f') $('bFire').click();
  else if (k === 'r') $('bRoar').click();
  else if (k === 'a') $('bWings').click();
  else if (k === 'e') $('bFly').click();
  else if (k === 'c') $('bCam').click();
  else if (k === 's') $('bSound').click();
});
for (const b of document.querySelectorAll('.btn')) b.addEventListener('mouseup', () => b.blur());

/* =====================================================================
   Boucle principale
   ===================================================================== */
const intro = { on: true, t: 0, dur: 6, from: new V3(38, 20, 56), to: camera.position.clone() };
if (camera.aspect < 1.3) {
  // écran étroit (portrait) : on recule pour garder le dragon entier dans le cadre
  const k = Math.pow(clamp(1.3 / camera.aspect, 1, 2.6), 0.4);
  intro.to.sub(controls.target).multiplyScalar(k).add(controls.target);
}
camera.position.copy(intro.from);
const _shake = new V3(), _camPrev = new V3(), HOME_T = controls.target.clone(), _want = new V3();
let roared = false;
function frame(dt) {
  U.time.value += dt;
  updateDragon(dt);
  updateFire(dt);
  for (const l of lavaLights) l.intensity = l.userData.base * (0.85 + 0.1 * Math.sin(st.t * 1.3 + l.position.x) + 0.05 * Math.sin(st.t * 3.7 + l.position.z));
  // l'ombre du soleil suit le dragon
  _want.copy(FLY.state === 'perched' ? HOME_T : JP[J_CHEST]);
  sun.target.position.lerp(_want, 1 - Math.exp(-dt * 4));
  sun.position.copy(SUN_DIR).multiplyScalar(80).add(sun.target.position);
  // caméra
  camera.position.sub(_shake);
  if (FLY.follow > 0) {
    _camPrev.copy(controls.target);
    controls.target.lerp(_want, (1 - Math.exp(-dt * 2.5)) * FLY.follow);
    camera.position.add(_camPrev.sub(controls.target).negate());
  }
  if (intro.on) {
    intro.t += dt;
    const k = smooth(0, 1, intro.t / intro.dur);
    camera.position.lerpVectors(intro.from, intro.to, k);
    if (intro.t >= intro.dur) intro.on = false;
  }
  if (!roared && st.t > 3.2) { roared = true; startRoar(); }
  if (autoCam && !controls.autoRotate && st.t - userTouchT > 8) controls.autoRotate = true;
  controls.autoRotate = controls.autoRotate && !intro.on;
  controls.update(dt);
  // pas de caméra sous la roche
  const r = Math.hypot(camera.position.x, camera.position.z);
  const gy = Math.max(LAVA_Y + 1.5, (r < perchR(Math.atan2(camera.position.z, camera.position.x)) + 1.5 ? perchTop(camera.position.x, camera.position.z) : terrainH(camera.position.x, camera.position.z)) + 1.2);
  if (camera.position.y < gy) camera.position.y = gy;
  const sk = st.shake * st.shake;
  _shake.set(rr(-1, 1), rr(-1, 1), rr(-1, 1)).multiplyScalar(sk * 0.6);
  camera.position.add(_shake);
  sky.position.copy(camera.position);
  composer.render(dt);
}
let last = performance.now();
const perf = { acc: 0, n: 0, pr: DPR };
function loop() {
  const now = performance.now(), raw = (now - last) / 1000;
  const dt = Math.min(raw, 0.05);
  last = now;
  // qualité adaptative : on baisse la résolution si le GPU peine
  if (!document.hidden && raw < 0.4) {
    perf.acc += raw; perf.n++;
    if (perf.n >= 150) {
      if (perf.acc / perf.n > 0.026 && perf.pr > 0.75) {
        perf.pr = Math.max(0.75, perf.pr - 0.25);
        renderer.setPixelRatio(perf.pr); composer.setPixelRatio(perf.pr); onResize();
      }
      perf.acc = 0; perf.n = 0;
    }
  }
  frame(dt);
}

// Accès de débogage / tests
window.__dragon = {
  THREE, scene, camera, renderer, controls, composer, st, joints, head, jaw, WINGS, LEGS, FIRE, SMOKE, FLY, sound,
  frame, startFire, startRoar, setWings, toggleFlight, intro,
  step(dt = 1 / 60, n = 1) { for (let i = 0; i < n; i++) frame(dt); },
};

await progress(0.92, 'Le dragon ouvre les yeux…');
chooseLook();
frame(1 / 60);
scatterBoulders();
try { await renderer.compileAsync(scene, camera); } catch (e) { /* compilation synchrone au premier rendu */ }
await progress(1);
$('loader').classList.add('gone');
last = performance.now();
renderer.setAnimationLoop(loop);
setTimeout(() => $('hint').classList.add('fade'), 14000);
</script>
</body>
