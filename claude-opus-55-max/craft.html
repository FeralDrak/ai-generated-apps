  return `<div class="view-head"><h2>📖 Le Registre</h2></div><div class="row mb">${b('heros', '🧝 Héros')}${b('memorial', '⚰️ Mémorial')}${b('journal', '📜 Journal')}${b('saison', '📊 Saison')}</div>${body}`;
}
ACT.rtab = el => { UI.regTab = el.dataset.v; render(); };

/* =====================================================================
   FENÊTRES : fin de journée, rapport, talents, événements
   ===================================================================== */
ACT.endday = () => {
  if (S.forging && ['work', 'finish'].includes(S.forging.phase)) return toast('Terminez ou abandonnez la pièce en cours à la forge.', 'bad');
  const warn = [];
  if (S.visitors.length) warn.push(`${plural(S.visitors.length, 'visiteur repartira', 'visiteurs repartiront')} sans réponse.`);
  const late = S.orders.filter(o => o.kind !== 'final' && o.due <= S.day);
  if (late.length) warn.push(`<b class="bad">${plural(late.length, 'commande expire', 'commandes expirent')} ce soir !</b>`);
  if (S.hours >= 1) warn.push(`Il vous reste ${fmtH(S.hours)} de travail.`);
  const due = DUES[S.day];
  if (due) warn.push(`📜 La Guilde prélève <b>${fmt(due)} or</b> ce soir${S.gold < due ? ` — <b class="bad">il vous manque ${fmt(due - S.gold)} or !</b> Vos objets seront bradés pour payer.` : '.'}`);
  if (S.day >= SEASON_DAYS) { const ev = finalOdds(); warn.push(`👑 <b>Ce soir, le champion affronte ${BOSSES[S.boss].short}</b> (${ev ? pct(ev.chance) : '?'} de victoire).`); }
  if (!warn.length) return doEndDay();
  openModal(`<h2>🌙 Fermer la boutique ?</h2>${warn.map(w => `<div class="notice">${w}</div>`).join('')}<div class="foot"><button class="btn" data-a="close">Pas encore</button><button class="btn fire" data-a="endday2">Finir la journée</button></div>`);
};
ACT.endday2 = () => { closeModal(); doEndDay(); };
function doEndDay() { sfx('bell'); endDay(); UI.sel = UI.sel || { r: null, mats: [] }; render(); nextPopup(); }
function showReport() {
  const r = S.report;
  const outc = { triomphe: ['🏆 Triomphe', 'good'], succes: ['✔ Succès', 'good'], echec: ['✖ Échec (blessé·e)', 'warn'], mort: ['💀 Mort', 'bad'] };
  let html = `<h2>🌙 Rapport du soir — Jour ${r.day}</h2>`;
  html += `<h3>🛍️ Vitrine</h3>${r.sales.length ? r.sales.map(s => `<div class="row"><span class="r-${s.r}">${s.name}</span><span class="spacer"></span>${gold(s.price)} <span class="small dim">(${Math.round(s.price / s.value * 100)} % de la valeur)</span></div>`).join('') : '<p class="dim">Aucune vente.</p>'}`;
  if (r.quests.length) html += `<h3 class="mt">🗺️ Retours de quête</h3>${r.quests.map(q => { const h = S.heroes[q.h]; return `<div class="card flat row nowrap mb">${heroPortrait(h, 'sm')}<div style="flex:1"><b>${esc(q.name)}</b> — ${q.quest}<br><b class="${outc[q.out][1]}">${outc[q.out][0]}</b> <span class="small dim">(chances : ${pct(q.chance)})</span>
      ${q.gold ? ` · part du butin : ${gold(q.gold)}` : ''}${q.mats.length ? ` · 🎁 ${q.mats.join(', ')}` : ''}${q.lvl ? ` · ⬆ niveau ${q.lvl}` : ''} <span class="small ${q.rep >= 0 ? 'good' : 'bad'}">réputation ${q.rep >= 0 ? '+' : ''}${q.rep}</span></div></div>`; }).join('')}`;
  if (r.expired.length) html += `<h3 class="mt">⌛ Commandes expirées</h3>${r.expired.map(e => `<div class="bad">${esc(e.name)} : réputation ${e.rep}</div>`).join('')}`;
  if (r.left) html += `<p class="dim mt">${plural(r.left, 'visiteur est reparti', 'visiteurs sont repartis')} sans réponse.</p>`;
  if (r.dues) html += `<h3 class="mt">📜 Dîme de la Guilde</h3>${r.dues.sold.length ? `<div class="notice bad">Vente forcée : ${r.dues.sold.join(', ')}</div>` : ''}${r.dues.ok ? `<div class="notice good">Dîme de ${fmt(r.dues.due)} or payée. Un nouveau talent vous attend !</div>` : `<div class="notice bad">Impossible de payer ${fmt(r.dues.due)} or…</div>`}`;
  if (r.battle) html += `<h3 class="mt">⚔️ L’affrontement final</h3><div class="notice ${r.battle.win ? 'good' : 'bad'}">${esc(r.battle.champion)} affronte ${BOSSES[S.boss].n} avec ${pct(r.battle.chance)} de chances… ${r.battle.win ? '<b>et triomphe ! Le royaume est sauvé grâce à vos armes.</b>' : '<b>et tombe au combat. La menace déferle sur le royaume.</b>'}</div>`;
  html += `<div class="row mt"><span>💰 ${fmt(S.gold)} or</span><span>⭐ ${fmt(S.rep)}</span><span class="spacer"></span><button class="btn primary big" data-a="closereport">${S.over ? 'Voir le bilan' : `☀️ Jour ${S.day}`}</button></div>`;
  openModal(html, { lock: true, wide: true });
  if (r.battle) sfx(r.battle.win ? 'win' : 'fail');
}
ACT.closereport = () => { S.report = null; saveRun(); closeModal(); render(); nextPopup(); };
function showTalents() {
  const offer = talentOffer(); saveRun();
  openModal(`<h2 class="center">💡 Choisissez un talent</h2><p class="center muted">Ce choix est définitif pour toute la saison.${S.pendingTalents > 1 ? ` (${S.pendingTalents} talents à choisir)` : ''}</p>
    <div class="grid ${offer.length === 4 ? 'g2' : 'g3'} mt">${offer.map(t => `<div class="card clickable talent" data-a="talent" data-v="${t}"><div class="emblem">${TALENTS[t].ico}</div><h3>${TALENTS[t].n}</h3><p class="muted">${TALENTS[t].d}</p></div>`).join('')}</div>`, { lock: true, wide: true });
}
ACT.talent = el => { pickTalent(el.dataset.v); closeModal(); render(); nextPopup(); };
function showEvent() {
  const ev = S.today.evt, v = eventView(ev), E2 = EVENTS[ev.id];
  const ch = !ev.done && E2.choices ? E2.choices(ev.p) : null;
  openModal(`<div class="center"><div class="emblem" style="font-size:3rem">${v.ico}</div><h2>${v.t}</h2><p>${v.d}</p></div>
    <div class="foot" style="justify-content:center">${ch ? ch.map((c, i) => `<button class="btn ${i === 0 ? 'primary' : ''}" data-a="evchoice" data-v="${i}" ${c.can && !c.can() ? 'disabled' : ''}>${c.l}</button>`).join('') : `<button class="btn primary" data-a="evok">D’accord</button>`}</div>`, { lock: !!ch });
  UI.modalOnClose = () => { S.today.evtSeen = true; saveRun(); render(); nextPopup(); };
}
ACT.evchoice = el => { const msg = chooseEvent(+el.dataset.v); if (msg) { toast(msg); closeModal(); } };
ACT.evok = () => closeModal();
function showRoyal() {
  const o = S.orders.find(x => x.kind === 'final'); S.today.royalSeen = true; saveRun();
  if (!o) return nextPopup();
  const h = S.heroes[o.heroId], B = BOSSES[S.boss];
  openModal(`<div class="center"><div class="emblem" style="font-size:3rem">👑</div><h2>Un héraut royal entre dans la boutique</h2></div>
    <p>« Par ordre de la Couronne, votre forge est chargée d’équiper <b>${esc(h.name)}</b>, ${fem(h) ? 'championne' : 'champion'} du royaume, qui affrontera <b>${B.n}</b> au soir du jour ${SEASON_DAYS}. »</p>
    <div class="notice">Livrez au moins une <b>arme</b> et une <b>armure de corps</b>. Casque, bouclier, gantelets et bottes sont facultatifs mais augmentent les chances. Exploitez la faiblesse ${elemPill(B.weak)} et résistez au danger ${elemPill(B.danger)} !</div>
    <p class="muted">Les héros encore en vie que vous avez équipés pendant la saison soutiendront le champion (+2 % chacun).</p>
    <div class="foot"><button class="btn primary" data-a="close">Pour le royaume !</button></div>`);
  UI.modalOnClose = () => { render(); nextPopup(); };
}

/* =====================================================================
   AIDE
   ===================================================================== */
function showHelp() {
  openModal(`<div class="row"><h2 style="margin:0">❓ Comment jouer</h2><span class="spacer"></span><button class="btn small ghost" data-a="close">✖</button></div>
  <div class="grid g2 mt">
    <div class="card flat"><h3>🎯 Le but</h3><p>Vous tenez une forge pendant une <b>saison de ${SEASON_DAYS} jours</b>. Chaque semaine, la Guilde prélève sa <b>dîme</b> (jours 7, 14 et 21) : sans or, c’est la faillite. Au jour 22, la Couronne vous commande l’équipement de son champion, qui affrontera la <b>grande menace</b> au soir du jour ${SEASON_DAYS}.</p></div>
    <div class="card flat"><h3>☀️ Une journée</h3><p>Vous disposez de <b>${BASE_HOURS} heures de travail</b>. Recevez les clients au <b>Comptoir</b>, achetez vos matériaux au <b>Marché</b>, forgez, exposez en <b>Vitrine</b>, puis <b>finissez la journée</b> : ventes, retours de quête et échéances sont résolus le soir.</p></div>
    <div class="card flat"><h3>🧝 Les clients</h3><p>Acceptez, négociez ou refusez. Héros en partance pour une quête, commandes <b>en lot</b> de la Garde, nobles exigeant de la <b>rareté</b>… Certains héros paient en <b>commission</b> : un pourcentage de leur butin s’ils reviennent vivants, parfois avec des matériaux introuvables.</p></div>
    <div class="card flat"><h3>🗺️ Les quêtes</h3><p>L’équipement livré décide du sort du héros : la <b>puissance</b> de l’arme et la <b>défense</b> des armures augmentent la réussite. Une arme de l’élément <b>faible</b> de l’ennemi (+40 %) et une armure qui <b>résiste</b> au danger (risque de mort ÷2) font toute la différence. Les classes légères détestent le lourd !</p></div>
    <div class="card flat"><h3>🔨 La forge</h3><p>Choisissez un plan et des matériaux (puissance, poids, magie, élément). Au mini-jeu, gardez la <b>chaleur</b> dans la zone verte, alternez <b>frappes mesurées</b> (sûres), <b>puissantes</b> (rapides mais risquées) et <b>finitions</b> (qualité). Chaque fissure coûte un cœur ; à zéro, la pièce se brise. Terminez par une <b>trempe</b> prudente ou audacieuse. <b>Coups parfaits</b> et <b>chefs-d’œuvre</b> (95+) donnent des propriétés spéciales.</p><p class="small muted">Raccourcis : 1, 2, 3 pour frapper, R pour réchauffer.</p></div>
    <div class="card flat"><h3>✨ Améliorations & rareté</h3><p>À la <b>table d’enchantement</b>, une gemme ajoute un élément ou un pouvoir — mais un échec peut briser la gemme, fêler… ou détruire l’objet. La <b>meule</b> renforce (+1, +2…) avec un risque croissant. La rareté (Commun → Légendaire) vient des propriétés magiques, de la qualité et du renforcement.</p></div>
    <div class="card flat"><h3>🛍️ Vitrine & économie</h3><p>Exposez vos créations à un prix libre : <b>plus vous dépassez la valeur, moins les passants achètent</b>. Investissez à l’<b>Atelier</b> : forge plus chaude (nouveaux métaux), marteau, enclume, meule, table d’enchantement, vitrine, apprenti… et de nouveaux plans.</p></div>
    <div class="card flat"><h3>🎲 Roguelite</h3><p>Chaque saison est unique : menace, clients, prix et événements changent. Vous choisissez des <b>talents</b> en payant la dîme et en montant en réputation. À la fin, vous gagnez des <b>points de légende ✦</b> pour débloquer un <b>héritage</b> permanent et de nouvelles origines.</p></div>
  </div><div class="foot"><button class="btn primary" data-a="close">Compris !</button></div>`, { wide: true });
}

/* =====================================================================
   ÉCRANS : titre, origine, héritage, fin de saison
   ===================================================================== */
function titleDeco() {
  const set = [['epeelongue', ['orichalque', 'mithril', 'dragon'], ELEM.feu.col], ['pavois', ['adamantite', 'boisfer'], null], ['baton', ['saule', 'orichalque'], ELEM.foudre.col], ['hache', ['givracier', 'boisfer'], ELEM.givre.col], ['casque', ['argent', 'cuir'], ELEM.sacre.col]];
  return `<div class="row" style="justify-content:center;gap:14px">${set.map(([r, m, g], i) => `<div class="icon lg ${i === 0 ? 'rb-4' : i === 2 ? 'rb-3' : 'rb-2'}">${itemSVG(r, m, { glow: g })}</div>`).join('')}</div>`;
}
function renderTitle() {
  const saved = loadRun();
  const canCont = saved && !saved.over;
  app.innerHTML = `<div class="title-screen">
    <div class="emblem" style="font-size:3.4rem">⚒️</div>
    <h1>Forge &amp; Fortune</h1>
    <div class="tag">Forgez armes et armures pour les héros du royaume, gérez votre boutique, prenez des risques à l’enclume… et équipez le champion qui affrontera la menace.</div>
    ${titleDeco()}
    <div class="row" style="justify-content:center">
      ${canCont ? `<button class="btn primary big" data-a="continue">▶ Continuer — jour ${saved.day}</button>` : ''}
      <button class="btn ${canCont ? '' : 'primary'} big" data-a="newrun">⚒ Nouvelle saison</button>
      <button class="btn big" data-a="heritage">🏛️ Héritage <span class="gold">${M.points} ✦</span></button>
      <button class="btn big ghost" data-a="help">❓ Comment jouer</button>
    </div>
    <div class="card" style="max-width:640px;width:100%"><div class="grid g3 center">
      <div><div class="muted small">Saisons</div><b style="font-size:1.4rem">${M.runs}</b></div>
      <div><div class="muted small">Victoires</div><b style="font-size:1.4rem">${M.wins}</b></div>
      <div><div class="muted small">Meilleur score</div><b style="font-size:1.4rem">${fmt(M.bestScore)}</b></div></div></div>
    <div class="row"><button class="btn small ghost" data-a="sound">${M.sound ? '🔊 Son activé' : '🔇 Son coupé'}</button></div>
  </div>`;
}
ACT.continue = () => { S = loadRun(); if (!S) return render(); UI.screen = 'game'; UI.tab = 'comptoir'; UI.sel = { r: null, mats: [] }; render(); nextPopup(); };
ACT.newrun = () => {
  const saved = loadRun();
  if (saved && !saved.over && UI.screen === 'title' && !UI.confirmNew) {
    openModal(`<h2>Commencer une nouvelle saison ?</h2><p>La saison en cours (jour ${saved.day}) sera perdue.</p><div class="foot"><button class="btn" data-a="close">Annuler</button><button class="btn danger" data-a="newrun2">Nouvelle saison</button></div>`);
    return;
  }
  UI.screen = 'origin'; render();
};
ACT.newrun2 = () => { closeModal(); UI.confirmNew = true; ACT.newrun(); UI.confirmNew = false; };
function renderOrigin() {
  app.innerHTML = `<div class="title-screen"><h1 style="font-size:2.6rem">Choisissez votre origine</h1><div class="tag">D’où vient votre savoir-faire ? Chaque origine modifie votre façon de jouer.</div>
    <div class="grid gauto" style="max-width:1100px;width:100%">${Object.keys(ORIGINS).map(id => {
      const o = ORIGINS[id], ok = M.origins[id];
      return `<div class="card ${ok ? 'clickable' : ''} origin ${ok ? '' : 'locked'}" ${ok ? `data-a="origin" data-v="${id}"` : ''}><div class="row nowrap"><div class="emblem">${o.ico}</div><h3 style="margin:0">${o.n}</h3></div><p class="muted">${o.d}</p>${ok ? '<b class="gold">Choisir →</b>' : `<span class="pill">🔒 ${o.cost} ✦ dans l’Héritage</span>`}</div>`;
    }).join('')}</div><button class="btn ghost" data-a="totitle2">← Retour</button></div>`;
}
ACT.totitle2 = () => { UI.screen = 'title'; render(); };
ACT.origin = el => {
  newRun(el.dataset.v); saveRun();
  UI.screen = 'game'; UI.tab = 'comptoir'; UI.sel = { r: null, mats: [] };
  render();
  if (!M.tuto) { M.tuto = true; saveMeta(); showHelp(); UI.modalOnClose = () => nextPopup(); } else nextPopup();
};
ACT.heritage = () => { UI.screen = 'heritage'; render(); };
function renderHeritage() {
  const ups = Object.keys(HERITAGE).map(id => {
    const h = HERITAGE[id], l = her(id), c = l < h.max ? h.cost[l] : null;
    return `<div class="card"><div class="row nowrap"><div class="emblem">${h.ico}</div><div><h3 style="margin:0">${h.n}</h3><div class="gold small">${'●'.repeat(l)}${'○'.repeat(h.max - l)}</div></div></div><p class="muted small">${h.d}</p>
      ${c != null ? `<button class="btn ${M.points >= c ? 'primary' : ''}" style="width:100%" data-a="buyher" data-v="${id}" ${M.points >= c ? '' : 'disabled'}>Acquérir — ${c} ✦</button>` : '<span class="pill gold">Maximum</span>'}</div>`;
  }).join('');
  const ors = Object.keys(ORIGINS).filter(id => id !== 'village').map(id => {
    const o = ORIGINS[id], ok = M.origins[id];
    return `<div class="card"><div class="row nowrap"><div class="emblem">${o.ico}</div><h3 style="margin:0">${o.n}</h3></div><p class="muted small">${o.d}</p>
      ${ok ? '<span class="pill ok">✔ Débloquée</span>' : `<button class="btn ${M.points >= o.cost ? 'primary' : ''}" style="width:100%" data-a="buyorigin" data-v="${id}" ${M.points >= o.cost ? '' : 'disabled'}>Débloquer — ${o.cost} ✦</button>`}</div>`;
  }).join('');
  app.innerHTML = `<div class="title-screen"><h1 style="font-size:2.6rem">🏛️ L’Héritage</h1>
    <div class="tag">Les points de légende gagnés à chaque saison se transmettent de génération en génération de forgerons.</div>
    <div class="stat" style="font-size:1.3rem">✦ ${M.points} points de légende</div>
    <h2 class="mt">Améliorations permanentes</h2><div class="grid gauto" style="max-width:1200px;width:100%">${ups}</div>
    <h2 class="mt">Origines</h2><div class="grid gauto" style="max-width:1200px;width:100%">${ors}</div>
    <button class="btn big" data-a="totitle2">← Retour</button></div>`;
}
ACT.buyher = el => { const id = el.dataset.v, h = HERITAGE[id], l = her(id); if (l >= h.max || M.points < h.cost[l]) return; M.points -= h.cost[l]; M.heritage[id] = l + 1; saveMeta(); sfx('magic'); render(); };
ACT.buyorigin = el => { const id = el.dataset.v, o = ORIGINS[id]; if (M.origins[id] || M.points < o.cost) return; M.points -= o.cost; M.origins[id] = true; saveMeta(); sfx('magic'); render(); };
function renderEnd() {
  const o = S.over, st = S.stats, B = BOSSES[S.boss];
  const t = o.win ? ['👑 Victoire !', `${B.n} est vaincu${B.f ? 'e' : ''}. Les bardes chanteront longtemps le nom de votre forge.`]
    : o.reason === 'faillite' ? ['💸 Faillite', 'Incapable de payer la dîme, vous voyez la Guilde saisir votre enclume. La forge ferme ses portes.']
    : o.reason === 'abandon' ? ['🏳️ Saison abandonnée', 'Vous rangez vos marteaux avant la fin de la saison.']
    : ['💀 Défaite', `Le champion est tombé face à ${B.n}. Le royaume vacille… mais votre lignée de forgerons se relèvera.`];
  app.innerHTML = `<div class="title-screen"><h1>${t[0]}</h1><div class="tag">${t[1]}</div>
    <div class="card" style="max-width:760px;width:100%"><div class="grid g3 center">
      <div><div class="muted small">Jours tenus</div><b style="font-size:1.4rem">${S.day}/${SEASON_DAYS}</b></div>
      <div><div class="muted small">Or gagné</div><b style="font-size:1.4rem">${fmt(st.earned)}</b></div>
      <div><div class="muted small">Réputation</div><b style="font-size:1.4rem">${fmt(S.rep)}</b></div>
      <div><div class="muted small">Objets forgés</div><b style="font-size:1.4rem">${st.crafted}</b></div>
      <div><div class="muted small">Quêtes réussies</div><b style="font-size:1.4rem">${st.successes}</b></div>
      <div><div class="muted small">Héros tombés</div><b style="font-size:1.4rem">${st.deaths}</b></div>
      <div><div class="muted small">Épiques</div><b style="font-size:1.4rem">${st.epic}</b></div>
      <div><div class="muted small">Légendaires</div><b style="font-size:1.4rem">${st.legendary}</b></div>
      <div><div class="muted small">Score</div><b style="font-size:1.4rem" class="gold">${fmt(o.score)}</b></div></div></div>
    <div class="stat" style="font-size:1.3rem">+${o.pts} ✦ points de légende (total : ${M.points})</div>
    <div class="row"><button class="btn primary big" data-a="endheritage">🏛️ Héritage</button><button class="btn big" data-a="endtitle">🏠 Écran titre</button></div></div>`;
}
ACT.endheritage = () => { clearRun(); S = null; UI.screen = 'heritage'; render(); };
ACT.endtitle = () => { clearRun(); S = null; UI.screen = 'title'; render(); };

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
loadMeta();
render();

</script>
</body>
</html>
