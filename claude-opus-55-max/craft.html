<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge &amp; Fortune — La forge des héros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17110d; --bg2:#211812; --panel:#2a1f17; --panel2:#33261b; --panel3:#3d2e21;
  --line:#5a4330; --line2:#7a5c3c; --text:#f3e8d2; --muted:#c2ad8d; --dim:#8f7b62;
  --gold:#f0b84c; --gold2:#ffd88a; --fire:#ff7a2f; --good:#6fd36b; --bad:#ff5d4f; --warn:#ffc04a; --info:#69b8ff;
  --r-c:#cfc8b8; --r-u:#62d66b; --r-r:#4fa8ff; --r-e:#bf74ff; --r-l:#ff9d2e;
  --e-feu:#ff6a3d; --e-givre:#7fd8ff; --e-foudre:#ffe066; --e-sacre:#fff1a8; --e-ombre:#a989e6; --e-poison:#86e05c;
  --radius:12px; --shadow:0 6px 24px rgba(0,0,0,.45);
  --title:'Cinzel', Georgia, 'Times New Roman', serif;
  --body:'Alegreya Sans', 'Segoe UI', Tahoma, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.4;
  background-image:radial-gradient(ellipse at 50% -10%, rgba(255,140,60,.13), transparent 60%),
  radial-gradient(ellipse at 100% 100%, rgba(120,70,30,.18), transparent 55%);background-attachment:fixed;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;font-size:inherit}
h1,h2,h3,h4{font-family:var(--title);margin:0 0 .5em;letter-spacing:.02em;font-weight:600}
h2{font-size:1.45rem;color:var(--gold2)}
h3{font-size:1.18rem;color:var(--gold2)}
h4{font-size:1.02rem;color:var(--muted)}
p{margin:.35em 0}
small,.small{font-size:.9rem}
.muted{color:var(--muted)} .dim{color:var(--dim)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .gold{color:var(--gold)} .info{color:var(--info)}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.col{display:flex;flex-direction:column;gap:8px}
.spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.gauto-s{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.center{text-align:center}
.mt{margin-top:12px}.mb{margin-bottom:12px}.mt2{margin-top:20px}

/* ---------- Boutons ---------- */
.btn{appearance:none;border:1px solid var(--line2);background:linear-gradient(#4a3826,#3a2a1c);color:var(--text);
  padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:700;letter-spacing:.01em;transition:transform .08s, filter .15s, background .15s;
  box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:42px;text-align:center}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#f4c25e,#c98a25);color:#2a1806;border-color:#ffd88a}
.btn.fire{background:linear-gradient(#ff8b45,#d4501c);color:#fff8ef;border-color:#ffb27a}
.btn.good{background:linear-gradient(#5fb85a,#3b8a37);border-color:#8ee08a}
.btn.danger{background:linear-gradient(#c8473b,#8e2a22);border-color:#ff8b7f}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.small{padding:6px 11px;min-height:34px;font-size:.95rem;border-radius:8px}
.btn.big{padding:13px 24px;font-size:1.12rem;min-height:52px}
.btn:disabled,.btn.disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.5)}
.btn:disabled:hover{filter:grayscale(.5)}
.btn .kbd{font-size:.8rem;opacity:.75;border:1px solid currentColor;border-radius:5px;padding:0 5px}

/* ---------- Structure ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:linear-gradient(#2d2118,#231a12);border-bottom:2px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#topbar .logo{font-family:var(--title);font-weight:800;font-size:1.25rem;color:var(--gold);white-space:nowrap;letter-spacing:.04em}
.stat{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.25);border:1px solid var(--line);padding:5px 11px;border-radius:999px;font-weight:700;white-space:nowrap}
.stat .lbl{color:var(--muted);font-weight:500;font-size:.92rem}
.stat.alert{border-color:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,93,79,.25)}}
#layout{display:flex;flex:1;min-height:0}
#tabs{width:210px;flex:none;background:rgba(0,0,0,.2);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:6px;position:sticky;top:var(--hh,62px);align-self:flex-start;height:calc(100vh - var(--hh,62px));overflow-y:auto}
.tab{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;color:var(--muted);font-weight:700;font-size:1.04rem;background:none;text-align:left;width:100%}
.tab:hover{background:rgba(255,255,255,.04);color:var(--text)}
.tab.active{background:linear-gradient(90deg,rgba(240,184,76,.18),rgba(240,184,76,.04));border-color:var(--line2);color:var(--gold2)}
.tab .ico{font-size:1.25rem;width:26px;text-align:center}
.tab .badge{margin-left:auto;background:var(--fire);color:#fff;border-radius:999px;font-size:.82rem;padding:1px 8px;font-weight:800}
.tab .badge.gold{background:var(--gold);color:#2a1806}
#tabs .endday{margin-top:auto}
#view{flex:1;padding:20px 24px 60px;min-width:0;max-width:1500px}
.view-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.view-head h2{margin:0}
.view-head .sub{color:var(--muted)}

/* ---------- Cartes ---------- */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative}
.card.flat{box-shadow:none}
.card.inset{background:rgba(0,0,0,.22);box-shadow:none}
.card.hl{border-color:var(--gold)}
.card.sel{outline:2px solid var(--gold);outline-offset:1px}
.card.clickable{cursor:pointer;transition:transform .1s,border-color .15s}
.card.clickable:hover{border-color:var(--line2);transform:translateY(-2px)}
.card h3{margin-bottom:6px}
.sep{height:1px;background:var(--line);margin:10px 0;border:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.98rem}
.kv>span:nth-child(odd){color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.92rem;font-weight:700;border:1px solid var(--line2);background:rgba(0,0,0,.25);white-space:nowrap}
.pill.e-feu{color:var(--e-feu);border-color:var(--e-feu)} .pill.e-givre{color:var(--e-givre);border-color:var(--e-givre)}
.pill.e-foudre{color:var(--e-foudre);border-color:var(--e-foudre)} .pill.e-sacre{color:var(--e-sacre);border-color:var(--e-sacre)}
.pill.e-ombre{color:var(--e-ombre);border-color:var(--e-ombre)} .pill.e-poison{color:var(--e-poison);border-color:var(--e-poison)}
.pill.ok{color:var(--good);border-color:var(--good)} .pill.no{color:var(--bad);border-color:var(--bad)} .pill.gold{color:var(--gold);border-color:var(--gold)}
.r-0{color:var(--r-c)} .r-1{color:var(--r-u)} .r-2{color:var(--r-r)} .r-3{color:var(--r-e)} .r-4{color:var(--r-l)}
.rb-0{border-color:#6d6658!important} .rb-1{border-color:var(--r-u)!important} .rb-2{border-color:var(--r-r)!important} .rb-3{border-color:var(--r-e)!important} .rb-4{border-color:var(--r-l)!important;box-shadow:0 0 18px rgba(255,157,46,.35)}

/* ---------- Icônes d'objets ---------- */
.icon{width:64px;height:64px;flex:none;border-radius:12px;border:2px solid #6d6658;background:radial-gradient(circle at 50% 40%,#3c2f24,#1c1510);display:grid;place-items:center;position:relative;overflow:hidden}
.icon svg{width:88%;height:88%}
.icon.lg{width:120px;height:120px;border-radius:18px}
.icon.xl{width:190px;height:190px;border-radius:24px}
.icon.sm{width:46px;height:46px;border-radius:9px}
.icon .plus{position:absolute;right:4px;top:2px;font-weight:800;color:var(--gold2);font-size:.85rem;text-shadow:0 1px 2px #000}
.icon.rb-4::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent,rgba(255,170,60,.25),transparent 30%);animation:spin 4s linear infinite}
.icon.rb-3::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(190,116,255,.18),transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.mat-chip{display:inline-flex;align-items:center;gap:6px}
.swatch{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.5);display:inline-block;flex:none}

/* ---------- Objets ---------- */
.item{display:flex;gap:12px;align-items:flex-start}
.item .info{min-width:0;flex:1}
.item .name{font-weight:800;font-size:1.06rem;line-height:1.2}
.item .meta{color:var(--muted);font-size:.95rem}
.statline{display:flex;gap:12px;flex-wrap:wrap;font-weight:700;margin:4px 0}
.statline span{white-space:nowrap}

/* ---------- Barres ---------- */
.bar{height:16px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid var(--line);overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width .35s ease}
.bar.tall{height:26px}
.bar .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;text-shadow:0 1px 2px #000;z-index:2}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(111,211,107,.22);border-left:2px solid rgba(111,211,107,.9);border-right:2px solid rgba(111,211,107,.9);z-index:1}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.35);z-index:1}

/* ---------- Visiteurs / héros ---------- */
.portrait{width:76px;height:76px;flex:none;border-radius:14px;overflow:hidden;border:2px solid var(--line2);background:#2b2118}
.portrait svg{width:100%;height:100%;display:block}
.portrait.sm{width:54px;height:54px;border-radius:10px}
.portrait.dead{filter:grayscale(1) brightness(.6)}
.req{background:rgba(0,0,0,.22);border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;margin:8px 0}
.req .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:3px 0}
.quote{font-style:italic;color:var(--muted);border-left:3px solid var(--line2);padding-left:10px;margin:6px 0}
.chance{font-weight:800;font-size:1.05rem}
.stars{color:var(--gold);letter-spacing:1px}

/* ---------- Forge ---------- */
.forge-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.anvil{min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 85%, rgba(255,110,40,.28), transparent 60%), linear-gradient(180deg,#2a1e15,#1a120c)}
.anvil .glow{position:absolute;inset:0;pointer-events:none;transition:opacity .4s}
.anvil .piece{position:relative;z-index:2;transition:filter .3s}
.anvil .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd36b;box-shadow:0 0 8px #ff9a2e;z-index:3;pointer-events:none;animation:spark .7s ease-out forwards}
@keyframes spark{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx),var(--dy))}}
.anvil .float{position:absolute;z-index:4;font-weight:800;font-size:1.35rem;text-shadow:0 2px 4px #000;animation:floatup 1.2s ease-out forwards;pointer-events:none}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.hearts{font-size:1.35rem;letter-spacing:2px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.action{text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:11px 13px;min-height:84px}
.action .t{font-size:1.06rem}
.action .d{font-weight:500;font-size:.9rem;opacity:.9}
.slotpick{display:flex;flex-wrap:wrap;gap:8px}
.matbtn{border:2px solid var(--line);background:rgba(0,0,0,.25);border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--text);display:flex;gap:8px;align-items:center;text-align:left;min-width:150px}
.matbtn:hover{border-color:var(--line2)}
.matbtn.on{border-color:var(--gold);background:rgba(240,184,76,.12)}
.matbtn.off{opacity:.45;cursor:not-allowed}
.matbtn .q{margin-left:auto;font-weight:800;color:var(--muted)}
.recipe{display:flex;gap:10px;align-items:center;cursor:pointer}
.recipe.locked{opacity:.5}

/* ---------- Tableaux ---------- */
table.t{width:100%;border-collapse:collapse;font-size:1rem}
table.t th{text-align:left;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);font-size:.92rem;white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid rgba(90,67,48,.5);vertical-align:middle}
table.t tr:hover td{background:rgba(255,255,255,.025)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.trend-up{color:var(--bad)} .trend-down{color:var(--good)}
input[type=number],input[type=text],select{background:#1a130e;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:1rem;font-family:inherit}
input[type=number]{width:84px}
input[type=range]{accent-color:var(--gold);width:100%;height:26px}

/* ---------- Modale / toasts / tooltips ---------- */
#modal-root .overlay{position:fixed;inset:0;background:rgba(8,5,3,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal{background:linear-gradient(180deg,#3a2b1f,#2a1f17);border:2px solid var(--line2);border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .2s}
.modal.wide{max-width:1040px}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:#2d2118;border:1px solid var(--line2);border-left:5px solid var(--gold);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:380px;animation:tin .25s;font-weight:600}
.toast.good{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)} .toast.crit{border-left-color:var(--r-l);background:#3a2610}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:#120d09;border:1px solid var(--line2);color:var(--text);padding:7px 10px;border-radius:8px;font-size:.92rem;font-weight:500;white-space:pre-line;width:max-content;max-width:300px;z-index:50;pointer-events:none;box-shadow:var(--shadow);text-align:left;line-height:1.35}
.log{max-height:420px;overflow:auto;font-size:.98rem}
.log div{padding:5px 0;border-bottom:1px solid rgba(90,67,48,.45)}

/* ---------- Écran titre ---------- */
.title-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px;gap:18px}
.title-screen h1{font-size:clamp(2.4rem,6vw,4.2rem);font-weight:800;color:var(--gold);text-shadow:0 0 30px rgba(255,140,40,.45),0 3px 0 #5a3a12;margin:0;text-align:center}
.title-screen .tag{font-size:1.25rem;color:var(--muted);text-align:center;max-width:720px}
.origin{cursor:pointer}
.origin.locked{opacity:.55}
.emblem{font-size:2.4rem;line-height:1}
.empty{padding:26px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:12px}
.notice{border-left:4px solid var(--gold);background:rgba(240,184,76,.08);padding:10px 14px;border-radius:8px;margin:8px 0}
.notice.bad{border-left-color:var(--bad);background:rgba(255,93,79,.08)}
.notice.good{border-left-color:var(--good);background:rgba(111,211,107,.08)}
.talent{cursor:pointer;text-align:center;padding:18px}
.talent .emblem{margin-bottom:8px}
.badge-day{font-family:var(--title);font-size:1.05rem}

@media (max-width:1280px){
  #topbar{gap:8px}
  .stat .lbl.opt{display:none}
}
@media (max-width:1100px){
  #topbar .logo{display:none}
  .forge-wrap{grid-template-columns:1fr}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  #layout{flex-direction:column}
  #tabs{width:auto;max-width:100vw;align-self:stretch;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  .tab{width:auto;white-space:nowrap;padding:9px 11px}
  #tabs .endday{position:fixed;right:12px;bottom:12px;z-index:30;margin:0;box-shadow:0 6px 20px rgba(0,0,0,.6)}
  #toasts{bottom:80px}
  #view{padding:14px 14px 50px}
  .g2,.g3{grid-template-columns:1fr}
  .actions{grid-template-columns:1fr}
  #topbar .logo{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script>
'use strict';
/* =====================================================================
   FORGE & FORTUNE — jeu de forge / gestion / roguelite
   ===================================================================== */

/* ---------- Utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = () => Math.random();
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const rfl = (a, b) => a + Math.random() * (b - a);
const chance = p => Math.random() < p;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wpick = (arr, w) => { const ws = arr.map(w); let t = ws.reduce((s, x) => s + x, 0) * Math.random(); for (let i = 0; i < arr.length; i++) { t -= ws[i]; if (t <= 0) return arr[i]; } return arr[arr.length - 1]; };
const fmt = n => Math.round(n).toLocaleString('fr-FR');
const pct = p => Math.round(p * 100) + ' %';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f = x => x) => a.reduce((s, x) => s + f(x), 0);
const logistic = z => 1 / (1 + Math.exp(-z));
const plural = (n, s, p) => n + ' ' + (Math.abs(n) >= 2 ? (p || s + 's') : s);
function shade(hex, f) { // f > 0 éclaircit, f < 0 assombrit
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; } else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return '#' + [r, g, b].map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
}
const OR = '<span class="gold">●</span>';
const gold = n => `<b class="gold">${fmt(n)}&nbsp;or</b>`;

/* ---------- Données : éléments ---------- */
const ELEM = {
  feu:    { n: 'Feu',    ico: '🔥', col: '#ff6a3d' },

/* ---------- Objets : calculs dérivés ---------- */
function qMult(q) { return 0.7 + q / 100 * 0.7 + (q >= 95 ? 0.1 : 0); }
function itemStats(it) {
  const R = RECIPES[it.r];
  let base = 0, wt = 0, magSum = 0, n = 0, cost = 0;
  R.parts.forEach((p, i) => {
    const m = MAT[it.mats[i]], q = p[2];
    let pw = R.magic ? m.pow * 0.6 + m.mag * R.magic : m.pow;
    if (it.r === 'arc' && i === 0 && m.bow) pw *= m.bow;
    base += q * pw * (i === 0 ? 1 : 0.5);
    wt += q * m.wt; magSum += q * m.mag; n += q; cost += q * m.price;
  });
  const traits = it.traits || [], ench = it.ench || [];
  let power = base * R.mult * qMult(it.q);
  if (traits.includes('equilibre')) power *= 1.1;
  if (traits.includes('aceree')) power *= 1.15;
  if (traits.includes('renforcee')) power *= 1.15;
  if (ench.includes('rune')) power *= 1.15;
  if (ench.includes('fureur')) power *= 1.3;
  power *= 1 + 0.08 * (it.reinf || 0);
  if (S && S.origin === 'sylve' && ['arc', 'baton', 'robe'].includes(it.r)) power *= 1.15;
  if (S && S.origin === 'orque' && R.kind === 'arme' && R.tags.includes('lourd')) power *= 1.15;
  if (R.tags.includes('lourd')) wt *= 1.4;
  if (traits.includes('plume')) wt *= 0.6;
  const mag = magSum / n;
  const innate = MAT[it.mats[0]].elem || null;
  const elems = [];
  if (innate) elems.push(innate);
  ench.forEach(e => { if (ELEM[e] && !elems.includes(e)) elems.push(e); });
  const sps = ench.filter(e => SPECIAL[e]);
  let idx = ench.length + traits.length + (innate ? 1 : 0) + (it.q >= 80 ? 1 : 0) + ((it.reinf || 0) >= 3 ? 1 : 0) + ((it.reinf || 0) >= 5 ? 1 : 0);
  const rarity = Math.min(4, idx);
  const sockets = Math.min(3, 1 + (mag >= .5 ? 1 : 0) + (it.q >= 80 ? 1 : 0));
  let value = (cost * 1.35 + R.h * 9) * (0.55 + it.q / 100 * 0.9) * (1 + 0.12 * (it.reinf || 0));
  ench.forEach(e => { const g = Object.values(MAT).find(m => m.cat === 'gemme' && (m.elem === e || m.sp === e)); value += (g ? g.price : 40) * 1.6; });
  value *= 1 + 0.18 * rarity;
  if (traits.includes('gloire')) value *= 1.3;
  if (hasT('prestige') && rarity >= 2) value *= 1.2;
  return {
    power: Math.round(power), weight: Math.round(wt * 10) / 10, heavy: wt > 4.5, light: wt <= 2.5,
    mag, elems, sps, rarity, sockets, value: Math.max(5, Math.round(value)), cost, kind: R.kind, slot: R.slot,
  };
}

function needs(r, mats, n = 1) { const o = {}; RECIPES[r].parts.forEach((p, i) => { o[mats[i]] = (o[mats[i]] || 0) + p[2] * n; }); return o; }
function craftHours(r, auto) { return RECIPES[r].h * (auto && hasT('serie') ? .75 : 1); }
function canCraft(r, mats, n = 1, auto = false) {
  const R = RECIPES[r];
  if (!S.recipes.includes(r)) return { ok: false, why: 'Plan non acquis.' };
  if (S.tools.enclume < R.anvil) return { ok: false, why: `Enclume niv. ${R.anvil} requise.` };
  for (let i = 0; i < R.parts.length; i++) {
    const m = MAT[mats[i]];
    if (!m) return { ok: false, why: `Choisissez : ${R.parts[i][0]}.` };
    if (!R.parts[i][1].includes(m.cat)) return { ok: false, why: `${m.n} ne convient pas pour : ${R.parts[i][0]}.` };
    if (m.cat === 'metal' && m.forge > S.tools.forge) return { ok: false, why: `${m.n} : forge niv. ${m.forge} requise.` };
  }
  const nd = needs(r, mats, n);
  for (const id in nd) if ((S.mats[id] || 0) < nd[id]) return { ok: false, why: `Pas assez de ${MAT[id].n.toLowerCase()} (${S.mats[id] || 0}/${nd[id]}).` };
  if (S.coal < n) return { ok: false, why: 'Pas assez de charbon.' };
  if (S.hours + 1e-6 < craftHours(r, auto) * n) return { ok: false, why: 'Pas assez d’heures de travail aujourd’hui.' };
  return { ok: true };
}
function consume(r, mats, n = 1) { const nd = needs(r, mats, n); for (const id in nd) S.mats[id] -= nd[id]; S.coal -= n; }
function heartsFor(mats) {
  let h = 3 + T('enclume', 'hearts') + her('mains') + (hasT('solide') ? 1 : 0) - (S.origin === 'port' ? 1 : 0);

function rollEvent() {
  const ids = Object.keys(EVENTS).filter(id => (!EVENTS[id].cond || EVENTS[id].cond()) && !S.seenEvents.slice(-4).includes(id));
  if (!ids.length) return null;
  const id = wpick(ids, x => EVENTS[x].w);
  S.seenEvents.push(id);
  const p = EVENTS[id].gen ? EVENTS[id].gen() : {};
  return { id, p, done: !EVENTS[id].choices };
}
function eventView(ev) { return EVENTS[ev.id].text(ev.p); }
function chooseEvent(i) {
  const ev = S.today.evt; if (!ev || ev.done) return;
  const ch = EVENTS[ev.id].choices(ev.p)[i];
  if (ch.can && !ch.can()) return toast('Impossible.', 'bad');
  const msg = ch.f(); ev.done = true; ev.result = msg;
  addLog(`${eventView(ev).t} : ${msg}`);
  saveRun();
  return msg;
}

/* ---------- Vitrine ---------- */
function traffic() {
  return (.38 + rankOf(S.rep) * .04 + T('vitrine', 'attract')) * (S.today.traffic || 1) * (hasT('vendeur') ? 1.25 : 1) * (S.origin === 'port' ? 1.2 : 1);
}
function saleChance(it, price) {
  const st = itemStats(it), r = price / st.value;
  const f = r <= .8 ? 1.25 : 1.25 * Math.exp(-2.6 * (r - .8));
  return clamp(traffic() * f * (S.today.weaponDemand && st.kind === 'arme' ? 1.5 : 1), 0, .95);
}
function showcaseSales(rep) {
  S.showcase.slice().forEach(sc => {
    const it = S.items.find(x => x.id === sc.id); if (!it) return;
    if (chance(saleChance(it, sc.price))) {
      const st = itemStats(it);
      removeItem(it.id);
      S.gold += sc.price; S.stats.earned += sc.price; S.stats.sold++;
      const g = gainRep(st.rarity >= 2 ? 2 : 1);
      rep.sales.push({ name: itemName(it), r: st.rarity, price: sc.price, value: st.value, rep: g });
    }
  });
}
function putShowcase(id, price) {
  if (S.showcase.length >= T('vitrine', 'slots')) return toast('Vitrine pleine.', 'bad');
  if (S.showcase.some(s => s.id === id)) return;
  S.showcase.push({ id, price: Math.round(price) }); sfx('click'); saveRun();
}

/* ---------- Cycle des journées ---------- */
function startDay() {
  S.today = {};
  S.hours = maxHours();
  rollMarket(false);
  Object.values(S.heroes).forEach(h => { if (h.status === 'blesse' && h.until <= S.day) h.status = 'ville'; if (h.status === 'commande' && !S.orders.some(o => o.heroId === h.id)) h.status = 'ville'; });
  if (S.day >= 22 && !S.finalIssued) { issueFinal(); S.today.royal = true; }
  if (S.day > 1 && chance(.55)) {
    const ev = rollEvent();
    if (ev) { S.today.evt = ev; const E2 = EVENTS[ev.id]; if (E2.apply) E2.apply(ev.p); }
  }
  genVisitors();
  saveRun();
}
function payDues(rep) {
  const due = DUES[S.day]; if (!due) return true;
  const sold = [];
  if (S.gold < due) {
    // Vente d'urgence au colporteur, des objets les moins précieux aux plus précieux
    const its = S.items.slice().sort((a, b) => itemStats(a).value - itemStats(b).value);
    for (const it of its) { if (S.gold >= due) break; const g = Math.round(itemStats(it).value * .5); removeItem(it.id); S.gold += g; sold.push(`${itemName(it)} (${g} or)`); }
  }
  rep.dues = { due, sold, ok: S.gold >= due };
  if (S.gold < due) return false;
  S.gold -= due; S.stats.duesPaid++; S.pendingTalents++;
  addLog(`Dîme de la Guilde payée : ${due} or.`);
  return true;
}
function endDay() {
  const rep = { day: S.day, sales: [], quests: [], expired: [], left: S.visitors.length, dues: null, battle: null };
  S.visitors = [];
  showcaseSales(rep);
  resolveQuests(rep);
  S.orders.filter(o => o.kind !== 'final' && o.due <= S.day).forEach(o => {
    S.orders = S.orders.filter(x => x !== o);
    // Les objets déjà livrés d'une commande partielle sont rendus au stock
    o.lines.forEach(l => l.got.forEach(it => S.items.push(it)));
    const r = gainRep(o.kind === 'bulk' ? -5 : -8);
    if (o.heroId) { const h = S.heroes[o.heroId]; h.loyal = Math.max(0, h.loyal - 20); h.status = 'ville'; }
    rep.expired.push({ name: clientName(o), rep: r });
    addLog(`Commande expirée : ${clientName(o)} (réputation ${r}).`);
  });
  const okDues = payDues(rep);
  if (!okDues) {
    S.report = rep; endRun(false, 'faillite');
    return;
  }
  if (S.day >= SEASON_DAYS) {
    const ev = finalOdds();
    const o = S.orders.find(x => x.kind === 'final');
    const win = chance(ev ? ev.chance : .02);
    rep.battle = { win, chance: ev ? ev.chance : .02, champion: o ? S.heroes[o.heroId].name : 'Le champion' };
    S.report = rep;
    endRun(win, win ? 'victoire' : 'defaite');
    return;
  }
  S.report = rep;
  S.day++;
  startDay();
}

/* ---------- Talents ---------- */
function talentOffer() {
  if (!S.talentOffer) S.talentOffer = shuffle(Object.keys(TALENTS).filter(t => !S.talents.includes(t))).slice(0, her('muse') ? 4 : 3);
  return S.talentOffer;
}
function pickTalent(id) {
  if (S.talents.includes(id)) return;
  S.talents.push(id); S.pendingTalents = Math.max(0, S.pendingTalents - 1); S.talentOffer = null;
  if (id === 'heures') S.hours += 2;
  addLog(`Talent acquis : <b>${TALENTS[id].n}</b>.`);
  sfx('magic'); saveRun();
}

/* ---------- Fin de saison ---------- */
function legendPoints(win) {
  const st = S.stats;
  return Math.round(S.day + S.rep / 12 + st.successes * 1.5 + st.epic * 2 + st.legendary * 5 + st.duesPaid * 6 + (win ? 40 : 0));
}
function runScore(win) { const st = S.stats; return Math.round(st.earned + S.rep * 5 + st.successes * 25 + st.legendary * 120 + st.epic * 40 + (win ? 1500 : 0)); }
function endRun(win, reason) {
  const pts = legendPoints(win), score = runScore(win);
  M.points += pts; M.earned += pts; M.runs++; if (win) M.wins++;
  M.bestScore = Math.max(M.bestScore, score); M.bestDay = Math.max(M.bestDay, S.day);
  saveMeta();
  S.over = { win, reason, pts, score };
  addLog(win ? '👑 VICTOIRE ! La menace est vaincue.' : reason === 'faillite' ? '💸 Faillite : la Guilde saisit votre forge.' : '💀 Défaite : la menace a triomphé.');
  saveRun();
}

/* ---------- Achats d'outils et de plans ---------- */
function toolCost(id) { const t = TOOLS[id], l = S.tools[id]; if (l >= t.max) return null; return t.cost[l] ?? null; }
function upgradeTool(id) {
  const c = toolCost(id); if (c == null) return;
  if (S.gold < c) return toast('Pas assez d’or.', 'bad');
  S.gold -= c; S.tools[id]++;
  if (id === 'apprenti') S.hours += TOOLS.apprenti.hours[S.tools.apprenti] - TOOLS.apprenti.hours[S.tools.apprenti - 1];
  addLog(`Amélioration : ${TOOLS[id].n} niv. ${S.tools[id]}.`);
  toast(`${TOOLS[id].ico} ${TOOLS[id].n} amélioré${id === 'forge' || id === 'enclume' || id === 'meule' || id === 'table' || id === 'vitrine' ? 'e' : ''} au niveau ${S.tools[id]} !`, 'good');
  sfx('crit'); saveRun();
}
function buyRecipe(r) {
  const p = RECIPES[r].price; if (S.recipes.includes(r)) return;
  if (S.gold < p) return toast('Pas assez d’or.', 'bad');
  S.gold -= p; S.recipes.push(r); addLog(`Plan acquis : ${RECIPES[r].n}.`); toast(`📜 Plan acquis : ${RECIPES[r].n}`, 'good'); sfx('coin'); saveRun();
}

function portraitSVG(o) {

  const k = o.cls || o.look, g = o.g || 'm', sd = o.seed || 0;

    case 'rodeur': case 'voleur': case 'pretre': {
      const hc = k === 'rodeur' ? '#3f6b35' : k === 'voleur' ? '#26262d' : '#6a5040';
      back = `<path d="M15 34 C14 8 50 8 49 34 L50 52 L14 52Z" fill="${shade(hc, -.15)}"/>`;

    case 'marchand': top = `<path d="M17 24 C17 14 47 14 47 24 L49 26 L15 26Z" fill="#8a5a2a"/>`; break;
    case 'noble': top = g === 'f' ? `<path d="M23 18 L26 12 L29 17 L32 10 L35 17 L38 12 L41 18Z" fill="#f0c040" stroke="#8a6a1a" stroke-width=".8"/>` + top : `<path d="M16 23 C18 13 46 13 48 23Z" fill="#3a1a3a"/><path d="M44 18 C52 10 56 14 58 6" stroke="#f2e6c0" stroke-width="2.5" fill="none"/>`; break;
  }

    `<ellipse cx="27" cy="33" rx="1.8" ry="2.1" fill="#1d140e"/><ellipse cx="37" cy="33" rx="1.8" ry="2.1" fill="#1d140e"/><path d="M24 29.5 L29.5 29 M34.5 29 L40 29.5" stroke="${shade(hair, -.2)}" stroke-width="1.4"/>`;
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bg2}"/><stop offset="1" stop-color="${bg1}"/></linearGradient></defs>

   SONS (Web Audio, synthétisés)
   ===================================================================== */
let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, t0, dur, type = 'sine', vol = .2, f2) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .005); g.gain.exponentialRampToValueAtTime(.0008, t0 + dur);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function noise(t0, dur, vol = .2, ftype = 'bandpass', freq = 1200, q = 1) {
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; f.type = ftype; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
  s.connect(f).connect(g).connect(AC.destination); s.start(t0);
}
function sfx(name) {
  if (!AC || !M || !M.sound) return;
  const t = AC.currentTime + .01;
  try {
    switch (name) {
      case 'clang': [523, 1187, 2240, 3310].forEach((f, i) => tone(f * rfl(.98, 1.02), t, .5 - i * .08, 'sine', .12 / (i + 1))); noise(t, .06, .25, 'highpass', 2500); break;
      case 'crit': [659, 1318, 2637].forEach((f, i) => tone(f, t, .7, 'sine', .12 / (i + 1))); [880, 1108, 1318, 1760].forEach((f, i) => tone(f, t + .08 + i * .06, .3, 'triangle', .06)); noise(t, .05, .2, 'highpass', 3000); break;
      case 'crack': noise(t, .25, .5, 'lowpass', 900); tone(140, t, .25, 'square', .08, 60); break;
      case 'break': noise(t, .7, .6, 'lowpass', 1400); tone(200, t, .6, 'sawtooth', .07, 40); [1800, 2600, 3500].forEach((f, i) => tone(f, t + i * .07, .2, 'sine', .04)); break;
      case 'hiss': noise(t, 1.1, .3, 'highpass', 3500); break;
      case 'fire': noise(t, .5, .25, 'lowpass', 500); break;
      case 'coin': tone(1568, t, .12, 'square', .05); tone(2093, t + .07, .25, 'square', .05); break;
      case 'magic': [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, t + i * .06, .5, 'sine', .07)); break;
      case 'fail': tone(392, t, .25, 'triangle', .1, 262); tone(262, t + .2, .35, 'triangle', .1, 196); break;
      case 'click': tone(900, t, .05, 'square', .03); break;
      case 'win': [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, t + i * .14, .5, 'triangle', .09)); break;
      case 'bell': [880, 1760].forEach((f, i) => tone(f, t, 1.4, 'sine', .08 / (i + 1))); break;
    }
  } catch (e) {}
}

  if (UI.tab === 'forge' && S.forging && UI.fx) { const fx = UI.fx; UI.fx = null; playForgeFx(fx); }

/* ---------- Enchaînement des fenêtres (rapport, talents, événements) ---------- */
function nextPopup() {
  if (!S || UI.screen !== 'game' || modalOpen()) return;
  if (S.report) return showReport();
  if (S.over) return render();
  if (S.pendingTalents > 0) return showTalents();
  if (S.today.evt && !S.today.evtSeen) return showEvent();
  if (S.today.royal && !S.today.royalSeen) return showRoyal();
}

/* ---------- Distribution des actions ---------- */
const ACT = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) {
    const ov = e.target.classList && e.target.classList.contains('overlay') ? e.target : null;
    if (ov && ov.dataset.lock !== '1') closeModal();
    return;
  }
  if (el.tagName === 'A') e.preventDefault();
  if (el.disabled || el.classList.contains('disabled')) return;
  initAudio();
  const f = ACT[el.dataset.a];
  if (f) f(el, e);
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && ACT[el.dataset.in]) ACT[el.dataset.in](el, e); });
document.addEventListener('keydown', e => {
  if (UI.screen !== 'game' || !S || e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape' && modalOpen() && $('#modal-root .overlay').dataset.lock !== '1') return closeModal();
  if (modalOpen()) return;
  const F = S.forging;
  if (UI.tab === 'forge' && F) {
    const k = e.key.toLowerCase();
    if (F.phase === 'work') { if (k === '1') ACT.strike({ dataset: { v: 'mesuree' } }); if (k === '2') ACT.strike({ dataset: { v: 'puissante' } }); if (k === '3') ACT.strike({ dataset: { v: 'finition' } }); if (k === 'r') ACT.reheat(); }
    else if (F.phase === 'finish') { if (k === '1') ACT.finish({ dataset: { v: 'sure' } }); if (k === '2') ACT.finish({ dataset: { v: 'risquee' } }); }
  }
});
ACT.tab = el => { UI.tab = el.dataset.v; render(); window.scrollTo(0, 0); };
ACT.close = () => closeModal();
ACT.sound = () => { M.sound = !M.sound; saveMeta(); render(); };
ACT.help = () => showHelp();
ACT.menu = () => openModal(`<h2>Menu</h2><p class="muted">La partie est sauvegardée automatiquement.</p>

ACT.abandon = () => openModal(`<h2>Abandonner la saison ?</h2><p>La saison s’arrête ici. Vous gagnez tout de même les points de légende de votre progression.</p>
  <div class="foot"><button class="btn" data-a="close">Annuler</button><button class="btn danger" data-a="abandon2">Abandonner</button></div>`);

/* =====================================================================
   VUE : COMPTOIR (clients, commandes, missions)

function dueText(o) {
  const n = o.due - S.day;
  if (n <= 0) return `<b class="bad">Ce soir, dernier délai !</b>`;
  if (n === 1) return `<b class="warn">Demain soir</b>`;
  return `Encore ${n} jours <span class="dim">(jour ${o.due})</span>`;
}
function deadlineText(rq) { const d = rq.deadline + (hasT('ponctuel') ? 1 : 0); return d <= 1 ? '<b class="warn">Aujourd’hui même</b>' : `${d} jours <span class="dim">(avant la fin du jour ${S.day + d - 1})</span>`; }
function chanceCol(p) { return p >= .7 ? 'good' : p >= .4 ? 'warn' : 'bad'; }
function reqHeader(o) {
  if (o.heroId) {
    const h = S.heroes[o.heroId];
    return `<div class="row nowrap">${heroPortrait(h)}<div style="min-width:0"><h3>${esc(h.name)}</h3>
      <div class="muted">${CLASSES[h.cls].ico} ${clsName(h)} niv. ${h.lvl}</div>
      <div class="row mt" style="margin-top:4px;gap:6px"><span class="pill" data-tip="${esc(PERS[h.pers].d)}">${persName(h)}</span>${h.loyal >= 30 ? `<span class="pill gold" data-tip="Client fidèle (${Math.round(h.loyal)}/100) : paie mieux et revient souvent.">💛 Fidèle</span>` : ''}${h.wins ? `<span class="pill" data-tip="Quêtes réussies">🏅 ${h.wins}</span>` : ''}</div></div></div>`;
  }
  return `<div class="row nowrap">${clientPortrait(o)}<div><h3>${esc(o.client.n)}</h3><div class="muted">${esc(o.client.t)}</div></div></div>`;
}
function questBlock(q, h) {
  const Q = q.boss ? BOSSES[q.id] : QUESTS[q.id];
  const ev = h ? heroEval(h, q.id, q.D, null, q.boss) : null;
  return `<div class="req">
    <div class="line">🗺️ <b>${esc(Q.n)}</b>${q.boss ? '' : ` <span class="dim">— ${Q.foe}</span> <span class="stars" data-tip="Difficulté">${stars(q.stars)}</span> <span class="dim">· ${q.days} jours</span>`}</div>
    <div class="line"><span class="muted">Faiblesse :</span> ${Q.weak ? `<span data-tip="Une arme de ${ELEM[Q.weak].n} augmente fortement les chances de réussite (+40 % de puissance).">${elemPill(Q.weak)}</span>` : '<span class="dim">aucune</span>'}
      <span class="muted">Danger :</span> ${Q.danger ? `<span data-tip="Une armure résistante au ${ELEM[Q.danger].n} réduit de moitié le risque de mort.">${elemPill(Q.danger)}</span>` : '<span class="dim">physique</span>'}${Q.blunt ? ' <span class="pill" data-tip="Les armes contondantes (masse, marteau) sont efficaces ici.">🔨 Contondant</span>' : ''}</div>
    ${ev && !q.boss ? `<div class="line small"><span class="muted">Avec son équipement actuel :</span> <b class="${chanceCol(ev.chance)}">${pct(ev.chance)}</b> de réussite, <b class="bad">${pct(ev.death)}</b> de mort</div>` : ''}
  </div>`;
}
function linesBlock(o, mode) {
  return o.lines.map((l, i) => {
    const rlock = l.r && !S.recipes.includes(l.r);
    const n = matchingItems(l).length, done = l.got.length >= l.qty;
    let status = '';
    if (mode === 'order') {
      status = done ? `<span class="pill ok">✔ Livré${l.qty > 1 ? ` (${l.qty})` : ''}</span>`
        : `<span class="pill ${n ? 'ok' : ''}">${l.got.length}/${l.qty} livré${l.qty > 1 ? 's' : ''} · ${n} en stock</span> <button class="btn small ${n ? 'primary' : ''}" data-a="deliver" data-id="${o.id}" data-li="${i}" ${n ? '' : 'disabled'}>📦 Livrer</button>`;
    } else status = n ? `<span class="pill ok" data-tip="Objets correspondants déjà en stock">✔ ${n} en stock</span>` : '';
    return `<div class="req"><div class="line">${l.r ? recipeIcon(l.r, null, 'sm') : ''}<b>${lineTitle(l)}</b> ${status}</div>
      ${lineReqs(l) ? `<div class="line">${lineReqs(l)}</div>` : ''}
      ${rlock ? `<div class="line small warn">⚠️ Plan non acquis (${RECIPES[l.r].price} or à l’Atelier)</div>` : ''}
      ${done && mode === 'order' && l.got.length ? `<div class="line small muted">${l.got.map(it => `<span class="r-${itemStats(it).rarity}">${itemName(it)}</span>`).join(', ')}</div>` : ''}</div>`;
  }).join('');
}
function payBlock(o) {
  if (o.commission) {
    const lo = Math.round(o.quest.D * 2.5 * o.commission / 100), hi = Math.round(o.quest.D * 4.5 * o.commission / 100);
    return `<div class="line">💰 ${gold(o.pay)} à la livraison <span class="muted">+</span> <b class="gold">${o.commission} %</b> <span class="muted">du butin si la quête réussit (≈ ${lo}–${hi} or, parfois des matériaux rares)</span></div>`;
  }
  return `<div class="line">💰 ${gold(o.pay)} à la livraison <span class="dim">(+ pourboire si vous dépassez les attentes)</span></div>`;
}
function visitorCard(rq) {
  const h = rq.heroId ? S.heroes[rq.heroId] : null;
  const neg = negoOdds(rq);
  return `<div class="card">${reqHeader(rq)}
    <div class="quote">« ${esc(rq.quote)} »</div>

    <div class="row"><button class="btn good" data-a="accept" data-id="${rq.id}">✔ Accepter</button>
      <button class="btn" data-a="nego" data-id="${rq.id}" ${rq.nego ? 'disabled' : ''} data-tip="${rq.commission ? '+8 points de commission' : '+25 % de paiement'}. Réussite : ${pct(neg)}.\nEn cas d’échec, le client peut partir.">🗣️ Négocier ${rq.nego ? '' : `(${pct(neg)})`}</button>
      <button class="btn ghost" data-a="refuse" data-id="${rq.id}">✖ Refuser</button></div></div>`;
}
function orderCard(o) {
  const h = o.heroId ? S.heroes[o.heroId] : null;
  let extra = '';
  if (h && o.quest && !o.quest.boss) {
    const g = Object.assign({}, h.gear); o.lines.forEach(l => l.got.forEach(it => { g[RECIPES[it.r].slot] = it; }));

  return `<div class="card">${reqHeader(o)}${linesBlock(o, 'order')}

    <div class="col" style="gap:4px;margin-top:8px">${payBlock(o)}<div class="line">⏱️ ${dueText(o)}</div></div></div>`;
}
function finalCard(o) {
  const h = S.heroes[o.heroId], B = BOSSES[S.boss], ev = finalOdds();
  return `<div class="card hl"><div class="row"><h2 style="margin:0">👑 Commande royale</h2><span class="spacer"></span><span class="pill gold">${dueText(o)}</span></div>
    <div class="row nowrap mt">${heroPortrait(h)}<div><h3>${esc(h.name)}</h3><div class="muted">${CLASSES[h.cls].ico} ${clsName(h)} niv. 10 — ${fem(h) ? 'championne' : 'champion'} du royaume</div>
    <div class="quote">« ${esc(o.quote)} »</div></div></div>
    <div class="notice"><b>${B.ico} ${B.n}</b> — ${B.d}<br>Faiblesse : ${elemPill(B.weak)} · Danger : ${elemPill(B.danger)}</div>

    <div class="row mt"><span class="chance">Chances de victoire : <span class="${chanceCol(ev.chance)}">${pct(ev.chance)}</span></span>
      <span class="muted small">Puissance ${ev.P} contre ${BOSS_DIFF} · soutien de ${ev.support.n} héros équipés : +${pct(ev.support.b)}${ev.elemHit ? ' · ✔ faiblesse exploitée' : ' · ✖ faiblesse non exploitée'}${ev.resist ? ' · ✔ résistance au danger' : ''}</span></div>
    <p class="small dim">Arme et armure de corps obligatoires ; casque, bouclier, gantelets et bottes sont facultatifs mais augmentent les chances. Vous pouvez livrer jusqu’au soir du jour ${SEASON_DAYS}.</p></div>`;

function viewComptoir() {
  const ev = S.today.evt ? eventView(S.today.evt) : null;
  const fin = S.orders.find(o => o.kind === 'final');
  const orders = S.orders.filter(o => o.kind !== 'final');

ACT.accept = el => { acceptReq(el.dataset.id); render(); };
ACT.refuse = el => { refuseReq(el.dataset.id); render(); };
ACT.nego = el => { negotiate(el.dataset.id); render(); };

/* ---------- Fenêtre de livraison ---------- */
function showDeliver(oid, li) {
  const o = S.orders.find(x => x.id === oid); if (!o) return;
  const l = o.lines[li], need = l.qty - l.got.length;
  const h = o.heroId ? S.heroes[o.heroId] : null;
  let its = matchingItems(l);
  const rows = its.map(it => {
    const st = itemStats(it);
    let pred = '';
    if (h && o.quest) {
      const g = o.kind === 'final' ? finalGear(o) : Object.assign({}, h.gear);
      if (o.kind !== 'final') o.lines.forEach(x => x.got.forEach(y => { g[RECIPES[y.r].slot] = y; }));
      g[RECIPES[it.r].slot] = it;
      const ev = o.kind === 'final' ? heroEval(h, S.boss, BOSS_DIFF, g, true) : heroEval(h, o.quest.id, o.quest.D, g);
      if (o.kind === 'final') ev.chance = clamp(ev.chance + supportBonus().b, .02, .97);
      it._pred = ev.chance;
      pred = `<div class="small">→ <b class="${chanceCol(ev.chance)}">${pct(ev.chance)}</b> de réussite${o.kind === 'final' ? '' : ` · <span class="bad">${pct(ev.death)}</span> de mort`}${ev.notes.length ? ` <span class="dim">(${ev.notes.join(', ')})</span>` : ''}</div>`;
    }
    const inShow = S.showcase.some(s => s.id === it.id);
    return { it, html: `<label class="card flat clickable row nowrap" style="padding:10px"><input type="${need > 1 ? 'checkbox' : 'radio'}" name="dsel" value="${it.id}" data-in="dsel" style="width:20px;height:20px">
      ${itemIcon(it, 'sm')}<div style="min-width:0;flex:1"><div class="r-${st.rarity}"><b>${itemName(it)}</b></div>
      <div class="small muted">${qName(it.q)} (${it.q}) · ${RECIPES[it.r].kind === 'arme' ? '⚔️' : '🛡️'} ${st.power} · ⚖️ ${st.weight} ${st.elems.map(e => ELEM[e].ico).join('')} · valeur ${fmt(st.value)} or${inShow ? ' · <span class="warn">en vitrine</span>' : ''}</div>${pred}</div></label>` };
  });
  if (h) rows.sort((a, b) => (b.it._pred || 0) - (a.it._pred || 0)); else rows.sort((a, b) => itemStats(a.it).value - itemStats(b.it).value);
  UI.del = { oid, li, need, sel: [] };
  openModal(`<h2>📦 Livrer : ${lineTitle(l)}</h2><p class="muted">Client : <b>${esc(clientName(o))}</b>. ${need > 1 ? `Choisissez ${need} objets.` : 'Choisissez l’objet à livrer.'}</p>
    ${lineReqs(l) ? `<div class="row">${lineReqs(l)}</div>` : ''}
    ${h && o.quest ? `<p class="small muted">L’équipement que vous livrez change directement les chances du héros : choisissez bien !</p>` : ''}
    <div class="col mt">${rows.map(r => r.html).join('')}</div>
    <div class="foot">${need > 1 ? `<button class="btn" data-a="dauto">Sélection auto (les moins précieux)</button>` : ''}<button class="btn" data-a="close">Annuler</button><button class="btn primary" id="dconfirm" data-a="dconfirm" disabled>Livrer</button></div>`, { wide: true });
}
ACT.deliver = el => showDeliver(el.dataset.id, +el.dataset.li);
ACT.dsel = () => {
  const sel = $$('#modal-root input[name=dsel]:checked').map(x => x.value);
  if (sel.length > UI.del.need) { const boxes = $$('#modal-root input[name=dsel]:checked'); boxes[boxes.length - 1].checked = false; sel.pop(); toast(`Seulement ${UI.del.need} objet(s) nécessaires.`); }
  UI.del.sel = sel;
  const b = $('#dconfirm'); if (b) { b.disabled = !sel.length; b.textContent = sel.length ? `Livrer (${sel.length}/${UI.del.need})` : 'Livrer'; }
};
ACT.dauto = () => {
  const o = S.orders.find(x => x.id === UI.del.oid), l = o.lines[UI.del.li];
  const ids = matchingItems(l).sort((a, b) => itemStats(a).value - itemStats(b).value).slice(0, UI.del.need).map(x => x.id);
  $$('#modal-root input[name=dsel]').forEach(x => { x.checked = ids.includes(x.value); });
  ACT.dsel();
};
ACT.dconfirm = () => {
  const d = UI.del; if (!d || !d.sel.length) return;
  closeModal(); deliver(d.oid, d.li, d.sel); render();
};

  const st = itemStats(it), R = RECIPES[it.r];

  return `<div class="item">${itemIcon(it, size)}<div class="info">
    <div class="name r-${st.rarity}">${itemName(it)}</div>

    <div class="statline"><span data-tip="${R.kind === 'arme' ? 'Puissance : augmente les chances de réussite du porteur.' : 'Défense : augmente la réussite et réduit le risque de mort.'}">${R.kind === 'arme' ? '⚔️ Puissance' : '🛡️ Défense'} ${st.power}</span>
      <span data-tip="Les voleurs, rôdeurs et mages détestent les objets lourds.">⚖️ ${st.weight} (${weightLabel(st)})</span><span>💰 ${fmt(st.value)} or</span></div>
    <div class="row" style="gap:6px">${st.elems.map(e => elemPill(e, R.kind)).join('')}
      ${st.sps.map(s => `<span class="pill gold" data-tip="${SPECIAL[s].d}">${SPECIAL[s].ico} ${SPECIAL[s].n}</span>`).join('')}
      ${(it.traits || []).map(t => `<span class="pill gold" data-tip="${TRAITS[t].d}">🌟 ${TRAITS[t].n}</span>`).join('')}
      ${R.tags.includes('contondant') ? '<span class="pill" data-tip="Efficace contre les morts-vivants, trolls et golems.">🔨 Contondant</span>' : ''}
      ${st.sockets ? `<span class="pill" data-tip="Emplacements d’enchantement (limités par l’affinité magique, la qualité et la table d’enchantement).">${'◆'.repeat(it.ench.length)}${'◇'.repeat(Math.max(0, st.sockets - it.ench.length))}</span>` : ''}</div>
    <div class="small dim" style="margin-top:4px">${R.parts.map((p, i) => `${p[0]} : ${MAT[it.mats[i]].n}`).join(' · ')}</div>
  </div></div>`;
}
function previewItem(r, mats, q) { return { r, mats, q, ench: [], reinf: 0, traits: [] }; }
function viewForge() { return S.forging ? forgeSession() : forgeSetup(); }
function forgeSetup() {
  const sel = UI.sel;
  const list = Object.keys(RECIPES).sort((a, b) => (S.recipes.includes(b) - S.recipes.includes(a)) || RECIPES[a].h - RECIPES[b].h);
  const recipesHtml = list.map(r => {
    const R = RECIPES[r], own = S.recipes.includes(r);
    const parts = R.parts.map(p => `${p[2]} ${p[1].map(c => CAT_1[c]).join('/')}`).join(' + ');
    return `<div class="card flat clickable recipe ${own ? '' : 'locked'} ${sel.r === r ? 'sel' : ''}" data-a="selr" data-v="${r}" style="padding:9px 11px">${recipeIcon(r, null, 'sm')}
      <div style="min-width:0"><b>${R.n}</b><div class="small muted">${R.kind === 'arme' ? '⚔️' : '🛡️'} ${fmtH(R.h)} · ${parts}</div>
      ${own ? (S.tools.enclume < R.anvil ? `<div class="small warn">Enclume niv. ${R.anvil} requise</div>` : '') : `<div class="small warn">Plan : ${R.price} or</div>`}</div></div>`;
  }).join('');
  let right = `<div class="empty">Choisissez un plan pour commencer.</div>`;
  if (sel.r) {
    const R = RECIPES[sel.r], own = S.recipes.includes(sel.r);
    const partsHtml = R.parts.map((p, i) => {
      const opts = Object.keys(MAT).filter(id => p[1].includes(MAT[id].cat) && (S.mats[id] || 0) > 0);
      return `<div class="mt"><h4>${p[0]} — ${p[2]} × ${p[1].map(c => CAT_1[c]).join(' ou ')}</h4><div class="slotpick">${opts.length ? opts.map(id => {
        const m = MAT[id], have = S.mats[id] || 0, need = sum(R.parts.filter((pp, j) => sel.mats[j] === id && j !== i), pp => pp[2]) + p[2];
        const bad = have < need ? `Il en faut ${need}` : m.cat === 'metal' && m.forge > S.tools.forge ? `Forge niv. ${m.forge} requise` : '';

      }).join('') : `<span class="dim">Aucun matériau en stock. <a href="#" data-a="tab" data-v="marche" class="gold">Aller au marché →</a></span>`}</div></div>`;

      btns = `<div class="grid g2 mt">

    }
    right = `<div class="card"><div class="row"><h3 style="margin:0">${R.n}</h3><span class="pill">${R.kind === 'arme' ? 'Arme' : 'Armure · ' + SLOT_N[R.slot]}</span>${R.tags.map(t => `<span class="pill">${{ leger: 'Léger', lourd: 'Lourd', contondant: 'Contondant', magique: 'Magique', distance: 'À distance' }[t]}</span>`).join('')}</div>

      ${S.tools.enclume < R.anvil ? `<div class="notice bad">Nécessite une enclume de niveau ${R.anvil}.</div>` : ''}

  return `<div class="view-head"><h2>🔥 La Forge</h2><span class="sub">⏳ ${fmtH(S.hours)} de travail restantes · ⚫ ${S.coal} charbon · Forge niv. ${S.tools.forge} (${T('forge', 'heat')}°)</span></div>

function autoPickMats(r) {
  const R = RECIPES[r];
  return R.parts.map(p => {
    const opts = Object.keys(MAT).filter(id => p[1].includes(MAT[id].cat) && (S.mats[id] || 0) >= p[2] && (MAT[id].cat !== 'metal' || MAT[id].forge <= S.tools.forge));
    opts.sort((a, b) => MAT[a].price - MAT[b].price);
    return opts[0] || null;
  });
}
ACT.selr = el => { const r = el.dataset.v; if (UI.sel.r !== r) UI.sel = { r, mats: autoPickMats(r) }; render(); };
ACT.selm = el => { UI.sel.mats[+el.dataset.i] = el.dataset.v; render(); };
ACT.buyr = el => { buyRecipe(el.dataset.v); render(); };
ACT.autoN = el => { const v = el.dataset.v; UI.autoN = v === 'max' ? 99 : UI.autoN + (+v); render(); };
ACT.auto = () => {
  const made = autoCraft(UI.sel.r, UI.sel.mats, UI.autoN); if (!made) return;
  toast(`🏭 ${made.length} × ${RECIPES[UI.sel.r].n} produits (qualité ${made.map(x => x.q).sort((a, b) => a - b).join(', ')}).`, 'good');
  UI.autoN = 1; render();
};
ACT.forge = () => { startForge(UI.sel.r, UI.sel.mats); render(); };

/* ---------- Session de forge (mini-jeu) ---------- */
function expGain(type) {
  const F = S.forging, ST = STRIKES[type], od = strikeOdds(type);
  const heatF = od.inZone ? 1 + .2 * (F.heat - F.zone) / Math.max(1, F.max - F.zone) : .45;
  let q = ST.q / RECIPES[F.r].size * forgeTools(F).power * heatF; if (type === 'puissante' && hasT('poigne')) q *= 1.25;
  return { q: Math.round(q), f: Math.round(ST.forme / RECIPES[F.r].size), od };
}
function forgeSession() {
  const F = S.forging, R = RECIPES[F.r], prim = MAT[F.mats[0]];
  const heatPct = F.heat, glow = clamp(F.heat / 100, 0, 1);
  const scale = .55 + .45 * F.forme / 100;
  const heatCol = F.metal ? `linear-gradient(90deg,#5a2a10,#ff6a1a ${Math.max(10, heatPct - 20)}%,#ffd27a)` : 'linear-gradient(90deg,#3a5a2a,#8fd46a)';
  const qt = qTier(F.q);
  let panel = '';

      <span class="d">+${g.f} % forme · ~+${g.q} qualité</span><span class="d">Fissure ${pct(g.od.flaw)} · Coup parfait ${pct(g.od.crit)}</span></button>`;
    panel = `<div class="actions">${act('mesuree', a)}${act('puissante', b)}${act('finition', c, F.forme < 60 ? 'disabled data-tip="Disponible à partir de 60 % de forme"' : '')}
      <button class="btn action" data-a="reheat" ${F.heat >= F.max - .5 ? 'disabled' : ''}><span class="t">${F.metal ? '🔥 Réchauffer' : '🛢️ Assouplir'} <span class="kbd">R</span></span>
      <span class="d">${F.metal ? (hasT('souffle') ? 'Gratuit (Souffle du dragon)' : `1 charbon (reste ${S.coal})`) + ' · −1 qualité' : '30 min de travail'}</span><span class="d">${F.metal ? 'Chaleur' : 'Souplesse'} → ${Math.round(F.max)}</span></button></div>
      <div class="row mt"><span class="small muted">${F.heat < F.zone ? `<b class="bad">❄ ${F.metal ? 'Trop froid' : 'Trop rigide'} !</b> Frapper maintenant est risqué et peu efficace.` : `<span class="good">● ${F.metal ? 'Chaleur' : 'Souplesse'} idéale</span> — plus c’est ${F.metal ? 'chaud' : 'souple'}, plus le gain de qualité est grand.`}</span>

  } else if (F.phase === 'finish') {
    panel = `<h3>${F.metal ? '💧 La trempe' : '✂️ La finition'}</h3><p class="muted">Dernière étape : jouer la sécurité ou tenter le tout pour le tout ?</p>
      <div class="actions"><button class="btn action good" data-a="finish" data-v="sure"><span class="t">${F.metal ? 'Trempe à l’huile' : 'Finition soignée'} <span class="kbd">1</span></span><span class="d">Sans risque : +3 à +6 qualité</span></button>
      <button class="btn action fire" data-a="finish" data-v="risquee"><span class="t">${F.metal ? 'Trempe à l’eau' : 'Finition audacieuse'} <span class="kbd">2</span></span><span class="d">55 % : +12 à +18 · 30 % : +4 à +8</span><span class="d">${hasT('trempe') ? '0 % d’échec (Trempe parfaite)' : '15 % : −10 à −14 qualité'}</span></button></div>
      <p class="small dim mt">Chef-d’œuvre à 95 de qualité : l’objet gagne une propriété spéciale. Chaque coup parfait augmente aussi les chances de réussite critique.</p>`;
  } else if (F.phase === 'done') {
    const it = S.items.find(x => x.id === F.result);
    panel = it ? `<h3>✨ Pièce terminée !</h3>${itemDetail(it)}
      <div class="row mt"><button class="btn primary" data-a="upgrade" data-id="${it.id}">✨ Améliorer</button><button class="btn" data-a="toshow" data-id="${it.id}">🛍️ Mettre en vitrine</button>
      <button class="btn fire" data-a="again">🔨 Nouvelle pièce</button></div>` : `<p>Pièce terminée.</p><button class="btn fire" data-a="again">🔨 Nouvelle pièce</button>`;
  } else if (F.phase === 'broken') {

  }
  const tick = v => `<span class="tick" style="left:${v}%"></span>`;
  return `<div class="view-head"><h2>🔥 ${R.n} en ${prim.n.toLowerCase()}</h2><span class="sub">⏳ ${fmtH(S.hours)} restantes · ⚫ ${S.coal} charbon</span></div>
    <div class="forge-wrap">
      <div class="card anvil" id="anvil"><div class="glow" style="opacity:${F.metal ? glow : glow * .3};background:radial-gradient(circle at 50% 55%,rgba(255,120,30,.55),transparent 60%)"></div>

        ${F.metal ? `<svg viewBox="0 0 200 66" width="240" height="80" style="margin-top:-46px;position:relative;z-index:1"><defs><linearGradient id="anv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7480"/><stop offset=".25" stop-color="#3b4048"/><stop offset="1" stop-color="#1c1f24"/></linearGradient></defs>
          <path d="M18 6 L150 6 C170 6 188 12 197 20 C182 23 162 23 150 25 L140 32 L114 32 L114 48 L138 60 L62 60 L86 48 L86 32 L58 32 C38 28 22 20 18 6Z" fill="url(#anv)" stroke="#000" stroke-opacity=".6" stroke-width="1.5"/>
          <path d="M20 7 L150 7" stroke="rgba(255,190,120,${(glow * .6).toFixed(2)})" stroke-width="3"/></svg>`
        : `<svg viewBox="0 0 200 66" width="240" height="80" style="margin-top:-46px;position:relative;z-index:1"><rect x="10" y="6" width="180" height="14" rx="3" fill="#7a5634" stroke="#000" stroke-opacity=".5"/><rect x="22" y="20" width="12" height="44" fill="#5a3e26"/><rect x="166" y="20" width="12" height="44" fill="#5a3e26"/><rect x="34" y="40" width="132" height="6" fill="#4a3220"/></svg>`}
        <div class="hearts" data-tip="Solidité : chaque fissure coûte un cœur. À zéro, la pièce se brise.">${hearts(F.hearts, F.maxHearts)}</div>
        <div class="small muted">${F.strikes} frappe${F.strikes > 1 ? 's' : ''} · ${F.crits} coup${F.crits > 1 ? 's' : ''} parfait${F.crits > 1 ? 's' : ''} · ${F.metal ? F.reheats + ' réchauffe' + (F.reheats > 1 ? 's' : '') : ''}</div></div>
      <div class="card">
        <div class="col" style="gap:10px">
          <div><div class="row"><b>${F.metal ? '🌡️ Chaleur' : '🍃 Souplesse'}</b><span class="spacer"></span><span class="small muted">zone idéale : ${F.zone}+</span></div>
            <div class="bar tall"><span class="zone" style="left:${F.zone}%;width:${Math.max(0, F.max - F.zone)}%"></span><i style="width:${heatPct}%;background:${heatCol}"></i><span class="lab">${Math.round(F.heat)} / ${Math.round(F.max)}</span></div></div>
          <div><div class="row"><b>🔨 Forme</b><span class="spacer"></span><span class="small muted">${Math.round(F.forme)} %</span></div>
            <div class="bar tall"><i style="width:${F.forme}%;background:linear-gradient(90deg,#8a6a3b,#f0b84c)"></i><span class="lab">${F.forme >= 100 ? 'Prête pour la finition' : Math.round(F.forme) + ' %'}</span></div></div>
          <div><div class="row"><b>💎 Qualité</b><span class="spacer"></span><b class="${qt >= 4 ? 'gold' : ''}">${QUALITY[qt].n} (${Math.round(F.q)})</b></div>
            <div class="bar tall">${[20, 40, 60, 80, 95].map(tick).join('')}<i style="width:${F.q}%;background:linear-gradient(90deg,#6d6658,#62d66b 40%,#4fa8ff 65%,#bf74ff 85%,#ff9d2e)"></i></div>
            <div class="row small dim" style="justify-content:space-between"><span>Grossière</span><span>Commune</span><span>Bonne</span><span>Fine</span><span>Excellente</span><span>Chef-d’œuvre</span></div></div>

function playForgeFx(fx) {
  const an = $('#anvil'); if (!an) return;
  const n = fx.crit ? 26 : fx.flaw ? 6 : 12;
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div'); s.className = 'spark';
    const a = rnd() * Math.PI * 2, d = rfl(40, fx.crit ? 170 : 110);
    s.style.left = '50%'; s.style.top = '48%'; s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', (Math.sin(a) * d - 30) + 'px');
    if (fx.crit) s.style.background = '#fff2b0';
    an.appendChild(s); setTimeout(() => s.remove(), 800);
  }
  if (fx.text) { const f = document.createElement('div'); f.className = 'float'; f.style.left = '50%'; f.style.top = '30%'; f.style.transform = 'translateX(-50%)'; f.style.color = fx.col || '#ffd88a'; f.textContent = fx.text; an.appendChild(f); setTimeout(() => f.remove(), 1300); }
  if (fx.flaw) { an.classList.add('shake'); setTimeout(() => an.classList.remove('shake'), 400); }
}
ACT.strike = el => {
  const r = strike(el.dataset.v); if (!r) return;
  UI.fx = r.flaw ? { flaw: true, text: '💥 Fissure !', col: '#ff5d4f' } : r.crit ? { crit: true, text: `🌟 +${Math.round(r.dq)}`, col: '#ffd88a' } : { text: `+${Math.max(0, Math.round(r.dq))}` };
  if (S.forging.phase === 'broken') UI.fx = { flaw: true, text: '☠️ Brisée !', col: '#ff5d4f' };
  render();
};
ACT.reheat = () => { reheat(); render(); };
ACT.finish = el => { const it = finishForge(el.dataset.v); UI.fx = { crit: true, text: it ? qName(it.q) : '' }; render(); };
ACT.again = () => { const F = S.forging; S.forging = null; if (F) UI.sel = { r: F.r, mats: autoPickMats(F.r).map((m, i) => (S.mats[F.mats[i]] || 0) >= RECIPES[F.r].parts[i][2] ? F.mats[i] : m) }; saveRun(); render(); };
ACT.abandonforge = () => openModal(`<h2>Abandonner la pièce ?</h2><p>Les matériaux, le charbon et le temps investis seront perdus.</p><div class="foot"><button class="btn" data-a="close">Continuer à forger</button><button class="btn danger" data-a="abandonforge2">Abandonner</button></div>`);
ACT.abandonforge2 = () => { closeModal(); S.forging.phase = 'broken'; S.forging.log.unshift('Vous abandonnez la pièce.'); saveRun(); render(); };

function showUpgrade(id, msg) {
  const it = S.items.find(x => x.id === id);
  if (!it) { closeModal(); render(); return; }
  const st = itemStats(it);
  const gems = Object.keys(MAT).filter(g => MAT[g].cat === 'gemme' && (S.mats[g] || 0) > 0);
  const od = enchantOdds(it), left = enchantSlotsLeft(it);
  let ench;
  if (S.tools.table < 1) ench = `<div class="notice">Il vous faut une <b>table d’enchantement</b> (Atelier).</div>`;
  else if (left <= 0) ench = `<div class="notice">Aucun emplacement libre. ${st.sockets > T('table', 'slots') ? 'Une meilleure table d’enchantement en débloquerait d’autres.' : 'La qualité (Excellente +) et l’affinité magique du matériau donnent plus d’emplacements.'}</div>`;
  else ench = `<p class="small muted">Réussite : <b class="${chanceCol(od.p)}">${pct(od.p)}</b> · En cas d’échec : gemme perdue, ${pct(od.crack / (1 - od.p || 1))} de fêlure (−10 qualité), <b class="bad">${pct(od.destroy / (1 - od.p || 1))} de destruction</b>. Coût : 1 h.</p>
    <div class="slotpick">${gems.length ? gems.map(g => { const m = MAT[g], err = canEnchant(it, g); return `<button class="matbtn ${err ? 'off' : ''}" data-a="ench" data-id="${it.id}" data-v="${g}" data-tip="${esc(err || m.d)}"><span class="swatch" style="background:${m.col};border-radius:50%"></span><span><b>${m.n}</b><br><span class="small muted">${m.elem ? ELEM[m.elem].ico + ' ' + (st.kind === 'arme' ? 'Dégâts' : 'Rés.') + ' ' + ELEM[m.elem].n : SPECIAL[m.sp].n}</span></span><span class="q">×${S.mats[g]}</span></button>`; }).join('') : '<span class="dim">Aucune gemme en stock (marché : rubis, saphir, topaze…).</span>'}</div>`;
  const ro = reinfOdds(it), rerr = canReinf(it);
  openModal(`<div class="row"><h2 style="margin:0">✨ Améliorer</h2><span class="spacer"></span><button class="btn small ghost" data-a="close">✖</button></div>
    ${msg ? `<div class="notice ${msg.cls || ''}">${msg.t}</div>` : ''}
    <div class="card inset mt">${itemDetail(it)}</div>
    <div class="grid g2 mt"><div class="card flat"><h3>🔮 Enchantement</h3><p class="small muted">Ajoute une propriété élémentaire (dégâts pour une arme, résistance pour une armure) ou un pouvoir spécial. Augmente la rareté.</p>${ench}</div>
    <div class="card flat"><h3>⚙️ Renforcement +${ro.t}</h3><p class="small muted">+8 % de puissance par niveau. À +3 et +5, la rareté augmente.</p>
      <p>Réussite : <b class="${chanceCol(ro.p)}">${pct(ro.p)}</b><br><span class="small muted">Échec : ${ro.drop ? 'l’objet perd un niveau' : 'rien de perdu sauf l’or'}${ro.destroy ? `, <b class="bad">${pct(ro.destroy)} de briser l’objet</b>` : ''}.</span></p>
      <button class="btn primary" data-a="reinf" data-id="${it.id}" ${rerr ? 'disabled' : ''}>Renforcer (${fmt(ro.cost)} or · 1 h)</button>${rerr ? `<div class="small bad mt">${rerr}</div>` : ''}</div></div>`, { wide: true });
}

function viewVitrine() {
  const slots = T('vitrine', 'slots');
  const cells = [];
  for (let i = 0; i < slots; i++) {
    const sc = S.showcase[i];
    const it = sc && S.items.find(x => x.id === sc.id);
    if (!it) { cells.push(`<div class="card flat clickable center" data-a="addshow" style="min-height:180px;display:flex;align-items:center;justify-content:center;border-style:dashed"><div><div style="font-size:2rem">＋</div><div class="muted">Exposer un objet</div></div></div>`); continue; }
    const st = itemStats(it), ratio = sc.price / st.value;
    cells.push(`<div class="card rb-${st.rarity}" style="border-width:1px"><div class="item">${itemIcon(it)}<div class="info"><div class="name r-${st.rarity}">${itemName(it)}</div>
      <div class="meta">${qName(it.q)} · ${RECIPES[it.r].kind === 'arme' ? '⚔️' : '🛡️'} ${st.power} · valeur ${fmt(st.value)} or</div></div></div>
      <div class="mt"><div class="row"><b>Prix : <span id="pr-${it.id}">${fmt(sc.price)}</span> or</b><span class="spacer"></span><span class="small" id="rt-${it.id}">${Math.round(ratio * 100)} % de la valeur</span></div>
      <input type="range" min="40" max="250" step="5" value="${Math.round(ratio * 100)}" data-in="price" data-id="${it.id}">
      <div class="small">Chance de vente ce soir : <b id="ch-${it.id}" class="${chanceCol(saleChance(it, sc.price) * 1.6)}">${pct(saleChance(it, sc.price))}</b></div></div>
      <div class="row mt"><button class="btn small ghost" data-a="unshow" data-id="${it.id}">Retirer</button></div></div>`);
  }
  const tr = traffic();
  return `<div class="view-head"><h2>🛍️ La Vitrine</h2><span class="sub">${S.showcase.length}/${slots} emplacements · affluence ${tr >= .6 ? 'forte' : tr >= .4 ? 'moyenne' : 'faible'} (${Math.round(tr * 100)})</span></div>
    <div class="notice">Les passants achètent en fin de journée. <b>Plus le prix dépasse la valeur, moins il y a de chances de vendre.</b> À 80 % de la valeur ou moins, la vente est très probable. La réputation, la vitrine et les événements augmentent l’affluence.</div>
    <div class="grid gauto-s mt">${cells.join('')}</div>`;
}

function viewMarche() {
  const rank = rankOf(S.rep);

  const mods = S.market.mods.filter(m => m.until >= S.day);
  const rows = c => Object.keys(MAT).filter(id => MAT[id].cat === c && !MAT[id].loot).map(id => {

    const trend = p > base * 1.08 ? '<span class="trend-up">▲</span>' : p < base * .92 ? '<span class="trend-down">▼</span>' : '<span class="dim">=</span>';
    const why = !tierAllowed(m) ? `Rang « ${RANKS[clamp(m.tier - 2, 0, 4)].n} » requis` : 'Indisponible aujourd’hui';
    const props = c === 'gemme' ? (m.elem ? `${ELEM[m.elem].ico} ${ELEM[m.elem].n}` : SPECIAL[m.sp].d) :
      `pui. <b>${m.pow}</b> · poids ${m.wt} · magie ${Math.round(m.mag * 100)} %${m.elem ? ' · ' + ELEM[m.elem].ico + ' ' + ELEM[m.elem].n : ''}${m.cat === 'metal' ? ` · forge ${m.forge}` : ''}${m.sol ? ` · ${m.sol > 0 ? '+' : ''}${m.sol} ❤️` : ''}`;

      <td class="small">${props}</td><td class="num">${av ? `<b>${p}</b> ${trend}` : '—'}</td><td class="num">${S.mats[id] || 0}</td>
      <td style="white-space:nowrap">${av ? `<button class="btn small" data-a="buy" data-v="${id}" data-n="1" ${S.gold >= p ? '' : 'disabled'}>+1</button> <button class="btn small" data-a="buy" data-v="${id}" data-n="5" ${S.gold >= p * 5 ? '' : 'disabled'}>+5</button>` : `<span class="small">${why}</span>`}
      ${(S.mats[id] || 0) > 0 ? ` <button class="btn small ghost" data-a="sell" data-v="${id}" data-tip="Revendre 1 pour ${Math.floor(p * .5)} or">−1</button>` : ''}</td></tr>`;
  }).join('');
  const cp = coalPrice();
  return `<div class="view-head"><h2>⚖️ Le Marché</h2><span class="sub">Les prix changent chaque jour. Matériaux rares accessibles avec la réputation.</span></div>
    ${mods.length ? `<div class="notice">${mods.map(md => `${MAT[md.mat].n} : ${md.f > 1 ? '<b class="bad">+' + Math.round((md.f - 1) * 100) + ' %</b>' : '<b class="good">−' + Math.round((1 - md.f) * 100) + ' %</b>'} ${md.until > S.day ? `jusqu’au jour ${md.until}` : 'aujourd’hui'}`).join(' · ')}</div>` : ''}
    <div class="card mb"><div class="row"><b>⚫ Charbon</b><span class="muted">${cp} or l’unité · stock : ${S.coal}</span><span class="spacer"></span>
      ${[5, 10, 20].map(n => `<button class="btn small" data-a="coal" data-n="${n}" ${S.gold >= cp * n ? '' : 'disabled'}>+${n} (${cp * n} or)</button>`).join(' ')}</div></div>
    ${cats.map(c => `<div class="card mb"><h3>${CAT_N[c]}</h3><div style="overflow-x:auto"><table class="t"><thead><tr><th>Matériau</th><th>Propriétés</th><th class="num">Prix</th><th class="num">Stock</th><th></th></tr></thead><tbody>${rows(c)}</tbody></table></div></div>`).join('')}
    <p class="small dim">Rang actuel : ${RANKS[rank].n}. Les matériaux de tier ${3 + rank} et plus nécessitent une meilleure réputation (sauf caravane). Certains trésors (écailles de dragon, fer météorique…) ne s’obtiennent qu’en butin de quête.</p>`;
}

function toolEffect(id, l) {
  const t = TOOLS[id];
  switch (id) {
    case 'forge': return `${t.heat[l]}° max · perte de chaleur ×${t.keep[l]} · métaux de niv. ${l}`;
    case 'marteau': return `qualité ×${t.power[l]} · coup parfait ${pct(t.crit[l])}`;
    case 'enclume': return `fissures −${pct(t.flaw[l])} · +${t.hearts[l]} ❤️ · grands plans niv. ${l}`;
    case 'meule': return `renforcement max +${t.maxr[l]} · réussite +${pct(t.bonus[l])}`;
    case 'table': return l ? `${t.slots[l]} enchantement${t.slots[l] > 1 ? 's' : ''} max · réussite +${pct(t.bonus[l])}` : 'non construite';
    case 'etabli': return `bois/cuir/tissu : +${t.q[l]} qualité de départ · gestes ×${TOOLS.marteau.power[Math.max(1, l)]}`;
    case 'vitrine': return `${t.slots[l]} emplacements · affluence +${pct(t.attract[l])}${l >= 3 ? ' · serrures anti-vol' : ''}`;
    case 'apprenti': return l ? `+${t.hours[l]} h/jour · production rapide +${t.auto[l]} qualité` : 'aucun apprenti';
  }
}
function viewAtelier() {

      <p class="small muted">${t.d}</p><div class="small">Actuel : <b>${toolEffect(id, l)}</b></div>
      ${c != null ? `<div class="small good">Niveau ${l + 1} : ${toolEffect(id, l + 1)}</div><button class="btn ${S.gold >= c ? 'primary' : ''} mt" style="width:100%" data-a="tool" data-v="${id}" ${S.gold >= c ? '' : 'disabled'}>Améliorer — ${fmt(c)} or</button>` : '<div class="pill gold mt">Niveau maximal</div>'}</div>`;

      <h4 class="mt">Dîmes de la Guilde</h4><div class="kv">${Object.keys(DUES).map(d => `<span>Jour ${d}</span><span>${fmt(DUES[d])} or ${+d < S.day ? '✔' : ''}</span>`).join('')}</div></div></div>`;
