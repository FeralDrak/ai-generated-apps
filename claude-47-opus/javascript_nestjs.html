<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NestJS Mastery — Prep entretien fullstack</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg-elev: #14141d;
    --bg-elev-2: #1c1c28;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --text-dim: #9090a8;
    --accent: #e0234e;
    --accent-glow: #ff4070;
    --accent-soft: rgba(224, 35, 78, 0.15);
    --ok: #4ade80;
    --warn: #fbbf24;
    --info: #60a5fa;
    --code-bg: #0d0d14;
    --keyword: #ff7ab6;
    --string: #a5e075;
    --comment: #6a6a7e;
    --type: #7dd3fc;
    --func: #fbbf24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(at 20% 0%, rgba(224, 35, 78, 0.08) 0px, transparent 50%),
      radial-gradient(at 80% 100%, rgba(96, 165, 250, 0.06) 0px, transparent 50%);
  }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    padding: 24px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .logo {
    padding: 0 24px 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .logo h1 {
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-glow) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .logo p { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  .nav { list-style: none; }
  .nav-section {
    padding: 12px 24px 6px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    font-weight: 700;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dim);
    border-left: 3px solid transparent;
    transition: all 0.15s;
  }
  .nav-item:hover { background: var(--bg-elev-2); color: var(--text); }
  .nav-item.active {
    background: var(--accent-soft);
    color: var(--text);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .nav-item .check {
    margin-left: auto;
    font-size: 12px;
    color: var(--ok);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .nav-item.completed .check { opacity: 1; }

  .progress-bar {
    margin: 16px 24px;
    height: 6px;
    background: var(--bg-elev-2);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-glow));
    width: 0%;
    transition: width 0.4s;
  }
  .progress-text {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: -8px;
    margin-bottom: 8px;
  }

  /* Main */
  .main { padding: 40px 56px; max-width: 1100px; }

  .breadcrumb {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  h2.lesson-title {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 8px;
    line-height: 1.1;
  }
  .lesson-subtitle {
    color: var(--text-dim);
    font-size: 16px;
    margin-bottom: 32px;
  }

  .content-block {
    margin-bottom: 24px;
    line-height: 1.7;
    color: #c8c8d8;
    font-size: 15px;
  }
  .content-block h3 {
    color: var(--text);
    font-size: 20px;
    margin: 28px 0 12px;
    font-weight: 700;
  }
  .content-block h4 {
    color: var(--text);
    font-size: 16px;
    margin: 20px 0 8px;
    font-weight: 600;
  }
  .content-block p { margin-bottom: 12px; }
  .content-block ul, .content-block ol { margin: 12px 0 12px 24px; }
  .content-block li { margin-bottom: 6px; }
  .content-block strong { color: var(--text); }
  .content-block code:not(pre code) {
    background: var(--bg-elev-2);
    color: var(--accent-glow);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
  }

  /* Code blocks */
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    overflow-x: auto;
    margin: 16px 0;
    font-family: 'Fira Code', 'Consolas', monospace;
    font-size: 13.5px;
    line-height: 1.6;
    position: relative;
  }
  pre .lang-tag {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .kw { color: var(--keyword); }
  .str { color: var(--string); }
  .cm { color: var(--comment); font-style: italic; }
  .ty { color: var(--type); }
  .fn { color: var(--func); }
  .dec { color: var(--accent-glow); }

  /* Callouts */
  .callout {
    border-left: 4px solid var(--info);
    background: rgba(96, 165, 250, 0.08);
    padding: 14px 18px;
    border-radius: 0 8px 8px 0;
    margin: 16px 0;
    font-size: 14px;
  }
  .callout.tip { border-color: var(--ok); background: rgba(74, 222, 128, 0.08); }
  .callout.warn { border-color: var(--warn); background: rgba(251, 191, 36, 0.08); }
  .callout.interview { border-color: var(--accent); background: var(--accent-soft); }
  .callout-title {
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .callout.tip .callout-title { color: var(--ok); }
  .callout.warn .callout-title { color: var(--warn); }
  .callout.interview .callout-title { color: var(--accent-glow); }
  .callout .callout-title { color: var(--info); }

  /* Comparison table */
  .compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin: 20px 0;
  }
  .compare-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .compare-card h4 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .compare-card.nest h4 { color: var(--accent-glow); }
  .compare-card ul { margin: 0; padding-left: 18px; }

  /* Quiz */
  .quiz {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-top: 32px;
  }
  .quiz h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
    margin-bottom: 18px;
  }
  .quiz-question { margin-bottom: 16px; font-size: 15px; }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .quiz-option {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    text-align: left;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.15s;
  }
  .quiz-option:hover:not(:disabled) {
    background: var(--bg-elev);
    border-color: var(--accent);
  }
  .quiz-option:disabled { cursor: default; }
  .quiz-option.correct {
    background: rgba(74, 222, 128, 0.15);
    border-color: var(--ok);
    color: var(--ok);
  }
  .quiz-option.wrong {
    background: rgba(239, 68, 68, 0.15);
    border-color: #ef4444;
    color: #fca5a5;
  }
  .quiz-feedback {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  .quiz-feedback.show { display: block; }
  .quiz-feedback.ok { background: rgba(74, 222, 128, 0.1); border-left: 3px solid var(--ok); }
  .quiz-feedback.ko { background: rgba(239, 68, 68, 0.1); border-left: 3px solid #ef4444; }

  /* Footer nav */
  .footer-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .btn {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn:hover { background: var(--bg-elev-2); border-color: var(--accent); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-glow));
    border-color: var(--accent);
  }
  .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(224, 35, 78, 0.3); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Architecture diagram */
  .diagram {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin: 20px 0;
    text-align: center;
  }
  .diagram-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 12px 0;
    flex-wrap: wrap;
  }
  .diagram-box {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 13px;
    font-weight: 600;
    min-width: 140px;
    transition: all 0.2s;
  }
  .diagram-box.controller { border-color: var(--info); color: var(--info); }
  .diagram-box.service { border-color: var(--ok); color: var(--ok); }
  .diagram-box.module { border-color: var(--accent); color: var(--accent-glow); }
  .diagram-box.guard, .diagram-box.pipe, .diagram-box.intercept { border-color: var(--warn); color: var(--warn); }
  .diagram-arrow { font-size: 20px; color: var(--text-dim); align-self: center; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin: 20px 0 0;
  }
  .tab {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 10px 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active { color: var(--accent-glow); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Final screen */
  .completion {
    text-align: center;
    padding: 60px 20px;
  }
  .completion-icon {
    font-size: 72px;
    margin-bottom: 24px;
  }
  .completion h2 {
    font-size: 32px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-glow));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; }
    .main { padding: 24px; }
    .compare { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <h1>🦁 NestJS Mastery</h1>
      <p>Prep entretien fullstack</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 0 leçons</div>
    <ul class="nav" id="nav"></ul>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
/* ============================================================
   CONTENU PÉDAGOGIQUE — NestJS pour dev fullstack React/Node
   ============================================================ */

const lessons = [
  {
    section: "Fondations",
    id: "intro",
    icon: "🎯",
    title: "NestJS, c'est quoi vraiment ?",
    subtitle: "Pourquoi un framework Node opinionated existe, et qu'est-ce qu'il t'apporte par rapport à Express pur.",
    content: `
      <div class="content-block">
        <p>Tu fais déjà du Node.js avec Express ou Fastify. <strong>NestJS</strong> est un framework qui s'appuie <em>justement</em> sur Express (par défaut) ou Fastify dessous. Mais il ajoute une couche d'architecture inspirée d'Angular et du backend Java/Spring : <strong>modules, injection de dépendances, décorateurs</strong>.</p>

        <h3>Les 3 piliers à retenir</h3>
        <ul>
          <li><strong>TypeScript first</strong> — les décorateurs et les types sont au cœur du framework.</li>
          <li><strong>Architecture modulaire</strong> — l'app est un arbre de modules, chacun encapsule une feature.</li>
          <li><strong>Dependency Injection (DI)</strong> — tu ne fais jamais <code>new MonService()</code>, Nest l'injecte pour toi.</li>
        </ul>

        <div class="compare">
          <div class="compare-card">
            <h4>Express pur</h4>
            <ul>
              <li>Tu structures comme tu veux</li>
              <li>Tu choisis ton ORM, validation, etc.</li>
              <li>Flexible mais inégal entre projets</li>
              <li>Pas de DI native</li>
            </ul>
          </div>
          <div class="compare-card nest">
            <h4>NestJS</h4>
            <ul>
              <li>Convention forte (controllers/services/modules)</li>
              <li>Intégrations officielles (TypeORM, Mongoose, GraphQL, Swagger…)</li>
              <li>Code uniforme, scalable</li>
              <li>DI, guards, pipes, interceptors out of the box</li>
            </ul>
          </div>
        </div>

        <div class="callout interview">
          <div class="callout-title">💼 Entretien</div>
          Si on te demande "pourquoi NestJS plutôt qu'Express ?", la réponse attendue : <em>"architecture opinionated qui force de bonnes pratiques sur des projets d'équipe — DI, séparation des responsabilités, testabilité élevée — au prix d'une courbe d'apprentissage et de plus de boilerplate."</em>
        </div>

        <h3>Installation rapide</h3>
        <pre><span class="lang-tag">bash</span><span class="cm"># Installation du CLI</span>
npm i -g @nestjs/cli

<span class="cm"># Création d'un projet</span>
nest new my-app

<span class="cm"># Générer une ressource complète (controller + service + module + DTO)</span>
nest g resource users</pre>
      </div>
    `,
    quiz: {
      question: "Quelle affirmation décrit le mieux NestJS ?",
      options: [
        "Un remplaçant de Node.js qui exécute du TypeScript nativement",
        "Un framework opinionated bâti au-dessus d'Express/Fastify avec DI et architecture modulaire",
        "Un ORM compatible avec PostgreSQL et MongoDB",
        "Une alternative à React côté backend"
      ],
      correct: 1,
      explain: "NestJS n'exécute pas le code lui-même — il s'appuie sur Express (par défaut) ou Fastify. Sa valeur ajoutée, c'est l'architecture imposée."
    }
  },

  {
    section: "Fondations",
    id: "architecture",
    icon: "🏗️",
    title: "L'architecture en couches",
    subtitle: "Module → Controller → Service. Le pattern central que tu reverras dans 100% des projets Nest.",
    content: `
      <div class="content-block">
        <p>Chaque feature dans NestJS suit la même triple structure. C'est <strong>la</strong> chose à comprendre.</p>

        <div class="diagram">
          <div class="diagram-row">
            <div class="diagram-box module">UsersModule</div>
          </div>
          <div style="color: var(--text-dim); font-size: 12px;">déclare et expose</div>
          <div class="diagram-row">
            <div class="diagram-box controller">UsersController</div>
            <div class="diagram-arrow">→</div>
            <div class="diagram-box service">UsersService</div>
            <div class="diagram-arrow">→</div>
            <div class="diagram-box" style="border-color: var(--text-dim); color: var(--text-dim);">DB / API</div>
          </div>
          <div style="margin-top: 12px; color: var(--text-dim); font-size: 12px;">
            Controller = routes HTTP &nbsp;·&nbsp; Service = logique métier &nbsp;·&nbsp; Module = colle DI
          </div>
        </div>

        <h3>Exemple complet : feature "users"</h3>

        <h4>1️⃣ Le Controller — reçoit les requêtes HTTP</h4>
        <pre><span class="lang-tag">users.controller.ts</span><span class="kw">import</span> { Controller, Get, Post, Body, Param } <span class="kw">from</span> <span class="str">'@nestjs/common'</span>;
<span class="kw">import</span> { UsersService } <span class="kw">from</span> <span class="str">'./users.service'</span>;

<span class="dec">@Controller</span>(<span class="str">'users'</span>) <span class="cm">// préfixe la route : /users</span>
<span class="kw">export class</span> <span class="ty">UsersController</span> {
  <span class="kw">constructor</span>(<span class="kw">private readonly</span> usersService: <span class="ty">UsersService</span>) {}

  <span class="dec">@Get</span>()
  <span class="fn">findAll</span>() {
    <span class="kw">return</span> <span class="kw">this</span>.usersService.<span class="fn">findAll</span>();
  }

  <span class="dec">@Get</span>(<span class="str">':id'</span>)
  <span class="fn">findOne</span>(<span class="dec">@Param</span>(<span class="str">'id'</span>) id: <span class="ty">string</span>) {
    <span class="kw">return</span> <span class="kw">this</span>.usersService.<span class="fn">findOne</span>(id);
  }

  <span class="dec">@Post</span>()
  <span class="fn">create</span>(<span class="dec">@Body</span>() dto: CreateUserDto) {
    <span class="kw">return</span> <span class="kw">this</span>.usersService.<span class="fn">create</span>(dto);
  }
}</pre>

        <h4>2️⃣ Le Service — la logique métier (injectable)</h4>
        <pre><span class="lang-tag">users.service.ts</span><span class="kw">import</span> { Injectable } <span class="kw">from</span> <span class="str">'@nestjs/common'</span>;

<span class="dec">@Injectable</span>()
<span class="kw">export class</span> <span class="ty">UsersService</span> {
  <span class="kw">private</span> users = [];

  <span class="fn">findAll</span>() { <span class="kw">return</span> <span class="kw">this</span>.users; }
  <span class="fn">findOne</span>(id: <span class="ty">string</span>) { <span class="kw">return</span> <span class="kw">this</span>.users.<span class="fn">find</span>(u => u.id === id); }
  <span class="fn">create</span>(dto: CreateUserDto) {
    <span class="kw">const</span> user = { id: crypto.<span class="fn">randomUUID</span>(), ...dto };
    <span class="kw">this</span>.users.<span class="fn">push</span>(user);
    <span class="kw">return</span> user;
  }
}</pre>

        <h4>3️⃣ Le Module — assemble le tout</h4>
        <pre><span class="lang-tag">users.module.ts</span><span class="kw">import</span> { Module } <span class="kw">from</span> <span class="str">'@nestjs/common'</span>;
<span class="kw">import</span> { UsersController } <span class="kw">from</span> <span class="str">'./users.controller'</span>;
<span class="kw">import</span> { UsersService } <span class="kw">from</span> <span class="str">'./users.service'</span>;

<span class="dec">@Module</span>({
  controllers: [UsersController],
  providers: [UsersService],     <span class="cm">// instances injectables dans ce module</span>
  exports: [UsersService],        <span class="cm">// rend dispo dans d'autres modules qui importent celui-ci</span>
})
<span class="kw">export class</span> <span class="ty">UsersModule</span> {}</pre>

        <div class="callout tip">
          <div class="callout-title">💡 Mental model</div>
          Le <strong>controller</strong> ne devrait <em>jamais</em> contenir de logique métier — juste valider/router. Toute la logique vit dans les <strong>services</strong>. C'est le test ultime de qualité Nest.
        </div>
      </div>
    `,
    quiz: {
      question: "Où devrait vivre la logique métier (calculs, règles, accès DB) ?",
      options: [
        "Dans le Controller, pour avoir tout au même endroit",
        "Dans le Module, dans la propriété providers",
        "Dans un Service injecté dans le Controller",
        "Dans un Middleware Express classique"
      ],
      correct: 2,
      explain: "Le Controller ne fait que recevoir/valider/déléguer. Le Service contient la logique et est testable indépendamment."
    }
  },

  {
    section: "Fondations",
    id: "di",
    icon: "💉",
    title: "Dependency Injection",
    subtitle: "Le mécanisme magique derrière `private readonly service: Service` dans les constructeurs.",
    content: `
      <div class="content-block">
        <p>Tu n'instancies jamais tes services avec <code>new</code>. Tu déclares ta dépendance dans le constructeur, et Nest l'injecte automatiquement. Ce conteneur IoC (Inversion of Control) est <strong>le cœur</strong> de Nest.</p>

        <h3>Pourquoi c'est puissant</h3>
        <ul>
          <li><strong>Singleton par défaut</strong> — une seule instance partagée dans toute l'app.</li>
          <li><strong>Testable</strong> — tu mockes les dépendances facilement dans les tests unitaires.</li>
          <li><strong>Découplé</strong> — tu codes contre une interface, pas une implémentation concrète.</li>
        </ul>

        <h3>Comment ça marche</h3>

<span class="kw">export class</span> <span class="ty">JwtAuthGuard</span> <span class="kw">implements</span> <span class="ty">CanActivate</span> {
  <span class="kw">constructor</span>(<span class="kw">private</span> jwt: <span class="ty">JwtService</span>) {}

  <span class="kw">async</span> <span class="fn">canActivate</span>(ctx: <span class="ty">ExecutionContext</span>): <span class="ty">Promise</span>&lt;<span class="ty">boolean</span>&gt; {
    <span class="kw">const</span> req = ctx.<span class="fn">switchToHttp</span>().<span class="fn">getRequest</span>();
    <span class="kw">const</span> token = req.headers.authorization?.<span class="fn">replace</span>(<span class="str">'Bearer '</span>, <span class="str">''</span>);
    <span class="kw">if</span> (!token) <span class="kw">throw new</span> <span class="ty">UnauthorizedException</span>();

    <span class="kw">try</span> {
      req.user = <span class="kw">await this</span>.jwt.<span class="fn">verifyAsync</span>(token);
      <span class="kw">return</span> <span class="kw">true</span>;
    } <span class="kw">catch</span> {
      <span class="kw">throw new</span> <span class="ty">UnauthorizedException</span>();
    }
  }
}</pre>

  <span class="kw">constructor</span>(<span class="kw">private</span> reflector: <span class="ty">Reflector</span>) {}

    <span class="kw">const</span> required = <span class="kw">this</span>.reflector.<span class="fn">get</span>&lt;<span class="ty">string</span>[]&gt;(<span class="str">'roles'</span>, ctx.<span class="fn">getHandler</span>());

const state = {
  current: 0,
  completed: new Set(JSON.parse(localStorage.getItem('nestjs-completed') || '[]')),
  answered: new Set(JSON.parse(localStorage.getItem('nestjs-answered') || '[]')),
};

function saveState() {
  localStorage.setItem('nestjs-completed', JSON.stringify([...state.completed]));
  localStorage.setItem('nestjs-answered', JSON.stringify([...state.answered]));
}

function renderNav() {
  const nav = document.getElementById('nav');
  let html = '';
  let currentSection = null;
  lessons.forEach((l, i) => {
    if (l.section !== currentSection) {
      currentSection = l.section;
      html += `<li class="nav-section">${currentSection}</li>`;
    }
    const active = i === state.current ? 'active' : '';
    const completed = state.completed.has(l.id) ? 'completed' : '';
    html += `<li class="nav-item ${active} ${completed}" data-i="${i}">
      <span>${l.icon}</span><span>${l.title}</span><span class="check">✓</span>
    </li>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => goTo(parseInt(el.dataset.i)));
  });

  const pct = (state.completed.size / lessons.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${state.completed.size} / ${lessons.length} leçons`;
}

function renderMain() {
  if (state.current >= lessons.length) {
    renderCompletion();
    return;
  }
  const l = lessons[state.current];
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="breadcrumb">${l.section} · Leçon ${state.current + 1} / ${lessons.length}</div>
    <h2 class="lesson-title">${l.icon} ${l.title}</h2>
    <p class="lesson-subtitle">${l.subtitle}</p>
    ${l.content}
    <div class="quiz">
      <h3>🎯 Quick check</h3>
      <div class="quiz-question">${l.quiz.question}</div>
      <div class="quiz-options" id="quizOptions">
        ${l.quiz.options.map((opt, i) => `
          <button class="quiz-option" data-i="${i}">${String.fromCharCode(65 + i)}. ${opt}</button>
        `).join('')}
      </div>
      <div class="quiz-feedback" id="quizFeedback"></div>
    </div>
    <div class="footer-nav">
      <button class="btn" id="prevBtn" ${state.current === 0 ? 'disabled' : ''}>← Précédent</button>
      <button class="btn primary" id="nextBtn">${state.current === lessons.length - 1 ? 'Terminer 🎓' : 'Suivant →'}</button>
    </div>
  `;

  main.querySelectorAll('.quiz-option').forEach(btn => {
    btn.addEventListener('click', () => onAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('prevBtn').addEventListener('click', () => goTo(state.current - 1));
  document.getElementById('nextBtn').addEventListener('click', () => {
    state.completed.add(l.id);
    saveState();
    goTo(state.current + 1);
  });

  if (state.answered.has(l.id)) {
    document.querySelectorAll('.quiz-option').forEach((b, i) => {
      b.disabled = true;
      if (i === l.quiz.correct) b.classList.add('correct');
    });
  }

  main.scrollIntoView({ behavior: 'smooth', block: 'start' });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function onAnswer(choice) {
  const l = lessons[state.current];
  const fb = document.getElementById('quizFeedback');
  const buttons = document.querySelectorAll('.quiz-option');
  buttons.forEach(b => b.disabled = true);

  if (choice === l.quiz.correct) {
    buttons[choice].classList.add('correct');
    fb.className = 'quiz-feedback show ok';
    fb.innerHTML = `<strong>✓ Exact !</strong> ${l.quiz.explain}`;
  } else {
    buttons[choice].classList.add('wrong');
    buttons[l.quiz.correct].classList.add('correct');
    fb.className = 'quiz-feedback show ko';
    fb.innerHTML = `<strong>✗ Pas tout à fait.</strong> ${l.quiz.explain}`;
  }
  state.answered.add(l.id);
  state.completed.add(l.id);
  saveState();
  renderNav();
}

function goTo(i) {
  if (i < 0) return;
  state.current = i;
  renderNav();
  renderMain();
}

function renderCompletion() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="completion">
      <div class="completion-icon">🎓</div>
      <h2>Bravo, prep terminée !</h2>
      <p class="lesson-subtitle">Tu as parcouru les ${lessons.length} chapitres essentiels de NestJS.</p>
      <div style="max-width: 600px; margin: 32px auto; text-align: left;">
        <div class="callout interview">
          <div class="callout-title">💼 Récap entretien</div>
          Le mental model à retenir : <strong>Nest = TypeScript + DI + architecture modulaire + décorateurs</strong>. La force du framework, c'est la cohérence : peu importe la feature (HTTP, GraphQL, WebSocket, microservice), tu retrouves le triptyque <em>Module / Controller-Resolver-Gateway / Service</em>.
        </div>
        <div class="callout tip">
          <div class="callout-title">🚀 Pour aller plus loin</div>
          Construis un mini-projet : API CRUD avec auth JWT + role-based access. Couvre 80% des questions d'entretien. Si tu veux te démarquer : ajoute Swagger + un test e2e.
        </div>
      </div>
      <button class="btn primary" onclick="goTo(0)">Recommencer 🔄</button>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderNav();
renderMain();
</script>
</body>
</html>
