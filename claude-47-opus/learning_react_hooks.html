<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>React Mastery — Hooks, State & Components</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #0a0e1a;
    --bg-2: #0d1220;
    --card: #141a2e;
    --card-hover: #1a2138;
    --elevated: #1d2540;
    --border: #232b46;
    --border-strong: #303a5e;
    --text: #e8ecf5;
    --text-muted: #8893b3;
    --text-dim: #525d7e;

    --react: #61dafb;
    --react-soft: rgba(97, 218, 251, .14);
    --react-glow: rgba(97, 218, 251, .35);
    --purple: #a78bfa;
    --purple-soft: rgba(167, 139, 250, .15);
    --pink: #f0abfc;
    --green: #34d399;
    --green-soft: rgba(52, 211, 153, .15);
    --gold: #fbbf24;
    --gold-soft: rgba(251, 191, 36, .15);
    --rose: #fb7185;
    --rose-soft: rgba(251, 113, 133, .15);
    --orange: #fb923c;

    --radius: 18px;
    --radius-sm: 12px;
    --radius-xs: 8px;
    --shadow: 0 4px 24px rgba(0, 0, 0, .45);
    --shadow-lg: 0 18px 60px rgba(0, 0, 0, .55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(900px 600px at 12% 8%, rgba(97, 218, 251, .07), transparent 60%),
      radial-gradient(700px 500px at 88% 18%, rgba(167, 139, 250, .06), transparent 60%),
      radial-gradient(800px 600px at 50% 100%, rgba(240, 171, 252, .04), transparent 60%);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; }
  code, pre { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #4a567c; }

  /* ───────── HEADER ───────── */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10, 14, 26, .8);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1400px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 70px; padding: 0 28px; gap: 20px;
  }
  .brand {
    display: flex; align-items: center; gap: 14px; user-select: none;
  }
  .brand-logo {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--react) 0%, var(--purple) 100%);
    display: grid; place-items: center;
    box-shadow: 0 6px 22px var(--react-glow), inset 0 0 0 1px rgba(255, 255, 255, .12);
    position: relative; overflow: hidden;
  }
  .brand-logo svg { width: 28px; height: 28px; color: var(--bg); }
  .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
  .brand-name { font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
  .brand-sub { font-size: 11px; color: var(--text-muted); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }

  .header-actions { display: flex; align-items: center; gap: 16px; }
  .progress-pill {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 99px;
    font-size: 13px; color: var(--text-muted); font-weight: 500;
  }
  .progress-pill .progress-bar {
    width: 100px; height: 6px;
    background: var(--bg-2); border-radius: 99px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-pill .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--react), var(--purple));
    border-radius: 99px;
    transition: width .35s ease;
  }
  .progress-pill strong { color: var(--text); font-weight: 700; }

  .reset-btn {
    padding: 8px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-muted);
    font-size: 12px; font-weight: 500;
    transition: all .2s ease;
  }
  .reset-btn:hover { color: var(--rose); border-color: var(--rose); background: var(--rose-soft); }

  /* ───────── LAYOUT ───────── */
  .layout {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px 28px 80px;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 36px;
    position: relative; z-index: 1;
  }
  .sidebar {
    position: sticky; top: 102px;
    height: calc(100vh - 130px);
    overflow-y: auto;
    padding-right: 4px;
  }
  .chapter-group { margin-bottom: 24px; }
  .chapter-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin: 0 12px 10px;
  }
  .chapter-title .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chapter-hooks .dot { background: var(--react); box-shadow: 0 0 8px var(--react-glow); }
  .chapter-state .dot { background: var(--purple); box-shadow: 0 0 8px rgba(167, 139, 250, .6); }
  .chapter-design .dot { background: var(--pink); box-shadow: 0 0 8px rgba(240, 171, 252, .6); }
  .chapter-extras .dot { background: var(--gold); box-shadow: 0 0 8px rgba(251, 191, 36, .5); }

  .lesson-link {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 9px 12px;
    border-radius: var(--radius-xs);
    font-size: 14px; font-weight: 500;
    color: var(--text-muted);
    text-align: left;
    transition: all .15s ease;
    margin-bottom: 1px;
    border-left: 2px solid transparent;
  }
  .lesson-link:hover { color: var(--text); background: var(--card); }
  .lesson-link.active {
    color: var(--text);
    background: var(--card);
    border-left-color: var(--react);
    font-weight: 600;
  }
  .lesson-link .check {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    display: grid; place-items: center;
    flex-shrink: 0;
    transition: all .2s ease;
  }
  .lesson-link.done .check {
    background: var(--green);
    border-color: var(--green);
  }
  .lesson-link.done .check svg { width: 10px; height: 10px; color: var(--bg); }
  .lesson-link.active.done .check { box-shadow: 0 0 0 3px var(--green-soft); }
  .lesson-link .num {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--bg-2);
    font-size: 11px; font-weight: 700;
    display: grid; place-items: center;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .lesson-link.active .num {
    background: var(--react-soft); color: var(--react);
  }

  /* ───────── MAIN CONTENT ───────── */
  .main { min-width: 0; }

  .lesson-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 24px; margin-bottom: 28px;
  }
  .lesson-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px;
    border-radius: 99px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .badge-hooks { background: var(--react-soft); color: var(--react); border: 1px solid rgba(97, 218, 251, .25); }
  .badge-state { background: var(--purple-soft); color: var(--purple); border: 1px solid rgba(167, 139, 250, .25); }
  .badge-design { background: rgba(240, 171, 252, .15); color: var(--pink); border: 1px solid rgba(240, 171, 252, .25); }
  .badge-extras { background: var(--gold-soft); color: var(--gold); border: 1px solid rgba(251, 191, 36, .25); }
  .lesson-num {
    color: var(--text-dim); font-size: 13px; font-weight: 600;
  }
  .lesson-title {
    font-size: 38px; font-weight: 800; letter-spacing: -.025em;
    line-height: 1.1;
    background: linear-gradient(180deg, #fff 0%, #b8c4e0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lesson-subtitle {
    margin-top: 10px;
    font-size: 17px; color: var(--text-muted);
    max-width: 720px;
  }

  .nav-buttons { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .nav-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    display: grid; place-items: center;
    color: var(--text-muted);
    transition: all .15s ease;
  }
  .nav-btn:hover:not(:disabled) {
    background: var(--card-hover); color: var(--text);
    border-color: var(--border-strong);
  }
  .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
  .nav-btn svg { width: 18px; height: 18px; }

  /* ───────── SECTIONS ───────── */
  .section { margin-bottom: 28px; }
  .section-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 14px;
  }
  .section-title .icon-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--react);
  }

  .prose { font-size: 16px; color: var(--text); line-height: 1.7; }
  .prose p { margin-bottom: 14px; }
  .prose strong { color: var(--text); font-weight: 700; }
  .prose code {
    background: var(--bg-2);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 13.5px;
    color: var(--react);
    border: 1px solid var(--border);
  }
  .prose ul { margin: 8px 0 14px 0; padding-left: 22px; }
  .prose li { margin-bottom: 6px; color: var(--text); }
  .prose li::marker { color: var(--react); }

  /* ───────── CARDS ───────── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
  }
  .card-elevated {
    background: linear-gradient(180deg, var(--card) 0%, var(--bg-2) 100%);
    box-shadow: var(--shadow);
  }

  /* ───────── CODE BLOCK ───────── */
  .code-block {
    position: relative;
    background: #0b0f1d;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .code-block-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, .015);
  }
  .code-dots { display: flex; gap: 6px; }
  .code-dot { width: 11px; height: 11px; border-radius: 50%; }
  .code-dot:nth-child(1) { background: #ff5f57; }
  .code-dot:nth-child(2) { background: #ffbd2e; }
  .code-dot:nth-child(3) { background: #28c93f; }
  .code-filename {
    font-size: 12px; color: var(--text-muted); font-weight: 500;
    font-family: 'JetBrains Mono', monospace;
  }
  .code-copy {
    padding: 4px 10px;
    border-radius: 6px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 11px; font-weight: 600;
    transition: all .15s ease;
  }
  .code-copy:hover { color: var(--text); background: var(--card); border-color: var(--border-strong); }
  .code-copy.copied { color: var(--green); border-color: var(--green); }
  .code-block pre {
    padding: 18px 20px;
    overflow-x: auto;
    font-size: 13.5px;
    line-height: 1.6;
    color: #d4d8e8;
  }
  .hl-keyword { color: #c084fc; }
  .hl-react { color: #61dafb; font-weight: 500; }
  .hl-string { color: #a3e635; }
  .hl-number { color: #fb923c; }
  .hl-comment { color: #525d7e; font-style: italic; }
  .hl-jsx-tag { color: #f0abfc; }
  .hl-jsx-attr { color: #fbbf24; }
  .hl-fn { color: #60a5fa; }

  /* ───────── DEMO ZONE ───────── */
  .demo {
    background: linear-gradient(180deg, #11172a 0%, #0d1220 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    position: relative;
    overflow: hidden;
  }
  .demo::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(400px 200px at 80% 20%, rgba(97, 218, 251, .06), transparent 60%),
      radial-gradient(300px 200px at 20% 80%, rgba(167, 139, 250, .05), transparent 60%);
    pointer-events: none;
  }
  .demo-label {
    position: absolute; top: 14px; right: 16px;
    font-size: 10px; font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .1em;
    display: flex; align-items: center; gap: 6px;
  }
  .demo-label::before {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  .demo-content { position: relative; z-index: 1; }

  /* ───────── CALLOUT ───────── */
  .callout {
    display: flex; gap: 14px;
    padding: 18px 20px;
    border-radius: var(--radius-sm);
    border: 1px solid;
    background: var(--card);
  }
  .callout-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .callout-icon svg { width: 18px; height: 18px; }
  .callout-content { flex: 1; min-width: 0; }
  .callout-title {
    font-size: 13px; font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-bottom: 6px;
  }
  .callout-text { font-size: 14.5px; color: var(--text); line-height: 1.6; }
  .callout-text code {
    background: var(--bg-2); padding: 1px 6px; border-radius: 4px;
    font-size: 12.5px; color: var(--react);
  }
  .callout-interview {
    border-color: rgba(251, 191, 36, .25);
    background: linear-gradient(180deg, rgba(251, 191, 36, .06), transparent);
  }
  .callout-interview .callout-icon { background: var(--gold-soft); color: var(--gold); }
  .callout-interview .callout-title { color: var(--gold); }

  .callout-warn {
    border-color: rgba(251, 113, 133, .25);
    background: linear-gradient(180deg, rgba(251, 113, 133, .05), transparent);
  }
  .callout-warn .callout-icon { background: var(--rose-soft); color: var(--rose); }
  .callout-warn .callout-title { color: var(--rose); }

  .callout-tip {
    border-color: rgba(52, 211, 153, .25);
    background: linear-gradient(180deg, rgba(52, 211, 153, .05), transparent);
  }
  .callout-tip .callout-icon { background: var(--green-soft); color: var(--green); }
  .callout-tip .callout-title { color: var(--green); }

  /* ───────── DEMO COMPONENTS ───────── */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px; font-weight: 600;
    transition: all .15s ease;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn:hover { background: var(--card-hover); border-color: var(--border-strong); }
  .btn-primary {
    background: linear-gradient(135deg, var(--react), #4fb5da);
    color: var(--bg); border: none; font-weight: 700;
    box-shadow: 0 4px 14px rgba(97, 218, 251, .3);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(97, 218, 251, .45);
  }
  .btn-purple {
    background: linear-gradient(135deg, var(--purple), #8b5cf6);
    color: white; border: none;
    box-shadow: 0 4px 14px rgba(167, 139, 250, .3);
  }
  .btn-purple:hover { transform: translateY(-1px); }
  .btn-rose { background: var(--rose-soft); color: var(--rose); border-color: rgba(251, 113, 133, .3); }
  .btn-rose:hover { background: rgba(251, 113, 133, .25); }
  .btn-green { background: var(--green-soft); color: var(--green); border-color: rgba(52, 211, 153, .3); }
  .btn-green:hover { background: rgba(52, 211, 153, .25); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-icon { padding: 8px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .input-base, .demo input[type="text"], .demo input[type="number"], .demo textarea, .demo select {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    transition: all .15s ease;
    outline: none;
  }
  .demo input:focus, .demo textarea:focus, .demo select:focus {
    border-color: var(--react);
    box-shadow: 0 0 0 3px var(--react-soft);
  }

  .counter-display {
    font-size: 64px; font-weight: 800;
    background: linear-gradient(135deg, var(--react), var(--purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-align: center;
    min-width: 100px;
  }

  .render-counter {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    background: var(--gold-soft);
    color: var(--gold);
    border-radius: 99px;
    font-size: 11px; font-weight: 700;
    border: 1px solid rgba(251, 191, 36, .3);
    font-family: 'JetBrains Mono', monospace;
  }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 11px; font-weight: 600;
    background: var(--bg-2); color: var(--text-muted);
    border: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
  }
  .pill-react { background: var(--react-soft); color: var(--react); border-color: rgba(97, 218, 251, .25); }
  .pill-purple { background: var(--purple-soft); color: var(--purple); border-color: rgba(167, 139, 250, .25); }
  .pill-green { background: var(--green-soft); color: var(--green); border-color: rgba(52, 211, 153, .3); }
  .pill-gold { background: var(--gold-soft); color: var(--gold); border-color: rgba(251, 191, 36, .3); }
  .pill-rose { background: var(--rose-soft); color: var(--rose); border-color: rgba(251, 113, 133, .3); }

  .demo-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .demo-col { display: flex; flex-direction: column; gap: 12px; }

  .todo-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: all .15s ease;
  }
  .todo-item.done { opacity: .55; }
  .todo-item.done .todo-text { text-decoration: line-through; }
  .todo-text { flex: 1; }
  .todo-checkbox {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid var(--border-strong);
    display: grid; place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    background: transparent;
  }
  .todo-checkbox.checked { background: var(--green); border-color: var(--green); }
  .todo-checkbox.checked svg { width: 12px; height: 12px; color: var(--bg); }
  .todo-delete {
    width: 28px; height: 28px;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    display: grid; place-items: center;
    transition: all .15s ease;
  }
  .todo-delete:hover { background: var(--rose-soft); color: var(--rose); }

  /* ───────── COMPARISON TABLE ───────── */
  .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  table.cmp { width: 100%; border-collapse: collapse; min-width: 600px; }
  table.cmp th, table.cmp td {
    padding: 12px 16px; text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  table.cmp th {
    background: var(--bg-2);
    color: var(--text-muted);
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em;
  }
  table.cmp td:first-child { font-weight: 700; color: var(--text); }
  table.cmp tr:last-child td { border-bottom: none; }
  table.cmp tr:hover td { background: rgba(255, 255, 255, .02); }

  /* ───────── QUIZ ───────── */
  .quiz-question {
    margin-bottom: 24px;
  }
  .quiz-q-title {
    font-size: 17px; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .quiz-q-num {
    flex-shrink: 0;
    width: 28px; height: 28px;
    background: var(--react-soft); color: var(--react);
    border-radius: 8px;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 800;
  }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .quiz-option {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    // Le preset "react" de Babel utilise le runtime JSX "automatic" par défaut,
    // ce qui génère `import ... from "react/jsx-runtime"` — impossible dans un
    // script non-module (React est chargé en UMD). On force le runtime classic.
    Babel.registerPreset('react-classic', {
      presets: [[Babel.availablePresets.react, { runtime: 'classic' }]]
    });
  </script>

  <script type="text/babel" data-presets="env,react-classic">
const { useState, useEffect, useRef, useMemo, useCallback, useReducer, useContext, createContext, memo, Fragment } = React;

// ─────────────────────────────────────────────────────────────────────────────
// SYNTAX HIGHLIGHTER
// ─────────────────────────────────────────────────────────────────────────────
function highlightCode(code) {
  const tokens = [];
  // Placeholder: \x00x<digits>x\x00 — les 'x' empêchent \b de déclencher
  // donc la regex des nombres \b\d+\b ne matche jamais le contenu du placeholder.
  function ph(m, cls) {
    tokens.push({ cls, text: m });
    return `\x00x${tokens.length - 1}x\x00`;
  }

  let out = code;

  // 1. Comments + strings en UN SEUL pass (left-to-right, first match wins)
  //    sinon "// 'fake'" ou "'has // inside'" se chevauchent mal.
  out = out.replace(
    /(\/\/[^\n]*)|(`(?:[^`\\]|\\.)*`)|('(?:[^'\\]|\\.)*')|("(?:[^"\\]|\\.)*")/g,
    (m, c, s1, s2, s3) => c ? ph(c, 'comment') : ph(s1 || s2 || s3, 'string')
  );

  // 2. Identifiants React, mots-clés, nombres — chaque regex utilise \b ou \d
  //    et ne peut PAS matcher l'intérieur des placeholders \x00x<n>x\x00.
  out = out.replace(/\b(useState|useEffect|useRef|useMemo|useCallback|useReducer|useContext|createContext|memo|forwardRef|lazy|Suspense|Fragment|Children|Provider|Consumer|React|ReactDOM)\b/g, m => ph(m, 'react'));
  out = out.replace(/\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|import|export|from|default|class|extends|new|this|async|await|try|catch|throw|typeof|instanceof|true|false|null|undefined|in|of)\b/g, m => ph(m, 'keyword'));
  out = out.replace(/\b\d+(?:\.\d+)?\b/g, m => ph(m, 'number'));

  // 3. Échapper le HTML restant
  out = out.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // 4. Substituer les placeholders par les <span>
  return out.replace(/\x00x(\d+)x\x00/g, (_, n) => {
    const t = tokens[+n];
    const escaped = t.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return `<span class="hl-${t.cls}">${escaped}</span>`;
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// ICONS
// ─────────────────────────────────────────────────────────────────────────────
const Icon = {
  Check: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
  ChevronLeft: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>,
  ChevronRight: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
  Trash: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>,
  Lightbulb: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7c.7.7 1 1.4 1 2.3v1h6v-1c0-.9.3-1.6 1-2.3A7 7 0 0012 2z"/></svg>,
  Warn: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h0"/></svg>,
  Sparkles: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3l1.9 5.3 5.3 1.9-5.3 1.9L12 17.4l-1.9-5.3L4.8 10.2l5.3-1.9L12 3z"/></svg>,
  Briefcase: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>,
  Refresh: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M20.5 9A9 9 0 005.6 4.6L1 10m22 4l-4.6 5.4A9 9 0 013.5 15"/></svg>,
  Atom: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="2"/><ellipse cx="12" cy="12" rx="10" ry="4.5"/><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-60 12 12)"/></svg>,
};

// ─────────────────────────────────────────────────────────────────────────────
// CODE BLOCK COMPONENT
// ─────────────────────────────────────────────────────────────────────────────
function CodeBlock({ code, filename = 'Component.jsx' }) {
  const [copied, setCopied] = useState(false);
  const handleCopy = () => {
    navigator.clipboard.writeText(code).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    });
  };
  const trimmed = code.replace(/^\n+|\n+$/g, '');
  return (
    <div className="code-block">
      <div className="code-block-header">
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div className="code-dots">
            <span className="code-dot"></span>
            <span className="code-dot"></span>
            <span className="code-dot"></span>
          </div>
          <span className="code-filename">{filename}</span>
        </div>
        <button className={`code-copy ${copied ? 'copied' : ''}`} onClick={handleCopy}>
          {copied ? '✓ Copié' : 'Copier'}
        </button>
      </div>
      <pre><code dangerouslySetInnerHTML={{ __html: highlightCode(trimmed) }} /></pre>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// CALLOUT
// ─────────────────────────────────────────────────────────────────────────────
function Callout({ type = 'interview', title, children }) {
  const icons = {
    interview: <Icon.Briefcase />,

        <div className="callout-text">{children}</div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// DEMO COMPONENTS
// ─────────────────────────────────────────────────────────────────────────────

// 1. useState
function UseStateDemo() {
  const [count, setCount] = useState(0);
  return (
    <div className="demo-col" style={{ alignItems: 'center', gap: 20 }}>
      <div className="counter-display">{count}</div>
      <div className="demo-row">
        <button className="btn" onClick={() => setCount(c => c - 1)}>− 1</button>
        <button className="btn btn-rose" onClick={() => setCount(0)}>Reset</button>
        <button className="btn btn-primary" onClick={() => setCount(c => c + 1)}>+ 1</button>
      </div>
      <div className="demo-row" style={{ marginTop: 8, gap: 8 }}>
        <button className="btn btn-sm" onClick={() => { setCount(count + 1); setCount(count + 1); setCount(count + 1); }}>
          ❌ +1 trois fois (mauvaise façon)
        </button>
        <button className="btn btn-sm btn-green" onClick={() => { setCount(c => c + 1); setCount(c => c + 1); setCount(c => c + 1); }}>
          ✓ +1 trois fois (updater)
        </button>
      </div>
    </div>
  );
}

// 2. useEffect
function UseEffectDemo() {
  const [running, setRunning] = useState(false);
  const [seconds, setSeconds] = useState(0);

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => setSeconds(s => s + 1), 1000);
    return () => clearInterval(id);
  }, [running]);

  return (
    <div className="demo-col" style={{ alignItems: 'center', gap: 18 }}>
      <div className="counter-display" style={{ fontVariantNumeric: 'tabular-nums' }}>
        {String(Math.floor(seconds / 60)).padStart(2, '0')}:{String(seconds % 60).padStart(2, '0')}
      </div>
      <div className="demo-row">
        <button className={`btn ${running ? 'btn-rose' : 'btn-primary'}`} onClick={() => setRunning(r => !r)}>
          {running ? '⏸ Pause' : '▶ Démarrer'}
        </button>
        <button className="btn" onClick={() => { setSeconds(0); setRunning(false); }}>Reset</button>
      </div>
      <div style={{ fontSize: 13, color: 'var(--text-muted)', textAlign: 'center', maxWidth: 380 }}>
        Le <code style={{ color: 'var(--react)' }}>clearInterval</code> retourné par useEffect évite la fuite mémoire quand on stop ou démonte.
      </div>
    </div>
  );
}

// 3. useRef
function UseRefDemo() {
  const inputRef = useRef(null);
  const renderCount = useRef(0);
  const [, force] = useState(0);
  renderCount.current++;
  return (
    <div className="demo-col" style={{ gap: 16 }}>
      <div className="demo-row" style={{ justifyContent: 'space-between' }}>
        <span className="pill pill-react">renders : {renderCount.current}</span>
        <span className="pill">useRef ne déclenche PAS de re-render</span>
      </div>
      <input ref={inputRef} placeholder="Tapez ici..." />
      <div className="demo-row">
        <button className="btn btn-primary" onClick={() => inputRef.current?.focus()}>Focus l'input</button>
        <button className="btn" onClick={() => force(x => x + 1)}>Forcer un re-render</button>
      </div>
    </div>
  );
}

// 4. useMemo
function UseMemoDemo() {
  const [enabled, setEnabled] = useState(true);
  const [count, setCount] = useState(10000);
  const [tick, setTick] = useState(0);

  // Calcul lourd : somme des nombres premiers jusqu'à count
  const expensiveValue = useMemo(() => {
    if (!enabled) return null;
    function isPrime(n) {
      if (n < 2) return false;
      for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
      return true;
    }
    let sum = 0;
    for (let i = 2; i <= count; i++) if (isPrime(i)) sum += i;
    return sum;
  }, [count, enabled]);

  const start = performance.now();
  // Sans useMemo on aurait tout recalculé sur chaque render
  const elapsed = (performance.now() - start).toFixed(2);

  return (
    <div className="demo-col" style={{ gap: 14 }}>
      <div className="demo-row" style={{ justifyContent: 'space-between' }}>
        <span className="pill pill-purple">Σ premiers jusqu'à {count}</span>
        <span className="pill pill-gold">render #{tick}</span>
      </div>
      <div style={{
        padding: '20px', background: 'var(--bg-2)', borderRadius: 12,
        textAlign: 'center', border: '1px solid var(--border)'
      }}>
        <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 6 }}>Résultat mémoïsé</div>
        <div style={{ fontSize: 28, fontWeight: 800, color: 'var(--react)', fontFamily: 'JetBrains Mono' }}>
          {expensiveValue?.toLocaleString('fr')}
        </div>
      </div>
      <div className="demo-row" style={{ justifyContent: 'space-between' }}>
        <button className="btn btn-primary" onClick={() => setTick(t => t + 1)}>
          Re-render sans changer la valeur
        </button>
        <button className="btn btn-purple" onClick={() => setCount(c => c + 1000)}>
          count +1000 (recalcul)
        </button>
      </div>
      <div style={{ fontSize: 13, color: 'var(--text-muted)' }}>
        Le 1er bouton re-render le composant mais <strong>ne recalcule pas</strong> la somme grâce à <code style={{ color: 'var(--react)' }}>useMemo([count])</code>. Le 2e change <code style={{ color: 'var(--react)' }}>count</code> donc invalide le cache.
      </div>
    </div>
  );
}

// 5. useCallback - compare memoized vs non
const ChildButton = memo(function ChildButton({ onClick, label }) {
  const renders = useRef(0);
  renders.current++;
  return (
    <div style={{
      padding: '14px 16px', background: 'var(--bg-2)', borderRadius: 10,
      border: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center'
    }}>
      <button className="btn btn-sm" onClick={onClick}>{label}</button>
      <span className="render-counter">renders : {renders.current}</span>
    </div>
  );
});

function UseCallbackDemo() {
  const [tick, setTick] = useState(0);

  // ❌ Nouvelle référence à chaque render → casse memo()
  const unstableHandler = () => console.log('clic instable');

  // ✓ Même référence → memo() fonctionne
  const stableHandler = useCallback(() => console.log('clic stable'), []);

  return (
    <div className="demo-col" style={{ gap: 14 }}>
      <div className="demo-row" style={{ justifyContent: 'space-between' }}>
        <span className="pill pill-purple">Parent render #{tick}</span>
        <button className="btn btn-primary btn-sm" onClick={() => setTick(t => t + 1)}>
          Re-render le parent
        </button>
      </div>
      <ChildButton onClick={unstableHandler} label="❌ Sans useCallback" />

// 8. Custom hook : useLocalStorage
function useLocalStorage(key, initial) {
  const [value, setValue] = useState(() => {
    try {
      const v = localStorage.getItem(key);
      return v !== null ? JSON.parse(v) : initial;
    } catch { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }, [key, value]);
  return [value, setValue];
}

// 10. Context + Reducer pattern (mini cart)
const cartReducer = (state, action) => {
  switch (action.type) {
    case 'add': {
      const existing = state.items.find(i => i.id === action.item.id);
      if (existing) {
        return { items: state.items.map(i => i.id === action.item.id ? { ...i, qty: i.qty + 1 } : i) };
      }
      return { items: [...state.items, { ...action.item, qty: 1 }] };
    }
    case 'remove': return { items: state.items.filter(i => i.id !== action.id) };
    case 'clear': return { items: [] };
    default: return state;
  }
};
const CartContext = createContext(null);

function CartProvider({ children }) {
  const [state, dispatch] = useReducer(cartReducer, { items: [] });
  const value = useMemo(() => ({ state, dispatch }), [state]);
  return <CartContext.Provider value={value}>{children}</CartContext.Provider>;
}
function useCart() {
  const ctx = useContext(CartContext);

}

      'Parce que count est figé par la closure au moment du render',
      'Parce que setState est asynchrone et annule les précédents',
      'Parce qu\'on a oublié await sur setCount',
    ],
    answer: 1,
    explain: <>Les trois appels capturent la <strong>même valeur</strong> de <code>count</code> (closure). Solution : la forme updater <code>setCount(c =&gt; c + 1)</code> qui reçoit la valeur la plus récente.</>,
  },
  {
    q: 'Quelle est la différence entre useMemo et useCallback ?',
    options: [
      'useMemo cache une valeur, useCallback cache une fonction',
      'useMemo est synchrone, useCallback est asynchrone',
      'useCallback existe seulement en React 18+',
      'Aucune, ce sont des alias',
    ],
    answer: 0,
    explain: <><code>useCallback(fn, deps)</code> est strictement équivalent à <code>useMemo(() =&gt; fn, deps)</code>. Le premier mémoïse une <strong>valeur calculée</strong>, le second une <strong>référence de fonction</strong>.</>,
  },
  {
    q: 'Que retourne useEffect(() => {...}, []) ?',
    options: [
      'L\'effet s\'exécute après chaque render',
      'L\'effet s\'exécute uniquement au mount, cleanup au unmount',
      'L\'effet ne s\'exécute jamais',
      'Une erreur, le tableau vide est interdit',
    ],
    answer: 1,
    explain: <>Tableau de deps <strong>vide</strong> = effet exécuté <strong>une seule fois</strong> après le mount. Le cleanup retourné est appelé au unmount du composant. Note : en StrictMode dev, l'effet est exécuté deux fois pour révéler les bugs.</>,
  },
  {
    q: 'Tu re-render un parent. Lequel de ses enfants re-render aussi ?',
    options: [
      'Aucun, React optimise automatiquement',
      'Tous, sauf ceux marqués comme pure',
      'Tous, sauf ceux wrappés dans React.memo avec props inchangées',
      'Seulement ceux qui consomment du Context',
    ],
    answer: 2,
    explain: <>Par défaut, <strong>tous les enfants re-render</strong> quand le parent re-render. <code>React.memo</code> + props stables (références identiques) = pas de re-render. Attention aux objets/fonctions inline qui cassent <code>memo</code>.</>,
  },
  {
    q: 'Quel est le bon outil pour gérer un cache de données API ?',
    options: [
      'Redux',
      'useState + useEffect',
      'Context + useReducer',
      'TanStack Query (ou SWR)',
    ],
    answer: 3,
    explain: <>Le <strong>server state</strong> (cache, refetch, invalidation, dédup) est résolu par des libs dédiées comme <strong>TanStack Query</strong> ou <strong>SWR</strong>. Le mettre dans Redux ou réinventer avec useEffect est laborieux et bugué.</>,
  },
  {
    q: 'Que se passe-t-il si tu écris key={index} dans une liste réorderable ?',
    options: [
      'Rien, c\'est la pratique standard',
      'React peut associer le mauvais state aux mauvais éléments quand l\'ordre change',
      'La liste ne s\'affiche pas',
      'Cela améliore les perfs',
    ],
    answer: 1,
    explain: <>La <code>key</code> sert à <strong>identifier</strong> un élément à travers les renders. Avec l'index, si l'ordre change, React pense que c'est le même élément avec d'autres données → state interne (input value, focus…) reste accroché au mauvais élément. Utilise un <strong>id stable</strong>.</>,
  },
  {
    q: 'Lequel n\'est PAS une règle des hooks ?',
    options: [
      'Appeler les hooks au top-level uniquement',
      'Ne pas appeler les hooks dans des conditions',
      'Préfixer les custom hooks par "use"',
      'Toujours appeler useEffect en premier',
    ],
    answer: 3,
    explain: <>Les hooks doivent être appelés <strong>au top-level</strong> et <strong>dans le même ordre</strong> à chaque render. Mais l'ordre entre eux est libre. La règle "useEffect en premier" n'existe pas.</>,
  },
  {
    q: 'Quelle est la principale limite du Context API en perf ?',
    options: [
      'Il ne peut contenir que des strings',
      'Tous les consommateurs re-render quand la value change',
      'Il est obsolète depuis React 18',
      'Il est limité à 5 niveaux de profondeur',
    ],
    answer: 1,
    explain: <>Quand la <code>value</code> du Provider change, <strong>tous les <code>useContext</code></strong> re-render, même si la partie qui les concerne n'a pas changé. Solutions : splitter en plusieurs contexts, mémoïser, ou utiliser une lib avec subscription fine (Zustand, Jotai).</>,
  },
  {
    q: 'Tu veux un input dont la valeur n\'est lue qu\'au submit. Le pattern idéal ?',
    options: [
      'Controlled avec useState',
      'Uncontrolled avec useRef',
      'Toujours controlled, c\'est la best practice',
      'Toujours uncontrolled, c\'est plus simple',
    ],
    answer: 1,
    explain: <>Si tu n'as pas besoin de la valeur à chaque frappe, <strong>uncontrolled</strong> (<code>useRef</code>) est plus performant : aucun re-render à la saisie. C'est ce que <strong>react-hook-form</strong> fait par défaut.</>,
  },
  {
    q: 'Quand utiliser useReducer plutôt que useState ?',
    options: [
      'Toujours, c\'est plus moderne',
      'Quand le state a plusieurs sous-champs liés ou des transitions complexes',
      'Quand on veut éviter les re-renders',
      'Uniquement avec Context',
    ],
    answer: 1,
    explain: <><code>useReducer</code> brille quand l'état est <strong>complexe</strong> (machine à états, multi-step form) et qu'il y a <strong>plusieurs transitions nommées</strong>. Bonus : le reducer est une <strong>pure function testable</strong> indépendamment.</>,
  },
];

// QUIZ COMPONENT
// ─────────────────────────────────────────────────────────────────────────────
function Quiz() {
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState({});

  const handleSelect = (qi, oi) => {
    if (submitted[qi]) return;
    setAnswers(a => ({ ...a, [qi]: oi }));
    setSubmitted(s => ({ ...s, [qi]: true }));
  };

  const reset = () => { setAnswers({}); setSubmitted({}); };

  const total = QUIZ_QUESTIONS.length;
  const answered = Object.keys(submitted).length;
  const score = QUIZ_QUESTIONS.reduce((s, q, i) => s + (answers[i] === q.answer ? 1 : 0), 0);
  const allDone = answered === total;

  let scoreMsg = '';
  if (allDone) {
    if (score === total) scoreMsg = '🏆 Parfait — tu es prêt pour ton entretien.';
    else if (score >= total * 0.8) scoreMsg = '🎯 Excellent — tu maîtrises les fondamentaux.';
    else if (score >= total * 0.6) scoreMsg = '💪 Bien — quelques relectures à faire.';
    else scoreMsg = '📚 À retravailler — relis les chapitres concernés.';
  }

  return (
    <div className="demo-col" style={{ gap: 28 }}>
      {QUIZ_QUESTIONS.map((q, i) => (
        <div key={i} className="quiz-question">
          <div className="quiz-q-title">
            <span className="quiz-q-num">{i + 1}</span>
            <span>{q.q}</span>
          </div>
          {q.code && <div style={{ marginBottom: 12 }}><CodeBlock code={q.code} filename="snippet.js" /></div>}
          <div className="quiz-options">
            {q.options.map((opt, oi) => {
              let cls = 'quiz-option';
              if (submitted[i]) {
                if (oi === q.answer) cls += ' correct';
                else if (oi === answers[i]) cls += ' wrong';
              } else if (answers[i] === oi) cls += ' selected';
              return (
                <button
                  key={oi}
                  className={cls}
                  onClick={() => handleSelect(i, oi)}
                  disabled={submitted[i]}
                >
                  <span className="opt-letter">{String.fromCharCode(65 + oi)}</span>
                  <span>{opt}</span>
                </button>
              );
            })}
          </div>
          {submitted[i] && (
            <div className="quiz-explanation">
              <strong>{answers[i] === q.answer ? '✓ Correct.' : '✗ Mauvaise réponse.'}</strong> {q.explain}
            </div>
          )}
        </div>
      ))}
      <div className="quiz-score">
        <div>
          <div className="quiz-score-num">{score} / {total}</div>
          <div className="quiz-score-label">{answered}/{total} questions répondues</div>
        </div>
        <div style={{ textAlign: 'right' }}>
          {allDone && <div className="quiz-score-msg">{scoreMsg}</div>}
          <button className="btn" onClick={reset} style={{ marginTop: 10 }}>
            <Icon.Refresh /> Recommencer
          </button>
        </div>
      </div>
    </div>
  );
}

  return (
    <div>
      <div className="lesson-header">
        <div style={{ flex: 1 }}>
          <div className="lesson-meta">
            <span className={badgeCls}>{lesson.chapter}</span>
            <span className="lesson-num">Leçon {idx + 1} / {LESSONS.length}</span>
          </div>
          <h1 className="lesson-title">{lesson.title}</h1>

// SIDEBAR
// ─────────────────────────────────────────────────────────────────────────────
function Sidebar({ currentId, onPick, completed }) {
  const groups = [
    { id: 'hooks', label: 'Hooks' },
    { id: 'state', label: 'State Management' },
    { id: 'design', label: 'Component Design' },
    { id: 'extras', label: 'Aller plus loin' },
  ];

  return (
    <aside className="sidebar">
      {groups.map(g => {
        const lessons = LESSONS.filter(l => l.chapter === g.id);
        return (
          <div key={g.id} className="chapter-group">
            <div className={`chapter-title chapter-${g.id}`}>
              <span className="dot"></span>{g.label}
            </div>
            {lessons.map(l => {
              const idx = LESSONS.findIndex(x => x.id === l.id);
              const isActive = currentId === l.id;
              const isDone = !!completed[l.id];
              return (
                <button
                  key={l.id}
                  className={`lesson-link ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}`}
                  onClick={() => onPick(l.id)}

                  <span className="num">{idx + 1}</span>
                  <span style={{ flex: 1 }}>{l.title}</span>
                  <span className="check">{isDone && <Icon.Check />}</span>

        );
      })}

// ─────────────────────────────────────────────────────────────────────────────
// APP
// ─────────────────────────────────────────────────────────────────────────────
function App() {
  const [currentId, setCurrentId] = useState(null); // null = home
  const [completed, setCompleted] = useLocalStorage('react_mastery_completed', {});

  const lessonIndex = currentId ? LESSONS.findIndex(l => l.id === currentId) : -1;
  const lesson = lessonIndex >= 0 ? LESSONS[lessonIndex] : null;
  const prevLesson = lessonIndex > 0 ? LESSONS[lessonIndex - 1] : null;
  const nextLesson = lessonIndex >= 0 && lessonIndex < LESSONS.length - 1 ? LESSONS[lessonIndex + 1] : null;

  const goTo = id => {
    setCurrentId(id);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const handleComplete = () => {
    setCompleted(c => ({ ...c, [currentId]: !c[currentId] }));
  };

  const reset = () => {
    if (confirm('Réinitialiser ta progression ?')) {
      setCompleted({});
      setCurrentId(null);
    }
  };

  const doneCount = LESSONS.filter(l => completed[l.id]).length;
  const pct = Math.round((doneCount / LESSONS.length) * 100);

  return (
    <>
      <header className="header">
        <div className="header-inner">
          <div className="brand" onClick={() => setCurrentId(null)} style={{ cursor: 'pointer' }}>
            <div className="brand-logo">
              <svg viewBox="-11.5 -10.23174 23 20.46348" xmlns="http://www.w3.org/2000/svg">
                <circle cx="0" cy="0" r="2.05" fill="currentColor"/>
                <g stroke="currentColor" strokeWidth="1" fill="none">
                  <ellipse rx="11" ry="4.2"/>
                  <ellipse rx="11" ry="4.2" transform="rotate(60)"/>
                  <ellipse rx="11" ry="4.2" transform="rotate(120)"/>
                </g>
              </svg>
            </div>
            <div className="brand-text">
              <span className="brand-name">React Mastery</span>
              <span className="brand-sub">Hooks · State · Components</span>
            </div>
          </div>
          <div className="header-actions">
            <div className="progress-pill">
              <span><strong>{doneCount}</strong>/{LESSONS.length} acquises</span>
              <div className="progress-bar"><div className="progress-fill" style={{ width: `${pct}%` }} /></div>
              <span><strong>{pct}%</strong></span>
            </div>
            <button className="reset-btn" onClick={reset}>Réinitialiser</button>
          </div>
        </div>
      </header>

      <div className="layout">
        <Sidebar currentId={currentId} onPick={goTo} completed={completed} />
        <main className="main">
          {lesson ? (
            <LessonView
              lesson={lesson}
              isDone={!!completed[lesson.id]}
              onComplete={handleComplete}
              onPrev={() => prevLesson ? goTo(prevLesson.id) : setCurrentId(null)}
              onNext={() => nextLesson && goTo(nextLesson.id)}
              hasPrev={!!prevLesson}
              hasNext={!!nextLesson}
              prevLesson={prevLesson}
              nextLesson={nextLesson}
            />
          ) : (
            <Home onGo={goTo} completed={completed} />
          )}
        </main>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
